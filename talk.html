<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 톡</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #f4f7f9;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 10px 14px;
            box-sizing: border-box;
            background: transparent;
        }

        .profile-info-card {
            position: relative;
            z-index: 2;
            background: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .hidden-auth {
            display: none !important;
        }

        /* 상단 헤더 영역 */
        .talk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 8px 14px;
            border-bottom: 1px solid rgba(0, 119, 190, 0.15);
            position: relative;
            user-select: none;
            flex-shrink: 0;
        }

        .talk-header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 16px;
            background-color: #0077b6;
            border-radius: 3px;
        }

        .talk-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .talk-title-icon-btn {
            background: transparent;
            border: none;
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .talk-title-icon-btn:hover {
            background-color: rgba(0, 119, 190, 0.08);
        }

        .talk-title-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #0077b6;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        .talk-title-icon-btn.authenticated .talk-title-icon {
            stroke: #03045e;
        }

        .talk-title {
            font-size: 18px;
            font-weight: 700;
            color: #0077b6;
            margin: 0;
        }

        .date-divider {
            width: 100%;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #0077b6;
            padding: 6px 0 2px 0;
            border-bottom: 1px solid rgba(0, 119, 190, 0.2);
            margin: 2px 0;
            box-sizing: border-box;
        }

        .talk-chat-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 4px 6px 4px 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 119, 190, 0.25) transparent;
        }

        .talk-chat-grid::-webkit-scrollbar {
            width: 5px;
        }

        .talk-chat-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .talk-chat-grid::-webkit-scrollbar-thumb {
            background-color: rgba(0, 119, 190, 0.25);
            border-radius: 10px;
        }

        .chat-row {
            position: relative;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            padding-left: 10px;
        }

        .chat-header-info::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 14px;
            background-color: #0077b6;
            border-radius: 3px;
        }

        .chat-nickname {
            font-size: 13px;
            font-weight: 700;
            color: #0077b6;
        }

        .chat-time {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }

        .chat-item {
            background: #ffffff;
            border: 1px solid rgba(0, 119, 190, 0.1);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            padding: 6px 8px;
            font-size: 15px;
            color: #1e293b;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-lines-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        /* 개별 줄 컨테이너 */
        .chat-line-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background-color 0.15s ease;
            box-sizing: border-box;
        }

        /* 삭제 버튼에 마우스를 올렸을 때 해당 줄에만 붉은색 배경 적용 */
        .chat-line-row:has(.chat-delete-btn:hover) {
            background-color: rgba(239, 68, 68, 0.08);
        }

        .chat-text {
            word-break: break-all;
            line-height: 1.35;
            color: #1e293b;
            flex: 1;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }

        /* 관리자용 개별 삭제 버튼 (박스 제거 및 크기 확대) */
        .chat-delete-btn {
            display: none;
            background: transparent;
            border: none;
            color: #cbd5e1; /* 평소에는 연한 회색으로 은은하게 표시 */
            font-size: 18px; /* 크기 키움 */
            font-weight: 600;
            cursor: pointer;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            padding: 0;
            line-height: 1;
        }

        /* x에 마우스를 올렸을 때 진한 빨간색으로 변경 */
        .chat-delete-btn:hover {
            color: #ef4444;
            background: transparent;
            border: none;
        }

        body.authenticated-mode .chat-delete-btn {
            display: flex;
        }

        .talk-input-section {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 8px;
            padding-top: 4px;
            flex-shrink: 0;
        }

        .talk-input-section.active-input {
            display: flex;
        }

        .input-wrapper {
            display: flex;
            border-bottom: 2px solid #0077b6;
            padding-bottom: 4px;
            transition: border-color 0.2s;
            background-color: #f4f7f9;
        }

        .input-wrapper:focus-within {
            border-bottom-color: #03045e;
        }

        .talk-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 4px 6px;
            font-size: 15px;
            font-family: inherit;
            color: #03045e;
            resize: none;
            height: 26px;
            line-height: 1.35;
        }

        .talk-send-btn {
            background: transparent;
            border: none;
            color: #0077b6;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .talk-send-btn:hover {
            color: #03045e;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #0077b6;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 119, 190, 0.25);
        }

        .toast-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(3, 4, 94, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 360px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #03045e;
            margin: 0;
        }

        .modal-input {
            padding: 12px 16px;
            border: 1px solid rgba(0, 119, 190, 0.3);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .modal-btn.cancel {
            background-color: #e2e8f0;
            color: #475569;
        }

        .modal-btn.submit {
            background-color: #0077b6;
            color: white;
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <div class="profile-info-card">
            
            <div class="talk-header">
                <div class="talk-title-wrapper">
                    <button class="talk-title-icon-btn" id="oceanAuthBtn" onclick="openAuthModal()" title="로그인 / 인증">
                        <svg class="talk-title-icon" viewBox="0 0 24 24">
                            <path d="M2 12c2.5-3 5-3 7.5 0s5 3 7.5 0M2 17c2.5-3 5-3 7.5 0s5 3 7.5 0" />
                        </svg>
                    </button>
                    <h1 class="talk-title">바다비 톡</h1>
                </div>
            </div>

            <div class="talk-chat-grid" id="chatGrid">
            </div>

            <div class="talk-input-section" id="inputSection">
                <div class="input-wrapper">
                    <textarea class="talk-textarea" id="chatInput" placeholder="입력 가능합니다..."></textarea>
                    <button class="talk-send-btn" id="sendBtn" onclick="sendMessage()">전송</button>
                </div>
            </div>

        </div>
    </div>

    <div class="toast-message" id="toastMessage">토스트 메시지</div>

    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <h3 class="modal-title">🔐 패스워드 인증</h3>
            <p style="font-size: 14px; color: #64748b; margin: 0;">작성 권한 패스워드를 입력하세요.</p>
            <input type="password" class="modal-input" id="passwordInput" placeholder="패스워드 입력">
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeAuthModal()">취소</button>
                <button class="modal-btn submit" onclick="verifyPassword()">확인</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";

        let isAuthenticated = localStorage.getItem("badabi_auth") === "true";
        let cachedMessagesJson = "";
        let currentMessagesList = [];
        let isSavingOrDeleting = false;

        const chatInput = document.getElementById("chatInput");
        const inputSection = document.getElementById("inputSection");
        const authModal = document.getElementById("authModal");
        const passwordInput = document.getElementById("passwordInput");
        const chatGrid = document.getElementById("chatGrid");
        const oceanAuthBtn = document.getElementById("oceanAuthBtn");
        const toastElement = document.getElementById("toastMessage");

        window.addEventListener("DOMContentLoaded", () => {
            if (isAuthenticated) {
                document.body.classList.add("authenticated-mode");
                inputSection.classList.add("active-input");
                oceanAuthBtn.classList.add("authenticated");
            }
            loadMessages();
            setInterval(loadMessages, 3000);
        });

        function showToast(message) {
            toastElement.textContent = message;
            toastElement.classList.add("show");
            setTimeout(() => {
                toastElement.classList.remove("show");
            }, 2500);
        }

        async function loadMessages() {
            if (isSavingOrDeleting) return;

            try {
                const response = await fetch(`${WORKER_URL}?type=talk&t=${Date.now()}`);
                if (!response.ok) return;
                const data = await response.json();
                
                const newJson = JSON.stringify(data);
                if (newJson === cachedMessagesJson) return;
                cachedMessagesJson = newJson;
                currentMessagesList = Array.isArray(data) ? data : [];

                const isAtBottom = chatGrid.scrollHeight - chatGrid.scrollTop <= chatGrid.clientHeight + 50;

                renderMessages(currentMessagesList);

                if (isAtBottom) {
                    chatGrid.scrollTop = chatGrid.scrollHeight;
                }
            } catch (err) {
                console.error("메시지 동기화 실패:", err);
            }
        }

        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(":");
            if (parts.length < 2) return 0;
            return parseInt(parts[0], 10) * 3600 + parseInt(parts[1], 10) * 60 + (parts[2] ? parseInt(parts[2], 10) : 0);
        }

        function renderMessages(messages) {
            chatGrid.innerHTML = "";

            if (!Array.isArray(messages) || messages.length === 0) {
                const emptyDiv = document.createElement("div");
                emptyDiv.style.cssText = "flex: 1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; text-align: center; padding: 20px;";
                emptyDiv.textContent = "아직 등록된 대화가 없습니다.";
                chatGrid.appendChild(emptyDiv);
                return;
            }

            let lastAppendedDate = "";
            let currentGroupElement = null;
            let lastMsgSec = -999;

            messages.forEach((msg, originalIndex) => {
                const dateStr = msg.date || "";
                const timeStr = msg.time || "";
                const text = msg.message || "";
                const msgSec = timeToSeconds(timeStr);

                if (dateStr !== lastAppendedDate) {
                    lastAppendedDate = dateStr;
                    currentGroupElement = null;
                    lastMsgSec = -999;

                    const dateDivider = document.createElement("div");
                    dateDivider.className = "date-divider";
                    dateDivider.textContent = dateStr;
                    chatGrid.appendChild(dateDivider);
                }

                const isWithinTime = (msgSec - lastMsgSec) <= 90;
                const canGroup = currentGroupElement !== null && isWithinTime;

                if (canGroup) {
                    const linesGroup = currentGroupElement.querySelector(".chat-lines-group");
                    appendChatLine(linesGroup, text, originalIndex);
                } else {
                    const row = document.createElement("div");
                    row.className = "chat-row";
                    
                    const headerInfo = document.createElement("div");
                    headerInfo.className = "chat-header-info";
                    
                    const nicknameSpan = document.createElement("span");
                    nicknameSpan.className = "chat-nickname";
                    nicknameSpan.textContent = "바다비";
                    headerInfo.appendChild(nicknameSpan);

                    if (timeStr) {
                        const timeElement = document.createElement("span");
                        timeElement.className = "chat-time";
                        timeElement.textContent = timeStr;
                        headerInfo.appendChild(timeElement);
                    }
                    row.appendChild(headerInfo);

                    const chatItem = document.createElement("div");
                    chatItem.className = "chat-item";
                    
                    const linesGroup = document.createElement("div");
                    linesGroup.className = "chat-lines-group";
                    
                    appendChatLine(linesGroup, text, originalIndex);

                    chatItem.appendChild(linesGroup);
                    row.appendChild(chatItem);
                    chatGrid.appendChild(row);

                    currentGroupElement = chatItem;
                }

                lastMsgSec = msgSec;
            });
        }

        function appendChatLine(container, text, originalIndex) {
            const lineRow = document.createElement("div");
            lineRow.className = "chat-line-row";
            
            const spanText = document.createElement("span");
            spanText.className = "chat-text";
            spanText.textContent = text;
            lineRow.appendChild(spanText);

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "chat-delete-btn";
            deleteBtn.textContent = "×";
            deleteBtn.title = "메시지 삭제";
            deleteBtn.onclick = () => deleteMessage(originalIndex);
            lineRow.appendChild(deleteBtn);

            container.appendChild(lineRow);
        }

        async function deleteMessage(index) {
            if (!isAuthenticated) return;
            if (!confirm("이 메시지를 삭제하시겠습니까?")) return;

            isSavingOrDeleting = true;

            currentMessagesList.splice(index, 1);
            cachedMessagesJson = JSON.stringify(currentMessagesList);
            renderMessages(currentMessagesList);

            const password = localStorage.getItem("badabi_pw") || "";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        password: password,
                        action: "save",
                        fileType: "talk",
                        content: currentMessagesList
                    })
                });

                if (!response.ok) {
                    const errRes = await response.json().catch(() => ({}));
                    throw new Error(errRes.error || "메시지 삭제 저장 실패");
                }
                showToast("메시지가 삭제되었습니다.");
            } catch (err) {
                console.error("메시지 삭제 실패:", err);
                showToast("메시지 삭제에 실패했습니다.");
                loadMessages();
            } finally {
                setTimeout(() => {
                    isSavingOrDeleting = false;
                }, 1500);
            }
        }

        function openAuthModal() {
            if (isAuthenticated) {
                if (confirm("로그인 상태입니다. 인증을 해제(로그아웃)하시겠습니까?")) {
                    isAuthenticated = false;
                    document.body.classList.remove("authenticated-mode");
                    localStorage.removeItem("badabi_auth");
                    localStorage.removeItem("badabi_pw");
                    updateAuthUI();
                    showToast("인증이 해제되었습니다.");
                    renderMessages(currentMessagesList);
                }
                return;
            }
            authModal.classList.add("active");
            passwordInput.value = "";
            passwordInput.focus();
        }

        function closeAuthModal() {
            authModal.classList.remove("active");
        }

        async function verifyPassword() {
            const password = passwordInput.value;
            if (!password) {
                showToast("패스워드를 입력해주세요.");
                return;
            }

            try {
                const authResponse = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        password: password, 
                        action: "verify", 
                        fileType: "verify" 
                    })
                });

                if (!authResponse.ok) {
                    throw new Error("인증 실패");
                }

                isAuthenticated = true;
                document.body.classList.add("authenticated-mode");
                localStorage.setItem("badabi_auth", "true");
                localStorage.setItem("badabi_pw", password);
                closeAuthModal();
                updateAuthUI();
                showToast("성공적으로 인증되었습니다!");
                renderMessages(currentMessagesList);

            } catch (error) {
                showToast("패스워드가 일치하지 않습니다.");
                passwordInput.value = "";
                passwordInput.focus();
            }
        }

        function updateAuthUI() {
            if (isAuthenticated) {
                document.body.classList.add("authenticated-mode");
                inputSection.classList.add("active-input");
                oceanAuthBtn.classList.add("authenticated");
                chatInput.focus();
            } else {
                document.body.classList.remove("authenticated-mode");
                inputSection.classList.remove("active-input");
                oceanAuthBtn.classList.remove("authenticated");
                chatInput.value = "";
            }
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !isAuthenticated) return;

            isSavingOrDeleting = true;
            const password = localStorage.getItem("badabi_pw") || "";

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}:${seconds}`;

            chatInput.value = "";

            currentMessagesList.push({
                message: text,
                date: dateStr,
                time: timeStr
            });
            cachedMessagesJson = JSON.stringify(currentMessagesList);
            renderMessages(currentMessagesList);
            chatGrid.scrollTop = chatGrid.scrollHeight;

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        password: password,
                        action: "save",
                        fileType: "talk",
                        content: currentMessagesList
                    })
                });

                if (!response.ok) {
                    const errRes = await response.json().catch(() => ({}));
                    throw new Error(errRes.error || "메시지 저장 실패");
                }
            } catch (err) {
                console.error("메시지 저장 실패:", err);
                showToast("메시지 저장에 실패했습니다.");
                loadMessages();
            } finally {
                setTimeout(() => {
                    isSavingOrDeleting = false;
                }, 1500);
            }
        }

        chatInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        passwordInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                verifyPassword();
            }
        });
    </script>
</body>
</html>
