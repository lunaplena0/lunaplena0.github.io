<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <title>바다비 톡</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #f4f7f9;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 10px 14px;
            box-sizing: border-box;
            background: transparent;
        }

        .profile-info-card {
            position: relative;
            z-index: 2;
            background: transparent;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .hidden-auth {
            display: none !important;
        }

        /* 상단 헤더 영역 */
        .talk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 8px 14px;
            border-bottom: 1px solid rgba(0, 119, 190, 0.15);
            position: relative;
            user-select: none;
            flex-shrink: 0;
        }

        .talk-header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 16px;
            background-color: #0077b6;
            border-radius: 3px;
        }

        .talk-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .talk-title-icon-btn {
            background: transparent;
            border: none;
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .talk-title-icon-btn:hover {
            background-color: rgba(0, 119, 190, 0.08);
        }

        .talk-title-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #0077b6;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s;
        }

        .talk-title-icon-btn.authenticated .talk-title-icon {
            stroke: #03045e;
        }

        .talk-title {
            font-size: 18px;
            font-weight: 700;
            color: #0077b6;
            margin: 0;
        }

        .date-divider {
            width: 100%;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #0077b6;
            padding: 6px 0 2px 0;
            border-bottom: 1px solid rgba(0, 119, 190, 0.2);
            margin: 2px 0;
            box-sizing: border-box;
        }

        .talk-chat-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 4px 6px 4px 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 119, 190, 0.25) transparent;
        }

        .talk-chat-grid::-webkit-scrollbar {
            width: 5px;
        }

        .talk-chat-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .talk-chat-grid::-webkit-scrollbar-thumb {
            background-color: rgba(0, 119, 190, 0.25);
            border-radius: 10px;
        }

        .load-more-indicator {
            text-align: center;
            font-size: 12px;
            color: #0077b6;
            padding: 8px;
            cursor: pointer;
            user-select: none;
        }

        .load-more-indicator:hover {
            text-decoration: underline;
        }

        .chat-row {
            position: relative;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            padding-left: 10px;
        }

        .chat-header-info::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 14px;
            background-color: #0077b6;
            border-radius: 3px;
        }

        .chat-nickname {
            font-size: 13px;
            font-weight: 700;
            color: #0077b6;
        }

        .chat-time {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }

        .chat-item {
            background: #ffffff;
            border: 1px solid rgba(0, 119, 190, 0.1);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            padding: 6px 8px;
            font-size: 15px;
            color: #1e293b;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-lines-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .chat-line-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background-color 0.15s ease;
            box-sizing: border-box;
        }

        .chat-line-row:has(.chat-delete-btn:hover) {
            background-color: rgba(239, 68, 68, 0.08);
        }

        .chat-text {
            word-break: break-all;
            line-height: 1.35;
            color: #1e293b;
            flex: 1;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }

        .chat-delete-btn {
            display: none;
            background: transparent;
            border: none;
            color: #fca5a5;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            padding: 0;
            line-height: 1;
        }

        .chat-delete-btn:hover {
            color: #dc2626;
            background: transparent;
            border: none;
        }

        body.authenticated-mode .chat-delete-btn {
            display: flex;
        }

        .talk-input-section {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 8px;
            padding-top: 4px;
            flex-shrink: 0;
        }

        .talk-input-section.active-input {
            display: flex;
        }

        .input-wrapper {
            display: flex;
            border-bottom: 2px solid #0077b6;
            padding-bottom: 4px;
            transition: border-color 0.2s;
            background-color: #f4f7f9;
        }

        .input-wrapper:focus-within {
            border-bottom-color: #03045e;
        }

        .talk-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 4px 6px;
            font-size: 15px;
            font-family: inherit;
            color: #03045e;
            resize: none;
            height: 26px;
            line-height: 1.35;
        }

        .talk-send-btn {
            background: transparent;
            border: none;
            color: #0077b6;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .talk-send-btn:hover {
            color: #03045e;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #0077b6;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 119, 190, 0.25);
        }

        .toast-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(3, 4, 94, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 360px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-sizing: border-box;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #0077b6;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #03045e;
            margin: 0;
        }

        .modal-input {
            padding: 12px 16px;
            border: 1px solid rgba(0, 119, 190, 0.3);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .modal-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #475569;
            cursor: pointer;
            user-select: none;
        }

        .modal-checkbox-label input {
            width: 16px;
            height: 16px;
            accent-color: #0077b6;
            cursor: pointer;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .modal-btn.cancel {
            background-color: #e2e8f0;
            color: #475569;
        }

        .modal-btn.submit {
            background-color: #0077b6;
            color: white;
        }

        .modal-btn.danger {
            background-color: #dc2626;
            color: white;
        }

        /* 로그인/로그아웃 모달 전용 스타일 - 노래책과 동일한 안정된 크기 */
        .talk-auth-panel { padding: 2px 1px 0; }
        .talk-auth-hero { text-align: center; padding: 8px 0 18px; }
        .talk-auth-hero-icon,
        .talk-auth-hero-icon svg,
        .talk-logout-icon,
        .talk-logout-icon svg { box-sizing: border-box; }

        .talk-auth-hero-icon {
            width: 48px; height: 48px; margin: 0 auto 10px;
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            background: #f0f9ff; color: #0369a1; border: 1px solid #dbeafe;
            flex: 0 0 48px; overflow: hidden;
        }
        .talk-auth-hero-icon svg {
            width: 24px !important; height: 24px !important;
            max-width: 24px; max-height: 24px;
            display: block; fill: none; stroke: currentColor;
            stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
            flex: 0 0 24px;
        }
        .talk-auth-hero-title { margin: 0; font-size: 17px; font-weight: 800; color: #1e293b; letter-spacing: -0.3px; }
        .talk-auth-hero-desc { margin: 6px 0 0; color: #94a3b8; font-size: 12px; line-height: 1.5; }
        .talk-auth-field { margin-top: 3px; }
        .talk-auth-field-label { display: block; margin-bottom: 7px; font-size: 11.5px; font-weight: 700; color: #64748b; }
        .talk-auth-input-shell { position: relative; width: 100%; }
        .talk-auth-input {
            width: 100%; height: 42px; box-sizing: border-box; padding: 0 42px 0 13px;
            border: 1px solid #d6dee8; border-radius: 10px; background: #fff;
            color: #1e293b; font-family: inherit; font-size: 13px; outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
        }
        .talk-auth-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.12); }
        .talk-auth-eye {
            position: absolute !important; right: 7px !important; top: 6px !important;
            width: 30px !important; height: 30px !important; padding: 0 !important;
            border: 0 !important; background: transparent !important; color: #94a3b8;
            cursor: pointer; border-radius: 7px; font-size: 13px; line-height: 30px;
        }
        .talk-auth-eye:hover { color: #0369a1; background: #f0f9ff !important; }
        .talk-turnstile-wrap { display: flex; justify-content: center; min-height: 65px; margin-top: 12px; overflow: hidden; }
        #talkTurnstileWidget { min-height: 65px; }
        .talk-auth-action {
            width: 100%; height: 41px; margin-top: 13px; border: 0; border-radius: 10px;
            background: #0369a1; color: #fff; font-family: inherit; font-size: 13px;
            font-weight: 700; cursor: pointer; transition: background .18s ease, transform .12s ease;
        }
        .talk-auth-action:hover { background: #075985; }
        .talk-auth-action:active { transform: translateY(1px); }
        .talk-auth-cancel {
            width: 100%; height: 38px; margin-top: 7px; padding: 0; border: 0;
            background: transparent; color: #94a3b8; font-family: inherit; font-size: 12px; cursor: pointer;
        }
        .talk-auth-cancel:hover { color: #64748b; }

        .talk-logout-card { text-align: center; padding: 5px 0 1px; }
        .talk-logout-icon {
            width: 46px; height: 46px; margin: 2px auto 11px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0;
            flex: 0 0 46px; overflow: hidden;
        }
        .talk-logout-icon svg {
            width: 22px !important; height: 22px !important;
            max-width: 22px; max-height: 22px; display: block;
            fill: none; stroke: currentColor; stroke-width: 1.9;
            stroke-linecap: round; stroke-linejoin: round; flex: 0 0 22px;
        }
        .talk-logout-title { margin: 0; font-size: 15px; font-weight: 800; color: #334155; }
        .talk-logout-desc { margin: 6px 0 16px; color: #94a3b8; font-size: 12px; line-height: 1.5; }
        .talk-logout-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .talk-logout-actions button {
            width: 100%; height: 39px; margin: 0; padding: 0 10px; box-sizing: border-box;
            border-radius: 9px; font-family: inherit; font-size: 12px; font-weight: 700;
            cursor: pointer; appearance: none; -webkit-appearance: none;
        }
        .talk-logout-cancel { border: 1px solid #d6dee8; background: #fff; color: #64748b; }
        .talk-logout-cancel:hover { background: #f8fafc; }
        .talk-logout-confirm { border: 1px solid #e2e8f0; background: #f8fafc; color: #475569; }
        .talk-logout-confirm:hover { background: #f1f5f9; border-color: #cbd5e1; }

    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <div class="profile-info-card">
            
            <div class="talk-header">
                <div class="talk-title-wrapper">
                    <button class="talk-title-icon-btn" id="oceanAuthBtn" onclick="openAuthModal()">
                        <svg class="talk-title-icon" viewBox="0 0 24 24">
                            <path d="M2 12c2.5-3 5-3 7.5 0s5 3 7.5 0M2 17c2.5-3 5-3 7.5 0s5 3 7.5 0" />
                        </svg>
                    </button>
                    <h1 class="talk-title">바다비 톡</h1>
                </div>
            </div>

            <div class="talk-chat-grid" id="chatGrid">
            </div>

            <div class="talk-input-section" id="inputSection">
                <div class="input-wrapper">
                    <textarea class="talk-textarea" id="chatInput" placeholder="입력 가능합니다..."></textarea>
                    <button class="talk-send-btn" id="sendBtn" onclick="sendMessage()">전송</button>
                </div>
            </div>

        </div>
    </div>

    <div class="toast-message" id="toastMessage">토스트 메시지</div>

    <!-- 통합 모달 (인증/로그아웃/삭제 확인용) -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box" id="authModalBox">
            <!-- 동적으로 내용 변경됨 -->
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const TURNSTILE_SITE_KEY = "0x4AAAAAAEbQ0YWNiL_WiyKR";

        let isAuthenticated = false;
        let sessionToken = localStorage.getItem("badabi_session") || "";
        let turnstileToken = "";
        let turnstileWidgetId = null;

        let cachedMessagesJson = "";
        let currentMessagesList = [];
        let displayLimit = 50;

        let saveQueue = Promise.resolve();
        let isLocallyMutating = false;

        const chatInput = document.getElementById("chatInput");
        const inputSection = document.getElementById("inputSection");
        const authModal = document.getElementById("authModal");
        const authModalBox = document.getElementById("authModalBox");
        const chatGrid = document.getElementById("chatGrid");
        const oceanAuthBtn = document.getElementById("oceanAuthBtn");
        const toastElement = document.getElementById("toastMessage");

        window.addEventListener("DOMContentLoaded", async () => {
            await restoreAuthentication();
            loadMessages(true);
            setInterval(() => loadMessages(false), 3000);

            chatGrid.addEventListener("scroll", () => {
                if (chatGrid.scrollTop === 0) {
                    if (displayLimit < currentMessagesList.length) {
                        const oldScrollHeight = chatGrid.scrollHeight;
                        displayLimit += 50;
                        renderMessages(currentMessagesList, false);
                        chatGrid.scrollTop = chatGrid.scrollHeight - oldScrollHeight;
                    }
                }
            });
        });

        function showToast(message) {
            toastElement.textContent = message;
            toastElement.classList.add("show");
            setTimeout(() => {
                toastElement.classList.remove("show");
            }, 2500);
        }

        async function loadMessages(isInitial = false) {
            if (isLocallyMutating) return;

            try {
                const response = await fetch(`${WORKER_URL}?type=talk&t=${Date.now()}`);
                if (!response.ok) return;
                const data = await response.json();
                
                const newJson = JSON.stringify(data);
                if (newJson === cachedMessagesJson) return;
                cachedMessagesJson = newJson;
                currentMessagesList = Array.isArray(data) ? data : [];

                const isAtBottom = chatGrid.scrollHeight - chatGrid.scrollTop <= chatGrid.clientHeight + 50;

                renderMessages(currentMessagesList, isInitial);

                if (isInitial || isAtBottom) {
                    chatGrid.scrollTop = chatGrid.scrollHeight;
                }
            } catch (err) {
                console.error("메시지 동기화 실패:", err);
            }
        }

        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(":");
            if (parts.length < 2) return 0;
            return parseInt(parts[0], 10) * 3600 + parseInt(parts[1], 10) * 60 + (parts[2] ? parseInt(parts[2], 10) : 0);
        }

        function renderMessages(messages, isInitial = false) {
            chatGrid.innerHTML = "";

            if (!Array.isArray(messages) || messages.length === 0) {
                const emptyDiv = document.createElement("div");
                emptyDiv.style.cssText = "flex: 1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 14px; text-align: center; padding: 20px;";
                emptyDiv.textContent = "아직 등록된 대화가 없습니다.";
                chatGrid.appendChild(emptyDiv);
                return;
            }

            const startIndex = Math.max(0, messages.length - displayLimit);
            const visibleMessages = messages.slice(startIndex);

            if (startIndex > 0) {
                const loadMoreDiv = document.createElement("div");
                loadMoreDiv.className = "load-more-indicator";
                loadMoreDiv.textContent = "👆 위로 스크롤하여 이전 메시지 더보기";
                loadMoreDiv.onclick = () => {
                    const oldScrollHeight = chatGrid.scrollHeight;
                    displayLimit += 50;
                    renderMessages(currentMessagesList, false);
                    chatGrid.scrollTop = chatGrid.scrollHeight - oldScrollHeight;
                };
                chatGrid.appendChild(loadMoreDiv);
            }

            let lastAppendedDate = "";
            let currentGroupElement = null;
            let lastMsgSec = -999;

            visibleMessages.forEach((msg, idx) => {
                const originalIndex = startIndex + idx;
                const dateStr = msg.date || "";
                const timeStr = msg.time || "";
                const text = msg.message || "";
                const msgSec = timeToSeconds(timeStr);

                if (dateStr !== lastAppendedDate) {
                    lastAppendedDate = dateStr;
                    currentGroupElement = null;
                    lastMsgSec = -999;

                    const dateDivider = document.createElement("div");
                    dateDivider.className = "date-divider";
                    dateDivider.textContent = dateStr;
                    chatGrid.appendChild(dateDivider);
                }

                const isWithinTime = (msgSec - lastMsgSec) <= 90;
                const canGroup = currentGroupElement !== null && isWithinTime;

                if (canGroup) {
                    const linesGroup = currentGroupElement.querySelector(".chat-lines-group");
                    appendChatLine(linesGroup, text, originalIndex);
                } else {
                    const row = document.createElement("div");
                    row.className = "chat-row";
                    
                    const headerInfo = document.createElement("div");
                    headerInfo.className = "chat-header-info";
                    
                    const nicknameSpan = document.createElement("span");
                    nicknameSpan.className = "chat-nickname";
                    nicknameSpan.textContent = "바다비";
                    headerInfo.appendChild(nicknameSpan);

                    if (timeStr) {
                        const timeElement = document.createElement("span");
                        timeElement.className = "chat-time";
                        timeElement.textContent = timeStr;
                        headerInfo.appendChild(timeElement);
                    }
                    row.appendChild(headerInfo);

                    const chatItem = document.createElement("div");
                    chatItem.className = "chat-item";
                    
                    const linesGroup = document.createElement("div");
                    linesGroup.className = "chat-lines-group";
                    
                    appendChatLine(linesGroup, text, originalIndex);

                    chatItem.appendChild(linesGroup);
                    row.appendChild(chatItem);
                    chatGrid.appendChild(row);

                    currentGroupElement = chatItem;
                }

                lastMsgSec = msgSec;
            });
        }

        function appendChatLine(container, text, originalIndex) {
            const lineRow = document.createElement("div");
            lineRow.className = "chat-line-row";
            
            const spanText = document.createElement("span");
            spanText.className = "chat-text";
            spanText.textContent = text;
            lineRow.appendChild(spanText);

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "chat-delete-btn";
            deleteBtn.textContent = "×";
            deleteBtn.title = "메시지 삭제";
            deleteBtn.onclick = () => requestDeleteMessage(originalIndex);
            lineRow.appendChild(deleteBtn);

            container.appendChild(lineRow);
        }

        function enqueueServerSave() {
            isLocallyMutating = true;
            saveQueue = saveQueue.then(async () => {
                if (!isAuthenticated || !sessionToken) {
                    throw new Error("로그인 세션이 없습니다. 다시 로그인해주세요.");
                }

                cachedMessagesJson = JSON.stringify(currentMessagesList);

                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sessionToken: sessionToken,
                        action: "save",
                        fileType: "talk",
                        content: currentMessagesList
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (response.status === 401) {
                    isAuthenticated = false;
                    sessionToken = "";
                    localStorage.removeItem("badabi_session");
                    updateAuthUI();
                    throw new Error("로그인 세션이 만료되었습니다. 다시 로그인해주세요.");
                }

                if (!response.ok) {
                    throw new Error(data.error || "서버 저장 실패");
                }
            }).catch(err => {
                console.error("저장 큐 에러:", err);
                showToast("저장에 실패했습니다. 최신 상태를 불러옵니다.");
                loadMessages(false);
            }).finally(() => {
                setTimeout(() => {
                    isLocallyMutating = false;
                }, 1000);
            });
        }

        function requestDeleteMessage(index) {
            if (!isAuthenticated) return;

            // '오늘 하루 바로 삭제' 설정이 유효한지 확인
            const instantDeleteUntil = localStorage.getItem("badabi_instant_delete_until");
            const now = Date.now();

            if (instantDeleteUntil && now < parseInt(instantDeleteUntil, 10)) {
                // 체크되어 있다면 모달 띄우지 않고 바로 삭제 실행
                executeDelete(index);
                return;
            }

            // 모달 팝업 띄우기
            authModalBox.innerHTML = `
                <div class="modal-header">
                    <svg class="modal-icon" viewBox="0 0 24 24">
                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <h3 class="modal-title">메시지 삭제</h3>
                </div>
                <p style="font-size: 14px; color: #64748b; margin: 0;">이 메시지를 삭제하시겠습니까?</p>
                <label class="modal-checkbox-label">
                    <input type="checkbox" id="instantDeleteCheck"> 오늘 하루 동안 묻지 않고 바로 삭제하기
                </label>
                <div class="modal-buttons">
                    <button class="modal-btn cancel" onclick="closeAuthModal()">취소</button>
                    <button class="modal-btn danger" onclick="confirmDeleteModal(${index})">삭제</button>
                </div>
            `;
            authModal.classList.add("active");
        }

        function confirmDeleteModal(index) {
            const checkbox = document.getElementById("instantDeleteCheck");
            if (checkbox && checkbox.checked) {
                // 오늘 자정(23:59:59)까지 만료 시간 설정
                const midnight = new Date();
                midnight.setHours(23, 59, 59, 999);
                localStorage.setItem("badabi_instant_delete_until", midnight.getTime().toString());
            }
            closeAuthModal();
            executeDelete(index);
        }

        function executeDelete(index) {
            currentMessagesList.splice(index, 1);
            renderMessages(currentMessagesList, false);
            enqueueServerSave();
            showToast("메시지가 삭제되었습니다.");
        }

        async function openAuthModal() {
            await restoreAuthentication();

            if (isAuthenticated) {
                authModalBox.innerHTML = `
                    <div class="talk-logout-card">
                        <div class="talk-auth-hero-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M9 18V5l12-2v13"></path>
                                <circle cx="6" cy="18" r="3"></circle>
                                <circle cx="18" cy="16" r="3"></circle>
                            </svg>
                        </div>
                        <h3 class="talk-logout-title">관리자 모드</h3>
                        <p class="talk-logout-desc">현재 바다비 톡 관리 권한으로 로그인되어 있습니다.<br>로그아웃하면 메시지 입력 및 삭제 기능이 다시 숨겨집니다.</p>
                        <div class="talk-logout-actions">
                            <button class="talk-logout-cancel" onclick="closeAuthModal()">닫기</button>
                            <button class="talk-logout-confirm" onclick="executeLogout()">로그아웃</button>
                        </div>
                    </div>
                `;
            } else {
                authModalBox.innerHTML = `
                    <div class="talk-auth-panel">
                        <div class="talk-auth-hero">
                            <div class="talk-auth-hero-icon">
                                <svg viewBox="0 0 24 24">
                                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </div>
                            <h3 class="talk-auth-hero-title">바다비 톡 관리자 로그인</h3>
                            <p class="talk-auth-hero-desc">메시지를 작성하거나 삭제하려면 인증이 필요합니다.</p>
                        </div>

                        <div class="talk-auth-field">
                            <label class="talk-auth-field-label" for="talkPasswordInput">패스워드</label>
                            <div class="talk-auth-input-shell">
                                <input type="password" class="talk-auth-input" id="talkPasswordInput"
                                       placeholder="관리자 패스워드를 입력하세요" autocomplete="current-password">
                                <button type="button" class="talk-auth-eye"
                                        onclick="toggleTalkPasswordVisibility()"
                                        aria-label="패스워드 표시">◉</button>
                            </div>
                        </div>

                        <div class="talk-turnstile-wrap">
                            <div id="talkTurnstileWidget"></div>
                        </div>

                        <button class="talk-auth-action" onclick="verifyPassword()">로그인</button>
                        <button class="talk-auth-cancel" onclick="closeAuthModal()">취소</button>
                    </div>
                `;

                setTimeout(() => {
                    const input = document.getElementById("talkPasswordInput");
                    if (input) {
                        input.focus();
                        input.addEventListener("keydown", (event) => {
                            if (event.key === "Enter") {
                                event.preventDefault();
                                verifyPassword();
                            }
                        });
                    }
                    waitForTalkTurnstile();
                }, 50);
            }

            authModal.classList.add("active");
        }

        function onTalkTurnstileSuccess(token) {
            turnstileToken = typeof token === "string" ? token : "";
        }

        function resetTalkTurnstile() {
            turnstileToken = "";
            if (window.turnstile && turnstileWidgetId !== null) {
                try {
                    window.turnstile.reset(turnstileWidgetId);
                } catch (error) {
                    console.warn("Turnstile 초기화 실패");
                }
            }
        }

        function renderTalkTurnstile() {
            if (typeof window.turnstile === "undefined") return;

            const container = document.getElementById("talkTurnstileWidget");
            if (!container || !TURNSTILE_SITE_KEY || TURNSTILE_SITE_KEY === "YOUR_TURNSTILE_SITE_KEY") return;

            turnstileToken = "";

            try {
                if (turnstileWidgetId !== null) {
                    window.turnstile.remove(turnstileWidgetId);
                    turnstileWidgetId = null;
                }

                turnstileWidgetId = window.turnstile.render(container, {
                    sitekey: TURNSTILE_SITE_KEY,
                    callback: onTalkTurnstileSuccess,
                    "expired-callback": resetTalkTurnstile,
                    "timeout-callback": resetTalkTurnstile,
                    theme: "auto"
                });
            } catch (error) {
                console.error("Turnstile 렌더링 실패:", error);
            }
        }

        function waitForTalkTurnstile() {
            if (typeof window.turnstile !== "undefined") {
                renderTalkTurnstile();
                return;
            }

            let attempts = 0;
            const timer = setInterval(() => {
                attempts += 1;

                if (typeof window.turnstile !== "undefined") {
                    clearInterval(timer);
                    renderTalkTurnstile();
                } else if (attempts >= 50) {
                    clearInterval(timer);
                }
            }, 100);
        }

        function toggleTalkPasswordVisibility() {
            const input = document.getElementById("talkPasswordInput");
            if (input) input.type = input.type === "password" ? "text" : "password";
        }

        function closeAuthModal() {
            authModal.classList.remove("active");
            if (!isAuthenticated) resetTalkTurnstile();
        }

        function executeLogout() {
            isAuthenticated = false;
            sessionToken = "";
            localStorage.removeItem("badabi_session");
            resetTalkTurnstile();
            closeAuthModal();
            updateAuthUI();
            showToast("로그아웃되었습니다.");
            renderMessages(currentMessagesList, false);
        }

        async function verifyPassword() {
            const passwordInput = document.getElementById("talkPasswordInput");
            const password = passwordInput ? passwordInput.value : "";

            if (!password) {
                showToast("패스워드를 입력해주세요.");
                return;
            }

            if (!turnstileToken) {
                showToast("보안 인증을 완료해주세요.");
                return;
            }

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        password: password,
                        turnstileToken: turnstileToken,
                        rateLimitId: getRateLimitId(),
                        action: "verify"
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success || !data.sessionToken) {
                    throw new Error(data.error || "인증 실패");
                }

                sessionToken = data.sessionToken;
                localStorage.setItem("badabi_session", sessionToken);

                isAuthenticated = true;
                turnstileToken = "";
                updateAuthUI();
                closeAuthModal();
                showToast("성공적으로 로그인되었습니다!");
                renderMessages(currentMessagesList, false);
            } catch (error) {
                console.error("관리자 로그인 실패:", error);
                showToast(error.message || "로그인에 실패했습니다. 다시 시도해주세요.");
                resetTalkTurnstile();

                if (passwordInput) {
                    passwordInput.value = "";
                    passwordInput.focus();
                }
            }
        }

        function getRateLimitId() {
            let rateLimitId = localStorage.getItem("badabi_rate_limit_id") || "";

            if (!rateLimitId) {
                const rateBytes = new Uint8Array(32);
                crypto.getRandomValues(rateBytes);
                rateLimitId = Array.from(
                    rateBytes,
                    byte => byte.toString(16).padStart(2, "0")
                ).join("");
                localStorage.setItem("badabi_rate_limit_id", rateLimitId);
            }

            return rateLimitId;
        }

        async function restoreAuthentication() {
            const token = localStorage.getItem("badabi_session") || sessionToken || "";

            if (!token) {
                isAuthenticated = false;
                sessionToken = "";
                updateAuthUI();
                return false;
            }

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sessionToken: token,
                        action: "verify"
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success || !data.role) {
                    throw new Error("saved session rejected");
                }

                sessionToken = token;
                isAuthenticated = true;
                updateAuthUI();
                return true;
            } catch (error) {
                console.warn("저장된 관리자 세션이 만료되었거나 유효하지 않습니다.");
                sessionToken = "";
                isAuthenticated = false;
                localStorage.removeItem("badabi_session");
                updateAuthUI();
                return false;
            }
        }

        function updateAuthUI() {
            if (isAuthenticated) {
                document.body.classList.add("authenticated-mode");
                inputSection.classList.add("active-input");
                oceanAuthBtn.classList.add("authenticated");
                chatInput.focus();
            } else {
                document.body.classList.remove("authenticated-mode");
                inputSection.classList.remove("active-input");
                oceanAuthBtn.classList.remove("authenticated");
                chatInput.value = "";
            }
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !isAuthenticated) return;

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}:${seconds}`;

            chatInput.value = "";

            currentMessagesList.push({
                message: text,
                date: dateStr,
                time: timeStr
            });

            displayLimit = Math.max(displayLimit, currentMessagesList.length);
            renderMessages(currentMessagesList, false);
            chatGrid.scrollTop = chatGrid.scrollHeight;

            enqueueServerSave();
        }

        chatInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const passwordInput = document.getElementById("talkPasswordInput");
                if (passwordInput && document.activeElement === passwordInput) {
                    verifyPassword();
                }
            }
        });
    </script>
</body>
</html>
