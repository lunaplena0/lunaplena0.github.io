<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 메인페이지</title>
    <!-- Noto Sans KR 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* 전체 페이지 기본 설정: 세로 정렬 및 배경 색상 지정 */
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow: hidden; /* 전체 페이지 스크롤 방지 및 내부 스크롤 유도 */
            font-family: 'Noto Sans KR', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2b2d42;
        }

        /* 상단 네비게이션 바 스타일: 고정 및 블러 효과 적용 */
        .marine-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(3, 4, 94, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 10px 20px;
        }

        /* 네비게이션바 내부 컨테이너 정렬 */
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        /* 네비게이션 로고 스타일 */
        .nav-logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #caf0f8;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap; /* 로고는 줄바꿈 방지 */
            flex-shrink: 0;
        }

        /* 네비게이션 링크 리스트 스타일 */
        .nav-links {
            display: flex;
            flex-wrap: wrap; /* 공간이 부족하면 다음 줄로 자연스럽게 떨어지도록 설정 */
            justify-content: flex-end;
            gap: 6px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 네비게이션 개별 링크 스타일 및 호버 효과 */
        .nav-links a {
            color: #90e0ef;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s ease, background 0.2s ease;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            line-height: 1.3;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 메인 콘텐츠 영역 (여백을 없애고 꽉 차도록 설정) */
        .main-content-container {
            flex: 1;
            width: 100vw;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* 로딩 상태 표시 */
        .loading-text {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .marine-nav {
                padding: 8px 12px;
            }
            .nav-container {
                align-items: flex-start; /* 모바일에서 메뉴가 여러 줄일 때 로고와 정렬 유연화 */
            }
            .nav-links {
                gap: 4px;
            }
           .nav-logo  .nav-links a {
                font-size: 12px;
                padding: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="marine-nav" id="marine-nav-bar">
        <div class="nav-container">
            <a href="#" class="nav-logo" id="default-home-link"> </a>
            <ul class="nav-links" id="nav-links-container">
                <!-- 동적 메뉴가 여기에 생성됩니다 -->
            </ul>
        </div>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content-container" id="main-content-area">
        <div class="loading-text">데이터를 불러오는 중입니다...</div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";

        // 페이지가 로드될 때 서버에서 메인페이지 설정 데이터를 불러와 적용
        async function loadMainPageSettings() {
            const navBar = document.getElementById('marine-nav-bar');
            const logoEl = document.getElementById('default-home-link');
            const navLinksContainer = document.getElementById('nav-links-container');

            try {
                const timestamp = new Date().getTime();
                const response = await fetch(WORKER_URL + "?type=fanmainpages&t=" + timestamp);
                
                if (!response.ok) {
                    throw new Error("서버에서 데이터를 불러오지 못했습니다.");
                }

                const data = await response.json();

                if (data) {
                    // 1. 네비게이션 배경 색상 적용
                    if (data.navBgColor) {
                        navBar.style.background = data.navBgColor;
                    }

                    // 2. 로고 텍스트 및 링크 적용
                    if (data.logoText) {
                        logoEl.textContent = data.logoText;
                    }
                    logoEl.onclick = (e) => {
                        e.preventDefault();
                        if (data.mainContent) {
                            renderMainContent(data.mainContent);
                        }
                    };

                    // 3. 네비게이션 메뉴 목록 동적 생성 및 싱글 페이지(SPA) 스타일 연동
                    if (navLinksContainer && Array.isArray(data.menuItems)) {
                        navLinksContainer.innerHTML = "";
                        
                        data.menuItems.forEach(item => {
                            if (!item.name) return;
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.textContent = item.name;
                            a.href = item.url || "#";

                            // 메뉴 클릭 시 페이지 전체 이동 대신 iframe 내부 주소만 변경
                            a.onclick = (e) => {
                                e.preventDefault();
                                if (item.url) {
                                    renderMainContent(item.url);
                                }
                            };

                            li.appendChild(a);
                            navLinksContainer.appendChild(li);
                        });
                    }

                    // 4. 초기 메인페이지 본문 콘텐츠 영역 렌더링
                    if (data.mainContent) {
                        renderMainContent(data.mainContent);
                    }
                }

            } catch (err) {
                console.error("메인페이지 설정 로드 실패:", err);
                const mainContainer = document.querySelector('.main-content-container');
                if (mainContainer) {
                    mainContainer.innerHTML = `<div class="loading-text" style="color: #ef4444;">설정을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>`;
                }
            }
        }

        // 메인 콘텐츠 영역에 주소(.html, http) 혹은 일반 HTML을 채워 넣는 공통 함수
        function renderMainContent(contentValue) {
            const mainContainer = document.querySelector('.main-content-container');
            if (!mainContainer) return;

            const trimmed = contentValue.trim();
            if (trimmed.endsWith('.html') || trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
                mainContainer.innerHTML = `
                    <iframe src="${trimmed}" style="width: 100%; height: 100%; border: none; background: white; margin: 0; display: block; flex: 1;"></iframe>
                `;
            } else {
                mainContainer.innerHTML = trimmed;
            }
        }

        // 페이지가 열릴 때 실행
        document.addEventListener("DOMContentLoaded", loadMainPageSettings);
    </script>
</body>
</html>
