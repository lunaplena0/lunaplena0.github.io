<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 메인페이지</title>
    <style>
        /* 전체 페이지 기본 설정: 세로 정렬 및 배경 색상 지정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 상단 네비게이션 바 스타일: 고정 및 블러 효과 적용 */
        .marine-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(3, 4, 94, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 12px 24px;
        }

        /* 네비게이션바 내부 컨테이너 정렬 */
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 네비게이션 로고 스타일 */
        .nav-logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #caf0f8;
            text-decoration: none;
            cursor: pointer;
        }

        /* 네비게이션 링크 리스트 스타일 */
        .nav-links {
            display: flex;
            gap: 12px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 네비게이션 개별 링크 스타일 및 호버 효과 */
        .nav-links a {
            color: #90e0ef;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s ease;
            padding: 5px 5px;
            border-radius: 6px;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 메인 콘텐츠 영역 (여백을 없애고 꽉 차도록 설정) */
        .main-content-container {
            flex: 1;
            width: 100vw;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="marine-nav">
        <div class="nav-container">
            <a href="#" class="nav-logo" id="default-home-link"></a>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content-container">
    </div>

</body>
</html>
