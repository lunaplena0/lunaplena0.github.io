<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 메인페이지</title>
    <!-- Noto Sans KR 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* 전체 페이지 기본 설정: 세로 정렬 및 배경 색상 지정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Noto Sans KR', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2b2d42;
        }

        /* 상단 네비게이션 바 스타일: 고정 및 블러 효과 적용 */
        .marine-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(3, 4, 94, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 12px 24px;
        }

        /* 네비게이션바 내부 컨테이너 정렬 */
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 네비게이션 로고 스타일 */
        .nav-logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #caf0f8;
            text-decoration: none;
            cursor: pointer;
        }

        /* 네비게이션 링크 리스트 스타일 */
        .nav-links {
            display: flex;
            gap: 12px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 네비게이션 개별 링크 스타일 및 호버 효과 */
        .nav-links a {
            color: #90e0ef;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: color 0.2s ease;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 메인 콘텐츠 영역 (SPA 콘텐츠 및 기본 레이아웃 컨테이너) */
        .main-content-container {
            flex: 1;
            width: 100vw;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* 프로필 페이지 전용 레이아웃 스타일 */
        .ocean-profile-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 20px; 
            padding: 40px 24px;
            box-sizing: border-box;
            background: transparent;
        }

        /* 왼쪽 이미지 영역 기본 스타일 (로딩 전 투명 및 마스크 적용) */
        .profile-main-gif {
            position: relative;
            width: 650px; 
            height: 650px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            /* 마스크 효과 */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                                linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                        linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-composite: intersect;

            filter: drop-shadow(0 0 35px rgba(0, 119, 190, 0.5));
            z-index: 3;
            flex-shrink: 0;
            margin-right: -120px;

            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .profile-main-gif.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* 오른쪽 프로필 카드 영역 */
        .profile-info-card {
            position: relative;
            z-index: 1;
            background: transparent; 
            border: none; 
            box-shadow: none; 
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
            padding: 20px;

            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .profile-info-card.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .profile-header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
        }

        .profile-name {
            font-size: clamp(36px, 4.5vw, 48px);
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #03045e;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .profile-catchphrase {
            display: inline-block;
            font-size: clamp(14px, 1.4vw, 16px);
            line-height: 1.5;
            color: #0077b6;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        /* 하단 공지 및 VOD 섹션 스타일 (2분할 상자) */
        .profile-widgets-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .widget-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 119, 190, 0.08);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
            
            height: 95px;
            min-height: 95px;
            max-height: 95px;
            overflow: hidden;
        }

        .widget-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 190, 0.15);
        }

        .widget-title {
            font-size: 14px;
            font-weight: 800;
            color: #0077b6;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        .widget-content {
            font-size: 13px;
            color: #334155;
            line-height: 1.4;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-all;
        }

        /* 화면 하단 타임라인 영역 스타일 */
        .timeline-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 24px 30px 24px;
            box-sizing: border-box;
            z-index: 10;
        }

        .timeline-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0, 119, 190, 0.08);
            box-sizing: border-box;
            width: 100%;
            max-width: 1400px;
        }

        .timeline-title {
            font-size: 14px;
            font-weight: 800;
            color: #0077b6;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timeline-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 100px;
            overflow-y: auto;
        }

        .timeline-item {
            font-size: 13px;
            color: #334155;
            display: flex;
            gap: 10px;
            align-items: baseline;
        }

        .timeline-date {
            font-weight: 700;
            color: #0077b6;
            white-space: nowrap;
        }

        .timeline-text {
            word-break: break-all;
        }

        /* 모바일 반응형 디자인 */
        @media (max-width: 768px) {
            .ocean-profile-wrapper {
                flex-direction: column;
                padding: 16px;
                gap: 20px;
            }
            .profile-main-gif {
                width: 250px;
                height: 250px;
                margin-right: 0;
            }
            .profile-info-card {
                padding: 10px;
            }
            .profile-widgets-container {
                grid-template-columns: 1fr;
            }
            .widget-box {
                height: auto;
                min-height: unset;
                max-height: unset;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="marine-nav">
        <div class="nav-container">
            <a href="#" class="nav-logo" id="default-home-link">BABABI FAN ARCHIVE</a>
            <ul class="nav-links"></ul>
        </div>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content-container">
        <!-- 기본 프로필 + 타임라인 UI 구조 템플릿 -->
        <div class="ocean-profile-wrapper">
            <div class="profile-main-gif" id="profile-gif"></div>
            <div class="profile-info-card" id="profile-card">
                <div class="profile-header-top">
                    <div class="profile-name" id="view-name">로딩 중...</div>
                    <div class="profile-catchphrase" id="view-catchphrase"></div>
                </div>
                
                <div class="profile-widgets-container">
                    <a href="#" id="widget-notice-link" class="widget-box" target="_blank">
                        <h4 class="widget-title">📢 최근 공지</h4>
                        <p class="widget-content" id="widget-notice-text">등록된 공지가 없습니다.</p>
                    </a>
                    <a href="#" id="widget-vod-link" class="widget-box" target="_blank">
                        <h4 class="widget-title">🎬 최근 VOD</h4>
                        <p class="widget-content" id="widget-vod-text">등록된 VOD가 없습니다.</p>
                    </a>
                </div>
            </div>
        </div>

        <div class="timeline-wrapper">
            <div class="timeline-container">
                <h4 class="timeline-title">🕒 타임라인</h4>
                <ul class="timeline-list" id="timeline-list">
                    <li class="timeline-item"><span class="timeline-text">기록이 없습니다.</span></li>
                </ul>
            </div>
        </div>
    </div>

<script>
    const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";

    function preloadImage(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(url);
            img.onerror = reject;
            img.src = url;
        });
    }

    async function loadMainPageSettings() {
        try {
            const timestamp = new Date().getTime();
            const response = await fetch(WORKER_URL + "?type=mainpage&t=" + timestamp);
            if (!response.ok) return;
            
            const data = await response.json();
            if (!data) return;

            // 1. 네비게이션 배경 색상 적용
            const navEl = document.querySelector('.marine-nav');
            if (navEl && data.navBgColor) {
                navEl.style.background = data.navBgColor;
            }

            // 2. 로고 텍스트 및 클릭 이벤트 적용
            const logoEl = document.querySelector('.nav-logo');
            if (logoEl) {
                if (data.logoText) logoEl.textContent = data.logoText;
                
                logoEl.onclick = (e) => {
                    e.preventDefault();
                    if (data.mainContent) {
                        renderMainContent(data.mainContent);
                    }
                };
            }

            // 3. 네비게이션 메뉴 목록 동적 생성 및 싱글 페이지(SPA) 연동
            const navLinksContainer = document.querySelector('.nav-links');
            if (navLinksContainer && Array.isArray(data.menuItems)) {
                navLinksContainer.innerHTML = "";
                
                data.menuItems.forEach(item => {
                    if (!item.name) return;
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.textContent = item.name;
                    a.href = item.url || "#";

                    a.onclick = (e) => {
                        e.preventDefault();
                        if (item.url) {
                            renderMainContent(item.url);
                        }
                    };

                    li.appendChild(a);
                    navLinksContainer.appendChild(li);
                });
            }

            // 4. 초기 메인페이지 본문 콘텐츠 영역 렌더링 (프로필 데이터 포함 연동)
            if (data.mainContent) {
                renderMainContent(data.mainContent);
            }

        } catch (err) {
            console.error("메인페이지 설정 로드 실패:", err);
        }
    }

    // 메인 콘텐츠 영역에 주소(.html, http) 혹은 일반 HTML을 채워 넣는 공통 함수 (외부 iframe 또는 프로필 화면 전환 처리)
    async function renderMainContent(contentValue) {
        const mainContainer = document.querySelector('.main-content-container');
        if (!mainContainer) return;

        const trimmed = contentValue.trim();
        if (trimmed.endsWith('.html') || trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
            mainContainer.innerHTML = `
                <iframe src="${trimmed}" style="width: 100%; height: calc(100vh - 55px); border: none; background: white; margin: 0; display: block;"></iframe>
            `;
        } else {
            // 본문에 커스텀 HTML이 들어올 경우 그대로 반영하고, 기본 프로필 데이터도 함께 비동기로 불러와 갱신
            mainContainer.innerHTML = trimmed;
            loadProfileData();
        }
    }

    // 프로필 세부 데이터(이름, 소개말, 공지, VOD, 타임라인, 프로필 이미지) 불러오기
    async function loadProfileData() {
        try {
            const timestamp = new Date().getTime();
            const response = await fetch(`${WORKER_URL}?type=fanstartpage&t=${timestamp}`);
            if (!response.ok) return;
            
            const data = await response.json();

            const nameEl = document.getElementById("view-name");
            const catchphraseEl = document.getElementById("view-catchphrase");
            if (nameEl) nameEl.textContent = data.name || "바다비。";
            if (catchphraseEl) catchphraseEl.innerHTML = (data.message || "").replace(/\n/g, '<br>');

            if (data.notice) {
                const noticeEl = document.getElementById("widget-notice-link");
                const noticeTextEl = document.getElementById("widget-notice-text");
                if (noticeEl) noticeEl.href = data.notice;
                if (noticeTextEl) noticeTextEl.textContent = data.notice;
            }

            if (data.vod) {
                const vodEl = document.getElementById("widget-vod-link");
                const vodTextEl = document.getElementById("widget-vod-text");
                if (vodEl) vodEl.href = data.vod;
                if (vodTextEl) vodTextEl.textContent = data.vod;
            }

            const timelineListEl = document.getElementById("timeline-list");
            if (timelineListEl) {
                if (Array.isArray(data.timeline) && data.timeline.length > 0) {
                    timelineListEl.innerHTML = data.timeline.map(item => `
                        <li class="timeline-item">
                            <span class="timeline-date">[${item.time || ''}]</span>
                            <span class="timeline-text">${item.text || ''}</span>
                        </li>
                    `).join('');
                } else {
                    timelineListEl.innerHTML = `<li class="timeline-item"><span class="timeline-text">기록이 없습니다.</span></li>`;
                }
            }

            const profileCard = document.getElementById("profile-card");
            if (profileCard) profileCard.classList.add('loaded');

            if (data.image) {
                await preloadImage(data.image); 
                const gifEl = document.getElementById("profile-gif");
                if (gifEl) {
                    gifEl.style.backgroundImage = `url('${data.image}')`;
                    gifEl.classList.add('loaded');
                }
            }
        } catch (err) {
            console.error("프로필 데이터 로드 실패:", err);
        }
    }

    // 페이지가 열릴 때 실행
    document.addEventListener("DOMContentLoaded", () => {
        loadMainPageSettings();
        loadProfileData();
    });
</script>
</body>
</html>
