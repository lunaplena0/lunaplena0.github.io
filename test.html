<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 배경 이미지 적용 페이지</title>
    <style>
        /* 기본 스타일 설정 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 기본 PC 화면 배경 (자바스크립트가 실행되기 전 기본값) */
        @media (min-width: 841px) {
            body::after {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url("Background.png");
                background-size: cover;
                background-position: center;
                z-index: -1;
            }
        }

        /* 컨텐츠 박스 디자인 */
        .content-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- 배경 이미지 랜덤 변경 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. 사용할 배경 이미지 파일명 목록 정의
            const bgImages = ["Background.png", "Background2.png"];
            
            // 2. 무작위로 인덱스 선택 (0 또는 1)
            const randomIndex = Math.floor(Math.random() * bgImages.length);
            const selectedBg = bgImages[randomIndex];
            
            // 3. 동적으로 스타일 태그를 생성하여 head에 추가
            const styleTag = document.createElement("style");
            styleTag.innerHTML = `
                @media (min-width: 841px) {
                    body::after {
                        background-image: url("${selectedBg}") !important;
                    }
                }
            `;
            document.head.appendChild(styleTag);
        });
    </script>

</body>
</html>
