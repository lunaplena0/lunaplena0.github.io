<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 노래책 (인덱스 없음)</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
        }

        .main-container {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            padding: 14px 16px 16px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            max-height: 100dvh;
            overflow: hidden;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .title-summary-box {
            border-left: 5px solid #0ea5e9;
            padding-left: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title-svg {
            width: 26px;
            height: 26px;
            stroke: #0ea5e9;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        .stats-summary {
            font-size: 13.5px;
            color: #64748b;
            font-weight: 600;
            margin: 0;
        }

        .header-btn-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .header-action-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0369a1;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-action-btn:hover {
            background-color: #f8fafc;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .btn-icon-svg {
            width: 15px;
            height: 15px;
            stroke: #0369a1;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .search-container {
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }

        .search-icon-wrapper {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }

        .search-icon-svg {
            width: 18px;
            height: 18px;
            stroke: #64748b;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .search-box {
            width: 100%;
            padding: 12px 42px 12px 16px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: #ffffff;
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .filter-tags-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }

        .filter-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0369a1;
            height: 34px;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
        }

        .filter-btn.active {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }

        .sub-filter-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0369a1;
            width: 35px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sub-filter-btn.active-filter {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }

        .sub-filter-btn.active-filter svg { stroke: white; }

        .filter-icon-svg {
            width: 18px;
            height: 18px;
            stroke: #0369a1;
            stroke-width: 2.2;
            stroke-linecap: round;
            fill: none;
        }

        .song-list-scroll-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 60px;
            scrollbar-gutter: stable both-edges;
        }

        .song-list-scroll-wrapper::-webkit-scrollbar { width: 8px; }
        .song-list-scroll-wrapper::-webkit-scrollbar-thumb {
            background-color: rgba(203, 213, 225, 0.9);
            border-radius: 4px;
        }

        .artist-group-header {
            font-size: 14.5px;
            font-weight: 800;
            color: #0369a1;
            padding: 10px 4px 4px 4px;
            margin-top: 6px;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .song-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            cursor: pointer;
        }

        .song-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .song-title {
            font-size: 15px;
            font-weight: 700;
            margin: 0;
        }

        .badge {
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 8px;
            background-color: #f1f5f9;
        }

        .timestamp-container {
            display: none;
            padding-top: 10px;
            gap: 6px;
            flex-wrap: wrap;
        }

        .song-card.expanded .timestamp-container { display: flex; }

        /* 모달 및 기타 UI 생략 (기존과 동일) */
        .toast-message { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #0f172a; color: white; padding: 10px 18px; border-radius: 12px; opacity: 0; pointer-events: none; transition: all 0.25s; }
        .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 상단 헤더, 검색, 필터 영역은 동일 -->
        <div class="header-row">
            <div class="title-summary-box">
                <h1 class="page-title">바다비 노래책</h1>
                <div id="statsSummary" class="stats-summary">데이터 로드 중...</div>
            </div>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="검색..." oninput="onSearchInput()">
        </div>

        <div class="filter-row">
            <div class="filter-tags-container">
                <button class="filter-btn active" data-filter="전체">전체</button>
                <button class="filter-btn" data-filter="기타연주">기타연주</button>
            </div>
            <button id="integratedFilterBtn" class="sub-filter-btn" onclick="openFilterModal()">필터</button>
        </div>

        <div class="song-list-scroll-wrapper">
            <div id="songContainer" class="song-list"></div>
        </div>
    </div>

    <div id="toastMessage" class="toast-message">복사되었습니다.</div>

    <script>
        // 생략: 기존 로직에서 renderQuickIndexSidebar() 호출 부분만 제거
        function renderAllSongs() {
            const container = document.getElementById("songContainer");
            container.innerHTML = "";

            let lastArtist = "";
            sortedSongs.forEach((song) => {
                const currentArtist = song.artist || '아티스트 미상';
                if (currentArtist !== lastArtist) {
                    lastArtist = currentArtist;
                    const groupHeader = document.createElement('div');
                    groupHeader.className = 'artist-group-header';
                    groupHeader.textContent = currentArtist;
                    container.appendChild(groupHeader);
                }

                const card = document.createElement("div");
                card.className = "song-card";
                card.onclick = () => card.classList.toggle("expanded");
                card.innerHTML = `
                    <div class="song-summary-row">
                        <h3 class="song-title">${song.title}</h3>
                        <span class="song-artist">${song.artist}</span>
                    </div>
                `;
                container.appendChild(card);
            });
            // renderQuickIndexSidebar(); // <--- 제거됨
        }
    </script>
</body>
</html>
