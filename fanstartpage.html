<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 시작페이지</title>
    <style>
        /* 전체 페이지 기본 설정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 메인 콘텐츠 영역 */
        .ocean-profile-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            flex: 1;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 20px; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        /* 왼쪽 이미지 영역 기본 스타일 (로딩 전 투명) */
        .profile-main-gif {
            position: relative;
            width: 650px; 
            height: 650px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            /* 마스크 효과 */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                                linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                        linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-composite: intersect;

            filter: drop-shadow(0 0 35px rgba(0, 119, 190, 0.5));
            z-index: 3;
            flex-shrink: 0;
            margin-right: -120px;

            /* 애니메이션 설정 */
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* 이미지 로딩 완료 시 표시되는 클래스 */
        .profile-main-gif.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* 오른쪽 프로필 카드 영역 */
        .profile-info-card {
            position: relative;
            z-index: 1;
            background: transparent; 
            border: none; 
            box-shadow: none; 
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: #2b2d42; 
            box-sizing: border-box;
            padding: 20px;

            /* 애니메이션 설정 */
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* 텍스트 로딩 완료 시 표시되는 클래스 */
        .profile-info-card.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* 프로필 텍스트 스타일들 */
        .profile-header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
        }

        .profile-name {
            font-size: clamp(36px, 4.5vw, 48px);
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #03045e;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .profile-catchphrase {
            display: inline-block;
            font-size: clamp(14px, 1.4vw, 16px);
            line-height: 1.5;
            color: #0077b6;
            background: transparent; 
            padding: 0;
            border: none;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        /* 하단 공지 및 VOD 섹션 스타일 (크기 고정형 2분할 상자) */
        .profile-widgets-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .widget-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 119, 190, 0.08);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-shadow: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
            
            /* 크기 고정 설정 */
            height: 95px;
            min-height: 95px;
            max-height: 95px;
            overflow: hidden;
        }

        .widget-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 190, 0.15);
        }

        .widget-title {
            font-size: 14px;
            font-weight: 800;
            color: #0077b6;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        .widget-content {
            font-size: 13px;
            color: #334155;
            line-height: 1.4;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-all;
        }

        /* 화면 맨아래 중앙에 위치하는 타임라인 섹션 스타일 */
        .timeline-wrapper {
            width: 100vw;
            display: flex;
            justify-content: center;
            padding: 0 20px 20px 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .timeline-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0, 119, 190, 0.08);
            box-sizing: border-box;
            width: 100%;
            max-width: 1400px;
            text-shadow: none;
        }

        .timeline-title {
            font-size: 14px;
            font-weight: 800;
            color: #0077b6;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timeline-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 100px;
            overflow-y: auto;
        }

        .timeline-item {
            font-size: 13px;
            color: #334155;
            display: flex;
            gap: 10px;
            align-items: baseline;
        }

        .timeline-date {
            font-weight: 700;
            color: #0077b6;
            white-space: nowrap;
        }

        .timeline-text {
            word-break: break-all;
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            .ocean-profile-container {
                flex-direction: column;
                padding: 16px;
                gap: 20px;
            }
            .profile-main-gif {
                width: 250px;
                height: 250px;
                margin-right: 0;
            }
            .profile-info-card {
                padding: 10px;
            }
            .profile-widgets-container {
                grid-template-columns: 1fr;
            }
            .widget-box {
                height: auto;
                min-height: unset;
                max-height: unset;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <!-- 왼쪽 이미지 영역 -->
        <div class="profile-main-gif" id="profile-gif"></div>

        <!-- 오른쪽 프로필 카드 -->
        <div class="profile-info-card" id="profile-card">
            <div class="profile-header-top">
                <div class="profile-name" id="view-name">로딩 중...</div>
                <div class="profile-catchphrase" id="view-catchphrase"></div>
            </div>
            
            <!-- 하단 크기가 고정된 최근 공지 / 최근 VOD 2분할 상자 영역 -->
            <div class="profile-widgets-container">
                <a href="#" id="widget-notice-link" class="widget-box" target="_blank">
                    <h4 class="widget-title">📢 최근 공지</h4>
                    <p class="widget-content" id="widget-notice-text">등록된 공지가 없습니다.</p>
                </a>
                <a href="#" id="widget-vod-link" class="widget-box" target="_blank">
                    <h4 class="widget-title">🎬 최근 VOD</h4>
                    <p class="widget-content" id="widget-vod-text">등록된 VOD가 없습니다.</p>
                </a>
            </div>
        </div>
    </div>

    <!-- 화면 맨아래 중앙에 위치하는 타임라인 영역 -->
    <div class="timeline-wrapper">
        <div class="timeline-container">
            <h4 class="timeline-title">🕒 타임라인</h4>
            <ul class="timeline-list" id="timeline-list">
                <li class="timeline-item"><span class="timeline-text">기록이 없습니다.</span></li>
            </ul>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev";

        function preloadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = reject;
                img.src = url;
            });
        }

        async function loadProfile() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`${WORKER_URL}?type=fanstartpage&t=${timestamp}`);
                if (!response.ok) throw new Error("데이터를 불러오지 못했습니다.");
                
                const data = await response.json();

                // 1. 기본 프로필 정보 바인딩
                document.getElementById("view-name").textContent = data.name || "바다비。";
                document.getElementById("view-catchphrase").innerHTML = (data.message || "").replace(/\n/g, '<br>');

                // 2. 최근 공지 링크 및 텍스트 바인딩
                if (data.notice) {
                    const noticeEl = document.getElementById("widget-notice-link");
                    const noticeTextEl = document.getElementById("widget-notice-text");
                    noticeEl.href = data.notice;
                    noticeTextEl.textContent = data.notice;
                }

                // 3. 최근 VOD 링크 및 텍스트 바인딩
                if (data.vod) {
                    const vodEl = document.getElementById("widget-vod-link");
                    const vodTextEl = document.getElementById("widget-vod-text");
                    vodEl.href = data.vod;
                    vodTextEl.textContent = data.vod;
                }

                // 4. 타임라인 리스트 바인딩
                const timelineListEl = document.getElementById("timeline-list");
                if (Array.isArray(data.timeline) && data.timeline.length > 0) {
                    timelineListEl.innerHTML = data.timeline.map(item => `
                        <li class="timeline-item">
                            <span class="timeline-date">[${item.time || ''}]</span>
                            <span class="timeline-text">${item.text || ''}</span>
                        </li>
                    `).join('');
                } else {
                    timelineListEl.innerHTML = `<li class="timeline-item"><span class="timeline-text">기록이 없습니다.</span></li>`;
                }

                // 5. 카드 등장 애니메이션 활성화
                document.getElementById("profile-card").classList.add('loaded');

                // 6. 이미지 프리로딩 및 배경 지정
                if (data.image) {
                    await preloadImage(data.image); 
                    const gifEl = document.getElementById("profile-gif");
                    gifEl.style.backgroundImage = `url('${data.image}')`;
                    gifEl.classList.add('loaded');
                }

            } catch (error) {
                console.error(error);
                document.getElementById("view-name").textContent = "데이터 로드 실패";
                document.getElementById("profile-gif").classList.add('loaded');
                document.getElementById("profile-card").classList.add('loaded');
            }
        }

        loadProfile();
    </script>

</body>
</html>
