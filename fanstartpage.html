<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 시작페이지</title>
    <style>
        /* 전체 페이지 기본 설정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 메인 콘텐츠 영역 */
        .ocean-profile-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            flex: 1;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 20px; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        /* 왼쪽 이미지 영역 */
        .profile-main-gif {
            position: relative;
            width: 600px; 
            height: 600px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            /* 마스크 효과 */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                                linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                        linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-composite: intersect;

            filter: drop-shadow(0 0 35px rgba(0, 119, 190, 0.5));
            z-index: 1;
            flex-shrink: 0;
            margin-right: 0;

            /* 애니메이션 설정 */
            opacity: 0;
            transform: scale(1);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .profile-main-gif.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* 오른쪽 프로필 카드 영역 */
        .profile-info-card {
            position: relative;
            z-index: 5;
            margin-left: -120px;
            background: transparent; 
            border: none; 
            box-shadow: none; 
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: #2b2d42; 
            box-sizing: border-box;
            padding: 20px;

            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .profile-info-card.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .profile-header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
        }

        .profile-name {
            font-size: clamp(36px, 4.5vw, 48px);
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #03045e;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .profile-catchphrase {
            display: inline-block;
            font-size: clamp(14px, 1.4vw, 16px);
            line-height: 1.5;
            color: #0077b6;
            background: transparent; 
            padding: 0;
            border: none;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .profile-links-container {
            display: flex;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .profile-link-box {
            flex: 1;
            min-width: 100px;
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: center;
            text-decoration: none;
            color: #0077b6;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0, 119, 190, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .profile-link-box:hover {
            transform: translateY(-2px);
            background: #0077b6;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(0, 119, 190, 0.15);
        }

        .profile-widgets-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .widget-box {
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            padding: 12px 15px;
            box-shadow: 0 4px 15px rgba(0, 119, 190, 0.08);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
            
            height: 75px;
            min-height: 75px;
            max-height: 75px;
            overflow: hidden;
        }

        .widget-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 190, 0.15);
        }

        .widget-title {
            font-size: 13px;
            font-weight: 800;
            color: #0077b6;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .widget-title svg {
            width: 15px;
            height: 15px;
            fill: #0077b6;
            flex-shrink: 0;
        }

        .widget-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .widget-item {
            font-size: 12px;
            color: #334155;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 타임라인 영역 스타일 */
        .timeline-container {
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 4px 15px rgba(0, 119, 190, 0.08);
            box-sizing: border-box;
            width: 100%;
            display: flex;
            flex-direction: column;
            
            height: 245px; 
            min-height: 245px;
            max-height: 245px;
        }

        .timeline-header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .timeline-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timeline-title {
            font-size: 13px;
            font-weight: 800;
            color: #0077b6;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timeline-title svg {
            width: 15px;
            height: 15px;
            fill: #0077b6;
            flex-shrink: 0;
        }

        .timeline-counter {
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
            background: rgba(0, 119, 190, 0.06);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .timeline-nav-btns {
            display: flex;
            gap: 4px;
        }

        .timeline-arrow-btn {
            background: rgba(0, 119, 190, 0.08);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 6px;
            color: #0077b6;
            width: 26px;
            height: 26px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
        }

        .timeline-arrow-btn:hover:not(:disabled) {
            background: #0077b6;
            color: #ffffff;
        }

        .timeline-arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .timeline-list {
            list-style: none;
            padding: 0;
            margin: 0;
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        /* 세로 선 위치 고정 */
        .timeline-list::before {
            content: '';
            position: absolute;
            left: 10px; 
            top: 4px;
            bottom: 4px;
            width: 2px;
            background-color: rgba(0, 119, 190, 0.2);
        }

        .timeline-item {
            position: absolute;
            left: 0;
            right: 0;
            padding-left: 24px;
            box-sizing: border-box;
            display: none; 
            flex-direction: column; 
            gap: 1px;
        }

        /* 각 항목이 보여질 때 위치 정밀 배분 */
        .timeline-item.show-1 { display: flex; top: 2px; }
        .timeline-item.show-2 { display: flex; top: 35px; }
        .timeline-item.show-3 { display: flex; top: 68px; }
        .timeline-item.show-4 { display: flex; top: 101px; }
        .timeline-item.show-5 { display: flex; top: 134px; }

        /* 동그란 점 위치 정밀 고정 */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 2px;
            width: 6px;
            height: 6px;
            background-color: #0077b6;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(0, 119, 190, 0.3);
        }

        .timeline-date {
            font-weight: 700;
            color: #0077b6;
            font-size: 11px; /* 날짜 글자 크기 유지 */
            letter-spacing: -0.3px;
            line-height: 1.1;
        }

        .timeline-text {
            word-break: break-all;
            line-height: 1.25;
            color: #334155;
            font-size: 11px; /* 설명 글자 크기 축소 */
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            .ocean-profile-container {
                flex-direction: column;
                padding: 8px;
                gap: 10px;
            }
            .profile-main-gif {
                width: 200px;
                height: 200px;
                margin-right: 0;
            }
            .profile-info-card {
                padding: 10px;
                margin-left: 0;
            }
            .profile-widgets-container {
                grid-template-columns: 1fr;
            }
            .widget-box {
                height: auto;
                min-height: unset;
                max-height: unset;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <!-- 왼쪽 이미지 영역 -->
        <div class="profile-main-gif" id="profile-gif"></div>

        <!-- 오른쪽 프로필 카드 -->
        <div class="profile-info-card" id="profile-card">
            <div class="profile-header-top">
                <div class="profile-name" id="view-name">로딩 중...</div>
                <div class="profile-catchphrase" id="view-catchphrase"></div>
            </div>
            
            <div class="profile-links-container" id="profile-links-container"></div>

            <!-- 하단 오늘의 추천 VOD / 오늘의 노래 추천 위젯 영역 -->
            <div class="profile-widgets-container">
                <a href="#" id="widget-notice-link" class="widget-box" target="_blank">
                    <h4 class="widget-title">
                        <svg viewBox="0 0 24 24"><path d="M21 3H3C1.9 3 1 3.9 1 5v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
                        오늘의 추천 VOD
                    </h4>
                    <ul class="widget-list" id="widget-notice-list">
                        <li class="widget-item">불러오는 중...</li>
                    </ul>
                </a>
                <a href="#" id="widget-vod-link" class="widget-box" target="_blank">
                    <h4 class="widget-title">
                        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        오늘의 노래 추천
                    </h4>
                    <ul class="widget-list" id="widget-vod-list">
                        <li class="widget-item">불러오는 중...</li>
                    </ul>
                </a>
            </div>

            <!-- 타임라인 영역 -->
            <div class="timeline-container">
                <div class="timeline-header-wrap">
                    <div class="timeline-title-area">
                        <h4 class="timeline-title">
                            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                            타임라인
                        </h4>
                        <span class="timeline-counter" id="timeline-counter">1-5 / 1</span>
                    </div>
                    <div class="timeline-nav-btns">
                        <button type="button" class="timeline-arrow-btn" id="timeline-prev-btn" onclick="moveTimelinePage(-1)" title="이전 5개">▲</button>
                        <button type="button" class="timeline-arrow-btn" id="timeline-next-btn" onclick="moveTimelinePage(1)" title="다음 5개">▼</button>
                    </div>
                </div>
                <ul class="timeline-list" id="timeline-list">
                    <li class="timeline-item show-1">
                        <span class="timeline-date">-</span>
                        <span class="timeline-text">기록이 없습니다.</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev";
        let currentPage = 0;
        const pageSize = 5; 
        let allTimelineData = [];

        function preloadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = reject;
                img.src = url;
            });
        }

        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

        function renderTimeline() {
            const timelineListEl = document.getElementById("timeline-list");
            const counterEl = document.getElementById("timeline-counter");
            const prevBtn = document.getElementById("timeline-prev-btn");
            const nextBtn = document.getElementById("timeline-next-btn");

            if (!Array.isArray(allTimelineData) || allTimelineData.length === 0) {
                timelineListEl.innerHTML = `
                    <li class="timeline-item show-1">
                        <span class="timeline-date">-</span>
                        <span class="timeline-text">기록이 없습니다.</span>
                    </li>
                `;
                counterEl.textContent = "1-1 / 1";
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            const totalCount = allTimelineData.length;
            const maxPage = Math.ceil(totalCount / pageSize) - 1;

            if (currentPage < 0) currentPage = 0;
            if (currentPage > maxPage) currentPage = maxPage;

            const startIndex = currentPage * pageSize;
            const endIndex = Math.min(startIndex + pageSize, totalCount);

            timelineListEl.innerHTML = allTimelineData.map((item, index) => {
                if (index >= startIndex && index < endIndex) {
                    const relativeIndex = (index - startIndex) + 1;
                    return `
                        <li class="timeline-item show-${relativeIndex}">
                            <span class="timeline-date">${item.time || ''}</span>
                            <span class="timeline-text">${item.text || ''}</span>
                        </li>
                    `;
                }
                return '';
            }).join('');

            counterEl.textContent = `${startIndex + 1}-${endIndex} / ${totalCount}`;
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage >= maxPage);
        }

        function moveTimelinePage(direction) {
            currentPage += direction;
            renderTimeline();
        }

        async function loadProfile() {
            try {
                const todayKey = new Date().toISOString().split('T')[0];
                
                const [profileRes, vodRes, songRes] = await Promise.all([
                    fetch(`${WORKER_URL}?type=fanstartpage&day=${todayKey}`),
                    fetch(`${WORKER_URL}?type=fanvodlist&day=${todayKey}`).catch(() => null),
                    fetch(`${WORKER_URL}?type=fansongstats&day=${todayKey}`).catch(() => null)
                ]);

                if (!profileRes.ok) throw new Error("기본 프로필 데이터를 불러오지 못했습니다.");
                const data = await profileRes.json();

                document.getElementById("view-name").textContent = data.name || "바다비。";
                document.getElementById("view-catchphrase").innerHTML = (data.message || "").replace(/\n/g, '<br>');

                const linksContainer = document.getElementById("profile-links-container");
                if (Array.isArray(data.links) && data.links.length > 0) {
                    linksContainer.innerHTML = data.links.map(link => `
                        <a href="${link.url}" class="profile-link-box" target="_blank">
                            ${link.name}
                        </a>
                    `).join('');
                } else {
                    linksContainer.innerHTML = "";
                }

                if (vodRes && vodRes.ok) {
                    const vodData = await vodRes.json();
                    const allVods = vodData.vods || [];
                    const vods = allVods.filter(vod => timeToSeconds(vod.duration || "0:00:00") >= 1800);

                    if (vods.length > 0) {
                        const sessionKey = "badabi_session_vod_" + todayKey;
                        let selectedVod = JSON.parse(sessionStorage.getItem(sessionKey));

                        if (!selectedVod) {
                            const randomIndex = Math.floor(Math.random() * vods.length);
                            selectedVod = vods[randomIndex];
                            sessionStorage.setItem(sessionKey, JSON.stringify(selectedVod));
                        }

                        document.getElementById("widget-notice-link").href = selectedVod.link;
                        document.getElementById("widget-notice-list").innerHTML = `<li class="widget-item">· ${selectedVod.title}</li>`;
                    } else {
                        document.getElementById("widget-notice-list").innerHTML = `<li class="widget-item">· 30분 이상인 VOD가 없습니다.</li>`;
                    }
                }
                
                if (songRes && songRes.ok) {
                    const songData = await songRes.json();
                    const allSongs = [
                        ...(songData.registeredSongs || []),
                        ...(songData.unregisteredSongs || [])
                    ];
                    const vodSources = songData.vodSources || [];

                    if (allSongs.length > 0) {
                        const sessionKey = "badabi_session_song_" + todayKey;
                        let sessionSongData = JSON.parse(sessionStorage.getItem(sessionKey));

                        let selectedSong, targetUrl;

                        if (!sessionSongData) {
                            const randomSongIndex = Math.floor(Math.random() * allSongs.length);
                            selectedSong = allSongs[randomSongIndex];

                            targetUrl = "#";
                            if (selectedSong && selectedSong.dateTimes && selectedSong.dateTimes.length > 0) {
                                const randomDateIndex = Math.floor(Math.random() * selectedSong.dateTimes.length);
                                const songDateTime = selectedSong.dateTimes[randomDateIndex];
                                
                                const matchedSource = vodSources.find(src => songDateTime.date.includes(src.date) || src.date.includes(songDateTime.date.split('(')[0]));
                                
                                if (matchedSource && matchedSource.url) {
                                    const totalSeconds = timeToSeconds(songDateTime.time);
                                    targetUrl = `${matchedSource.url}?change_second=${totalSeconds}`;
                                }
                            }
                            sessionSongData = { selectedSong, targetUrl };
                            sessionStorage.setItem(sessionKey, JSON.stringify(sessionSongData));
                        } else {
                            selectedSong = sessionSongData.selectedSong;
                            targetUrl = sessionSongData.targetUrl;
                        }
                        
                        const vodEl = document.getElementById("widget-vod-link");
                        const vodListEl = document.getElementById("widget-vod-list");

                        vodEl.href = targetUrl;
                        vodListEl.innerHTML = `<li class="widget-item">· ${selectedSong.title} (${selectedSong.artist})</li>`;
                    }
                }

                allTimelineData = data.timeline || [];
                currentPage = 0;
                renderTimeline();

                document.getElementById("profile-card").classList.add('loaded');

                if (data.image) {
                    await preloadImage(data.image); 
                    const gifEl = document.getElementById("profile-gif");
                    gifEl.style.backgroundImage = `url('${data.image}')`;
                    gifEl.classList.add('loaded');
                }

            } catch (error) {
                console.error(error);
                document.getElementById("view-name").textContent = "데이터 로드 실패";
                document.getElementById("profile-gif").classList.add('loaded');
                document.getElementById("profile-card").classList.add('loaded');
            }
        }

        loadProfile();
    </script>
    <footer style="text-align: center; padding: 10px 10px; color: #b3cde0; font-size: 11px; border-top: 1px solid rgba(0, 229, 255, 0.12); margin-top: 20px; width: 100%; box-sizing: border-box;">
        <p style="margin: 0; opacity: 0.8; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;">
            <strong style="display: block; margin-bottom: 5px; color: #03045e; font-size: 12px;">바다비 비공식 팬 아카이브</strong>
            <span style="display: inline-block;">비영리로 운영되며, 정보 갱신 시 데이터 반영에 차이가 있을 수 있습니다.</span>
        </p>
    </footer>
</body>
</html>
