<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 시작페이지</title>
    <style>
        /* 전체 페이지 기본 설정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 메인 콘텐츠 영역 */
        .ocean-profile-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            flex: 1;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 20px; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        /* 왼쪽 이미지 영역 기본 스타일 (로딩 전 투명) */
        .profile-main-gif {
            position: relative;
            width: 650px; 
            height: 650px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            /* 마스크 효과 */
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                                linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                        linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-composite: intersect;

            filter: drop-shadow(0 0 35px rgba(0, 119, 190, 0.5));
            z-index: 3;
            flex-shrink: 0;
            margin-right: -120px;

            /* 애니메이션 설정 */
            opacity: 0;
            transform: scale(1);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* 이미지 로딩 완료 시 표시되는 클래스 */
        .profile-main-gif.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* 오른쪽 프로필 카드 영역 */
        .profile-info-card {
            position: relative;
            z-index: 1;
            background: transparent; 
            border: none; 
            box-shadow: none; 
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: #2b2d42; 
            box-sizing: border-box;
            padding: 20px;

            /* 애니메이션 설정 */
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* 텍스트 로딩 완료 시 표시되는 클래스 */
        .profile-info-card.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* 프로필 텍스트 스타일들 */
        .profile-header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
        }

        .profile-name {
            font-size: clamp(36px, 4.5vw, 48px);
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #03045e;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .profile-catchphrase {
            display: inline-block;
            font-size: clamp(14px, 1.4vw, 16px);
            line-height: 1.5;
            color: #0077b6;
            background: transparent; 
            padding: 0;
            border: none;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        /* 관련 링크 박스 컨테이너 */
        .profile-links-container {
            display: flex;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .profile-link-box {
            flex: 1;
            min-width: 100px;
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: center;
            text-decoration: none;
            color: #0077b6;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0, 119, 190, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .profile-link-box:hover {
            transform: translateY(-2px);
            background: #0077b6;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(0, 119, 190, 0.15);
        }

        /* 하단 공지 및 VOD 섹션 스타일 */
        .profile-widgets-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        .widget-box {
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            padding: 12px 15px;
            box-shadow: 0 4px 15px rgba(0, 119, 190, 0.08);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-shadow: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
            
            height: 75px;
            min-height: 75px;
            max-height: 75px;
            overflow: hidden;
        }

        .widget-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 119, 190, 0.15);
        }

        .widget-title {
            font-size: 13px;
            font-weight: 800;
            color: #0077b6;
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        .widget-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .widget-item {
            font-size: 12px;
            color: #334155;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 타임라인 영역 스타일 */
        .timeline-container {
            background: rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            padding: 14px 18px;
            box-shadow: 0 4px 15px rgba(0, 119, 190, 0.08);
            box-sizing: border-box;
            width: 100%;
            text-shadow: none;
            display: flex;
            flex-direction: column;
        }

        .timeline-header-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .timeline-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timeline-title {
            font-size: 13px;
            font-weight: 800;
            color: #0077b6;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 타임라인 카운터 스타일 (예: 1 / 5) */
        .timeline-counter {
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
            background: rgba(0, 119, 190, 0.06);
            padding: 1px 6px;
            border-radius: 4px;
        }

        /* 상하 화살표 컨트롤러 버튼들 */
        .timeline-nav-btns {
            display: flex;
            gap: 4px;
        }

        .timeline-arrow-btn {
            background: rgba(0, 119, 190, 0.08);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 6px;
            color: #0077b6;
            width: 26px;
            height: 26px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
        }

        .timeline-arrow-btn:hover:not(:disabled) {
            background: #0077b6;
            color: #ffffff;
        }

        .timeline-arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .timeline-list {
            list-style: none;
            padding: 0 0 0 12px; /* 세로줄 공간 */
            margin: 0;
            position: relative;
            min-height: 52px; /* 2줄 내용 공간 안정화 */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 왼쪽 타임라인 세로줄 */
        .timeline-list::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 2px;
            bottom: 2px;
            width: 2px;
            background-color: rgba(0, 119, 190, 0.2);
        }

        .timeline-item {
            position: relative;
            font-size: 12.5px;
            color: #1e293b;
            display: none; /* 기본 숨김 */
            flex-direction: column; /* 2줄 구조 (상단 날짜, 하단 내용) */
            gap: 3px;
            padding-left: 16px;
        }

        /* 타임라인 점(마커) */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 4px;
            width: 8px;
            height: 8px;
            background-color: #0077b6;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(0, 119, 190, 0.3);
        }

        .timeline-item.show {
            display: flex; 
        }

        /* 1번째 줄: 날짜 영역 */
        .timeline-date {
            font-weight: 700;
            color: #0077b6;
            font-size: 11.5px;
            letter-spacing: -0.3px;
        }

        /* 2번째 줄: 내용 영역 */
        .timeline-text {
            word-break: break-all;
            line-height: 1.4;
            color: #334155;
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            .ocean-profile-container {
                flex-direction: column;
                padding: 16px;
                gap: 20px;
            }
            .profile-main-gif {
                width: 250px;
                height: 250px;
                margin-right: 0;
            }
            .profile-info-card {
                padding: 10px;
            }
            .profile-widgets-container {
                grid-template-columns: 1fr;
            }
            .widget-box {
                height: auto;
                min-height: unset;
                max-height: unset;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <!-- 왼쪽 이미지 영역 -->
        <div class="profile-main-gif" id="profile-gif"></div>

        <!-- 오른쪽 프로필 카드 -->
        <div class="profile-info-card" id="profile-card">
            <div class="profile-header-top">
                <div class="profile-name" id="view-name">로딩 중...</div>
                <div class="profile-catchphrase" id="view-catchphrase"></div>
            </div>
            
            <!-- 프로필 메시지 바로 아래 관련 링크 상자 영역 -->
            <div class="profile-links-container" id="profile-links-container">
                <!-- 동적으로 링크 상자들이 생성됩니다 -->
            </div>

            <!-- 하단 최근 공지 / 최근 VOD 리스트 영역 -->
            <div class="profile-widgets-container">
                <a href="#" id="widget-notice-link" class="widget-box" target="_blank">
                    <h4 class="widget-title">📢 공지</h4>
                    <ul class="widget-list" id="widget-notice-list">
                        <li class="widget-item">등록된 공지가 없습니다.</li>
                    </ul>
                </a>
                <a href="#" id="widget-vod-link" class="widget-box" target="_blank">
                    <h4 class="widget-title">🎬 VOD</h4>
                    <ul class="widget-list" id="widget-vod-list">
                        <li class="widget-item">등록된 VOD가 없습니다.</li>
                    </ul>
                </a>
            </div>

            <!-- 공지·VOD 아래에 위치하는 타임라인 영역 -->
            <div class="timeline-container">
                <div class="timeline-header-wrap">
                    <div class="timeline-title-area">
                        <h4 class="timeline-title">🕒 타임라인</h4>
                        <span class="timeline-counter" id="timeline-counter">1 / 1</span>
                    </div>
                    <div class="timeline-nav-btns">
                        <button type="button" class="timeline-arrow-btn" id="timeline-prev-btn" onclick="moveTimeline(-1)" title="이전 기록">▲</button>
                        <button type="button" class="timeline-arrow-btn" id="timeline-next-btn" onclick="moveTimeline(1)" title="다음 기록">▼</button>
                    </div>
                </div>
                <ul class="timeline-list" id="timeline-list">
                    <li class="timeline-item show">
                        <span class="timeline-date">-</span>
                        <span class="timeline-text">기록이 없습니다.</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev";
        let currentIndex = 0; 
        let allTimelineData = [];

        function preloadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = reject;
                img.src = url;
            });
        }

        function renderTimeline() {
            const timelineListEl = document.getElementById("timeline-list");
            const counterEl = document.getElementById("timeline-counter");
            const prevBtn = document.getElementById("timeline-prev-btn");
            const nextBtn = document.getElementById("timeline-next-btn");

            if (!Array.isArray(allTimelineData) || allTimelineData.length === 0) {
                timelineListEl.innerHTML = `
                    <li class="timeline-item show">
                        <span class="timeline-date">-</span>
                        <span class="timeline-text">기록이 없습니다.</span>
                    </li>
                `;
                counterEl.textContent = "1 / 1";
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            // 인덱스 범위 안전장치
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= allTimelineData.length) currentIndex = allTimelineData.length - 1;

            const item = allTimelineData[currentIndex];

            // 1개 항목 렌더링
            timelineListEl.innerHTML = `
                <li class="timeline-item show">
                    <span class="timeline-date">${item.time || ''}</span>
                    <span class="timeline-text">${item.text || ''}</span>
                </li>
            `;

            // 카운터 업데이트 (예: 1 / 5)
            counterEl.textContent = `${currentIndex + 1} / ${allTimelineData.length}`;

            // 화살표 활성화/비활성화 상태 업데이트
            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === allTimelineData.length - 1);
        }

        // 화살표 클릭 시 이전(-1)/다음(+1) 기록으로 전환하는 함수
        function moveTimeline(direction) {
            currentIndex += direction;
            renderTimeline();
        }

        async function loadProfile() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`${WORKER_URL}?type=fanstartpage&t=${timestamp}`);
                if (!response.ok) throw new Error("데이터를 불러오지 못했습니다.");
                
                const data = await response.json();

                // 1. 기본 프로필 정보 바인딩
                document.getElementById("view-name").textContent = data.name || "바다비。";
                document.getElementById("view-catchphrase").innerHTML = (data.message || "").replace(/\n/g, '<br>');

                // 1-1. 관련 링크 상자들 바인딩
                const linksContainer = document.getElementById("profile-links-container");
                if (Array.isArray(data.links) && data.links.length > 0) {
                    linksContainer.innerHTML = data.links.map(link => `
                        <a href="${link.url}" class="profile-link-box" target="_blank">
                            ${link.name}
                        </a>
                    `).join('');
                } else {
                    linksContainer.innerHTML = "";
                }

                // 2. 최근 공지 리스트 바인딩
                if (data.notice) {
                    const noticeEl = document.getElementById("widget-notice-link");
                    const noticeListEl = document.getElementById("widget-notice-list");
                    noticeEl.href = data.notice;
                    
                    const notices = Array.isArray(data.noticeList) ? data.noticeList : [data.noticeTitle || "공지사항 바로가기"];
                    noticeListEl.innerHTML = notices.map(item => `<li class="widget-item">· ${item}</li>`).join('');
                }

                // 3. 최근 VOD 리스트 바인딩
                if (data.vod) {
                    const vodEl = document.getElementById("widget-vod-link");
                    const vodListEl = document.getElementById("widget-vod-list");
                    vodEl.href = data.vod;
                    
                    const vods = Array.isArray(data.vodList) ? data.vodList : [data.vodTitle || "VOD 영상 바로가기"];
                    vodListEl.innerHTML = vods.map(item => `<li class="widget-item">· ${item}</li>`).join('');
                }

                // 4. 타임라인 데이터 저장 및 초기화
                allTimelineData = data.timeline || [];
                currentIndex = 0;
                renderTimeline();

                // 5. 카드 등장 애니메이션 활성화
                document.getElementById("profile-card").classList.add('loaded');

                // 6. 이미지 프리로딩 및 배경 지정
                if (data.image) {
                    await preloadImage(data.image); 
                    const gifEl = document.getElementById("profile-gif");
                    gifEl.style.backgroundImage = `url('${data.image}')`;
                    gifEl.classList.add('loaded');
                }

            } catch (error) {
                console.error(error);
                document.getElementById("view-name").textContent = "데이터 로드 실패";
                document.getElementById("profile-gif").classList.add('loaded');
                document.getElementById("profile-card").classList.add('loaded');
            }
        }

        loadProfile();
    </script>
</body>
</html>
