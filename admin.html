<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badabi Songbook - 관리자 인증</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9f9f9; color: #333; }
        .card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { background: #4f46e5; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #4338ca; }
        .status { margin-top: 15px; font-weight: bold; font-size: 14px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔒 관리자 인증</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 20px;">비밀번호를 입력하세요.</p>
        <input type="password" id="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter') verifyPassword()">
        <button onclick="verifyPassword()">확인</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        async function verifyPassword() {
            const password = document.getElementById('password').value;
            const statusEl = document.getElementById('status');

            if (!password) {
                statusEl.className = 'status error';
                statusEl.innerText = '비밀번호를 입력해주세요.';
                return;
            }

            statusEl.className = 'status';
            statusEl.innerText = '확인 중...';

            try {
                // 👉 아래의 URL을 본인의 Cloudflare Worker 주소로 변경해주세요!
                const workerUrl = 'https://badabi-api.dalkkumli054.workers.dev'; 

                // 비밀번호 검증을 위해 빈 데이터나 현재 데이터를 전송 (여기서는 비밀번호만 단독 검증하기 위해 빈 배열 전달)
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        password: password,
                        songsData: [] // 혹은 기존 데이터를 유지하려면 이 부분을 수정할 수 있습니다.
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    statusEl.className = 'status success';
                    statusEl.innerText = '입력되었습니다!';
                } else {
                    statusEl.className = 'status error';
                    statusEl.innerText = '비밀번호가 틀렸습니다.';
                }
            } catch (err) {
                statusEl.className = 'status error';
                statusEl.innerText = '통신 에러가 발생했습니다.';
            }
        }
    </script>
</body>
</html>
