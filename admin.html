<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 통합 관리자</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f7f9;
            color: #2b2d42;
        }
        h2 { color: #03045e; border-bottom: 2px solid rgba(0, 119, 190, 0.2); padding-bottom: 10px; }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 119, 190, 0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(0, 119, 190, 0.15);
        }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #0077b6; }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0, 119, 190, 0.25);
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 14px;
            background: #fafbfc;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            background-color: #0077b6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: #03045e; }
        .song-item-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }
        .delete-btn {
            background-color: #ef4444;
            padding: 6px 12px;
            font-size: 13px;
            float: right;
        }
        .delete-btn:hover { background-color: dc2626; }
        #status { margin-top: 15px; font-weight: 700; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .batch-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h2>🎵 바다비 노래책 관리자 패널</h2>

    <!-- [1단계] 로그인 섹션 -->
    <div id="login-section" class="card">
        <h3>🔐 관리자 인증</h3>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 15px;">관리자 페이지를 이용하려면 비밀번호를 입력해주세요.</p>
        <input type="password" id="admin-password" placeholder="Cloudflare Worker에 설정한 비밀번호 입력">
        <button onclick="verifyAndLoad()" style="width: 100%;">로그인 및 데이터 불러오기</button>
        <div id="login-status" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <!-- [2단계] 실제 수정 패널 -->
    <div id="admin-panel" class="card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0; color: #03045e;">📝 노래책 내용 편집</h3>
            <button onclick="location.reload()" style="background-color: #64748b; padding: 6px 12px; font-size: 13px;">로그아웃</button>
        </div>

        <!-- 공지사항 수정 영역 -->
        <div style="margin-bottom: 25px;">
            <label for="notice-input">📢 공지사항 내용</label>
            <textarea id="notice-input" placeholder="공지사항을 입력하세요..."></textarea>
        </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin-bottom: 25px;">

        <!-- [신규] 구글 시트/엑셀 데이터 일괄 붙여넣기 섹션 -->
        <div class="batch-box">
            <label style="color: #15803d; margin-bottom: 5px;">📊 구글 시트(엑셀) 데이터 한 번에 가져오기</label>
            <p style="font-size: 13px; color: #166534; margin-top: 0; margin-bottom: 10px;">
                구글 시트에서 행들을 복사(Ctrl+C)한 뒤 아래 칸에 붙여넣기(Ctrl+V)하고 버튼을 누르면 목록에 싹 추가됩니다!<br>
                (순서: <b>제목 / 가수 / 장르 / 제한 / 기타</b> 순서의 탭(Tab) 구분 형태 권장)
            </p>
            <textarea id="batch-input" placeholder="여기에 구글 시트 복사 내용을 붙여넣으세요..." style="height: 80px; background: #fff;"></textarea>
            <button onclick="importBatchSongs()" style="background-color: #16a34a; padding: 8px 16px; font-size: 13px;">붙여넣은 내용으로 목록에 추가하기</button>
        </div>

        <!-- 노래 목록 수정 영역 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <label style="margin: 0;">🎶 노래 목록 (<span id="song-count-badge">0</span>곡)</label>
            <button onclick="addSong()" style="background-color: #10b981; padding: 8px 14px; font-size: 13px;">+ 새 노래 직접 추가하기</button>
        </div>

        <div id="songs-container">
            <!-- 자바스크립트로 동적 생성됨 -->
        </div>

        <button onclick="saveSonglist()" style="width: 100%; margin-top: 20px; background-color: #0077b6; padding: 14px; font-size: 16px;">GitHub에 최종 변경사항 반영하기</button>
        <div id="status"></div>
    </div>

<script>
    const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
    const GITHUB_JSON_URL = "https://lunaplena0.github.io/songlist.json";

    let loadedData = { notice: "", songs: [] };

    async function verifyAndLoad() {
        const password = document.getElementById("admin-password").value;
        const statusEl = document.getElementById("login-status");

        if (!password) {
            statusEl.style.color = "#ef4444";
            statusEl.textContent = "비밀번호를 입력해주세요.";
            return;
        }

        statusEl.style.color = "#0077b6";
        statusEl.textContent = "데이터를 불러오는 중...";

        try {
            const response = await fetch(GITHUB_JSON_URL + "?t=" + new Date().getTime());
            if (!response.ok) throw new Error("GitHub 데이터를 불러오지 못했습니다.");
            
            loadedData = await response.json();

            document.getElementById("login-section").style.display = "none";
            document.getElementById("admin-panel").style.display = "block";

            renderEditor();

        } catch (error) {
            statusEl.style.color = "#ef4444";
            statusEl.textContent = "로드 실패: " + error.message;
        }
    }

    function renderEditor() {
        document.getElementById("notice-input").value = loadedData.notice || "";
        const container = document.getElementById("songs-container");
        container.innerHTML = "";

        const songs = loadedData.songs || [];
        document.getElementById("song-count-badge").textContent = songs.length;

        songs.forEach((song, index) => {
            const box = document.createElement("div");
            box.className = "song-item-box";
            box.innerHTML = `
                <button class="delete-btn" onclick="deleteSong(${index})">삭제</button>
                <div style="font-weight: bold; margin-bottom: 10px; color: #0077b6;">#${index + 1}</div>
                <div class="row">
                    <div>
                        <label style="font-size: 12px;">노래 제목</label>
                        <input type="text" class="input-title" value="${escapeHtml(song.title || '')}" placeholder="제목">
                    </div>
                    <div>
                        <label style="font-size: 12px;">가수</label>
                        <input type="text" class="input-artist" value="${escapeHtml(song.artist || '')}" placeholder="가수">
                    </div>
                </div>
                <div class="row">
                    <div>
                        <label style="font-size: 12px;">장르</label>
                        <input type="text" class="input-genre" value="${escapeHtml(song.genre || '')}" placeholder="K팝, J팝 등">
                    </div>
                    <div>
                        <label style="font-size: 12px;">제한/조건 (limit)</label>
                        <input type="text" class="input-limit" value="${escapeHtml(song.limit || '')}" placeholder="기타연주 등">
                    </div>
                </div>
                <div>
                    <label style="font-size: 12px;">기타 정보 (etc)</label>
                    <input type="text" class="input-etc" value="${escapeHtml(song.etc || '')}" placeholder="특이사항">
                </div>
            `;
            container.appendChild(box);
        });
    }

    function escapeHtml(str) {
        return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function addSong() {
        syncFormToData();
        if (!loadedData.songs) loadedData.songs = [];
        loadedData.songs.unshift({ title: "", artist: "", genre: "", limit: "", etc: "" });
        renderEditor();
    }

    // 구글 시트 복사본 일괄 파싱 기능
    function importBatchSongs() {
        syncFormToData();
        const rawText = document.getElementById("batch-input").value.trim();
        if (!rawText) {
            alert("붙여넣을 텍스트가 없습니다.");
            return;
        }

        const lines = rawText.split("\n");
        let addedCount = 0;

        lines.forEach(line => {
            const cols = line.split("\t"); // 엑셀/구글시트는 복사하면 탭(\t)으로 구분됨
            if (cols.length >= 1 && cols[0].trim() !== "") {
                // 구글 시트 구조 매칭 (제목, 가수, 장르, 제한, 기타 순서 가정)
                const newSong = {
                    title: cols[0] ? cols[0].trim() : "",
                    artist: cols[1] ? cols[1].trim() : "",
                    genre: cols[2] ? cols[2].trim() : "",
                    limit: cols[3] ? cols[3].trim() : "",
                    etc: cols[4] ? cols[4].trim() : ""
                };
                loadedData.songs.unshift(newSong); // 맨 위에 추가
                addedCount++;
            }
        });

        if (addedCount > 0) {
            document.getElementById("batch-input").value = ""; // 입력창 초기화
            renderEditor();
            alert(`${addedCount}곡이 성공적으로 목록에 추가되었습니다! (맨 위 확인)`);
        } else {
            alert("파싱된 데이터가 없습니다. 구글 시트 셀을 올바르게 복사했는지 확인해주세요.");
        }
    }

    function deleteSong(index) {
        syncFormToData();
        if (confirm(`"${loadedData.songs[index].title || '제목없음'}" 곡을 삭제하시겠습니까?`)) {
            loadedData.songs.splice(index, 1);
            renderEditor();
        }
    }

    function syncFormToData() {
        loadedData.notice = document.getElementById("notice-input").value;
        const boxes = document.querySelectorAll(".song-item-box");
        
        boxes.forEach((box, index) => {
            loadedData.songs[index] = {
                title: box.querySelector(".input-title").value,
                artist: box.querySelector(".input-artist").value,
                genre: box.querySelector(".input-genre").value,
                limit: box.querySelector(".input-limit").value,
                etc: box.querySelector(".input-etc").value
            };
        });
    }

    async function saveSonglist() {
        syncFormToData();
        const password = document.getElementById("admin-password").value;
        const statusEl = document.getElementById("status");

        statusEl.style.color = "#0077b6";
        statusEl.textContent = "GitHub에 반영 중...";

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    password: password,
                    content: loadedData
                })
            });

            const result = await response.json();

            if (response.ok) {
                statusEl.style.color = "#10b981";
                statusEl.textContent = "성공적으로 업데이트되었습니다! (GitHub Pages 반영까지 1~2분 소요)";
            } else {
                statusEl.style.color = "#ef4444";
                statusEl.textContent = "업데이트 실패: " + (result.error || "비밀번호가 틀렸거나 오류가 발생했습니다.");
            }
        } catch (error) {
            statusEl.style.color = "#ef4444";
            statusEl.textContent = "네트워크 오류: " + error.message;
        }
    }
</script>

</body>
</html>
