<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 통합 관리자</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f7f9;
            color: #2b2d42;
        }
        h2 { color: #03045e; border-bottom: 2px solid rgba(0, 119, 190, 0.2); padding-bottom: 10px; }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 119, 190, 0.1);
            margin-bottom: 20px;
            border: 1px solid rgba(0, 119, 190, 0.15);
        }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #0077b6; }
        textarea {
            width: 100%;
            height: 400px;
            font-family: monospace;
            font-size: 13px;
            padding: 12px;
            border: 1px solid rgba(0, 119, 190, 0.25);
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
            background: #fafbfc;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0, 119, 190, 0.25);
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background-color: #0077b6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: #03045e; }
        #load-btn { background-color: #475569; }
        #load-btn:hover { background-color: #334155; }
        #status { margin-top: 15px; font-weight: 700; font-size: 14px; }
    </style>
</head>
<body>

    <h2>🎵 노래책(songlist.json) 관리자 패널</h2>

    <div class="card">
        <div class="btn-group">
            <button id="load-btn" onclick="loadSonglist()">현재 GitHub 데이터 불러오기</button>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="songlist-json">songlist.json 편집 (JSON 형식)</label>
            <textarea id="songlist-json" placeholder="데이터를 불러오거나 직접 입력하세요..."></textarea>
        </div>

        <div>
            <label for="admin-password">관리자 비밀번호</label>
            <input type="password" id="admin-password" placeholder="Cloudflare Worker에 설정한 비밀번호 입력">
        </div>

        <button onclick="saveSonglist()" style="width: 100%;">GitHub에 변경사항 반영하기</button>
        <div id="status"></div>
    </div>

<script>
    // 본인의 Cloudflare Worker 주소로 변경하세요!
    const WORKER_URL = "https://your-worker-subdomain.workers.dev";
    const GITHUB_JSON_URL = "https://lunaplena0.github.io/songlist.json";

    async function loadSonglist() {
        const statusEl = document.getElementById("status");
        statusEl.style.color = "#0077b6";
        statusEl.textContent = "GitHub에서 데이터를 불러오는 중...";

        try {
            const response = await fetch(GITHUB_JSON_URL + "?t=" + new Date().getTime()); // 캐시 방지
            if (!response.ok) throw new Error("파일을 불러오지 못했습니다.");
            
            const data = await response.json();
            document.getElementById("songlist-json").value = JSON.stringify(data, null, 2);
            statusEl.style.color = "#10b981";
            statusEl.textContent = "데이터를 성공적으로 불러왔습니다!";
        } catch (error) {
            statusEl.style.color = "#ef4444";
            statusEl.textContent = "불러오기 실패: " + error.message;
        }
    }

    async function saveSonglist() {
        const statusEl = document.getElementById("status");
        const jsonText = document.getElementById("songlist-json").value;
        const password = document.getElementById("admin-password").value;

        let parsedContent;
        try {
            parsedContent = JSON.parse(jsonText);
        } catch (e) {
            statusEl.style.color = "#ef4444";
            statusEl.textContent = "오류: 올바른 JSON 형식이 아닙니다. 따옴표나 쉼표를 확인해주세요.";
            return;
        }

        statusEl.style.color = "#0077b6";
        statusEl.textContent = "GitHub에 반영 중...";

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    password: password,
                    content: parsedContent
                })
            });

            const result = await response.json();

            if (response.ok) {
                statusEl.style.color = "#10b981";
                statusEl.textContent = "성공적으로 업데이트되었습니다! (GitHub Pages 반영까지 1~2분 소요)";
            } else {
                statusEl.style.color = "#ef4444";
                statusEl.textContent = "업데이트 실패: " + (result.error || "알 수 없는 오류");
            }
        } catch (error) {
            statusEl.style.color = "#ef4444";
            statusEl.textContent = "네트워크 오류: " + error.message;
        }
    }

    // 페이지 접속 시 자동 로드
    loadSonglist();
</script>

</body>
</html>
