<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 팬 아카이브</title>
    <style>
        /* 전체 페이지 기본 설정: 세로 정렬 및 배경 색상 지정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 상단 네비게이션 바 스타일: 고정 및 블러 효과 적용 */
        .marine-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(3, 4, 94, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 12px 24px;
        }

        /* 네비게이션바 내부 컨테이너 정렬 */
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 네비게이션 로고 스타일 */
        .nav-logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #caf0f8;
            text-decoration: none;
        }

        /* 네비게이션 링크 리스트 스타일 */
        .nav-links {
            display: flex;
            gap: 16px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 네비게이션 개별 링크 스타일 및 호버 효과 */
        .nav-links a {
            color: #90e0ef;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
            padding: 6px 6px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 메인 콘텐츠 영역 (내부를 비우고 공간을 채우도록 설정) */
        .main-content-container {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="marine-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BABABI FAN ARCHIVE</a>
            <ul class="nav-links">
                <li><a href="profile.html">프로필</a></li>
                <li><a href="link.html">주소모음</a></li>
            </ul>
        </div>
    </nav>

    <!-- 메인 콘텐츠 영역 (내부가 비어 있는 상태) -->
    <div class="main-content-container">
        <!-- 필요한 메인 화면 내용을 이 안쪽에 자유롭게 채워 넣으시면 됩니다. -->
    </div>

</body>
</html>
