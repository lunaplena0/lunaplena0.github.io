<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 VOD 리스트</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        /* 월별 섹션 스타일 */
        .month-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .month-title {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            border-left: 5px solid #0077b6;
            padding-left: 10px;
            margin: 0;
        }

        .vod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        @keyframes fadeUpIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vod-card {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            opacity: 0;
            animation: fadeUpIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .vod-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 119, 182, 0.12);
        }

        /* 썸네일 영역 */
        .vod-thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .vod-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .no-thumb {
            color: #94a3b8;
            font-size: 13px;
            font-weight: bold;
        }

        .vod-duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* VOD 정보 영역 */
        .vod-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .vod-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 6px 0;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vod-meta {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vod-desc {
            font-size: 12px;
            color: #475569;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 뱃지 영역 */
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: auto;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .badge-adult {
            background-color: #fee2e2;
            color: #ef4444;
        }

        .badge-sub {
            background-color: #e0e7ff;
            color: #4f46e5;
        }

        .badge-category {
            background-color: #f1f5f9;
            color: #475569;
        }

        .full-width-message {
            text-align: center;
            color: #64748b;
            font-size: 16px;
            padding: 40px 0;
            width: 100%;
        }

        @media (max-width: 500px) {
            .vod-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .main-container {
                padding: 16px 10px;
            }
            .month-title {
                font-size: 18px;
            }
            .vod-info {
                padding: 8px;
            }
            .vod-title {
                font-size: 12px;
            }
            .vod-desc, .vod-meta {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-container">
        <p class="full-width-message">VOD 리스트를 불러오는 중...</p>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const VOD_API_URL = WORKER_URL + "?type=fanvodlist&t=";

        async function loadVODs() {
            const container = document.getElementById("main-container");
            
            try {
                const response = await fetch(VOD_API_URL + new Date().getTime());
                if (!response.ok) throw new Error("VOD 정보를 불러오지 못했습니다.");
                
                const data = await response.json();
                const vods = data.vods || [];

                container.innerHTML = "";

                if (vods.length === 0) {
                    container.innerHTML = '<p class="full-width-message">등록된 VOD가 없습니다.</p>';
                    return;
                }

                // 💡 1. 년-월(YYYY-MM) 기준으로 데이터 그룹화하기
                const groupedVods = {};
                vods.forEach(item => {
                    if (!item.date) return;
                    const yearMonth = item.date.substring(0, 7); // "2026-04" 형태 추출
                    if (!groupedVods[yearMonth]) {
                        groupedVods[yearMonth] = [];
                    }
                    groupedVods[yearMonth].push(item);
                });

                // 💡 2. 년-월 기준 내림차순 정렬 (최신 월이 위로 오도록)
                const sortedMonths = Object.keys(groupedVods).sort().reverse();

                let globalIndex = 0; // 전체 애니메이션 지연 계산용

                // 💡 3. 월별 섹션 HTML 생성 및 조립
                sortedMonths.forEach(yearMonth => {
                    const [year, month] = yearMonth.split("-");
                    const formattedMonthTitle = `${year}년 ${parseInt(month, 10)}월`;

                    const section = document.createElement("div");
                    section.className = "month-section";

                    const titleEl = document.createElement("h2");
                    titleEl.className = "month-title";
                    titleEl.textContent = formattedMonthTitle;
                    section.appendChild(titleEl);

                    const gridEl = document.createElement("div");
                    gridEl.className = "vod-grid";

                    groupedVods[yearMonth].forEach((item) => {
                        const card = document.createElement("a");
                        card.href = item.link;
                        card.className = "vod-card";
                        card.target = "_blank";
                        card.rel = "noopener noreferrer";
                        card.style.animationDelay = `${(globalIndex++) * 0.03}s`;

                        const thumbHTML = item.thumbnail 
                            ? `<img src="${item.thumbnail}" alt="thumbnail" class="vod-thumb" loading="lazy">` 
                            : `<div class="vod-thumb no-thumb">No Image</div>`;

                        let badgesHTML = `<span class="badge badge-category">${item.category || "기타"}</span>`;
                        if (item.adult === "Y") badgesHTML += `<span class="badge badge-adult">19+</span>`;
                        if (item.subPlus === "Y") badgesHTML += `<span class="badge badge-sub">구독+</span>`;

                        card.innerHTML = `
                            <div class="vod-thumb-wrapper">
                                ${thumbHTML}
                                <div class="vod-duration">${item.duration || "-:--:--"}</div>
                            </div>
                            <div class="vod-info">
                                <h3 class="vod-title">${item.title}</h3>
                                <div class="vod-meta">
                                    <span>📅 ${item.date}</span>
                                </div>
                                <p class="vod-desc">${item.description || "설명 없음"}</p>
                                <div class="badge-container">
                                    ${badgesHTML}
                                </div>
                            </div>
                        `;

                        gridEl.appendChild(card);
                    });

                    section.appendChild(gridEl);
                    container.appendChild(section);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="full-width-message" style="color: #ef4444;">VOD 리스트 로드 실패</p>`;
            }
        }

        loadVODs();
    </script>
</body>
</html>
