<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 VOD 리스트</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 15px 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 상단 월 선택 필터 바 */
        .filter-bar {
            display: flex;
            gap: 8px; 
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: thin;
        }

        .filter-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: #0077b6;
            color: #0077b6;
        }

        .filter-btn.active {
            background-color: #0077b6;
            border-color: #0077b6;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 119, 182, 0.3);
        }

        /* 월별 섹션 스타일 */
        .month-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .month-title {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            border-left: 5px solid #0077b6;
            padding-left: 10px;
            margin: 0;
        }

        .vod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        @keyframes fadeUpIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vod-card {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            opacity: 0;
            animation: fadeUpIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .vod-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 119, 182, 0.12);
        }

        /* 기본 숨김 처리 제어를 위한 클래스 */
        .vod-card.collapsed-hidden {
            display: none !important;
        }

        /* 썸네일 영역 */
        .vod-thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        .vod-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .no-thumb {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            background-color: #e2e8f0;
        }

        .vod-duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* VOD 정보 영역 */
        .vod-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .vod-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 6px 0;
            line-height: 1.35;
            height: calc(14px * 1.35 * 2);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vod-meta {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vod-desc {
            font-size: 12px;
            color: #475569;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 뱃지 영역 */
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: auto;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .badge-adult {
            background-color: #fee2e2;
            color: #ef4444;
        }

        .badge-sub {
            background-color: #e0e7ff;
            color: #4f46e5;
        }

        .badge-category {
            background-color: #f1f5f9;
            color: #475569;
        }

        /* 더보기 버튼 스타일 */
        .expand-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 10px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: center;
        }

        .expand-btn:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
        }

        .full-width-message {
            text-align: center;
            color: #64748b;
            font-size: 16px;
            padding: 40px 0;
            width: 100%;
        }

        @media (max-width: 500px) {
            .vod-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .main-container {
                padding: 16px 10px;
            }
            .month-title {
                font-size: 18px;
            }
            .vod-info {
                padding: 8px;
            }
            .vod-title {
                font-size: 12px;
                height: calc(12px * 1.35 * 2);
            }
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-container">
        <p class="full-width-message">VOD 리스트를 불러오는 중...</p>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const VOD_API_URL = WORKER_URL + "?type=fanvodlist&t=";

        async function loadVODs() {
            const container = document.getElementById("main-container");
            
            try {
                const response = await fetch(VOD_API_URL + new Date().getTime());
                if (!response.ok) throw new Error("VOD 정보를 불러오지 못했습니다.");
                
                const data = await response.json();
                const vods = data.vods || [];

                container.innerHTML = "";

                if (vods.length === 0) {
                    container.innerHTML = '<p class="full-width-message">등록된 VOD가 없습니다.</p>';
                    return;
                }

                // 1. 년-월(YYYY-MM) 기준으로 데이터 그룹화
                const groupedVods = {};
                vods.forEach(item => {
                    if (!item.date) return;
                    const yearMonth = item.date.substring(0, 7);
                    if (!groupedVods[yearMonth]) {
                        groupedVods[yearMonth] = [];
                    }
                    groupedVods[yearMonth].push(item);
                });

                // 2. 최신순 정렬
                const sortedMonths = Object.keys(groupedVods).sort().reverse();
                const latestMonth = sortedMonths[0]; // 가장 최신 월

                // 3. 상단 월 선택 필터 바 생성 (버튼에 개수 표시)
                const filterBar = document.createElement("div");
                filterBar.className = "filter-bar";

                sortedMonths.forEach((ym) => {
                    const [y, m] = ym.split("-");
                    const count = groupedVods[ym].length; // 해당 월의 VOD 총 개수
                    
                    const btn = document.createElement("button");
                    btn.className = "filter-btn";
                    if (ym === latestMonth) btn.classList.add("active");
                    btn.dataset.month = ym;
                    btn.textContent = `${y}년 ${parseInt(m, 10)}월 (${count})`;
                    btn.onclick = () => filterMonth(ym);
                    filterBar.appendChild(btn);
                });

                container.appendChild(filterBar);

                // 컨텐츠가 담길 래퍼 생성
                const contentWrapper = document.createElement("div");
                contentWrapper.id = "content-wrapper";
                contentWrapper.style.display = "flex";
                contentWrapper.style.flexDirection = "column";
                contentWrapper.style.gap = "36px";
                container.appendChild(contentWrapper);

                let globalIndex = 0;

                // 화면 크기에 따른 기본 노출 개수 설정 (모바일 500px 이하: 6개, PC: 5개)
                const defaultVisibleCount = window.innerWidth <= 500 ? 6 : 5;

                // 4. 월별 섹션 구성
                sortedMonths.forEach(yearMonth => {
                    const [year, month] = yearMonth.split("-");
                    const formattedMonthTitle = `${year}년 ${parseInt(month, 10)}월`;
                    const monthVods = groupedVods[yearMonth];

                    const section = document.createElement("div");
                    section.className = "month-section";
                    section.dataset.sectionMonth = yearMonth;

                    if (yearMonth !== latestMonth) {
                        section.style.display = "none";
                    }

                    const titleEl = document.createElement("h2");
                    titleEl.className = "month-title";
                    titleEl.textContent = formattedMonthTitle;
                    
                    const headerEl = document.createElement("div");
                    headerEl.className = "month-header";
                    headerEl.appendChild(titleEl);
                    section.appendChild(headerEl);

                    const gridEl = document.createElement("div");
                    gridEl.className = "vod-grid";

                    monthVods.forEach((item, itemIdx) => {
                        const card = document.createElement("a");
                        card.href = item.link;
                        card.className = "vod-card";
                        card.target = "_blank";
                        card.rel = "noopener noreferrer";
                        card.style.animationDelay = `${(globalIndex++) * 0.03}s`;

                        if (itemIdx >= defaultVisibleCount) {
                            card.classList.add("collapsed-hidden");
                        }

                        const thumbHTML = item.thumbnail 
                            ? `<img src="${item.thumbnail}" alt="thumbnail" class="vod-thumb" loading="lazy">` 
                            : `<div class="no-thumb">No Image</div>`;

                        let badgesHTML = "";
                        if (item.category) {
                            const categories = item.category.split(",").map(cat => cat.trim()).filter(Boolean);
                            categories.forEach(cat => {
                                badgesHTML += `<span class="badge badge-category">${cat}</span>`;
                            });
                        } else {
                            badgesHTML += `<span class="badge badge-category">기타</span>`;
                        }

                        if (item.adult === "Y") badgesHTML += `<span class="badge badge-adult">19+</span>`;
                        if (item.subPlus === "Y") badgesHTML += `<span class="badge badge-sub">구독+</span>`;

                        card.innerHTML = `
                            <div class="vod-thumb-wrapper">
                                ${thumbHTML}
                                <div class="vod-duration">${item.duration || "-:--:--"}</div>
                            </div>
                            <div class="vod-info">
                                <h3 class="vod-title">${item.title}</h3>
                                <div class="vod-meta">
                                    <span>📅 ${item.date}</span>
                                </div>
                                <p class="vod-desc">${item.description || "설명 없음"}</p>
                                <div class="badge-container">
                                    ${badgesHTML}
                                </div>
                            </div>
                        `;

                        gridEl.appendChild(card);
                    });

                    section.appendChild(gridEl);

                    if (monthVods.length > defaultVisibleCount) {
                        const expandBtn = document.createElement("button");
                        expandBtn.className = "expand-btn";
                        expandBtn.textContent = `더보기 (${monthVods.length - defaultVisibleCount}개 더 있음)`;
                        expandBtn.onclick = () => {
                            const hiddenCards = gridEl.querySelectorAll(".collapsed-hidden");
                            hiddenCards.forEach(c => c.classList.remove("collapsed-hidden"));
                            expandBtn.style.display = "none";
                        };
                        section.appendChild(expandBtn);
                    }

                    contentWrapper.appendChild(section);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="full-width-message" style="color: #ef4444;">VOD 리스트 로드 실패</p>`;
            }
        }

        // 월별 필터링 기능
        function filterMonth(targetMonth) {
            document.querySelectorAll(".filter-btn").forEach(btn => {
                if (btn.dataset.month === targetMonth) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });

            document.querySelectorAll(".month-section").forEach(section => {
                if (section.dataset.sectionMonth === targetMonth) {
                    section.style.display = "flex";
                } else {
                    section.style.display = "none";
                }
            });
        }

        loadVODs();
    </script>
    <footer style="text-align: center; padding: 10px 10px; color: #b3cde0; font-size: 11px; border-top: 1px solid rgba(0, 229, 255, 0.12); margin-top: 20px; width: 100%; box-sizing: border-box;">
        <p style="margin: 0; opacity: 0.8; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;">
            <strong style="display: block; margin-bottom: 5px; color: #03045e; font-size: 12px;">바다비 비공식 팬 아카이브</strong>
            <span style="display: inline-block;">비영리로 운영되며, 정보 갱신 시 데이터 반영에 차이가 있을 수 있습니다.</span>
        </p>
    </footer>
</body>
</html>
