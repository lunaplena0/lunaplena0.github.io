<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 VOD 리스트</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 15px 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 상단 월 선택 필터 바 */
        .filter-bar {
            display: flex;
            gap: 8px; 
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: thin;
        }

        .filter-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: #0077b6;
            color: #0077b6;
        }

        .filter-btn.active {
            background-color: #0077b6;
            border-color: #0077b6;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 119, 182, 0.3);
        }

        /* 월별 섹션 스타일 */
        .month-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .month-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .month-title {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            border-left: 5px solid #0077b6;
            padding-left: 10px;
            margin: 0;
        }

        /* 월별 태그 필터 오픈 버튼 */
        .tag-filter-trigger-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .tag-filter-trigger-btn:hover {
            border-color: #0077b6;
            color: #0077b6;
            background-color: #f8fafc;
        }

        .tag-filter-trigger-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .vod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        @keyframes fadeUpIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vod-card {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            opacity: 0;
            animation: fadeUpIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .vod-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 119, 182, 0.12);
        }

        .vod-card.collapsed-hidden {
            display: none !important;
        }

        .vod-card.tag-hidden {
            display: none !important;
        }

        /* 썸네일 영역 */
        .vod-thumb-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        .vod-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .no-thumb {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            background-color: #e2e8f0;
        }

        .vod-duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* VOD 정보 영역 */
        .vod-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .vod-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 6px 0;
            line-height: 1.35;
            height: calc(14px * 1.35 * 2);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vod-meta {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vod-meta svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .vod-desc {
            font-size: 12px;
            color: #475569;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 뱃지 영역 */
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: auto;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .badge-adult {
            background-color: #fee2e2;
            color: #ef4444;
        }

        .badge-sub {
            background-color: #e0e7ff;
            color: #4f46e5;
        }

        .badge-category {
            background-color: #f1f5f9;
            color: #475569;
        }

        /* 더보기 버튼 스타일 */
        .expand-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 10px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: center;
        }

        .expand-btn:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
        }

        /* 모달 팝업 스타일 수정 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            backdrop-filter: blur(2px);
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #ffffff;
            width: 92%;
            max-width: 520px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            gap: 18px;
            transform: translateY(10px);
            transition: transform 0.2s ease;
            box-sizing: border-box;
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 14px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
            padding: 0 4px;
        }

        /* 4열 격자 레이아웃 및 깔끔한 여백 */
        .modal-body {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* '전체 보기' 버튼은 4열 전체를 가득 채우도록 설정 */
        .modal-tag-chip.chip-all {
            grid-column: span 4;
            background-color: #f1f5f9;
            font-weight: 700;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        .modal-tag-chip {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }

        .modal-tag-chip:hover {
            border-color: #0077b6;
            color: #0077b6;
            background-color: #f8fafc;
        }

        .modal-tag-chip.active {
            background-color: #0077b6;
            border-color: #0077b6;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 119, 182, 0.25);
        }

        .full-width-message {
            text-align: center;
            color: #64748b;
            font-size: 16px;
            padding: 40px 0;
            width: 100%;
        }

        @media (max-width: 500px) {
            .vod-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .main-container {
                padding: 16px 10px;
            }
            .month-title {
                font-size: 18px;
            }
            .vod-info {
                padding: 8px;
            }
            .vod-title {
                font-size: 12px;
                height: calc(12px * 1.35 * 2);
            }
            /* 모바일 화면에서는 3열로 조절하여 가독성 확보 */
            .modal-body {
                grid-template-columns: repeat(3, 1fr);
            }
            .modal-tag-chip.chip-all {
                grid-column: span 3;
            }
        }
    </style>
</head>
<body>

    <div class="main-container" id="main-container">
        <p class="full-width-message">VOD 리스트를 불러오는 중...</p>
    </div>

    <!-- 태그 필터 모달 팝업 구조 -->
    <div class="modal-overlay" id="tag-modal-overlay" onclick="closeTagModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title-text">태그 선택</h3>
                <button class="modal-close-btn" onclick="closeTagModal()">×</button>
            </div>
            <div class="modal-body" id="modal-tag-list-container">
                <!-- 동적으로 생성될 태그 칩들 -->
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const VOD_API_URL = WORKER_URL + "?type=fanvodlist";

        const CALENDAR_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z"/></svg>`;
        const FILTER_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>`;

        const currentActiveTags = {};
        let globalVods = [];

        async function loadVODs() {
            const container = document.getElementById("main-container");
            
            try {
                const response = await fetch(VOD_API_URL);
                if (!response.ok) throw new Error("VOD 정보를 불러오지 못했습니다.");
                
                const data = await response.json();
                globalVods = data.vods || [];

                container.innerHTML = "";

                if (globalVods.length === 0) {
                    container.innerHTML = '<p class="full-width-message">등록된 VOD가 없습니다.</p>';
                    return;
                }

                const groupedVods = {};
                globalVods.forEach(item => {
                    if (!item.date) return;
                    const yearMonth = item.date.substring(0, 7);
                    if (!groupedVods[yearMonth]) {
                        groupedVods[yearMonth] = [];
                    }
                    groupedVods[yearMonth].push(item);
                });

                const sortedMonths = Object.keys(groupedVods).sort().reverse();
                const latestMonth = sortedMonths[0];

                const filterBar = document.createElement("div");
                filterBar.className = "filter-bar";

                const allBtn = document.createElement("button");
                allBtn.className = "filter-btn";
                allBtn.dataset.month = "ALL";
                allBtn.textContent = `전체 보기 (${globalVods.length})`;
                allBtn.onclick = () => filterMonth("ALL");
                filterBar.appendChild(allBtn);

                sortedMonths.forEach((ym) => {
                    const [y, m] = ym.split("-");
                    const count = groupedVods[ym].length;
                    
                    const btn = document.createElement("button");
                    btn.className = "filter-btn";
                    if (ym === latestMonth) btn.classList.add("active");
                    btn.dataset.month = ym;
                    btn.textContent = `${y}년 ${parseInt(m, 10)}월 (${count})`;
                    btn.onclick = () => filterMonth(ym);
                    filterBar.appendChild(btn);
                });

                container.appendChild(filterBar);

                const contentWrapper = document.createElement("div");
                contentWrapper.id = "content-wrapper";
                contentWrapper.style.display = "flex";
                contentWrapper.style.flexDirection = "column";
                contentWrapper.style.gap = "36px";
                container.appendChild(contentWrapper);

                const defaultVisibleCount = window.innerWidth <= 500 ? 6 : 5;

                const allSection = document.createElement("div");
                allSection.className = "month-section";
                allSection.dataset.sectionMonth = "ALL";
                allSection.style.display = "none";

                const allHeaderEl = document.createElement("div");
                allHeaderEl.className = "month-header";
                const allTitleWrapper = document.createElement("div");
                allTitleWrapper.className = "month-title-wrapper";

                const allTitleEl = document.createElement("h2");
                allTitleEl.className = "month-title";
                allTitleEl.textContent = `전체 VOD 리스트`;
                allTitleWrapper.appendChild(allTitleEl);

                const allTagTriggerBtn = document.createElement("button");
                allTagTriggerBtn.className = "tag-filter-trigger-btn";
                allTagTriggerBtn.innerHTML = `${FILTER_ICON_SVG}<span>태그 필터</span>`;
                allTagTriggerBtn.onclick = () => openTagModal("ALL", globalVods);
                allTitleWrapper.appendChild(allTagTriggerBtn);

                allHeaderEl.appendChild(allTitleWrapper);
                allSection.appendChild(allHeaderEl);

                const allGridEl = document.createElement("div");
                allGridEl.className = "vod-grid";
                const allFragment = document.createDocumentFragment();

                globalVods.forEach((item) => {
                    const card = createVodCard(item);
                    allFragment.appendChild(card);
                });
                allGridEl.appendChild(allFragment);
                allSection.appendChild(allGridEl);
                contentWrapper.appendChild(allSection);

                sortedMonths.forEach(yearMonth => {
                    const [year, month] = yearMonth.split("-");
                    const formattedMonthTitle = `${year}년 ${parseInt(month, 10)}월`;
                    const monthVods = groupedVods[yearMonth];

                    const section = document.createElement("div");
                    section.className = "month-section";
                    section.dataset.sectionMonth = yearMonth;

                    if (yearMonth !== latestMonth) {
                        section.style.display = "none";
                    }

                    const headerEl = document.createElement("div");
                    headerEl.className = "month-header";

                    const titleWrapper = document.createElement("div");
                    titleWrapper.className = "month-title-wrapper";

                    const titleEl = document.createElement("h2");
                    titleEl.className = "month-title";
                    titleEl.textContent = formattedMonthTitle;
                    titleWrapper.appendChild(titleEl);

                    const tagTriggerBtn = document.createElement("button");
                    tagTriggerBtn.className = "tag-filter-trigger-btn";
                    tagTriggerBtn.innerHTML = `${FILTER_ICON_SVG}<span>태그 필터</span>`;
                    tagTriggerBtn.onclick = () => openTagModal(yearMonth, monthVods);
                    titleWrapper.appendChild(tagTriggerBtn);

                    headerEl.appendChild(titleWrapper);
                    section.appendChild(headerEl);

                    const gridEl = document.createElement("div");
                    gridEl.className = "vod-grid";

                    const fragment = document.createDocumentFragment();

                    monthVods.forEach((item, itemIdx) => {
                        const card = createVodCard(item);
                        if (itemIdx >= defaultVisibleCount) {
                            card.classList.add("collapsed-hidden");
                        }
                        fragment.appendChild(card);
                    });

                    gridEl.appendChild(fragment);
                    section.appendChild(gridEl);

                    if (monthVods.length > defaultVisibleCount) {
                        const expandBtn = document.createElement("button");
                        expandBtn.className = "expand-btn";
                        expandBtn.textContent = `더보기 (${monthVods.length - defaultVisibleCount}개 더 있음)`;
                        expandBtn.onclick = () => {
                            const hiddenCards = gridEl.querySelectorAll(".collapsed-hidden");
                            hiddenCards.forEach(c => {
                                const activeTag = currentActiveTags[yearMonth];
                                if (!activeTag) {
                                    c.classList.remove("collapsed-hidden");
                                } else {
                                    const tags = JSON.parse(c.dataset.tags || "[]");
                                    if (tags.includes(activeTag)) {
                                        c.classList.remove("collapsed-hidden");
                                    }
                                }
                            });
                            expandBtn.style.display = "none";
                        };
                        section.appendChild(expandBtn);
                    }

                    contentWrapper.appendChild(section);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="full-width-message" style="color: #ef4444;">VOD 리스트 로드 실패</p>`;
            }
        }

        function createVodCard(item) {
            const card = document.createElement("a");
            card.href = item.link;
            card.className = "vod-card";
            card.target = "_blank";
            card.rel = "noopener noreferrer";

            const itemCategories = item.category ? item.category.split(",").map(c => c.trim()).filter(Boolean) : ["기타"];
            if (item.adult === "Y") itemCategories.push("19+");
            if (item.subPlus === "Y") itemCategories.push("구독+");

            card.dataset.tags = JSON.stringify(itemCategories);

            const thumbHTML = item.thumbnail 
                ? `<img src="${item.thumbnail}" alt="thumbnail" class="vod-thumb" loading="lazy" decoding="async">` 
                : `<div class="no-thumb">No Image</div>`;

            let badgesHTML = "";
            if (item.category) {
                item.category.split(",").map(cat => cat.trim()).filter(Boolean).forEach(cat => {
                    badgesHTML += `<span class="badge badge-category">${cat}</span>`;
                });
            } else {
                badgesHTML += `<span class="badge badge-category">기타</span>`;
            }

            if (item.adult === "Y") badgesHTML += `<span class="badge badge-adult">19+</span>`;
            if (item.subPlus === "Y") badgesHTML += `<span class="badge badge-sub">구독+</span>`;

            card.innerHTML = `
                <div class="vod-thumb-wrapper">
                    ${thumbHTML}
                    <div class="vod-duration">${item.duration || "-:--:--"}</div>
                </div>
                <div class="vod-info">
                    <h3 class="vod-title">${item.title}</h3>
                    <div class="vod-meta">
                        ${CALENDAR_SVG}<span>${item.date}</span>
                    </div>
                    <p class="vod-desc">${item.description || "설명 없음"}</p>
                    <div class="badge-container">
                        ${badgesHTML}
                    </div>
                </div>
            `;
            return card;
        }

        function filterMonth(targetMonth) {
            document.querySelectorAll(".filter-btn").forEach(btn => {
                if (btn.dataset.month === targetMonth) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });

            document.querySelectorAll(".month-section").forEach(section => {
                if (section.dataset.sectionMonth === targetMonth) {
                    section.style.display = "flex";
                } else {
                    section.style.display = "none";
                }
            });
        }

        function openTagModal(targetKey, targetVods) {
            const modalOverlay = document.getElementById("tag-modal-overlay");
            const modalTitle = document.getElementById("modal-title-text");
            const tagListContainer = document.getElementById("modal-tag-list-container");

            if (targetKey === "ALL") {
                modalTitle.textContent = `전체 VOD 태그 필터`;
            } else {
                const [y, m] = targetKey.split("-");
                modalTitle.textContent = `${y}년 ${parseInt(m, 10)}월 태그 필터`;
            }
            tagListContainer.innerHTML = "";

            const tagSet = new Set();
            targetVods.forEach(item => {
                if (item.category) {
                    item.category.split(",").forEach(cat => {
                        const trimmed = cat.trim();
                        if (trimmed) tagSet.add(trimmed);
                    });
                } else {
                    tagSet.add("기타");
                }
                if (item.adult === "Y") tagSet.add("19+");
                if (item.subPlus === "Y") tagSet.add("구독+");
            });

            const uniqueTags = Array.from(tagSet);
            const activeTag = currentActiveTags[targetKey];

            const allChip = document.createElement("button");
            allChip.className = `modal-tag-chip chip-all ${!activeTag ? "active" : ""}`;
            allChip.textContent = "전체 보기";
            allChip.onclick = () => {
                applyTagFilter(targetKey, null);
                closeTagModal();
            };
            tagListContainer.appendChild(allChip);

            uniqueTags.forEach(tag => {
                const chip = document.createElement("button");
                chip.className = `modal-tag-chip ${activeTag === tag ? "active" : ""}`;
                chip.textContent = tag;
                chip.onclick = () => {
                    applyTagFilter(targetKey, tag);
                    closeTagModal();
                };
                tagListContainer.appendChild(chip);
            });

            modalOverlay.classList.add("open");
        }

        function closeTagModal(event) {
            const modalOverlay = document.getElementById("tag-modal-overlay");
            if (!event || event.target === modalOverlay) {
                modalOverlay.classList.remove("open");
            }
        }

        function applyTagFilter(targetKey, selectedTag) {
            currentActiveTags[targetKey] = selectedTag;

            const section = document.querySelector(`.month-section[data-section-month="${targetKey}"]`);
            if (!section) return;

            const cards = section.querySelectorAll(".vod-card");
            const expandBtn = section.querySelector(".expand-btn");
            const defaultVisibleCount = window.innerWidth <= 500 ? 6 : 5;

            cards.forEach((card, idx) => {
                const tags = JSON.parse(card.dataset.tags || "[]");
                const matches = !selectedTag || tags.includes(selectedTag);

                if (matches) {
                    card.classList.remove("tag-hidden");
                    if (targetKey === "ALL" || selectedTag) {
                        card.classList.remove("collapsed-hidden");
                    } else {
                        if (idx >= defaultVisibleCount) {
                            card.classList.add("collapsed-hidden");
                        } else {
                            card.classList.remove("collapsed-hidden");
                        }
                    }
                } else {
                    card.classList.add("tag-hidden");
                }
            });

            if (expandBtn) {
                if (selectedTag || targetKey === "ALL") {
                    expandBtn.style.display = "none";
                } else {
                    expandBtn.style.display = "block";
                }
            }
        }

        loadVODs();
    </script>
    <footer style="text-align: center; padding: 10px 10px; color: #b3cde0; font-size: 11px; border-top: 1px solid rgba(0, 229, 255, 0.12); margin-top: 20px; width: 100%; box-sizing: border-box;">
        <p style="margin: 0; opacity: 0.8; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;">
            <strong style="display: block; margin-bottom: 5px; color: #03045e; font-size: 12px;">바다비 비공식 팬 아카이브</strong>
            <span style="display: inline-block;">비영리로 운영되며, 정보 갱신 시 데이터 반영에 차이가 있을 수 있습니다.</span>
        </p>
    </footer>
</body>
</html>
