<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 울보노트</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center; 
            padding: 50px 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        .profile-info-card {
            position: relative;
            z-index: 2;
            background: transparent; 
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-sizing: border-box;
        }
        
        /* 페이지 타이틀 */
        .page-title {
            text-align: center;
            color: #03045e;
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 800;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .profile-button-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0; 
            box-sizing: border-box;
            align-items: flex-start;
        }

        /* 💡 애니메이션 키프레임 정의: 아래에서 위로 살짝 올라오며 나타남 */
        @keyframes fadeUpIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 울보노트 리스트 아이템 디자인 (기존 profile-btn 기반) */
        .crynote-item {
            background: transparent;
            border: none;
            border-radius: 0;
            border-bottom: 1px solid rgba(0, 119, 190, 0.15); 
            padding: 16px 0 16px 28px; 
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: left;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            position: relative;
            box-sizing: border-box;
            
            /* 💡 애니메이션 기본 설정 (초기엔 투명하게) */
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 왼쪽에 있는 세로 바 */
        .crynote-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 34px;
            background-color: #0077b6;
            border-radius: 3px;
            transition: background-color 0.2s ease-in-out, height 0.2s ease-in-out;
        }

        /* 마우스 호버 시 효과 */
        .crynote-item:hover {
            transform: translateX(8px) !important; /* 애니메이션 종료 후 호버 위치 덮어쓰기 */
            border-bottom-color: rgba(3, 4, 94, 0.3);
        }

        .crynote-item:hover::before {
            background-color: #03045e;
            height: 44px; /* 높이를 살짝 더 키워서 두 줄을 감싸는 느낌을 줌 */
        }

        /* 내부 텍스트 디자인 */
        .crynote-meta {
            font-size: 13px;
            color: #64748b;
            display: flex;
            gap: 12px;
            font-weight: 500;
        }

        .crynote-desc {
            font-size: 18px;
            font-weight: 700;
            color: #0077b6;
            margin: 0;
            transition: color 0.2s ease-in-out;
        }

        .crynote-item:hover .crynote-desc {
            color: #03045e;
        }

        @media (max-width: 768px) { 
            body { 
                overflow: auto; 
                height: auto; 
            } 
            .ocean-profile-container { 
                height: auto; 
                min-height: auto; 
                padding: 30px 16px; 
            } 
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <div class="profile-info-card">
            
            <h2 class="page-title">💧 울보노트</h2>

            <!-- 링크 영역 -->
            <div class="profile-button-grid" id="button-grid">
                <p style="text-align: center; color: #64748b; font-size: 16px; width: 100%;">노트를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const CRYNOTE_URL = WORKER_URL + "?type=fancrynote&t=";

        // "HH:MM:SS" 또는 "MM:SS" 형태의 시간을 총 초(Second)로 변환하는 함수
        function convertTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 3) {
                // 시:분:초 (예: 1:56:56 -> 1시간 * 3600 + 56분 * 60 + 56초)
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                // 분:초 (예: 56:56 -> 56분 * 60 + 56초)
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

        async function loadCryNotes() {
            try {
                const response = await fetch(CRYNOTE_URL + new Date().getTime());
                if (!response.ok) throw new Error("노트 정보를 불러오지 못했습니다.");
                
                const data = await response.json();
                const gridContainer = document.getElementById("button-grid");
                gridContainer.innerHTML = "";

                let notes = [];
                if (data && Array.isArray(data.notes)) {
                    notes = data.notes;
                } else if (Array.isArray(data)) {
                    notes = data;
                }

                if (notes.length === 0) {
                    gridContainer.innerHTML = '<p style="text-align: center; color: #64748b; width: 100%; font-size: 16px;">등록된 울보노트가 없습니다.</p>';
                    return;
                }

                notes.forEach((item, index) => {
                    if (!item.url && !item.description) return;
                    
                    const a = document.createElement("a");
                    a.className = "crynote-item";
                    a.target = "_blank";
                    a.rel = "noopener noreferrer";
                    
                    // URL에 ?change_second=초 포맷 적용
                    if (item.url) {
                        const totalSeconds = convertTimeToSeconds(item.time);
                        // 이미 주소에 ? 가 포함되어 있는지 여부에 따라 안전하게 결합
                        const separator = item.url.includes('?') ? '&' : '?';
                        a.href = `${item.url}${separator}change_second=${totalSeconds}`;
                    } else {
                        a.href = "#";
                    }
                    
                    a.style.animationDelay = `${index * 0.1}s`;
                    
                    a.innerHTML = `
                        <div class="crynote-meta">
                            <span>📅 ${item.date || "날짜 없음"}</span>
                            <span>⏱️ ${item.time || "시간 없음"}</span>
                        </div>
                        <p class="crynote-desc">${item.description || "내용 없음"}</p>
                    `;
                    
                    gridContainer.appendChild(a);
                });

            } catch (err) {
                console.error(err);
                document.getElementById("button-grid").innerHTML = `<p style="text-align: center; color: #ef4444; width: 100%; font-size: 16px;">노트 로드 실패</p>`;
            }
        }

        loadCryNotes();
    </script>
</body>
</html>
