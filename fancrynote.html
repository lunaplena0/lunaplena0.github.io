<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 눈물노트</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center; 
            padding: 50px 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        .profile-info-card {
            position: relative;
            z-index: 2;
            background: transparent; 
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }
        
        /* 페이지 메인 타이틀 */
        .page-title {
            text-align: center;
            color: #03045e;
            margin: 0;
            font-size: 25px;
            font-weight: 800;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 통계 요약 카드 스타일 */
        .stats-card {
            background: #ffffff;
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 10px;
            padding: 8px 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            gap: 0px;
            text-align: center;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stats-title {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }

        .stats-value {
            font-size: 14px;
            font-weight: 800;
            color: #0077b6;
        }

        /* 연도별 섹션 스타일 */
        .year-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .year-heading {
            font-size: 24px;
            font-weight: 800;
            color: #03045e;
            margin: 20px 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(0, 119, 190, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 월별 아코디언 컨테이너 스타일 */
        .month-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-bottom: 3px;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 월별 헤더 (접기/펼치기 버튼 역할) */
        .month-heading {
            font-size: 16px;
            font-weight: 700;
            color: #0077b6;
            margin: 6px 0;
            padding: 10px 14px;
            background: rgba(0, 119, 190, 0.05);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease-in-out, color 0.2s ease-in-out;
            user-select: none;
        }

        .month-heading:hover {
            background: rgba(0, 119, 190, 0.12);
            color: #03045e;
        }

        /* 화살표 아이콘 애니메이션 */
        .month-heading::after {
            content: '▼';
            font-size: 11px;
            transition: transform 0.3s ease;
        }

        .month-group.collapsed .month-heading::after {
            transform: rotate(-90deg);
        }

        /* 아이템들을 담는 래퍼 */
        .month-content-wrapper {
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
            max-height: 2000px;
        }

        .month-group.collapsed .month-content-wrapper {
            max-height: 0;
        }

        /* 오래된 월 전체를 숨기는 클래스 */
        .month-group.hidden-by-default {
            display: none;
        }

        /* '더보기' 버튼 스타일 */
        .load-more-btn {
            width: 100%;
            padding: 14px;
            margin: 15px 0 25px 0;
            background-color: rgba(0, 119, 190, 0.08);
            border: 1px dashed rgba(0, 119, 190, 0.3);
            border-radius: 10px;
            color: #0077b6;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
        }

        .load-more-btn:hover {
            background-color: rgba(0, 119, 190, 0.15);
            color: #03045e;
            border-color: #0077b6;
        }

        .profile-button-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0; 
            box-sizing: border-box;
            align-items: flex-start;
            padding-left: 8px;
        }

        @keyframes fadeUpIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .crynote-item {
            background: transparent;
            border: none;
            border-radius: 0;
            border-bottom: 1px solid rgba(0, 119, 190, 0.15); 
            padding: 16px 0 16px 28px; 
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: left;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            position: relative;
            box-sizing: border-box;
        }

        .crynote-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 34px;
            background-color: #0077b6;
            border-radius: 3px;
            transition: background-color 0.2s ease-in-out, height 0.2s ease-in-out;
        }

        .crynote-item:hover {
            transform: translateX(8px) !important;
            border-bottom-color: rgba(3, 4, 94, 0.3);
        }

        .crynote-item:hover::before {
            background-color: #03045e;
            height: 44px;
        }

        .crynote-meta {
            font-size: 13px;
            color: #64748b;
            display: flex;
            gap: 12px;
            font-weight: 500;
        }

        .crynote-desc {
            font-size: 18px;
            font-weight: 700;
            color: #0077b6;
            margin: 0;
            transition: color 0.2s ease-in-out;
        }

        .crynote-item:hover .crynote-desc {
            color: #03045e;
        }

        @media (max-width: 768px) { 
            body { 
                overflow: auto; 
                height: auto; 
            } 
            .ocean-profile-container { 
                height: auto; 
                min-height: auto; 
                padding: 30px 16px; 
            } 
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <div class="profile-info-card">
            
            <h2 class="page-title">💧 바다비 눈물 노트</h2>

            <!-- 통계가 표시될 영역 -->
            <div id="stats-container"></div>

            <!-- 데이터가 렌더링될 컨테이너 -->
            <div id="content-container">
                <p style="text-align: center; color: #64748b; font-size: 16px; width: 100%;">노트를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const CRYNOTE_URL = WORKER_URL + "?type=fancrynote&t=";
        const BASE_DATE = new Date("2026-04-20");

        function convertTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

        async function loadCryNotes() {
            try {
                const response = await fetch(CRYNOTE_URL + new Date().getTime());
                if (!response.ok) throw new Error("노트 정보를 불러오지 못했습니다.");
                
                const data = await response.json();
                const container = document.getElementById("content-container");
                const statsContainer = document.getElementById("stats-container");
                container.innerHTML = "";
                statsContainer.innerHTML = "";

                let notes = [];
                if (data && Array.isArray(data.notes)) {
                    notes = data.notes;
                } else if (Array.isArray(data)) {
                    notes = data;
                }

                if (notes.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #64748b; width: 100%; font-size: 16px;">등록된 눈물노트가 없습니다.</p>';
                    return;
                }

                const today = new Date();
                today.setHours(0, 0, 0, 0);
                BASE_DATE.setHours(0, 0, 0, 0);

                const diffTime = today - BASE_DATE;
                const diffDays = Math.max(1, Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1);

                const filteredNotesForStats = notes.filter(item => {
                    if (!item.date) return false;
                    const itemDate = new Date(item.date);
                    return itemDate >= BASE_DATE;
                });

                const totalCryCount = filteredNotesForStats.length;
                let avgText = "";

                if (totalCryCount > 0) {
                    const daysPerCry = (diffDays / totalCryCount).toFixed(1);
                    avgText = `(약 <b>${daysPerCry}일당 1번</b> 울었어요)`;
                } else {
                    avgText = `2026년 4월 20일 이후 기록된 울음이 없습니다.`;
                }

                statsContainer.innerHTML = `
                    <div class="stats-card" style="animation-delay: 0.05s;">
                        <span class="stats-title">📊 울음 빈도 통계 (2026.04.20 ~ 기준)</span>
                        <span class="stats-value">${avgText}</span>
                    </div>
                `;

                // 데이터 그룹화
                const groupedData = {};
                notes.forEach(item => {
                    if (!item.date) return;
                    const dateParts = item.date.split('-');
                    if (dateParts.length < 2) return;

                    const year = dateParts[0];
                    const month = dateParts[1];

                    if (!groupedData[year]) groupedData[year] = {};
                    if (!groupedData[year][month]) groupedData[year][month] = [];
                    groupedData[year][month].push(item);
                });

                const sortedYears = Object.keys(groupedData).sort().reverse();
                
                let globalIndex = 1;
                let renderedMonthCounter = 0;
                let hiddenMonthGroups = []; 

                sortedYears.forEach(year => {
                    const yearSection = document.createElement("div");
                    yearSection.className = "year-section";

                    let yearTotalCount = 0;
                    Object.keys(groupedData[year]).forEach(month => {
                        yearTotalCount += groupedData[year][month].length;
                    });

                    const yearHeading = document.createElement("h3");
                    yearHeading.className = "year-heading";
                    yearHeading.innerHTML = `<span>${year}년</span> <span style="font-size: 16px; font-weight: 500; color: #64748b;">(총 ${yearTotalCount}번)</span>`;
                    yearHeading.style.animationDelay = `${globalIndex * 0.05}s`;
                    yearSection.appendChild(yearHeading);
                    globalIndex++;

                    const sortedMonths = Object.keys(groupedData[year]).sort().reverse();

                    sortedMonths.forEach(month => {
                        const monthGroup = document.createElement("div");
                        
                        renderedMonthCounter++;
                        // 💡 최신 3개의 월이든, 그 이후의 월이든 모두 'collapsed(접힘)' 클래스를 기본 추가
                        if (renderedMonthCounter > 3) {
                            monthGroup.className = "month-group hidden-by-default collapsed"; 
                            hiddenMonthGroups.push(monthGroup);
                        } else {
                            monthGroup.className = "month-group collapsed"; 
                        }

                        monthGroup.style.animationDelay = `${globalIndex * 0.05}s`;
                        globalIndex++;

                        const monthHeading = document.createElement("div");
                        monthHeading.className = "month-heading";
                        
                        const count = groupedData[year][month].length;
                        monthHeading.innerHTML = `<span>${parseInt(month, 10)}월</span> <span style="font-size: 13px; font-weight: 500; opacity: 0.8;">(${count}개의 노트)</span>`;
                        
                        monthHeading.addEventListener("click", () => {
                            monthGroup.classList.toggle("collapsed");
                        });
                        monthGroup.appendChild(monthHeading);

                        const contentWrapper = document.createElement("div");
                        contentWrapper.className = "month-content-wrapper";

                        const gridContainer = document.createElement("div");
                        gridContainer.className = "profile-button-grid";

                        groupedData[year][month].forEach((item) => {
                            if (!item.url && !item.description) return;

                            const a = document.createElement("a");
                            a.className = "crynote-item";
                            a.target = "_blank";
                            a.rel = "noopener noreferrer";
                            
                            if (item.url) {
                                const totalSeconds = convertTimeToSeconds(item.time);
                                const separator = item.url.includes('?') ? '&' : '?';
                                a.href = `${item.url}${separator}change_second=${totalSeconds}`;
                            } else {
                                a.href = "#";
                            }
                            
                            a.innerHTML = `
                                <div class="crynote-meta">
                                    <span>📅 ${item.date || "날짜 없음"}</span>
                                    <span>⏱️ ${item.time || "시간 없음"}</span>
                                </div>
                                <p class="crynote-desc">${item.description || "내용 없음"}</p>
                            `;
                            
                            gridContainer.appendChild(a);
                        });

                        contentWrapper.appendChild(gridContainer);
                        monthGroup.appendChild(contentWrapper);
                        yearSection.appendChild(monthGroup);
                    });

                    container.appendChild(yearSection);
                });

                // 숨겨진 월이 존재할 경우 맨 아래에 '더보기' 버튼 생성
                if (hiddenMonthGroups.length > 0) {
                    const loadMoreBtn = document.createElement("button");
                    loadMoreBtn.className = "load-more-btn";
                    loadMoreBtn.innerHTML = `펼치기 (이전 월 ${hiddenMonthGroups.length}개 더보기)`;
                    
                    loadMoreBtn.addEventListener("click", () => {
                        hiddenMonthGroups.forEach(group => {
                            group.classList.remove("hidden-by-default");
                        });
                        loadMoreBtn.remove(); // 버튼 클릭 후 제거
                    });

                    container.appendChild(loadMoreBtn);
                }

            } catch (err) {
                console.error(err);
                document.getElementById("content-container").innerHTML = `<p style="text-align: center; color: #ef4444; width: 100%; font-size: 16px;">노트 로드 실패</p>`;
            }
        }

        loadCryNotes();
    </script>
    <footer style="text-align: center; padding: 10px 10px; color: #b3cde0; font-size: 11px; border-top: 1px solid rgba(0, 229, 255, 0.12); margin-top: 20px; width: 100%; box-sizing: border-box;">
        <p style="margin: 0; opacity: 0.8; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;">
            <strong style="display: block; margin-bottom: 5px; color: #03045e; font-size: 12px;">바다비 비공식 팬 아카이브</strong>
            <span style="display: inline-block;">비영리로 운영되며, 정보 갱신 시 데이터 반영에 차이가 있을 수 있습니다.</span>
        </p>
    </footer>
</body>
</html>
