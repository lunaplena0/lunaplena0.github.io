<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노래 위젯</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            overflow: hidden;
            background-color: transparent;
        }

        /* 📌 위젯 크기 고정 영역 */
        .widget-container {
            width: 100%;
            max-width: 380px;
            min-height: 440px;
            max-height: 440px;
            box-sizing: border-box;
            padding: 10px;
            
            background-color: var(--widget-bg-resolved, transparent);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        /* 📌 상단 공지 메시지 감싸개 */
        .notice-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            flex-shrink: 0;
        }

        .notice-wrapper.show {
            grid-template-rows: 1fr;
        }

        .notice-inner {
            overflow: hidden;
            min-height: 0;
        }

        .widget-notice {
            width: 100%;
            padding: 2px 6px;
            margin-bottom: 6px;
            color: #f8fafc;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-all;
            white-space: pre-wrap;
            box-sizing: border-box;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .notice-wrapper.show .widget-notice {
            opacity: 1;
        }

        /* 📌 리스트 전환 효과 (페이지 바뀔 때만 작동) */
        .song-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            flex: 1;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .song-list.fade-out {
            opacity: 0;
            transform: translateY(4px);
        }

        /* 📌 곡 항목 공통 스타일 (부드러운 슬라이드 및 추가/삭제 효과) */
        .song-item {
            display: flex;
            align-items: center;
            padding: 8px 6px;
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 15px;
            height: 40px;
            box-sizing: border-box;
            
            /* 슬라이드 및 페이드 효과 핵심 속성 */
            opacity: 1;
            max-height: 40px;
            transform: translateY(0);
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 📌 항목이 추가되거나 사라질 때 상태 */
        .song-item.entering {
            opacity: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-bottom-width: 0;
            transform: translateY(-10px);
        }

        .song-item.leaving {
            opacity: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-bottom-width: 0;
            transform: translateY(-10px);
        }

        .song-item:last-child {
            border-bottom: none;
        }

        /* 📌 순서 번호 */
        .song-number {
            font-weight: 700;
            color: #000000;
            margin-right: 10px;
            font-size: 15px;
            min-width: 22px;
            text-align: right;
            flex-shrink: 0;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
        }

        .song-info {
            display: flex;
            align-items: center;
            overflow: hidden;
            flex: 1;
            gap: 8px;
            min-width: 0;
        }

        /* 📌 글자 영역 기본 스타일 */
        .song-content {
            display: flex;
            align-items: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #f8fafc;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            max-width: 100%;
            min-width: 0;
            flex: 1;
            
            text-decoration: none;
            transition: color 0.25s ease, opacity 0.25s ease;
        }

        /* 📌 체크된 곡에만 부드럽게 취소선과 투명도 적용 */
        .song-item.checked .song-content {
            text-decoration: line-through;
            text-decoration-thickness: 2.5px;
            text-decoration-color: #f8fafc;
            opacity: 0.65;
        }

        .song-title {
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 1;
            min-width: 0;
        }

        .song-artist {
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .empty-msg {
            text-align: center;
            color: #f8fafc;
            font-size: 15px;
            padding: 15px;
            margin: auto;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <!-- 📌 상단 공지 메시지 영역 -->
        <div id="notice-wrapper" class="notice-wrapper">
            <div class="notice-inner">
                <div id="widget-notice-bar" class="widget-notice"></div>
            </div>
        </div>

        <ul id="widget-song-list" class="song-list">
            <li class="empty-msg">목록을 불러오는 중...</li>
        </ul>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";

        let allSongs = [];
        let currentPage = 0;
        const ITEMS_PER_PAGE = 10;
        let paginationTimer = null;
        let lastFetchedNotice = ""; 

        function escapeHtml(str) {
            return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function parseColorWithOpacity(color, opacity) {
            if (!color || color === "transparent") return "transparent";
            let hex = color.trim();
            if (hex.startsWith('#') && hex.length === 7) {
                let r = parseInt(hex.slice(1, 3), 16);
                let g = parseInt(hex.slice(3, 5), 16);
                let b = parseInt(hex.slice(5, 7), 16);
                let alpha = opacity / 100;
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }
            return hex;
        }

        function getLimitBadgeHTML(limit) {
            let limitVal = limit ? limit.replace(/[\[\]]/g, '').trim() : '';
            if (limitVal === "") return "";
            let badgeColor = "rgba(14, 165, 233, 0.85)";
            if (limitVal.includes("200")) badgeColor = "rgba(16, 185, 129, 0.85)";
            else if (limitVal.includes("300")) badgeColor = "rgba(249, 115, 22, 0.85)";
            else if (limitVal.includes("기타")) {
                badgeColor = "rgba(139, 92, 246, 0.85)";
                limitVal = "기타 연주";
            }
            return `<span style="background-color: ${badgeColor}; backdrop-filter: blur(4px); color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; display: inline-block; vertical-align: middle; flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.4);">${escapeHtml(limitVal)}</span>`;
        }

        async function fetchWidgetData() {
            try {
                const response = await fetch(`${WORKER_URL}?type=widget&t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("데이터 오류");
                const data = await response.json();
                
                const newSongs = Array.isArray(data.songs) ? data.songs : [];
                const listContainer = document.getElementById("widget-song-list");
                
                const oldMaxPage = Math.ceil(allSongs.length / ITEMS_PER_PAGE);
                const newMaxPage = newSongs.length > 0 ? Math.ceil(newSongs.length / ITEMS_PER_PAGE) : 0;
                
                const isStructureChanged = allSongs.length !== newSongs.length || 
                    allSongs.some((song, i) => song.title !== newSongs[i]?.title || song.artist !== newSongs[i]?.artist);

                allSongs = newSongs;

                if (currentPage >= newMaxPage) {
                    currentPage = Math.max(0, newMaxPage - 1);
                    if (listContainer) listContainer.classList.remove("fade-out");
                }

                // 📌 공지 메시지 처리
                const noticeWrapper = document.getElementById("notice-wrapper");
                const noticeBar = document.getElementById("widget-notice-bar");
                
                if (noticeWrapper && noticeBar) {
                    const newNotice = data.notice ? data.notice.trim() : "";
                    if (newNotice !== lastFetchedNotice) {
                        lastFetchedNotice = newNotice;
                        if (newNotice === "") {
                            noticeWrapper.classList.remove("show");
                            setTimeout(() => { noticeBar.textContent = ""; }, 400);
                        } else {
                            if (noticeWrapper.classList.contains("show")) {
                                noticeBar.style.opacity = "0"; 
                                setTimeout(() => {
                                    noticeBar.textContent = newNotice;
                                    noticeBar.style.opacity = ""; 
                                }, 300);
                            } else {
                                noticeBar.textContent = newNotice;
                                setTimeout(() => { noticeWrapper.classList.add("show"); }, 10);
                            }
                        }
                    }
                }

                const resolvedColor = parseColorWithOpacity(data.bgColor || "transparent", data.bgOpacity ?? 100);
                document.querySelector('.widget-container').style.setProperty('--widget-bg-resolved', resolvedColor);
                
                if (isStructureChanged || oldMaxPage !== newMaxPage || listContainer.innerHTML.includes("목록을 불러오는 중...")) {
                    renderCurrentPageSmoothly();
                } else {
                    updateCheckStatesOnly();
                }
            } catch (error) {
                console.error(error);
            }
        }

        // 📌 체크 상태만 가볍게 실시간 반영
        function updateCheckStatesOnly() {
            const listContainer = document.getElementById("widget-song-list");
            if (!listContainer) return;
            
            const startIndex = currentPage * ITEMS_PER_PAGE;
            const pageSongs = allSongs.slice(startIndex, startIndex + ITEMS_PER_PAGE);
            const itemElements = listContainer.children;

            pageSongs.forEach((song, idx) => {
                if (itemElements[idx]) {
                    if (song.checked) {
                        itemElements[idx].classList.add('checked');
                    } else {
                        itemElements[idx].classList.remove('checked');
                    }
                }
            });
        }

        // 📌 중간 항목 추가/삭제 시 슬라이드되면서 밀려붙는 렌더링 함수
        function renderCurrentPageSmoothly() {
            const listContainer = document.getElementById("widget-song-list");
            if (!listContainer) return;
            
            if (allSongs.length === 0) { 
                listContainer.innerHTML = `<li class="empty-msg">선택된 곡이 없습니다.</li>`; 
                return; 
            }
            
            const maxPage = Math.ceil(allSongs.length / ITEMS_PER_PAGE);
            if (currentPage >= maxPage) currentPage = maxPage - 1;
            if (currentPage < 0) currentPage = 0;

            const startIndex = currentPage * ITEMS_PER_PAGE;
            const pageSongs = allSongs.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            const existingItems = Array.from(listContainer.children);
            
            // 처음 로딩인 경우
            if (existingItems.length === 0 || existingItems[0].classList.contains('empty-msg')) {
                renderCurrentPage();
                return;
            }

            // 기존 곡 데이터 키값 추출 (고유 식별용: title + artist)
            const existingKeys = existingItems.map(item => item.dataset.key);
            const newKeys = pageSongs.map(song => `${song.title}_${song.artist || ''}`);

            // 1. 사라져야 할 항목(삭제되거나 다른 페이지로 넘어간 항목)에 'leaving' 클래스 추가하여 슬라이드 축소
            existingItems.forEach((item, index) => {
                const key = item.dataset.key;
                if (!newKeys.includes(key)) {
                    item.classList.add('leaving');
                    setTimeout(() => item.remove(), 350); // 애니메이션 시간 후 DOM에서 제거
                }
            });

            // 2. 새로 추가되거나 위치가 바뀐 항목 처리
            pageSongs.forEach((song, idx) => {
                const key = `${song.title}_${song.artist || ''}`;
                const existingIndex = existingKeys.indexOf(key);
                const isCheckedClass = song.checked ? 'checked' : '';

                let itemHTML = `
                    <span class="song-number">${startIndex + idx + 1}.</span>
                    <div class="song-info">
                        ${getLimitBadgeHTML(song.limit)}
                        <div class="song-content">
                            <span class="song-title">${escapeHtml(song.title)}</span>
                            <span class="song-artist">${song.artist ? `&nbsp;-&nbsp;${escapeHtml(song.artist)}` : ''}</span>
                        </div>
                    </div>
                `;

                if (existingIndex !== -1) {
                    // 이미 존재하는 항목이면 순서 번호와 클래스만 갱신하고 위치 이동
                    const item = existingItems[existingIndex];
                    item.querySelector('.song-number').textContent = `${startIndex + idx + 1}.`;
                    if (song.checked) item.classList.add('checked');
                    else item.classList.remove('checked');

                    // DOM 상에서 올바른 위치로 재배치 (슬라이드 이동 효과 유도)
                    if (listContainer.children[idx] !== item) {
                        listContainer.insertBefore(item, listContainer.children[idx] || null);
                    }
                } else {
                    // 새로 추가된 항목이면 'entering' 클래스를 붙여서 슬라이드되며 나타나게 함
                    const newItem = document.createElement('li');
                    newItem.className = `song-item entering ${isCheckedClass}`;
                    newItem.dataset.key = key;
                    newItem.innerHTML = itemHTML;

                    const refNode = listContainer.children[idx] || null;
                    listContainer.insertBefore(newItem, refNode);

                    // 잠시 후 'entering' 클래스를 제거하여 원래 크기로 부드럽게 펼쳐짐
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            newItem.classList.remove('entering');
                        });
                    });
                }
            });
        }

        // 초기 전체 렌더링용
        function renderCurrentPage() {
            const listContainer = document.getElementById("widget-song-list");
            if (!listContainer) return;
            
            if (allSongs.length === 0) { 
                listContainer.innerHTML = `<li class="empty-msg">선택된 곡이 없습니다.</li>`; 
                return; 
            }
            
            const maxPage = Math.ceil(allSongs.length / ITEMS_PER_PAGE);
            if (currentPage >= maxPage) currentPage = maxPage - 1;
            if (currentPage < 0) currentPage = 0;

            const startIndex = currentPage * ITEMS_PER_PAGE;
            const pageSongs = allSongs.slice(startIndex, startIndex + ITEMS_PER_PAGE);
            let htmlContent = "";
            
            pageSongs.forEach((song, idx) => {
                const isCheckedClass = song.checked ? 'checked' : '';
                const key = `${song.title}_${song.artist || ''}`;
                htmlContent += `
                    <li class="song-item ${isCheckedClass}" data-key="${key}">
                        <span class="song-number">${startIndex + idx + 1}.</span>
                        <div class="song-info">
                            ${getLimitBadgeHTML(song.limit)}
                            <div class="song-content">
                                <span class="song-title">${escapeHtml(song.title)}</span>
                                <span class="song-artist">${song.artist ? `&nbsp;-&nbsp;${escapeHtml(song.artist)}` : ''}</span>
                            </div>
                        </div>
                    </li>
                `;
            });
            listContainer.innerHTML = htmlContent;
        }

        function startPaginationLoop() {
            if (paginationTimer) clearInterval(paginationTimer);
            paginationTimer = setInterval(() => {
                if (allSongs.length <= ITEMS_PER_PAGE) return;
                const listContainer = document.getElementById("widget-song-list");
                if (!listContainer) return;
                
                listContainer.classList.add("fade-out");
                
                setTimeout(() => {
                    const maxPage = Math.ceil(allSongs.length / ITEMS_PER_PAGE);
                    currentPage = (currentPage + 1) % maxPage;
                    renderCurrentPage();
                    listContainer.classList.remove("fade-out");
                }, 200);
            }, 5000);
        }

        fetchWidgetData();
        setInterval(fetchWidgetData, 3000);
        startPaginationLoop();
    </script>
</body>
</html>
