<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 노래책</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
        }

        .main-container {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            padding: 14px 20px 16px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* 상단 헤더 영역 */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .title-summary-box {
            border-left: 5px solid #0ea5e9;
            padding-left: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .stats-summary {
            font-size: 13.5px;
            color: #64748b;
            font-weight: 600;
            margin: 0;
        }

        /* 공지사항 접기/펼치기 아코디언 스타일 */
        .notice-box {
            background: rgba(0, 119, 190, 0.08);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 12px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .notice-header {
            padding: 12px 14px;
            font-weight: 700;
            font-size: 14px;
            color: #03045e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background: rgba(0, 119, 190, 0.04);
            transition: background 0.2s;
        }

        .notice-header:hover {
            background: rgba(0, 119, 190, 0.1);
        }

        .notice-content-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            padding: 0 14px;
        }

        .notice-box.expanded .notice-content-wrapper {
            max-height: 500px;
            padding: 0 14px 12px 14px;
            border-top: 1px dashed rgba(0, 119, 190, 0.2);
        }

        .notice-content {
            color: #334155;
            margin: 10px 0 0 0;
            white-space: pre-line;
            font-size: 14px;
            line-height: 1.6;
        }

        .notice-arrow {
            transition: transform 0.3s ease;
            font-size: 12px;
        }

        .notice-box.expanded .notice-arrow {
            transform: rotate(180deg);
        }

        /* 검색 및 필터 영역 */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .filter-tags-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0369a1;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .filter-btn:hover {
            background-color: #f8fafc;
            border-color: #0ea5e9;
        }

        .filter-btn.active {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }

        /* 아티스트 그룹별 섹션 스타일 */
        .artist-group {
            margin-bottom: 16px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }

        .artist-header {
            background: #f1f5f9;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 800;
            color: #1e3a8a;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .song-list {
            display: flex;
            flex-direction: column;
        }

        @keyframes slideDownFade {
            0% {
                opacity: 0;
                transform: translateY(-12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .song-card {
            border-bottom: 1px solid #f1f5f9;
            overflow: hidden;
            animation: slideDownFade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transition: background 0.2s ease;
        }

        .song-card:last-child {
            border-bottom: none;
        }

        .song-card:hover {
            background: #f8fafc;
        }

        .song-summary-row {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            gap: 12px;
            user-select: none;
        }

        .song-info-left {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .song-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .song-badges {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background-color: #f1f5f9;
            color: #475569;
        }

        .badge-count {
            background-color: #e0f2fe;
            color: #0284c7;
        }

        .badge-limit {
            background-color: #eef2ff;
            color: #6366f1;
        }

        /* 클릭 시 펼쳐지는 날짜 버튼 영역 */
        .timestamp-container {
            padding: 0 16px 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            border-top: 1px solid #f1f5f9;
            background-color: #fafbfc;
            display: none;
        }

        .song-card.expanded .timestamp-container {
            display: flex;
            padding-top: 10px;
        }

        .timestamp-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0284c7;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timestamp-btn:hover {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
        }

        .no-result {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            padding: 40px 0;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        @media (max-width: 500px) {
            .main-container {
                padding: 12px;
            }
            .page-title {
                font-size: 22px;
            }
            .title-summary-box {
                padding-left: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 상단 헤더 영역 -->
        <div class="header-row">
            <div class="title-summary-box">
                <h1 class="page-title">🎤 바다비 노래책</h1>
                <div id="statsSummary" class="stats-summary">통계 계산 중...</div>
            </div>
        </div>

        <!-- 공지사항 표시 박스 영역 (기본값 접힌 상태) -->
        <div class="notice-box" id="noticeBox">
            <div class="notice-header" onclick="toggleNotice()">
                <span>📢 공지사항</span>
                <span class="notice-arrow">▼</span>
            </div>
            <div class="notice-content-wrapper">
                <p class="notice-content">로딩중입니다...</p>
            </div>
        </div>
        
        <!-- 키워드 검색 입력창 -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 노래 제목이나 가수, 장르를 검색하세요..." oninput="onSearchInput()">

        <!-- 빠른 장르별 필터 토글 버튼 영역 -->
        <div class="filter-tags-container">
            <button class="filter-btn active" data-filter="전체">전체</button>
            <button class="filter-btn" data-filter="기타연주">기타연주</button>
            <button class="filter-btn" data-filter="k팝">K팝</button>
            <button class="filter-btn" data-filter="j팝">J팝</button>
            <button class="filter-btn" data-filter="팝">팝</button>
        </div>

        <!-- 노래 목록 출력 컨테이너 -->
        <div id="songContainer" class="song-list">
            <p class="no-result">데이터를 불러오는 중...</p>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const SONG_LIST_URL = WORKER_URL + "?type=songlist&t=";
        const STATS_API_URL = WORKER_URL + "?type=fansongstats&t=";

        let allSongs = [];
        let filteredSongs = [];
        let vodMap = {};
        let totalPlayCount = 0;
        let currentFilter = '전체';

        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(":").map(Number);
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            } else if (parts.length === 2) {
                return parts[0] * 60 + parts[1];
            }
            return 0;
        }

        function toggleNotice() {
            const noticeBox = document.getElementById("noticeBox");
            noticeBox.classList.toggle("expanded");
        }

        function toggleSongCard(cardElement) {
            cardElement.classList.toggle("expanded");
        }

        function animateNumber(elementId, endValue, duration = 800, suffix = "") {
            const element = document.getElementById(elementId);
            if (!element) return;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const current = Math.floor(progress * endValue);
                element.textContent = current.toLocaleString() + suffix;
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.textContent = endValue.toLocaleString() + suffix;
                }
            }
            requestAnimationFrame(update);
        }

        async function loadData() {
            const container = document.getElementById("songContainer");

            try {
                const timestamp = new Date().getTime();
                
                const [songListRes, statsRes] = await Promise.all([
                    fetch(SONG_LIST_URL + timestamp),
                    fetch(STATS_API_URL + timestamp)
                ]);

                if (!songListRes.ok || !statsRes.ok) throw new Error("데이터를 불러오지 못했습니다.");

                const songListData = await songListRes.json();
                const statsData = await statsRes.json();

                // 공지사항 설정
                const noticeText = songListData.notice || "";
                if (noticeText && noticeText.trim() !== "") {
                    let formattedNotice = noticeText.trim().replace(/<\/br>/gi, '\n');
                    document.querySelector('.notice-content').innerText = formattedNotice;
                } else {
                    document.querySelector('.notice-content').innerText = "공지사항이 없습니다.";
                }

                // VOD 맵 구성
                vodMap = {};
                if (statsData.vodSources) {
                    statsData.vodSources.forEach(vod => {
                        vodMap[vod.date] = vod.url;
                    });
                }

                // fansongstats에 있는 기록들을 타이틀+아티스트 기준으로 매핑
                const statsMap = {};
                const combinedStatsList = [...(statsData.registeredSongs || []), ...(statsData.unregisteredSongs || [])];
                combinedStatsList.forEach(statSong => {
                    const key = `${(statSong.title || '').trim().toLowerCase()}_${(statSong.artist || '').trim().toLowerCase()}`;
                    statsMap[key] = statSong.dateTimes || [];
                });

                // 노래리스트 기준 배열 생성 (노래리스트에 있는 것만 포함하며, 기록이 있으면 연결)
                const rawSongs = songListData.songs || [];
                allSongs = rawSongs.map(song => {
                    const key = `${(song.title || '').trim().toLowerCase()}_${(song.artist || '').trim().toLowerCase()}`;
                    return {
                        ...song,
                        dateTimes: statsMap[key] || []
                    };
                });

                totalPlayCount = allSongs.reduce((sum, song) => sum + song.dateTimes.length, 0);

                document.getElementById("statsSummary").innerHTML = `총 노래 : <span id="animSongCount">0</span>곡 | 총 부른 횟수 : 약 <span id="animPlayCount">0</span>회`;
                animateNumber("animSongCount", allSongs.length, 800);
                animateNumber("animPlayCount", totalPlayCount, 1000);

                if (allSongs.length === 0) {
                    container.innerHTML = '<p class="no-result">표시할 노래 데이터가 없습니다.</p>';
                    return;
                }

                setupFilterButtons();
                filteredSongs = [...allSongs];
                renderGroupedList();

            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="no-result" style="color: #ef4444;">노래 데이터를 불러오는데 실패했습니다.</p>';
            }
        }

        function setupFilterButtons() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.onclick = () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.getAttribute('data-filter');
                    filterAndRender();
                };
            });
        }

        function filterAndRender() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

            filteredSongs = allSongs.filter(song => {
                const title = song.title || '';
                const artist = song.artist || '';
                const genre = song.genre || '';
                const limit = song.limit || '';
                const etc = song.etc || '';

                const matchesKeyword = 
                    title.toLowerCase().includes(keyword) || 
                    artist.toLowerCase().includes(keyword) ||
                    genre.toLowerCase().includes(keyword) ||
                    limit.toLowerCase().includes(keyword) ||
                    etc.toLowerCase().includes(keyword);

                if (!matchesKeyword) return false;

                const g = genre.toLowerCase();
                const l = limit.toLowerCase();

                if (currentFilter === '전체') {
                    return true;
                } else if (currentFilter === '기타연주') {
                    return l.includes('기타');
                } else if (currentFilter === 'k팝') {
                    return g.includes('k') || g.includes('가요');
                } else if (currentFilter === 'j팝') {
                    return g.includes('j') || g.includes('일단') || g.includes('일본');
                } else if (currentFilter === '팝') {
                    const hasPop = g.includes('팝') || g.includes('pop');
                    const isKOrJ = g.includes('k') || g.includes('j') || g.includes('가요') || g.includes('일본');
                    return hasPop && !isKOrJ;
                }
                return true;
            });

            renderGroupedList();
        }

        function renderGroupedList() {
            const container = document.getElementById("songContainer");
            container.innerHTML = "";

            if (filteredSongs.length === 0) {
                container.innerHTML = '<p class="no-result">검색 결과가 없습니다.</p>';
                return;
            }

            // 아티스트별로 그룹화
            const groupedByArtist = {};
            filteredSongs.forEach(song => {
                const artist = (song.artist && song.artist.trim() !== "") ? song.artist.trim() : "아티스트 미상";
                if (!groupedByArtist[artist]) {
                    groupedByArtist[artist] = [];
                }
                groupedByArtist[artist].push(song);
            });

            // 아티스트 이름 기준 정렬
            const sortedArtists = Object.keys(groupedByArtist).sort((a, b) => a.localeCompare(b, 'ko'));

            sortedArtists.forEach((artist, artistIdx) => {
                const songs = groupedByArtist[artist];
                songs.sort((a, b) => (a.title || '').localeCompare((b.title || ''), 'ko'));

                const artistGroupDiv = document.createElement("div");
                artistGroupDiv.className = "artist-group";

                const artistHeader = document.createElement("div");
                artistHeader.className = "artist-header";
                artistHeader.innerHTML = `🎵 ${artist} <span style="font-weight: 500; font-size: 12px; color: #64748b;">(${songs.length}곡)</span>`;
                artistGroupDiv.appendChild(artistHeader);

                const songListInner = document.createElement("div");
                songListInner.className = "song-list-inner";

                songs.forEach((song, idx) => {
                    const card = document.createElement("div");
                    card.className = "song-card";
                    card.style.animationDelay = `${(artistIdx * 0.02) + (idx * 0.02)}s`;

                    card.onclick = (e) => {
                        if (e.target.tagName === 'A' || e.target.closest('a')) return;
                        toggleSongCard(card);
                    };

                    let limitVal = song.limit || '';
                    let limitBadge = "";
                    if (limitVal !== "") {
                        let cleanLimitVal = limitVal.replace(/[\[\]]/g, ''); 
                        let badgeColor = "#0ea5e9";
                        if (cleanLimitVal.includes("200")) badgeColor = "#10b981";
                        else if (cleanLimitVal.includes("300")) badgeColor = "#f97316";
                        else if (cleanLimitVal.includes("기타")) badgeColor = "#8b5cf6";
                        limitBadge = `<span class="badge badge-limit" style="background-color: ${badgeColor}; color: white;">${cleanLimitVal}</span>`;
                    }

                    const playCount = song.dateTimes ? song.dateTimes.length : 0;
                    const countBadge = `<span class="badge badge-count">${playCount}회</span>`;
                    const genreBadge = song.genre ? `<span class="badge" style="background-color: #e0f2fe; color: #0284c7;">${song.genre}</span>` : "";

                    let timestampsHTML = "";
                    if (song.dateTimes && song.dateTimes.length > 0) {
                        timestampsHTML = '<div class="timestamp-container">';
                        song.dateTimes.forEach(dt => {
                            const vodUrl = vodMap[dt.date] || "#";
                            const totalSeconds = timeToSeconds(dt.time);
                            const finalLink = vodUrl !== "#" ? `${vodUrl}?change_second=${totalSeconds}` : "#";
                            const cleanDate = dt.date.replace(/\(.*?\)/g, "").trim();

                            timestampsHTML += `
                                <a href="${finalLink}" target="_blank" rel="noopener noreferrer" class="timestamp-btn" onclick="event.stopPropagation();">
                                    📅 ${cleanDate}
                                </a>
                            `;
                        });
                        timestampsHTML += '</div>';
                    } else {
                        timestampsHTML = '<div class="timestamp-container" style="padding: 10px 16px; font-size: 13px; color: #64748b;">부른 기록이 없습니다.</div>';
                    }

                    card.innerHTML = `
                        <div class="song-summary-row">
                            <div class="song-info-left">
                                <h3 class="song-title">
                                    ${limitBadge}
                                    ${song.title || '제목없음'}
                                </h3>
                            </div>
                            <div class="song-badges">
                                ${genreBadge}
                                ${countBadge}
                            </div>
                        </div>
                        ${timestampsHTML}
                    `;

                    songListInner.appendChild(card);
                });

                artistGroupDiv.appendChild(songListInner);
                container.appendChild(artistGroupDiv);
            });
        }

        function onSearchInput() {
            filterAndRender();
        }

        loadData();
    </script>
</body>
</html>
