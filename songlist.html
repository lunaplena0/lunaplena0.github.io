<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 노래책</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f4f7f9;
            overflow-x: hidden;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent; 
        }

        /* 노래책 메인 카드 박스 */
        .profile-info-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 119, 190, 0.15);
            border-radius: 12px; 
            padding: 40px;
            box-shadow: 0 20px 45px rgba(0, 119, 190, 0.15);
            max-width: 950px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: #2b2d42; 
            box-sizing: border-box;
        }

        /* 상단 헤더 영역 */
        .songbook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 119, 190, 0.15);
            padding-bottom: 16px;
        }

        .songbook-title {
            font-size: 24px;
            font-weight: 800;
            color: #03045e;
            margin: 0;
        }

        /* 노래 총 개수 표시 스타일 */
        .song-count {
            font-size: 15px;
            font-weight: 600;
            color: #0077b6;
            background: rgba(0, 119, 190, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* 공지사항 박스 영역 */
        .notice-box {
            background: rgba(0, 119, 190, 0.08);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 8px;
            padding: 16px 18px;
            font-size: 14px;
            color: #03045e;
            line-height: 1.6;
            box-sizing: border-box;
        }

        .notice-title {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            border-bottom: 1px dashed rgba(0, 119, 190, 0.2);
            padding-bottom: 6px;
        }

        .notice-content {
            color: #334155;
            margin: 0;
            white-space: pre-line;
        }

        /* 검색 바 영역 (높이 및 글씨 크기 최적화) */
        .search-box {
            width: 100%;
            padding: 10px 14px;
            font-size: 13px;
            border: 1px solid rgba(0, 119, 190, 0.25);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            outline: none;
            color: #2b2d42;
            transition: all 0.2s ease-in-out;
        }

        .search-box::placeholder {
            font-size: 12px;
            color: #94a3b8;
        }

        .search-box:focus {
            border-color: #0077b6;
            box-shadow: 0 0 10px rgba(0, 119, 190, 0.15);
        }

        /* 토글(필터) 버튼 컨테이너 스타일 */
        .filter-tags-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: -10px;
        }

        .filter-btn {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 119, 190, 0.25);
            color: #0077b6;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background-color: rgba(0, 119, 190, 0.1);
        }

        .filter-btn.active {
            background-color: #0077b6;
            color: white;
            border-color: #0077b6;
        }

        /* 노래 목록 테이블 컨테이너 */
        .song-table-container {
            width: 100%;
            max-height: 420px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid rgba(0, 119, 190, 0.15);
            background: rgba(255, 255, 255, 0.6);
        }

        .song-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 15px;
            table-layout: fixed;
        }

        .song-table th {
            background: #e6f0f8;
            color: #03045e;
            font-weight: 800;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .song-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0, 119, 190, 0.08);
            color: #334155;
            word-break: break-all;
            vertical-align: middle;
        }

        .song-table tr:hover {
            background: rgba(0, 119, 190, 0.05);
        }

        .song-table tr:last-child td {
            border-bottom: none;
        }

        .loading-text {
            text-align: center;
            color: #64748b;
            font-style: italic;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
                justify-content: flex-start;
            }
            .ocean-profile-container {
                height: auto;
                min-height: auto;
                padding: 16px;
            }
            .profile-info-card {
                height: auto;
                max-height: none;
                padding: 16px;
                gap: 16px;
            }
            .song-table th, .song-table td {
                padding: 10px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <!-- 노래책 페이지 카드 영역 -->
        <div class="profile-info-card">
            <div class="songbook-header">
                <h1 class="songbook-title">🎤 바다비 노래책</h1>
                <span id="song-count" class="song-count">0곡</span>
            </div>

            <!-- 공지칸 영역 -->
            <div class="notice-box">
                <div class="notice-title">📢 공지</div>
                <p class="notice-content">로딩중입니다...</p>
            </div>

            <!-- 검색 입력창 -->
            <input type="text" id="search-input" class="search-box" placeholder="노래 제목이나 가수를 검색한 뒤 엔터를 눌러주세요...">

            <!-- 빠른 필터 토글 버튼 영역 -->
            <div class="filter-tags-container">
                <button class="filter-btn" data-filter="전체">전체</button>
                <button class="filter-btn" data-filter="기타연주">기타연주</button>
                <button class="filter-btn" data-filter="k팝">K팝</button>
                <button class="filter-btn" data-filter="j팝">J팝</button>
                <button class="filter-btn" data-filter="팝">팝</button>
            </div>

            <!-- 노래 목록 테이블 -->
            <div class="song-table-container">
                <table class="song-table">
                    <thead>
                        <tr>
                            <th style="width: 70%;">곡 정보</th>
                            <th style="width: 30%;">장르 및 기타</th>
                        </tr>
                    </thead>
                    <tbody id="song-tbody">
                        <tr>
                            <td colspan="2" class="loading-text" style="padding: 30px;">로딩중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 구글 시트 연동 및 캐싱 파싱 스크립트 -->
    <script>
        const tsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2WQUFSDIK2TzQICEyBQ0xwsBBuOdOKDdCGu3p08niQf25AgYeO8P6MT7vg-Hd4e6Xoqb6QNIgmSBu/pub?output=tsv';
        
        const CACHE_KEY = 'badabi_songbook_data';
        const CACHE_EXPIRY_KEY = 'badabi_songbook_expiry';
        const CACHE_DURATION = 5 * 60 * 1000; 

        let globalSongs = [];
        let currentFilter = '전체';
        let currentKeyword = '';

        async function loadSheetData() {
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cacheExpiry = localStorage.getItem(CACHE_EXPIRY_KEY);
            const now = new Date().getTime();

            if (cachedData && cacheExpiry && now < parseInt(cacheExpiry, 10)) {
                try {
                    const parsedData = JSON.parse(cachedData);
                    globalSongs = parsedData.allSongs;
                    applyDataToUI(parsedData.noticeText, globalSongs);
                    return;
                } catch (e) {
                    console.warn("캐시 데이터 파싱 실패, 새로 요청합니다.", e);
                }
            }

            try {
                const response = await fetch(tsvUrl);
                const text = await response.text();
                
                const rows = text.split('\n').map(row => row.split('\t'));

                if (rows.length > 0) {
                    let noticeText = "";
                    for (let i = 1; i <= 8 && i < rows.length; i++) {
                        if (rows[i] && rows[i][0]) {
                            let cleanText = rows[i][0].replace(/^"|"$/g, '');
                            noticeText += cleanText + "\n";
                        }
                    }

                    globalSongs = [];
                    for (let i = 10; i < rows.length; i++) {
                        const cols = rows[i];
                        if (cols && cols.length >= 4 && cols[0].trim() !== "") {
                            globalSongs.push({
                                title: (cols[0] || '').replace(/^"|"$/g, ''),
                                artist: (cols[1] || '').replace(/^"|"$/g, ''),
                                genre: (cols[2] || '').replace(/^"|"$/g, ''),
                                limit: (cols[3] || '').replace(/^"|"$/g, '').trim(), 
                                etc: (cols[4] || '').replace(/^"|"$/g, '').trim()   
                            });
                        }
                    }

                    const dataToCache = { noticeText, allSongs: globalSongs };
                    localStorage.setItem(CACHE_KEY, JSON.stringify(dataToCache));
                    localStorage.setItem(CACHE_EXPIRY_KEY, (now + CACHE_DURATION).toString());

                    applyDataToUI(noticeText, globalSongs);
                }
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.querySelector('.notice-content').innerText = "공지사항을 불러오지 못했습니다.";
                document.getElementById('song-tbody').innerHTML = `<tr><td colspan="2" class="loading-text" style="padding: 30px; color: #ef4444;">데이터 로드 실패</td></tr>`;
            }
        }

        function applyDataToUI(noticeText, allSongs) {
            if (noticeText && noticeText.trim() !== "") {
                let formattedNotice = noticeText.trim().replace(/<\/br>/gi, '\n');
                document.querySelector('.notice-content').innerText = formattedNotice;
            } else {
                document.querySelector('.notice-content').innerText = "공지사항이 없습니다.";
            }

            document.getElementById('song-count').innerText = `${allSongs.length}곡`;

            renderTable(allSongs);

            const searchInput = document.getElementById('search-input');
            
            searchInput.oninput = (e) => {
                currentKeyword = e.target.value.toLowerCase().trim();
                filterAndRender();
            };

            // 필터 버튼 이벤트 설정
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                if (btn.getAttribute('data-filter') === '전체') {
                    btn.classList.add('active');
                }

                btn.onclick = () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.getAttribute('data-filter');
                    filterAndRender();
                };
            });
        }

        function filterAndRender() {
            let filtered = globalSongs.filter(song => {
                // 1. 검색어 필터링
                const matchesKeyword = 
                    song.title.toLowerCase().includes(currentKeyword) || 
                    song.artist.toLowerCase().includes(currentKeyword) ||
                    song.genre.toLowerCase().includes(currentKeyword) ||
                    song.limit.toLowerCase().includes(currentKeyword) ||
                    song.etc.toLowerCase().includes(currentKeyword);

                if (!matchesKeyword) return false;

                // 2. 카테고리 토글 버튼 필터링 (K팝, J팝, 팝 개별 정확 분리)
                const g = song.genre.toLowerCase();
                const l = song.limit.toLowerCase();

                if (currentFilter === '전체') {
                    return true;
                } else if (currentFilter === '기타연주') {
                    return l.includes('기타');
                } else if (currentFilter === 'k팝') {
                    return g.includes('k') || g.includes('가요');
                } else if (currentFilter === 'j팝') {
                    return g.includes('j') || g.includes('일단') || g.includes('일본');
                } else if (currentFilter === '팝') {
                    // '팝' 또는 'pop'이 포함되어 있으면서, k나 j가 붙은 k팝/j팝은 제외
                    const hasPop = g.includes('팝') || g.includes('pop');
                    const isKOrJ = g.includes('k') || g.includes('j') || g.includes('가요') || g.includes('일본');
                    return hasPop && !isKOrJ;
                }
                return true;
            });

            renderTable(filtered);
        }

        function renderTable(songs) {
            const tbody = document.getElementById('song-tbody');
            tbody.innerHTML = "";

            if (songs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="loading-text" style="padding: 30px;">검색된 노래가 없습니다.</td></tr>`;
                return;
            }

            songs.forEach(song => {
                const tr = document.createElement('tr');
                
                let cleanTitle = song.title;
                if (cleanTitle.length > 30) {
                    cleanTitle = cleanTitle.substring(0, 30) + '...';
                }

                let limitBadgeHtml = "";
                if (song.limit !== "") {
                    let badgeColor = "#0ea5e9";
                    if (song.limit.includes("200")) {
                        badgeColor = "#10b981";
                    } else if (song.limit.includes("300")) {
                        badgeColor = "#f97316";
                    } else if (song.limit.includes("기타")) {
                        badgeColor = "#8b5cf6";
                    }
                    limitBadgeHtml += `<span style="background-color: ${badgeColor}; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block; margin-right: 4px;">${song.limit}</span>`;
                }

                let etcTextHtml = "";
                if (song.etc !== "") {
                    etcTextHtml += `<span style="color: #64748b; font-size: 12px; font-weight: 500;">${song.etc}</span>`;
                }
                
                tr.innerHTML = `
                    <td>
                        <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 4px; flex-wrap: wrap;">
                            ${limitBadgeHtml}
                            <span style="font-weight: 700; color: #1e293b; font-size: 15px;">${cleanTitle}</span>
                        </div>
                        <div style="color: #64748b; font-size: 13px;">${song.artist}</div>
                    </td>
                    <td>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span style="font-weight: 600; color: #0077b6; font-size: 14px;">${song.genre}</span>
                            <div>${etcTextHtml}</div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        loadSheetData();
    </script>
    
    <footer style="text-align: center; padding: 20px 10px; color: #718096; font-size: 11px; border-top: 1px solid rgba(0, 119, 190, 0.1); margin-top: auto; width: 100%; box-sizing: border-box;">
        <p style="margin: 0; opacity: 0.8; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;">
            <span style="display: inline-block;">정보 갱신 시 데이터 반영에 차이가 있을 수 있습니다.</span>
        </p>
    </footer>
</body>
</html>
