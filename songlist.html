<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 노래책</title>
    <style>
        /* 전체 페이지 기본 스타일 설정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 상단 네비게이션 바 스타일 */
        .marine-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(3, 4, 94, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 12px 24px;
        }

        /* 네비게이션 내부 정렬 컨테이너 */
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 네비게이션 로고 스타일 */
        .nav-logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #caf0f8;
            text-decoration: none;
        }

        /* 네비게이션 메뉴 링크 목록 */
        .nav-links {
            display: flex;
            gap: 16px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 네비게이션 메뉴 개별 링크 */
        .nav-links a {
            color: #90e0ef;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
            padding: 6px 6px;
            border-radius: 6px;
        }

        /* 네비게이션 링크 호버 효과 */
        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 메인 콘텐츠 영역을 감싸는 컨테이너 */
        .ocean-profile-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 4px;
            box-sizing: border-box;
            background: transparent; 
        }

        /* 노래책 메인 카드 박스 (유리구상 디자인 적용) */
        .profile-info-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 119, 190, 0.15);
            border-radius: 12px; 
            padding: 15px;
            box-shadow: 0 20px 45px rgba(0, 119, 190, 0.15);
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: #2b2d42; 
            box-sizing: border-box;
        }

        /* 카드 상단 헤더 영역 (제목과 곡 개수 배치) */
        .songbook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 119, 190, 0.15);
            padding-bottom: 8px;
        }

        /* 노래책 타이틀 텍스트 스타일 */
        .songbook-title {
            font-size: 24px;
            font-weight: 800;
            color: #03045e;
            margin: 0;
        }

        /* 노래 총 개수를 보여주는 뱃지 스타일 */
        .song-count {
            font-size: 15px;
            font-weight: 600;
            color: #0077b6;
            background: rgba(0, 119, 190, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* 공지사항 안내 박스 */
        .notice-box {
            background: rgba(0, 119, 190, 0.08);
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: #03045e;
            line-height: 1.6;
            box-sizing: border-box;
        }

        /* 공지사항 제목 타이틀 */
        .notice-title {
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 14px;
            border-bottom: 1px dashed rgba(0, 119, 190, 0.2);
            padding-bottom: 6px;
        }

        /* 공지사항 본문 내용 */
        .notice-content {
            color: #334155;
            margin: 0;
            white-space: pre-line;
        }

        /* 노래 검색 입력창 스타일 */
        .search-box {
            width: 100%;
            padding: 10px 12px;
            font-size: 12px;
            border: 1px solid rgba(0, 119, 190, 0.25);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            outline: none;
            color: #2b2d42;
            transition: all 0.2s ease-in-out;
        }

        /* 검색창 플레이스홀더 폰트 설정 */
        .search-box::placeholder {
            font-size: 12px;
            color: #94a3b8;
        }

        /* 검색창 포커스 효과 */
        .search-box:focus {
            border-color: #0077b6;
            box-shadow: 0 0 10px rgba(0, 119, 190, 0.15);
        }

        /* 장르 필터 태그 버튼들을 감싸는 컨테이너 */
        .filter-tags-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: -10px;
        }

        /* 개별 필터 버튼 스타일 */
        .filter-btn {
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 119, 190, 0.25);
            color: #0077b6;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* 필터 버튼 호버 효과 */
        .filter-btn:hover {
            background-color: rgba(0, 119, 190, 0.1);
        }

        /* 선택된(활성화된) 필터 버튼 스타일 */
        .filter-btn.active {
            background-color: #0077b6;
            color: white;
            border-color: #0077b6;
        }

        /* 노래 목록 테이블을 감싸는 스크롤 영역 컨테이너 */
        .song-table-container {
            width: 100%;
            max-height: 450px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid rgba(0, 119, 190, 0.15);
            background: rgba(255, 255, 255, 0.6);
        }

        /* 노래 목록 테이블 기본 설정 */
        .song-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            table-layout: fixed;
        }

        /* 테이블 헤더 셀 (스크롤 시 고정) */
        .song-table th {
            background: #e6f0f8;
            color: #03045e;
            font-weight: 800;
            padding: 8px 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* 테이블 데이터 셀 */
        .song-table td {
            padding: 3px 4px;
            border-bottom: 1px solid rgba(0, 119, 190, 0.08);
            color: #334155;
            word-break: break-word;
            vertical-align: middle;
        }

        /* 테이블 행 마우스 호버 효과 (배경색 변경 대신 테두리 선으로 강조) */
        .song-table tr:hover {
            background: transparent;
            outline: 1px solid #226c94;
            outline-offset: -1.5px;
            z-index: 5;
            position: relative;
        }

        /* 아티스트 그룹 행은 호버 시 테두리 효과를 제외하고 싶다면 추가 */
        .song-table tr:has(td[colspan="2"]):hover {
            outline: none;
            background: rgba(0, 119, 190, 0.05);
        }

        /* 마지막 행 하단 테두리 제거 */
        .song-table tr:last-child td {
            border-bottom: none;
        }

        /* 데이터 로딩 중 텍스트 스타일 */
        .loading-text {
            text-align: center;
            color: #64748b;
            font-style: italic;
        }

        /* 모바일 화면 대응 미디어 쿼리 */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .ocean-profile-container {
                height: auto;
                min-height: auto;
                padding: 16px;
            }
            .profile-info-card {
                height: auto;
                max-height: none;
                padding: 16px;
                gap: 16px;
            }
            .song-table th:nth-child(1), .song-table td:nth-child(1) {
                width: 60% !important;
            }
            .song-table th:nth-child(2), .song-table td:nth-child(2) {
                width: 40% !important;
            }
            .song-table th, .song-table td {
                padding: 8px 4px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="marine-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BABABI FAN ARCHIVE</a>
            <ul class="nav-links">
                <li><a href="profile.html">프로필</a></li>
                <li><a href="link.html">주소모음</a></li>
            </ul>
        </div>
    </nav>

    <!-- 메인 컨텐츠 영역 -->
    <div class="ocean-profile-container">
        <!-- 노래책 페이지 카드 영역 -->
        <div class="profile-info-card">
            <!-- 헤더 타이틀 및 곡 개수 영역 -->
            <div class="songbook-header">
                <h1 class="songbook-title">🎤 바다비 노래책</h1>
                <span id="song-count" class="song-count">0곡</span>
            </div>

            <!-- 공지사항 표시 박스 영역 -->
            <div class="notice-box">
                <div class="notice-title">📢 공지</div>
                <p class="notice-content">로딩중입니다...</p>
            </div>

            <!-- 키워드 검색 입력창 -->
            <input type="text" id="search-input" class="search-box" placeholder="🔍 노래 제목이나 가수를 검색한 뒤 엔터를 눌러주세요...">

            <!-- 빠른 장르별 필터 토글 버튼 영역 -->
            <div class="filter-tags-container">
                <button class="filter-btn" data-filter="전체">전체</button>
                <button class="filter-btn" data-filter="기타연주">기타연주</button>
                <button class="filter-btn" data-filter="k팝">K팝</button>
                <button class="filter-btn" data-filter="j팝">J팝</button>
                <button class="filter-btn" data-filter="팝">팝</button>
            </div>

            <!-- 노래 목록 출력 테이블 컨테이너 -->
            <div class="song-table-container">
                <table class="song-table">
                    <thead>
                        <tr>
                            <th style="width: 70%;">곡 정보</th>
                            <th style="width: 30%;">장르 및 기타</th>
                        </tr>
                    </thead>
                    <tbody id="song-tbody">
                        <tr>
                            <td colspan="2" class="loading-text" style="padding: 30px;">로딩중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 영역 -->
    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const jsonUrl = WORKER_URL + "?type=songlist&t=";
         
        const CACHE_KEY = 'badabi_songbook_json_data';
        const CACHE_EXPIRY_KEY = 'badabi_songbook_json_expiry';
        const CACHE_DURATION = 5 * 60 * 1000; 

        let globalSongs = [];
        let currentFilter = '전체';
        let currentKeyword = '';

        async function loadSongbookData() {
            const cachedData = localStorage.getItem(CACHE_KEY);
            const cacheExpiry = localStorage.getItem(CACHE_EXPIRY_KEY);
            const now = new Date().getTime();

            if (cachedData && cacheExpiry && now < parseInt(cacheExpiry, 10)) {
                try {
                    const parsedData = JSON.parse(cachedData);
                    globalSongs = parsedData.allSongs || [];
                    applyDataToUI(parsedData.noticeText, globalSongs);
                    return;
                } catch (e) {
                    console.warn("캐시 데이터 파싱 실패, 새로 요청합니다.", e);
                }
            }

            try {
                const response = await fetch(jsonUrl + new Date().getTime());
                if (!response.ok) throw new Error("songlist.json을 불러오지 못했습니다.");
                 
                const jsonData = await response.json();
                 
                const noticeText = jsonData.notice || "";
                globalSongs = jsonData.songs || [];

                const dataToCache = { noticeText, allSongs: globalSongs };
                localStorage.setItem(CACHE_KEY, JSON.stringify(dataToCache));
                localStorage.setItem(CACHE_EXPIRY_KEY, (now + CACHE_DURATION).toString());

                applyDataToUI(noticeText, globalSongs);
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.querySelector('.notice-content').innerText = "공지사항을 불러오지 못했습니다.";
                document.getElementById('song-tbody').innerHTML = `<tr><td colspan="2" class="loading-text" style="padding: 30px; color: #ef4444;">데이터 로드 실패</td></tr>`;
            }
        }

        function applyDataToUI(noticeText, allSongs) {
            if (noticeText && noticeText.trim() !== "") {
                let formattedNotice = noticeText.trim().replace(/<\/br>/gi, '\n');
                document.querySelector('.notice-content').innerText = formattedNotice;
            } else {
                document.querySelector('.notice-content').innerText = "공지사항이 없습니다.";
            }

            document.getElementById('song-count').innerText = `${allSongs.length}곡`;

            renderTable(allSongs);

            const searchInput = document.getElementById('search-input');

            searchInput.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    currentKeyword = e.target.value.toLowerCase().trim();
                    filterAndRender();
                }
            };

            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                if (btn.getAttribute('data-filter') === '전체') {
                    btn.classList.add('active');
                }

                btn.onclick = () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.getAttribute('data-filter');
                    filterAndRender();
                };
            });
        }

        function filterAndRender() {
            let filtered = globalSongs.filter(song => {
                const title = song.title || '';
                const artist = song.artist || '';
                const genre = song.genre || '';
                const limit = song.limit || '';
                const etc = song.etc || '';

                const matchesKeyword = 
                    title.toLowerCase().includes(currentKeyword) || 
                    artist.toLowerCase().includes(currentKeyword) ||
                    genre.toLowerCase().includes(currentKeyword) ||
                    limit.toLowerCase().includes(currentKeyword) ||
                    etc.toLowerCase().includes(currentKeyword);

                if (!matchesKeyword) return false;

                const g = genre.toLowerCase();
                const l = limit.toLowerCase();

                if (currentFilter === '전체') {
                    return true;
                } else if (currentFilter === '기타연주') {
                    return l.includes('기타');
                } else if (currentFilter === 'k팝') {
                    return g.includes('k') || g.includes('가요');
                } else if (currentFilter === 'j팝') {
                    return g.includes('j') || g.includes('일단') || g.includes('일본');
                } else if (currentFilter === '팝') {
                    const hasPop = g.includes('팝') || g.includes('pop');
                    const isKOrJ = g.includes('k') || g.includes('j') || g.includes('가요') || g.includes('일본');
                    return hasPop && !isKOrJ;
                }
                return true;
            });

            renderTable(filtered);
        }

        function renderTable(songs) {
            const tbody = document.getElementById('song-tbody');
            tbody.innerHTML = "";

            if (songs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="loading-text" style="padding: 30px;">검색된 노래가 없습니다.</td></tr>`;
                return;
            }

            const sortedSongs = [...songs].sort((a, b) => {
                const artistA = (a.artist || '아티스트 미상').toLowerCase();
                const artistB = (b.artist || '아티스트 미상').toLowerCase();
                
                if (artistA < artistB) return -1;
                if (artistA > artistB) return 1;

                const titleA = (a.title || '').toLowerCase();
                const titleB = (b.title || '').toLowerCase();
                return titleA.localeCompare(titleB, 'ko');
            });

            let lastArtist = "";

            sortedSongs.forEach(song => {
                const currentArtist = song.artist || '아티스트 미상';

                if (currentArtist !== lastArtist) {
                    lastArtist = currentArtist;
                    const groupTr = document.createElement('tr');
                    groupTr.innerHTML = `
                        <td colspan="2" style="background: rgba(0, 119, 190, 0.05); border-top: 1px solid rgba(0, 119, 190, 0.1); border-bottom: 1px solid rgba(0, 119, 190, 0.1); font-weight: 700; color: #1e3a8a; padding: 6px 4px; font-size: 12.5px;">
                            🎵 ${currentArtist}
                        </td>
                    `;
                    tbody.appendChild(groupTr);
                }

                const tr = document.createElement('tr');
                
                let rawTitle = song.title || '제목없음';
                let cleanTitle = rawTitle;
                
                let limitVal = song.limit || '';
                let limitBadgeHtml = "";
                if (limitVal !== "") {
                    let cleanLimitVal = limitVal.replace(/[\[\]]/g, ''); 
                    let badgeColor = "#0ea5e9";
                    if (cleanLimitVal.includes("200")) {
                        badgeColor = "#10b981";
                    } else if (cleanLimitVal.includes("300")) {
                        badgeColor = "#f97316";
                    } else if (cleanLimitVal.includes("기타")) {
                        badgeColor = "#8b5cf6";
                    }
                    limitBadgeHtml += `<span style="background-color: ${badgeColor}; color: white; padding: 2px 4px; border-radius: 4px; font-size: 11px; font-weight: 600; display: inline-block;">${cleanLimitVal}</span>`;
                }

                // 태그가 있으면 모바일에서 16글자, 없으면 기존대로 20글자로 제한
                let maxLength;
                if (window.innerWidth < 768) {
                    maxLength = (limitVal !== "") ? 16 : 25;
                } else {
                    maxLength = 50;
                }
                
                if (cleanTitle.length > maxLength) {
                    cleanTitle = cleanTitle.substring(0, maxLength) + '...';
                }

                let etcVal = song.etc || '';
                let etcHtml = '';
                
                const maxEtcLength = window.innerWidth < 768 ? 10 : 25;
                
                // etc가 있을 때만 HTML을 생성합니다. 없으면 아예 생성하지 않습니다.
                if (etcVal !== "") {
                    let displayEtc = etcVal;
                    if (displayEtc.length > maxEtcLength) {
                        displayEtc = displayEtc.substring(0, maxEtcLength) + '...';
                    }
                    etcHtml = `<div style="color: #64748b; font-size: 11px; font-weight: 500; margin-top: 2px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;" title="${etcVal}">${displayEtc}</div>`;
                }
                
                tr.innerHTML = `
                    <td>
                        <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 2px; flex-wrap: wrap; padding-left: 4px;">
                            ${limitBadgeHtml}
                            <span style="font-weight: 700; color: #1e293b; font-size: 14px;">${cleanTitle}</span>
                        </div>
                    </td>
                    <td>
                        <!-- justify-content와 align-items를 이용해 etc가 없으면 장르가 자연스럽게 수직 가운데 정렬됩니다 -->
                        <div style="display: flex; flex-direction: column; justify-content: center; min-height: 36px;">
                            <span style="font-weight: 600; color: #0077b6; font-size: 13px; line-height: 1.2;">${song.genre || '-'}</span>
                            ${etcHtml}
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        loadSongbookData();
    </script>
</body>
</html>
