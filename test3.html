<style>
:root{color-scheme:light;--blue:#0284c7;--blue-dark:#0369a1;--blue-pale:#eaf7ff;--line:#dbe7ef;--ink:#233447;--muted:#718096;--paper:#fff;--bg:#f5fbff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body{background:var(--bg);background-image:linear-gradient(180deg,rgba(244,251,255,.95),rgba(255,255,255,.97)),url('Background.png');background-size:cover;background-attachment:fixed}.app{width:min(100%,840px);height:100dvh;min-height:460px;margin:auto;padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}.brand{min-width:0}.title{margin:0;font-size:22px;line-height:1.25;font-weight:850;letter-spacing:-.6px;display:flex;align-items:center;gap:8px}.title button{display:grid;place-items:center;width:27px;height:27px;border:0;background:transparent;color:var(--blue);cursor:pointer;border-radius:8px}.title button:hover{background:var(--blue-pale)}.title svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.summary{margin-top:5px;color:var(--muted);font-size:13px;font-weight:650}.head-actions{display:flex;gap:6px;flex-shrink:0}.btn{border:1px solid var(--line);background:#fff;color:var(--blue-dark);border-radius:10px;padding:8px 11px;font:inherit;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap}.btn:hover{border-color:#7dd3fc;background:#f4fbff}.btn.primary{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}.btn.primary:hover{background:#075985}.search-wrap{position:relative;flex-shrink:0}.search{width:100%;height:45px;padding:0 42px 0 14px;border:1px solid #cbdce8;border-radius:12px;background:#fff;font:inherit;font-size:14px;outline:none}.search:focus{border-color:#38bdf8;box-shadow:0 0 0 3px #e0f2fe}.clear{position:absolute;right:8px;top:7px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#7b8b9c;font-size:18px;cursor:pointer}.genres{display:flex;gap:7px;flex-shrink:0;overflow-x:auto;padding:0 0 2px;scrollbar-width:thin}.genre{border:1px solid var(--line);border-radius:9px;background:#fff;color:#526779;padding:7px 12px;font:inherit;font-size:12px;font-weight:750;white-space:nowrap;cursor:pointer}.genre.active{background:var(--blue-pale);border-color:#7dd3fc;color:var(--blue-dark)}.subtools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}.subtools p{margin:0;font-size:12px;color:var(--muted)}.results{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.94);padding:4px 12px;scrollbar-gutter:stable}.song{padding:12px 2px;border-bottom:1px solid #edf2f7}.song:last-child{border-bottom:0}.song-head{display:flex;align-items:flex-start;gap:9px}.song-info{flex:1;min-width:0;cursor:pointer}.song-title{font-size:14px;font-weight:780;line-height:1.45;overflow-wrap:anywhere}.song-meta{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tag{border-radius:6px;background:#f0f9ff;color:#0369a1;padding:3px 6px;font-size:10px;font-weight:750}.song-tools{display:flex;gap:5px;align-items:center}.mini{border:1px solid var(--line);border-radius:7px;background:#fff;color:#537087;padding:5px 7px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}.song-details{display:none;padding:9px 0 1px 2px;color:#526779;font-size:12px;line-height:1.6}.song.expanded .song-details{display:block}.artist-heading{padding:10px 2px 4px;color:var(--blue-dark);font-size:11px;font-weight:800}.empty,.loading{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}.footer{font-size:10px;text-align:center;color:#94a3b8;flex-shrink:0}.overlay{position:fixed;inset:0;z-index:20;background:rgba(22,40,55,.35);display:none;align-items:center;justify-content:center;padding:16px}.overlay.open{display:flex}.modal{width:min(100%,480px);max-height:min(86dvh,760px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px #19364a24;padding:18px}.modal.wide{width:min(100%,680px)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.modal-head h2{margin:0;font-size:17px}.x{border:0;background:#f1f7fb;color:#597083;border-radius:8px;width:30px;height:30px;font-size:19px;cursor:pointer}.field{display:flex;flex-direction:column;gap:5px;margin:11px 0}.field label{font-size:12px;font-weight:750;color:#526779}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:13px;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#38bdf8}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.formgrid .full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.notice{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7}.recommend-item{padding:10px 0;border-bottom:1px solid #edf2f7;font-size:13px}.turnstile{display:flex;justify-content:center;overflow:hidden;margin:10px 0;min-height:65px}.toast{position:fixed;z-index:40;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;pointer-events:none;max-width:90vw;background:#20384a;color:white;padding:10px 15px;border-radius:10px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.admin-tools{display:none;gap:6px;flex-wrap:wrap;margin:0 0 10px}.admin-on .admin-tools{display:flex}.small-note{font-size:11px;color:#8796a4;line-height:1.5}@media(max-width:540px){.app{padding:11px 10px 9px;gap:10px}.title{font-size:20px}.head-actions{gap:4px}.btn{padding:7px 8px;font-size:11px}.summary{font-size:12px}.results{padding:3px 9px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.song-tools{flex-direction:column;align-items:stretch}.song-tools .mini{padding:5px}.top{align-items:flex-start}}
</style></head>
<body><main class="app" id="app">
<header class="top"><div class="brand"><h1 class="title"><button id="loginOpen" aria-label="관리자 로그인" title="관리자 로그인"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></button>바다비 노래책</h1><div class="summary" id="summary">노래 목록 불러오는 중...</div></div><div class="head-actions"><button class="btn" id="noticeOpen">노래공지</button><button class="btn" id="recommendOpen">추천곡</button></div></header>
<div class="search-wrap"><input id="search" class="search" type="search" autocomplete="off" placeholder="노래 제목 또는 가수 검색"><button class="clear" id="clearSearch" aria-label="검색 지우기" hidden>×</button></div>
<nav class="genres" id="genres" aria-label="장르 필터"><button class="genre active" data-filter="전체">전체</button><button class="genre" data-filter="기타연주">기타연주</button><button class="genre" data-filter="KPOP">KPOP</button><button class="genre" data-filter="JPOP">JPOP</button><button class="genre" data-filter="POP">POP</button><button class="genre" data-filter="그 외">그 외</button></nav>
<div class="subtools"><p id="resultSummary">목록을 불러오는 중입니다.</p><button class="btn" id="filterOpen">상세 필터</button></div>
<section class="results" id="results" aria-live="polite"><div class="loading">노래 목록을 불러오는 중...</div></section>
<div class="admin-tools"><button class="btn primary" id="addOpen">노래 추가</button><button class="btn" id="backupBtn">JSON 백업</button><button class="btn" id="refreshBtn">새로고침</button><button class="btn" id="logoutBtn">로그아웃</button></div>
<footer class="footer">바다비 팬 제작 노래책 · 수정 및 요청은 팬카페에 올려주세요</footer></main>
<div class="overlay" id="noticeModal"><section class="modal"><div class="modal-head"><h2>노래공지</h2><button class="x" data-close="noticeModal">×</button></div><div class="notice" id="noticeText">공지사항이 없습니다.</div><div class="actions"><button class="btn" data-close="noticeModal">닫기</button></div></section></div>
<div class="overlay" id="recommendModal"><section class="modal"><div class="modal-head"><h2>추천곡</h2><button class="x" data-close="recommendModal">×</button></div><div id="recommendList"></div><div class="actions"><button class="btn" data-close="recommendModal">닫기</button></div></section></div>
<div class="overlay" id="filterModal"><section class="modal"><div class="modal-head"><h2>상세 필터</h2><button class="x" data-close="filterModal">×</button></div><div class="field"><label for="countFilter">부른 횟수</label><select id="countFilter"><option value="all">전체</option><option value="0">0회</option><option value="1">1회</option><option value="2">2회</option><option value="3">3회</option><option value="5">5회 이상</option></select></div><div class="field"><label for="dateFilter">최근 부른 날짜</label><select id="dateFilter"><option value="all">전체</option><option value="30">최근 30일</option><option value="90">최근 3개월</option><option value="180">최근 6개월</option><option value="365">최근 1년</option></select></div><div class="field"><label for="monthFilter">월별 기록</label><select id="monthFilter"><option value="all">전체</option></select></div><label style="display:flex;gap:8px;align-items:center;font-size:12px"><input type="checkbox" id="excludeZero"> 부른 횟수 0회 제외</label><div class="actions"><button class="btn" id="filterReset">초기화</button><button class="btn primary" id="filterApply">적용</button></div></section></div>
<div class="overlay" id="authModal"><section class="modal"><div class="modal-head"><h2 id="authTitle">노래책 관리자 로그인</h2><button class="x" data-close="authModal">×</button></div><p class="small-note">관리자 인증이 필요합니다. 비밀번호는 이 페이지에 저장되지 않습니다.</p><div class="field"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력"></div><div class="turnstile"><div id="turnstileWidget"></div></div><p id="authMessage" class="small-note"></p><div class="actions"><button class="btn" data-close="authModal">취소</button><button class="btn primary" id="loginBtn">로그인</button></div></section></div>
<div class="overlay" id="editModal"><section class="modal"><div class="modal-head"><h2 id="editHeading">노래 추가</h2><button class="x" data-close="editModal">×</button></div><form id="songForm"><div class="formgrid"><div class="field"><label for="songTitle">노래 제목 *</label><input id="songTitle" required maxlength="200"></div><div class="field"><label for="songArtist">가수 *</label><input id="songArtist" required maxlength="200"></div><div class="field"><label for="songGenre">장르</label><input id="songGenre" list="genreOptions" placeholder="예: KPOP"><datalist id="genreOptions"><option>KPOP</option><option>JPOP</option><option>POP</option><option>기타연주</option></datalist></div><div class="field"><label for="songLimit">제한/분류</label><select id="songLimit"><option value="">없음</option><option value="기타">기타</option><option value="200개">200개</option><option value="300개">300개</option></select></div><div class="field full"><label for="songEtc">메모</label><textarea id="songEtc" placeholder="선택 입력"></textarea></div></div><p class="small-note">저장 시 Cloudflare Worker에 연결된 songlist 데이터가 변경됩니다.</p><div class="actions"><button type="button" class="btn" data-close="editModal">취소</button><button type="submit" class="btn primary">저장</button></div></form></section></div>
<div class="overlay" id="confirmModal"><section class="modal"><div class="modal-head"><h2>노래 삭제</h2><button class="x" data-close="confirmModal">×</button></div><p id="confirmText">이 노래를 삭제할까요?</p><div class="actions"><button class="btn" data-close="confirmModal">취소</button><button class="btn primary" id="deleteConfirm">삭제</button></div></section></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const WORKER_URL='https://badabi-api.dalkkumli054.workers.dev/';
const TURNSTILE_SITE_KEY='0x4AAAAAAEbQ0YWNiL_WiyKR';
const API={songs:WORKER_URL+'?type=songlist&t=',stats:WORKER_URL+'?type=fansongstats&t='};
let songs=[],songData={},statsData={registeredSongs:[],unregisteredSongs:[],vodSources:[]};
let role='',sessionToken=localStorage.getItem('badabi_session')||'',turnstileToken='',turnstileId=null,editingIndex=-1,deletingIndex=-1;
let activeGenre='전체',filterState={count:'all',date:'all',month:'all',excludeZero:false};
const $=id=>document.getElementById(id);
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2300)}
function openModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id)}));
function norm(s){return String(s??'').normalize('NFKC').toLocaleLowerCase('ko').replace(/[\s\p{P}\p{S}]/gu,'')}
function identity(s){return [norm(s.title),norm(s.artist),norm(s.genre),norm(s.limit)].join('|')}
function datesFor(song){const found=(statsData.registeredSongs||[]).find(x=>identity(x)===identity(song));return Array.isArray(found?.dateTimes)?found.dateTimes:[]}
function countFor(song){return datesFor(song).length}
function parseDate(s){if(!s)return null;const v=String(s).replace(/\(.*?\)/g,'').replace(/\./g,'-').trim();const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
function isGuitar(s){return /기타/.test(String(s.limit||''))||/기타연주/.test(String(s.genre||''))}
function genreMatch(song,g){if(g==='전체')return true;if(g==='기타연주')return isGuitar(song);const genre=String(song.genre||'').toLowerCase();if(g==='KPOP')return /kpop|k-pop|가요|한국/.test(genre);if(g==='JPOP')return /jpop|j-pop|일본/.test(genre);if(g==='POP')return /pop|팝/.test(genre)&&!(/kpop|k-pop|jpop|j-pop/.test(genre));return !isGuitar(song)&&!(/kpop|k-pop|가요|한국|jpop|j-pop|일본|pop|팝/.test(genre))}
function filtered(){const q=norm($('search').value);const now=new Date();return songs.filter(s=>{if(!genreMatch(s,activeGenre))return false;if(q&&!norm(s.title).includes(q)&&!norm(s.artist).includes(q))return false;const c=countFor(s);if(filterState.count==='0'&&c!==0)return false;if(filterState.count==='1'&&c!==1)return false;if(filterState.count==='2'&&c!==2)return false;if(filterState.count==='3'&&c!==3)return false;if(filterState.count==='5'&&c<5)return false;if(filterState.excludeZero&&c===0)return false;const ds=datesFor(s).map(x=>parseDate(typeof x==='string'?x:x?.date)).filter(Boolean);if(filterState.date!=='all'&&(!ds.length||Math.max(...ds.map(d=>d.getTime()))<now.getTime()-Number(filterState.date)*86400000))return false;if(filterState.month!=='all'&&!ds.some(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`===filterState.month))return false;return true}).sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'ko'))}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const list=filtered(),host=$('results');$('resultSummary').textContent=`${list.length.toLocaleString()}곡 표시 중`;$('clearSearch').hidden=!$('search').value;host.innerHTML='';if(!list.length){host.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}const frag=document.createDocumentFragment();let prev='';for(const s of list){const artist=String(s.artist||'아티스트 미상');if(artist!==prev){const h=document.createElement('div');h.className='artist-heading';h.textContent=artist;frag.appendChild(h);prev=artist}const i=songs.indexOf(s),row=document.createElement('article');row.className='song';row.dataset.index=i;const tags=[s.genre,s.limit].filter(Boolean).map(t=>`<span class="tag">${safe(t)}</span>`).join('');row.innerHTML=`<div class="song-head"><div class="song-info" role="button" tabindex="0" aria-expanded="false"><div class="song-title">${safe(s.title||'제목 없음')}</div><div class="song-meta">${safe(artist)} · ${countFor(s)}회</div><div class="tags">${tags}</div></div><div class="song-tools"><button class="mini copy">복사</button>${document.body.classList.contains('admin-on')?'<button class="mini edit">수정</button><button class="mini delete">삭제</button>':''}</div></div><div class="song-details">${s.etc?safe(s.etc)+'<br>':''}부른 기록: ${datesFor(s).map(x=>safe(typeof x==='string'?x:(x.date||''))).filter(Boolean).join(', ')||'기록 없음'}</div>`;const info=row.querySelector('.song-info');const expand=()=>{row.classList.toggle('expanded');info.setAttribute('aria-expanded',row.classList.contains('expanded')?'true':'false')};info.addEventListener('click',expand);info.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();expand()}});row.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(`${s.title||''} - ${artist}`);toast('노래와 가수를 복사했어요.')}catch{toast('복사에 실패했어요.')}};row.querySelector('.edit')?.addEventListener('click',()=>openEdit(i));row.querySelector('.delete')?.addEventListener('click',()=>{deletingIndex=i;$('confirmText').textContent=`“${s.title} - ${artist}” 노래를 삭제할까요?`;openModal('confirmModal')});frag.appendChild(row)}host.appendChild(frag)}
function updateSummary(){const artists=new Set(songs.map(s=>String(s.artist||'').trim()).filter(Boolean));$('summary').textContent=`노래 ${songs.length.toLocaleString()}곡 · 가수 ${artists.size.toLocaleString()}명`}
function refreshMonths(){const select=$('monthFilter'),old=select.value,months=new Set();songs.forEach(s=>datesFor(s).forEach(x=>{const d=parseDate(typeof x==='string'?x:x?.date);if(d)months.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}));select.innerHTML='<option value="all">전체</option>'+[...months].sort().reverse().map(m=>`<option value="${m}">${m.replace('-','년 ')}월</option>`).join('');select.value=[...select.options].some(o=>o.value===old)?old:'all'}
async function load(){ $('results').innerHTML='<div class="loading">노래 목록을 불러오는 중...</div>';try{const [sr,tr]=await Promise.all([fetch(API.songs+Date.now()),fetch(API.stats+Date.now())]);if(!sr.ok)throw Error('노래 목록 서버 응답 오류');const data=await sr.json();songData=data;songs=Array.isArray(data.songs)?data.songs:[];if(tr.ok){const t=await tr.json();statsData={registeredSongs:Array.isArray(t.registeredSongs)?t.registeredSongs:[],unregisteredSongs:Array.isArray(t.unregisteredSongs)?t.unregisteredSongs:[],vodSources:Array.isArray(t.vodSources)?t.vodSources:[]}}$('noticeText').textContent=String(data.notice||'공지사항이 없습니다.');updateSummary();refreshMonths();render();}catch(e){console.error(e);$('results').innerHTML='<div class="empty">노래 목록을 불러오지 못했어요.<br>인터넷 연결을 확인한 뒤 새로고침해 주세요.</div>';toast('데이터를 불러오지 못했어요.')}}
$('search').addEventListener('input',render);$('clearSearch').onclick=()=>{$('search').value='';render();$('search').focus()};$('genres').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;activeGenre=b.dataset.filter;document.querySelectorAll('.genre').forEach(x=>x.classList.toggle('active',x===b));render()});$('filterOpen').onclick=()=>openModal('filterModal');$('filterApply').onclick=()=>{filterState={count:$('countFilter').value,date:$('dateFilter').value,month:$('monthFilter').value,excludeZero:$('excludeZero').checked};closeModal('filterModal');render()};$('filterReset').onclick=()=>{$('countFilter').value='all';$('dateFilter').value='all';$('monthFilter').value='all';$('excludeZero').checked=false;filterState={count:'all',date:'all',month:'all',excludeZero:false};render()};$('noticeOpen').onclick=()=>openModal('noticeModal');$('recommendOpen').onclick=()=>{const chosen=[...songs].sort((a,b)=>countFor(a)-countFor(b)).slice(0,5);$('recommendList').innerHTML=chosen.length?chosen.map((s,i)=>`<div class="recommend-item"><strong>${i+1}. ${safe(s.title)}</strong><div class="song-meta">${safe(s.artist)} · ${countFor(s)}회</div></div>`).join(''):'<p class="small-note">추천할 노래가 없습니다.</p>';openModal('recommendModal')};
function renderTurnstile(){if(!window.turnstile){setTimeout(renderTurnstile,250);return}if(turnstileId!==null)return;try{turnstileId=turnstile.render('#turnstileWidget',{sitekey:TURNSTILE_SITE_KEY,callback:t=>{turnstileToken=t},'expired-callback':()=>{turnstileToken=''},'error-callback':()=>{turnstileToken=''}})}catch(e){console.warn(e)}}
$('loginOpen').onclick=async()=>{if(role){toast(role==='admin'?'총괄관리자로 로그인되어 있어요.':'서브관리자로 로그인되어 있어요.');return}openModal('authModal');renderTurnstile();$('password').focus()};
async function restoreAuth(){if(!sessionToken)return;try{const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'session',sessionToken})});const d=await r.json();if(r.ok&&d.success){role=d.role||d.userRole||'admin';document.body.classList.add('admin-on');render()}else{sessionToken='';localStorage.removeItem('badabi_session')}}catch(e){console.warn('세션 복원 실패',e)}}
$('loginBtn').onclick=async()=>{const password=$('password').value;if(!password){$('authMessage').textContent='비밀번호를 입력해주세요.';return}if(!turnstileToken){$('authMessage').textContent='보안 인증을 완료해주세요.';return}$('loginBtn').disabled=true;$('authMessage').textContent='인증 중...';try{let rateLimitId=localStorage.getItem('badabi_rate_limit_id');if(!rateLimitId){const bytes=crypto.getRandomValues(new Uint8Array(32));rateLimitId=[...bytes].map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('badabi_rate_limit_id',rateLimitId)}const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,turnstileToken:turnstileToken,rateLimitId,action:'verify'})});const d=await r.json();if(!r.ok||!d.success||!d.sessionToken)throw Error(d.message||'로그인에 실패했습니다.');sessionToken=d.sessionToken;role=d.role||d.userRole||'admin';localStorage.setItem('badabi_session',sessionToken);document.body.classList.add('admin-on');closeModal('authModal');$('password').value='';toast(role==='sub_admin'?'서브관리자로 로그인했습니다.':'총괄관리자로 로그인했습니다.');await load();render()}catch(e){$('authMessage').textContent=e.message||'인증에 실패했습니다.';turnstileToken='';if(window.turnstile&&turnstileId!==null)turnstile.reset(turnstileId)}finally{$('loginBtn').disabled=false}};
$('logoutBtn').onclick=async()=>{if(!confirm('로그아웃할까요?'))return;sessionToken='';role='';localStorage.removeItem('badabi_session');document.body.classList.remove('admin-on');render();toast('로그아웃했습니다.')};
function openEdit(i=-1){if(!role){toast('관리자 로그인이 필요합니다.');return}if(role==='sub_admin'){toast('서브관리자는 조회만 가능합니다.');return}editingIndex=i;const s=i>=0?songs[i]:{};$('editHeading').textContent=i>=0?'노래 수정':'노래 추가';$('songTitle').value=s.title||'';$('songArtist').value=s.artist||'';$('songGenre').value=s.genre||'';$('songLimit').value=s.limit||'';$('songEtc').value=s.etc||'';openModal('editModal')}$('addOpen').onclick=()=>openEdit(-1);
async function saveSongs(){const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionToken,action:'save',fileType:'songlist',content:{...songData,songs}})});const d=await r.json().catch(()=>({}));if(r.status===401){sessionToken='';role='';localStorage.removeItem('badabi_session');document.body.classList.remove('admin-on');throw Error('로그인 세션이 만료되었습니다.')}if(!r.ok||d.success===false)throw Error(d.message||'저장에 실패했습니다.');}
$('songForm').onsubmit=async e=>{e.preventDefault();if(role!=='admin'){toast('총괄관리자 권한이 필요합니다.');return}const item={title:$('songTitle').value.trim(),artist:$('songArtist').value.trim(),genre:$('songGenre').value.trim(),limit:$('songLimit').value, ...( $('songEtc').value.trim()?{etc:$('songEtc').value.trim()}:{} )};if(!item.title||!item.artist)return;if(songs.some((s,i)=>i!==editingIndex&&norm(s.title)===norm(item.title)&&norm(s.artist)===norm(item.artist)&&norm(s.genre)===norm(item.genre)&&norm(s.limit)===norm(item.limit))){toast('같은 제목·가수·장르·분류의 노래가 이미 있어요.');return}const before=[...songs];if(editingIndex>=0){const old=songs[editingIndex];songs[editingIndex]={...old,...item}}else songs.push(item);try{await saveSongs();songData.songs=songs;closeModal('editModal');updateSummary();refreshMonths();render();toast(editingIndex>=0?'노래를 수정했습니다.':'노래를 추가했습니다.')}catch(err){songs=before;render();toast(err.message||'저장에 실패했습니다.')}};
$('deleteConfirm').onclick=async()=>{if(role!=='admin'||deletingIndex<0)return;const before=[...songs];songs.splice(deletingIndex,1);try{await saveSongs();songData.songs=songs;closeModal('confirmModal');updateSummary();render();toast('노래를 삭제했습니다.')}catch(e){songs=before;render();toast(e.message||'삭제에 실패했습니다.')}finally{deletingIndex=-1}};
$('backupBtn').onclick=()=>{const blob=new Blob([JSON.stringify(songData,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='songlist.json';a.click();URL.revokeObjectURL(url);toast('songlist.json 백업을 시작했습니다.')};$('refreshBtn').onclick=load;
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(x=>closeModal(x.id))});
load();restoreAuth();
</script></body></html>
