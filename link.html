<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 프로필</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .marine-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(3, 4, 94, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 12px 24px;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #caf0f8;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 16px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #90e0ef;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
            padding: 6px 6px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        .profile-info-card {
            position: relative;
            z-index: 2;
            background: transparent; 
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-sizing: border-box;
        }

        .profile-button-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0; /* 💡 항목 간 간격을 없애고 아래 테두리로 대체 */
            box-sizing: border-box;
            align-items: flex-start;
        }

        /* 💡 체크리스트 느낌의 밑줄과 왼쪽 바가 있는 스타일 */
        .profile-btn {
            background: transparent;
            border: none;
            border-radius: 0;
            /* 체크리스트처럼 항목 아래에 은은한 밑줄 추가 */
            border-bottom: 1px solid rgba(0, 119, 190, 0.15); 
            padding: 18px 0 18px 28px; 
            font-size: 26px;
            font-weight: 700;
            color: #0077b6;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: left;
            box-shadow: none;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            position: relative;
            box-sizing: border-box;
        }

        /* 왼쪽에 있는 세로 바 */
        .profile-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 30px;
            background-color: #0077b6;
            border-radius: 3px;
            transition: background-color 0.2s ease-in-out, height 0.2s ease-in-out;
        }

        /* 마우스 호버 시 효과 */
        .profile-btn:hover {
            color: #03045e;
            transform: translateX(8px);
            border-bottom-color: rgba(3, 4, 94, 0.3); /* 호버 시 밑줄 색상도 살짝 진하게 */
        }

        .profile-btn:hover::before {
            background-color: #03045e;
            height: 36px;
        }

        @media (max-width: 768px) { 
            body { 
                overflow: auto; 
                height: auto; 
            } 
            .ocean-profile-container { 
                height: auto; 
                min-height: auto; 
                padding: 16px; 
            } 
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="marine-nav">
        <div class="nav-container">
            <a href="#" class="nav-logo">BABABI FAN ARCHIVE</a>
            <ul class="nav-links">
                <li><a href="profile.html">프로필</a></li>
                <li><a href="link.html">주소모음</a></li>
            </ul>
        </div>
    </nav>

    <div class="ocean-profile-container">
        <div class="profile-info-card">
            <!-- 링크 영역 -->
            <div class="profile-button-grid" id="button-grid">
                <p style="text-align: center; color: #64748b; font-size: 18px; width: 100%;">링크를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        const GITHUB_LINKS_URL = WORKER_URL + "?type=links&t=";

        async function loadProfileLinks() {
            try {
                const response = await fetch(GITHUB_LINKS_URL + new Date().getTime());
                if (!response.ok) throw new Error("링크 정보를 불러오지 못했습니다.");
                
                const data = await response.json();
                const gridContainer = document.getElementById("button-grid");
                gridContainer.innerHTML = "";

                let links = Array.isArray(data) ? data : [];
                if (links.length === 0 && !Array.isArray(data)) {
                    if (data.broadcast) links.push({ title: "방송국", url: data.broadcast, target: "_blank" });
                    if (data.youtube) links.push({ title: "유튜브", url: data.youtube, target: "_blank" });
                }

                if (links.length === 0) {
                    gridContainer.innerHTML = '<p style="text-align: center; color: #64748b; width: 100%; font-size: 18px;">등록된 링크가 없습니다.</p>';
                    return;
                }

                links.forEach(item => {
                    if (!item.url) return;
                    const a = document.createElement("a");
                    a.href = item.url;
                    a.className = "profile-btn";
                    a.textContent = item.title || item.url;
                    a.target = item.target || "_blank";
                    
                    if (a.target === "_blank") {
                        a.rel = "noopener noreferrer";
                    }
                    
                    gridContainer.appendChild(a);
                });

            } catch (err) {
                document.getElementById("button-grid").innerHTML = `<p style="text-align: center; color: #ef4444; width: 100%; font-size: 18px;">링크 로드 실패</p>`;
            }
        }

        loadProfileLinks();
    </script>
</body>
</html>
