<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 프로필</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        .profile-info-card {
            position: relative;
            z-index: 2;
            background: transparent; 
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-sizing: border-box;
        }

        .profile-button-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .profile-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 119, 190, 0.25);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            color: #0077b6;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 119, 190, 0.05);
            text-decoration: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .profile-btn:hover {
            background: #0077b6;
            color: #ffffff;
            border-color: #0077b6;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 119, 190, 0.25);
        }

        @media (max-width: 768px) {
            body { overflow: auto; height: auto; }
            .ocean-profile-container { height: auto; min-height: 100vh; padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <div class="profile-info-card">
            <!-- links.json 데이터를 받아와 동적으로 생성될 버튼 그리드 영역 -->
            <div class="profile-button-grid" id="button-grid">
                <p style="text-align: center; color: #64748b; font-size: 14px;">링크를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_LINKS_URL = "https://lunaplena0.github.io/links.json";

        async function loadProfileLinks() {
            try {
                const response = await fetch(GITHUB_LINKS_URL + "?t=" + new Date().getTime());
                if (!response.ok) throw new Error("링크 정보를 불러오지 못했습니다.");
                
                const data = await response.json();
                const gridContainer = document.getElementById("button-grid");
                gridContainer.innerHTML = "";

                // 데이터가 배열 형태인지 확인 (객체 형태일 경우 호환 처리 포함)
                let links = Array.isArray(data) ? data : [];
                if (links.length === 0 && !Array.isArray(data)) {
                    if (data.broadcast) links.push({ title: "방송국", url: data.broadcast, target: "_blank" });
                    if (data.youtube) links.push({ title: "유튜브", url: data.youtube, target: "_blank" });
                }

                if (links.length === 0) {
                    gridContainer.innerHTML = '<p style="text-align: center; color: #64748b;">등록된 링크가 없습니다.</p>';
                    return;
                }

                links.forEach(item => {
                    if (!item.url) return;
                    const a = document.createElement("a");
                    a.href = item.url;
                    a.className = "profile-btn";
                    a.textContent = item.title || item.url;
                    a.target = item.target || "_blank";
                    
                    if (a.target === "_blank") {
                        a.rel = "noopener noreferrer";
                    }
                    
                    gridContainer.appendChild(a);
                });

            } catch (err) {
                document.getElementById("button-grid").innerHTML = `<p style="text-align: center; color: #ef4444;">링크 로드 실패</p>`;
            }
        }

        loadProfileLinks();
    </script>
</body>
</html>
