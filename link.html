<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 프로필</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f7f9;
            overflow-x: hidden;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent; 
        }

        /* 오른쪽 프로필 카드 박스 */
        .profile-info-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 119, 190, 0.15);
            border-radius: 12px; 
            padding: 40px;
            box-shadow: 0 20px 45px rgba(0, 119, 190, 0.15);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            color: #2b2d42; 
            box-sizing: border-box;
        }

        /* 세로로 정렬되는 버튼 컨테이너 영역 */
        .profile-button-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        /* 버튼 개별 스타일 */
        .profile-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 119, 190, 0.25);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            color: #0077b6;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 119, 190, 0.05);
            text-decoration: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
        }

        .profile-btn:hover {
            background: #0077b6;
            color: #ffffff;
            border-color: #0077b6;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 119, 190, 0.25);
        }

        /* 모바일 화면 대응 */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .ocean-profile-container {
                height: auto;
                min-height: 100vh;
                padding: 16px;
            }
            .profile-info-card {
                height: auto;
                max-height: none;
                padding: 16px;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <!-- 프로필 카드 영역 (이모티콘이 추가된 세로 버튼 리스트) -->
        <div class="profile-info-card">
            <div class="profile-button-grid">
                <a href="https://badabi.pages.dev/songlist" class="profile-btn">🎤 노래책</a>
                <a href="https://badabi.pages.dev/" class="profile-btn">📁 팬아카이브</a>
                <a href="https://cafe.naver.com/soopbadabi" class="profile-btn">☕ 팬카페</a>
                <a href="https://youtube.com/channel/UCUcnsZ-VzanQT6NSMJ_JlCQ?si=kMa8AhcVNcQ6FyYE" class="profile-btn">📺 유튜브</a>
                <a href="https://x.com/badabi0" class="profile-btn">💬 트위터 (X)</a>
                <a href=https://fancim.me/celeb/profile.aspx?url=695744" class="profile-btn">🎁 팬심선물하기</a>
                <a href="https://www.youtube.com/playlist?list=PLXAKTD3IwZega6TV9p5T_w7R3tRH0Flbl" class="profile-btn">📼 유튜브다시보기</a>
            </div>
        </div>
    </div>

</body>
</html>
