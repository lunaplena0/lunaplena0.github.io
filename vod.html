<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOD - 바다비 팬 아카이브</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;
            color: #334155;
            background: #f8fbff;
        }

        button,
        input,
        select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid #e2e8f0;
        }

        .header-inner {
            width: min(1100px, calc(100% - 32px));
            height: 64px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            flex-shrink: 0;

            display: flex;
            align-items: center;
            gap: 7px;

            color: #0f172a;
            font-size: 16px;
            font-weight: 800;
        }

        .brand-wave {
            color: #0ea5e9;
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .main-nav a {
            padding: 8px 11px;
            border-radius: 9px;

            color: #64748b;
            font-size: 13px;
            font-weight: 700;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .main-nav a:hover {
            color: #0ea5e9;
            background: #f0f9ff;
        }

        .main-nav a.active {
            color: #0284c7;
            background: #e0f2fe;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: min(1000px, calc(100% - 32px));
            margin: 0 auto;
            padding: 54px 0 80px;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading .eyebrow {
            margin-bottom: 7px;

            color: #0ea5e9;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .page-heading h1 {
            margin: 0;

            color: #0f172a;
            font-size: 30px;
            line-height: 1.25;
            font-weight: 850;
        }

        .page-heading p {
            margin: 9px 0 0;

            color: #94a3b8;
            font-size: 13px;
        }

        /* =========================
           TOOLBAR
        ========================= */

        .vod-toolbar {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;

            margin-bottom: 22px;
            padding: 14px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            background: #ffffff;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);

            color: #94a3b8;
            font-size: 20px;
            line-height: 1;

            pointer-events: none;
        }

        #vod-search {
            width: 100%;
            height: 42px;

            padding: 0 14px 0 42px;

            border: 1px solid #e2e8f0;
            border-radius: 11px;

            outline: none;

            color: #334155;
            background: #f8fafc;

            font-size: 13px;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        #vod-search:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        #vod-search::placeholder {
            color: #94a3b8;
        }

        .vod-filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .month-select {
            width: 145px;
            height: 42px;

            padding: 0 12px;

            border: 1px solid #e2e8f0;
            border-radius: 11px;

            outline: none;

            color: #475569;
            background: #f8fafc;

            font-size: 13px;

            cursor: pointer;
        }

        .month-select:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        .result-count {
            flex-shrink: 0;

            margin-left: auto;

            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }

        /* =========================
           VOD LIST
        ========================= */

        .vod-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .vod-card {
            width: 100%;

            padding: 19px 20px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            background: #ffffff;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .vod-card:hover {
            transform: translateY(-1px);

            border-color: #bae6fd;

            box-shadow:
                0 8px 24px rgba(14, 165, 233, 0.08);
        }

        .vod-card-main {
            min-width: 0;
        }

        .vod-date {
            margin-bottom: 6px;

            color: #0ea5e9;
            font-size: 12px;
            font-weight: 800;
        }

        .vod-title {
            margin: 0;

            color: #1e293b;
            font-size: 16px;
            line-height: 1.45;
            font-weight: 800;

            word-break: keep-all;
        }

        .vod-status {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            margin-top: 12px;
        }

        .status-item {
            display: inline-flex;
            align-items: center;

            min-height: 27px;
            padding: 4px 9px;

            border: 1px solid #e2e8f0;
            border-radius: 8px;

            color: #94a3b8;
            background: #f8fafc;

            font-size: 11px;
            font-weight: 700;
        }

        .status-item.on {
            color: #0284c7;
            border-color: #bae6fd;
            background: #f0f9ff;
        }

        .status-item.adult {
            color: #be123c;
            border-color: #fecdd3;
            background: #fff1f2;
        }

        .empty-state {
            padding: 60px 20px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            text-align: center;

            color: #94a3b8;
            background: #ffffff;
        }

        .empty-state strong {
            display: block;

            margin-bottom: 6px;

            color: #64748b;
            font-size: 14px;
        }

        .empty-state span {
            font-size: 12px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2000;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(15, 23, 42, 0.48);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-backdrop.show {
            display: flex;
        }

        .vod-modal {
            position: relative;

            width: min(620px, 100%);
            max-height: min(720px, calc(100vh - 40px));

            overflow-y: auto;

            padding: 26px;

            border-radius: 20px;

            background: #ffffff;

            box-shadow:
                0 24px 70px rgba(15, 23, 42, 0.22);
        }

        .modal-close {
            position: absolute;
            top: 17px;
            right: 17px;

            width: 34px;
            height: 34px;

            border: 0;
            border-radius: 9px;

            color: #64748b;
            background: #f8fafc;

            font-size: 21px;
            line-height: 1;

            cursor: pointer;
        }

        .modal-close:hover {
            background: #f1f5f9;
        }

        .modal-date {
            margin-bottom: 7px;

            color: #0ea5e9;
            font-size: 12px;
            font-weight: 800;
        }

        .modal-title {
            margin: 0 45px 18px 0;

            color: #0f172a;
            font-size: 22px;
            line-height: 1.4;
            font-weight: 850;

            word-break: keep-all;
        }

        .modal-status {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;

            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-section {
            padding-top: 20px;
        }

        .modal-section-title {
            margin-bottom: 9px;

            color: #334155;
            font-size: 13px;
            font-weight: 800;
        }

        .organized-content {
            margin: 0;

            padding: 15px;

            border-radius: 12px;

            color: #475569;
            background: #f8fafc;

            font-size: 13px;
            line-height: 1.75;

            white-space: pre-line;
            word-break: keep-all;
        }

        .official-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 40px;

            padding: 0 15px;

            border-radius: 10px;

            color: #ffffff;
            background: #0ea5e9;

            font-size: 13px;
            font-weight: 800;
        }

        .official-link:hover {
            background: #0284c7;
        }

        .official-link.disabled {
            color: #94a3b8;
            background: #f1f5f9;

            cursor: default;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 28px 16px 38px;

            border-top: 1px solid #e2e8f0;

            text-align: center;

            background: #ffffff;
        }

        .footer-title {
            margin-bottom: 5px;

            color: #64748b;
            font-size: 12px;
            font-weight: 800;
        }

        .footer-text {
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.7;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 720px) {
            .header-inner {
                width: calc(100% - 20px);
                height: auto;

                min-height: 58px;

                padding: 8px 0;

                flex-direction: column;
                align-items: stretch;
                gap: 5px;
            }

            .brand {
                justify-content: center;
            }

            .main-nav {
                width: 100%;

                overflow-x: auto;

                justify-content: flex-start;

                padding-bottom: 2px;

                scrollbar-width: none;
            }

            .main-nav::-webkit-scrollbar {
                display: none;
            }

            .main-nav a {
                flex-shrink: 0;

                padding: 7px 9px;

                font-size: 12px;
            }

            main {
                width: calc(100% - 20px);
                padding: 38px 0 60px;
            }

            .page-heading {
                margin-bottom: 22px;
            }

            .page-heading h1 {
                font-size: 26px;
            }

            .vod-toolbar {
                padding: 12px;
            }

            .vod-filter-row {
                width: 100%;
            }

            .month-select {
                flex: 1;
                width: auto;
            }

            .vod-card {
                padding: 17px;
            }

            .vod-title {
                font-size: 15px;
            }

            .vod-modal {
                padding: 22px 18px;
                border-radius: 17px;
            }

            .modal-title {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="index.html" class="brand">
            <span class="brand-wave">🌊</span>
            <span>바다비 팬 아카이브</span>
        </a>

        <nav class="main-nav">
            <a href="index.html">메인</a>
            <a href="vod.html" class="active">VOD정보</a>
        </nav>

    </div>
</header>


<main>

    <section class="page-heading">
        <div class="eyebrow">VOD ARCHIVE</div>
        <h1>VOD</h1>
        <p>방송 다시보기와 팬이 직접 정리한 내용을 모아두는 공간입니다.</p>
    </section>


    <section class="vod-toolbar">

        <!-- 제목 검색 -->
        <div class="search-box">
            <span class="search-icon">⌕</span>

            <input
                type="search"
                id="vod-search"
                placeholder="VOD 제목 검색"
                autocomplete="off"
            >
        </div>

        <!-- 날짜 검색 -->
        <div class="vod-filter-row">

            <select id="vod-month" class="month-select">
                <option value="">전체 기간</option>
            </select>

            <span class="result-count" id="result-count">
                VOD 0개
            </span>

        </div>

    </section>


    <section id="vod-list" class="vod-list"></section>

</main>


<footer>
    <div class="footer-title">
        바다비 팬 아카이브
    </div>

    <div class="footer-text">
        해당 사이트는 별도의 회원가입을 받지 않으며<br>
        이용자의 개인정보를 수집 · 보관하지 않습니다.
    </div>
</footer>


<!-- =========================
     VOD DETAIL MODAL
========================= -->

<div
    class="modal-backdrop"
    id="vod-modal-backdrop"
    aria-hidden="true"
>
    <div
        class="vod-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
    >

        <button
            type="button"
            class="modal-close"
            id="modal-close"
            aria-label="닫기"
        >
            ×
        </button>

        <div class="modal-date" id="modal-date"></div>

        <h2 class="modal-title" id="modal-title"></h2>

        <div class="modal-status" id="modal-status"></div>

        <div class="modal-section">
            <div class="modal-section-title">
                직접 정리한 내용
            </div>

            <p
                class="organized-content"
                id="modal-content"
            ></p>
        </div>

        <div class="modal-section">

            <div class="modal-section-title">
                공식 VOD
            </div>

            <a
                id="modal-link"
                class="official-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                VOD 보러가기
            </a>

        </div>

    </div>
</div>


<script>
    /* =========================================================
       임시 VOD 데이터
       추후 공식 VOD API + 팬 정리 데이터로 교체
    ========================================================= */

    const VOD_DATA = [
        {
            id: "20261001-001",
            date: "2026-10-01",
            title: "2026.10.01 방송 다시보기",
            url: "#",
            subscribed: true,
            notification: true,
            adultVerified: false,

            organizedContent:
`소통과 노래 중심으로 진행된 방송입니다.

방송 중 팬들과 이야기를 나누었고,
여러 곡을 불렀습니다.

※ 현재 내용은 임시 데이터입니다.`
        },

        {
            id: "20260930-001",
            date: "2026-09-30",
            title: "2026.09.30 방송 다시보기",
            url: "#",
            subscribed: true,
            notification: false,
            adultVerified: false,

            organizedContent:
`소통 및 ASMR 방송.

방송에서 있었던 주요 내용을
나중에 직접 정리할 예정입니다.`
        },

        {
            id: "20260928-001",
            date: "2026-09-28",
            title: "2026.09.28 방송 다시보기",
            url: "#",
            subscribed: false,
            notification: false,
            adultVerified: true,

            organizedContent:
`노래와 기타연주가 포함된 방송입니다.

성인 인증이 필요한 VOD입니다.

※ 현재 내용은 임시 데이터입니다.`
        },

        {
            id: "20260925-001",
            date: "2026-09-25",
            title: "2026.09.25 방송 다시보기",
            url: "#",
            subscribed: true,
            notification: true,
            adultVerified: false,

            organizedContent:
`주말 방송.

소통과 노래 위주로 진행되었습니다.`
        }
    ];


    /* =========================================================
       ELEMENT
    ========================================================= */

    const vodList = document.getElementById("vod-list");
    const vodSearch = document.getElementById("vod-search");
    const vodMonth = document.getElementById("vod-month");
    const resultCount = document.getElementById("result-count");

    const modalBackdrop = document.getElementById("vod-modal-backdrop");
    const modalClose = document.getElementById("modal-close");

    const modalDate = document.getElementById("modal-date");
    const modalTitle = document.getElementById("modal-title");
    const modalStatus = document.getElementById("modal-status");
    const modalContent = document.getElementById("modal-content");
    const modalLink = document.getElementById("modal-link");


    /* =========================================================
       UTILITY
    ========================================================= */

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function formatDate(dateString) {
        const date = new Date(dateString + "T00:00:00");

        if (Number.isNaN(date.getTime())) {
            return dateString;
        }

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}.${month}.${day}`;
    }


    function normalizeSearch(value) {
        return String(value ?? "")
            .toLowerCase()
            .replace(/\s+/g, "");
    }


    /* =========================================================
       MONTH OPTIONS
    ========================================================= */

    function createMonthOptions() {
        const months = [
            ...new Set(
                VOD_DATA.map(vod => vod.date.slice(0, 7))
            )
        ].sort().reverse();

        months.forEach(month => {
            const [year, monthNumber] = month.split("-");

            const option = document.createElement("option");

            option.value = month;
            option.textContent = `${year}년 ${Number(monthNumber)}월`;

            vodMonth.appendChild(option);
        });
    }


    /* =========================================================
       STATUS
    ========================================================= */

    function createStatusHTML(vod) {

        let html = "";

        if (vod.subscribed) {
            html += `
                <span class="status-item on">
                    ✓ 구독+전용
                </span>
            `;
        } else {
            html += `
                <span class="status-item">
                    ○ 일반 VOD
                </span>
            `;
        }


        if (vod.notification) {
            html += `
                <span class="status-item on">
                    ✓ 알림 설정
                </span>
            `;
        } else {
            html += `
                <span class="status-item">
                    ○ 알림 미설정
                </span>
            `;
        }


        if (vod.adultVerified) {
            html += `
                <span class="status-item adult">
                    ✓ 성인 인증
                </span>
            `;
        } else {
            html += `
                <span class="status-item">
                    ○ 성인 인증 없음
                </span>
            `;
        }

        return html;
    }


    /* =========================================================
       RENDER
    ========================================================= */

    function renderVODList() {

        const searchValue = normalizeSearch(
            vodSearch.value
        );

        const selectedMonth = vodMonth.value;


        const filtered = VOD_DATA
            .filter(vod => {

                const titleMatch =
                    !searchValue ||
                    normalizeSearch(vod.title)
                        .includes(searchValue);

                const monthMatch =
                    !selectedMonth ||
                    vod.date.startsWith(selectedMonth);

                return titleMatch && monthMatch;
            })
            .sort((a, b) => {
                return b.date.localeCompare(a.date);
            });


        resultCount.textContent =
            `VOD ${filtered.length}개`;


        if (filtered.length === 0) {

            vodList.innerHTML = `
                <div class="empty-state">
                    <strong>검색 결과가 없습니다.</strong>
                    <span>
                        다른 제목이나 기간으로 검색해보세요.
                    </span>
                </div>
            `;

            return;
        }


        vodList.innerHTML = filtered.map(vod => {

            return `
                <article
                    class="vod-card"
                    data-id="${escapeHTML(vod.id)}"
                    tabindex="0"
                    role="button"
                    aria-label="${escapeHTML(vod.title)} 상세보기"
                >

                    <div class="vod-card-main">

                        <div class="vod-date">
                            ${escapeHTML(formatDate(vod.date))}
                        </div>

                        <h2 class="vod-title">
                            ${escapeHTML(vod.title)}
                        </h2>

                        <div class="vod-status">
                            ${createStatusHTML(vod)}
                        </div>

                    </div>

                </article>
            `;

        }).join("");


        document
            .querySelectorAll(".vod-card")
            .forEach(card => {

                card.addEventListener("click", () => {
                    openVODModal(card.dataset.id);
                });

                card.addEventListener("keydown", event => {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {
                        event.preventDefault();

                        openVODModal(card.dataset.id);
                    }

                });

            });
    }


    /* =========================================================
       MODAL
    ========================================================= */

    function openVODModal(id) {

        const vod = VOD_DATA.find(
            item => item.id === id
        );

        if (!vod) {
            return;
        }


        modalDate.textContent =
            formatDate(vod.date);

        modalTitle.textContent =
            vod.title;

        modalStatus.innerHTML =
            createStatusHTML(vod);

        modalContent.textContent =
            vod.organizedContent || "정리된 내용이 없습니다.";


        if (
            vod.url &&
            vod.url !== "#"
        ) {

            modalLink.href = vod.url;

            modalLink.classList.remove("disabled");

            modalLink.textContent =
                "VOD 보러가기";

            modalLink.target = "_blank";

        } else {

            modalLink.href = "#";

            modalLink.classList.add("disabled");

            modalLink.textContent =
                "VOD 링크 준비 중";

            modalLink.removeAttribute("target");
        }


        modalBackdrop.classList.add("show");

        modalBackdrop.setAttribute(
            "aria-hidden",
            "false"
        );

        document.body.style.overflow = "hidden";
    }


    function closeVODModal() {

        modalBackdrop.classList.remove("show");

        modalBackdrop.setAttribute(
            "aria-hidden",
            "true"
        );

        document.body.style.overflow = "";
    }


    /* =========================================================
       EVENTS
    ========================================================= */

    vodSearch.addEventListener(
        "input",
        renderVODList
    );


    vodMonth.addEventListener(
        "change",
        renderVODList
    );


    modalClose.addEventListener(
        "click",
        closeVODModal
    );


    modalBackdrop.addEventListener(
        "click",
        event => {

            if (
                event.target === modalBackdrop
            ) {
                closeVODModal();
            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape" &&
                modalBackdrop.classList.contains("show")
            ) {
                closeVODModal();
            }

        }
    );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    createMonthOptions();
    renderVODList();

</script>

</body>
</html>
