<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOD - 바다비 팬 아카이브</title>
    <meta name="description" content="바다비 팬 아카이브 VOD">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;
            color: #334155;
            background: #f8fbff;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .container {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
        }

        /* =========================
           Header
        ========================= */

        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(226, 232, 240, 0.9);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
        }

        .top-header-inner {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-weight: 800;
            color: #334155;
            white-space: nowrap;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: #e0f2fe;
            font-size: 18px;
        }

        .brand-text {
            font-size: 15px;
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-nav a {
            padding: 8px 11px;
            border-radius: 9px;
            color: #64748b;
            font-size: 13px;
            font-weight: 700;
            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .top-nav a:hover {
            background: #f0f9ff;
            color: #0284c7;
        }

        .top-nav a.active {
            background: #e0f2fe;
            color: #0284c7;
        }

        /* =========================
           Main
        ========================= */

        main {
            padding: 54px 0 80px;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            color: #0284c7;
            font-size: 12px;
            font-weight: 800;
        }

        .page-heading h1 {
            margin: 0;
            color: #1e293b;
            font-size: 30px;
            line-height: 1.3;
            letter-spacing: -0.03em;
        }

        .page-heading p {
            margin: 8px 0 0;
            color: #94a3b8;
            font-size: 13px;
        }

        /* =========================
           Toolbar
        ========================= */

        .vod-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            padding: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .search-box input {
            width: 100%;
            height: 42px;
            padding: 0 14px 0 40px;
            border: 1px solid #e2e8f0;
            border-radius: 11px;
            outline: none;
            color: #334155;
            background: #f8fafc;
            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .search-box input:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
        }

        .month-select {
            width: 145px;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #e2e8f0;
            border-radius: 11px;
            outline: none;
            color: #475569;
            background: #f8fafc;
        }

        .result-count {
            flex-shrink: 0;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* =========================
           VOD List
        ========================= */

        .vod-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .vod-card {
            overflow: hidden;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.035);
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;
        }

        .vod-card:hover {
            transform: translateY(-2px);
            border-color: #bae6fd;
            box-shadow: 0 10px 28px rgba(14, 165, 233, 0.08);
        }

        .vod-card-main {
            width: 100%;
        }

        .vod-content {
            min-width: 0;
            padding: 22px 24px;
        }

        .vod-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 7px;
        }

        .vod-tag {
            display: inline-flex;
            align-items: center;
            min-height: 23px;
            padding: 0 8px;
            border-radius: 7px;
            color: #0369a1;
            background: #e0f2fe;
            font-size: 10px;
            font-weight: 800;
        }

        .vod-tag.gray {
            color: #64748b;
            background: #f1f5f9;
        }

        .vod-title {
            margin: 0;
            color: #1e293b;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .vod-description {
            margin: 7px 0 14px;
            color: #64748b;
            font-size: 13px;
            white-space: pre-line;
        }

        .vod-status {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .status-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-height: 28px;
            padding: 0 9px;
            border-radius: 8px;
            background: #f8fafc;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
        }

        .status-item.on {
            color: #0369a1;
            background: #eff6ff;
        }

        .status-item.warning {
            color: #b45309;
            background: #fffbeb;
        }

        .vod-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vod-button {
            height: 36px;
            padding: 0 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 9px;
            color: #ffffff;
            background: #0ea5e9;
            font-size: 12px;
            font-weight: 800;
        }

        .vod-button:hover {
            background: #0284c7;
        }

        .detail-button {
            height: 36px;
            padding: 0 13px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            color: #64748b;
            background: #ffffff;
            font-size: 12px;
            font-weight: 800;
        }

        .detail-button:hover {
            border-color: #bae6fd;
            color: #0284c7;
            background: #f8fdff;
        }

        /* =========================
           Empty
        ========================= */

        .empty {
            display: none;
            padding: 70px 20px;
            border: 1px dashed #cbd5e1;
            border-radius: 18px;
            text-align: center;
            color: #94a3b8;
            background: #ffffff;
        }

        .empty-icon {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .empty-title {
            color: #64748b;
            font-size: 14px;
            font-weight: 800;
        }

        .empty-text {
            margin-top: 3px;
            font-size: 12px;
        }

        /* =========================
           Detail Modal
        ========================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
        }

        .modal-backdrop.open {
            display: flex;
        }

        .vod-modal {
            width: min(760px, 100%);
            max-height: min(820px, calc(100vh - 40px));
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.2);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 18px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-header h2 {
            margin: 0;
            color: #1e293b;
            font-size: 17px;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border: 0;
            border-radius: 9px;
            color: #64748b;
            background: #f1f5f9;
            font-size: 22px;
            line-height: 1;
        }

        .modal-close:hover {
            color: #334155;
            background: #e2e8f0;
        }

        .modal-body {
            overflow-y: auto;
            max-height: calc(100vh - 150px);
            padding: 20px;
        }

        .detail-info h3 {
            margin: 0 0 5px;
            color: #1e293b;
            font-size: 21px;
        }

        .detail-date {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
        }

        .detail-status {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 14px;
        }

        .detail-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
        }

        .detail-section-title {
            margin-bottom: 10px;
            color: #334155;
            font-size: 13px;
            font-weight: 800;
        }

        .detail-text {
            white-space: pre-line;
            color: #64748b;
            font-size: 13px;
        }

        .official-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
            height: 38px;
            padding: 0 14px;
            border-radius: 9px;
            color: #ffffff;
            background: #0ea5e9;
            font-size: 12px;
            font-weight: 800;
        }

        .official-link:hover {
            background: #0284c7;
        }

        /* =========================
           Footer
        ========================= */

        footer {
            padding: 28px 0 35px;
            border-top: 1px solid #e7eef5;
            background: #ffffff;
        }

        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 11px;
        }

        .footer-title {
            color: #64748b;
            font-weight: 800;
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 800px) {

            .container {
                width: min(100% - 28px, 1120px);
            }

            .top-header-inner {
                min-height: 62px;
            }

            .brand-text {
                font-size: 14px;
            }

            .top-nav {
                gap: 2px;
                overflow-x: auto;
                scrollbar-width: none;
            }

            .top-nav::-webkit-scrollbar {
                display: none;
            }

            .top-nav a {
                padding: 7px 8px;
                font-size: 11px;
                white-space: nowrap;
            }

            main {
                padding: 38px 0 60px;
            }

            .page-heading h1 {
                font-size: 26px;
            }

            .vod-toolbar {
                flex-wrap: wrap;
            }

            .search-box {
                flex-basis: 100%;
            }

            .month-select {
                flex: 1;
                width: auto;
            }

            .result-count {
                margin-left: auto;
            }

            .vod-content {
                padding: 18px;
            }

            .vod-title {
                font-size: 17px;
            }

            .vod-actions {
                width: 100%;
            }

            .vod-button,
            .detail-button {
                flex: 1;
            }

            .footer-inner {
                flex-direction: column;
                gap: 7px;
                text-align: center;
            }
        }

        @media (max-width: 430px) {

            .brand-text {
                display: none;
            }

            .vod-status {
                gap: 5px;
            }

            .status-item {
                font-size: 10px;
                padding: 0 7px;
            }

            .modal-backdrop {
                padding: 10px;
            }

            .vod-modal {
                border-radius: 16px;
            }

            .modal-body {
                padding: 15px;
            }
        }
    </style>
</head>

<script>

/* =========================================================
   임시 VOD 데이터

   현재는 HTML 내부에 직접 저장합니다.
   나중에 API 연동 시 이 부분을 API 데이터로 교체합니다.
========================================================= */

const VOD_DATA = [

    {
        id: "20261001-001",

        date: "2026-10-01",

        title: "2026.10.01 방송 다시보기",

        url: "#",

        adultVerified: false,

여러 곡을 불렀습니다.

    },


    {
        id: "20260930-001",

        date: "2026-09-30",

        title: "2026.09.30 방송 다시보기",

        url: "#",

        subscribed: true,

        notification: false,

        adultVerified: false,

        organizedContent:
`소통 및 ASMR 방송.

방송에서 있었던 주요 내용을
나중에 직접 정리할 예정입니다.`
    },


    {
        id: "20260928-001",

        date: "2026-09-28",

        title: "2026.09.28 방송 다시보기",

        url: "#",

        subscribed: false,

        notification: false,

        adultVerified: true,

        organizedContent:
`노래와 기타연주가 포함된 방송입니다.

성인 인증이 필요한 VOD입니다.

※ 현재 내용은 임시 데이터입니다.`
    },


    {
        id: "20260925-001",

        date: "2026-09-25",

        title: "2026.09.25 방송 다시보기",

        url: "#",

        subscribed: true,

        notification: true,

        adultVerified: false,

        organizedContent:
`주말 방송.

소통과 노래 위주로 진행되었습니다.`
    }

];


/* =========================================================
   DOM
========================================================= */

const vodList =
    document.getElementById("vod-list");

const vodEmpty =
    document.getElementById("vod-empty");

const vodSearch =
    document.getElementById("vod-search");

const vodMonth =
    document.getElementById("vod-month");

const resultCount =
    document.getElementById("result-count");

const modalBackdrop =
    document.getElementById("vod-modal-backdrop");

const modalClose =
    document.getElementById("vod-modal-close");

const modalTitle =
    document.getElementById("vod-modal-title");

const modalBody =
    document.getElementById("vod-modal-body");


/* =========================================================
   날짜 표시
========================================================= */

function formatDate(dateString) {

    const parts =
        dateString.split("-");

    if (parts.length !== 3) {
        return dateString;
    }

    return `${parts[0]}.${parts[1]}.${parts[2]}`;
}


/* =========================================================
   HTML 안전 처리
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   월 목록
========================================================= */

function createMonthOptions() {

    const months = [
        ...new Set(
            VOD_DATA.map(vod =>
                vod.date.slice(0, 7)
            )
        )
    ].sort().reverse();


    months.forEach(month => {

        const option =
            document.createElement("option");

        option.value = month;

        const [
            year,
            monthNumber
        ] = month.split("-");

        option.textContent =
            `${year}년 ${Number(monthNumber)}월`;

        vodMonth.appendChild(option);

    });
}


/* =========================================================
   상태 표시
========================================================= */

function createStatusHTML(vod) {

    let html = "";


    if (vod.subscribed) {

        html += `
            <span class="status-item on">
                ✓ 구독
            </span>
        `;

    } else {

        html += `
            <span class="status-item">
                ○ 미구독
            </span>
        `;

    }


    if (vod.notification) {

        html += `
            <span class="status-item on">
                🔔 알림 설정
            </span>
        `;

    } else {

        html += `
            <span class="status-item">
                🔕 알림 미설정
            </span>
        `;

    }


    if (vod.adultVerified) {

        html += `
            <span class="status-item warning">
                🔞 성인 인증
            </span>
        `;

    } else {

        html += `
            <span class="status-item">
                일반 VOD
            </span>
        `;

    }


    return html;
}


/* =========================================================
   VOD 목록 출력
========================================================= */

function renderVODList() {

    const keyword =
        vodSearch.value
            .trim()
            .toLowerCase();

    const month =
        vodMonth.value;


    const filtered =
        VOD_DATA
            .filter(vod => {

                const matchesKeyword =
                    !keyword ||
                    vod.title
                        .toLowerCase()
                        .includes(keyword);


                const matchesMonth =
                    !month ||
                    vod.date.startsWith(month);


                return (
                    matchesKeyword &&
                    matchesMonth
                );

            })
            .sort((a, b) =>
                b.date.localeCompare(a.date)
            );


    vodList.innerHTML = "";


    resultCount.textContent =
        `VOD ${filtered.length}개`;


    if (!filtered.length) {

        vodEmpty.style.display =
            "block";

        return;
    }


    vodEmpty.style.display =
        "none";


    filtered.forEach(vod => {

        const card =
            document.createElement("article");

        card.className =
            "vod-card";


        const firstLine =
            vod.organizedContent
                ? vod.organizedContent
                    .split("\n")
                    .find(line => line.trim())
                : "";


        card.innerHTML = `

            <div class="vod-card-main">

                <div class="vod-content">

                    <div class="vod-meta">

                        <span class="vod-tag">
                            📺 VOD
                        </span>

                        <span class="vod-tag gray">
                            ${escapeHTML(
                                formatDate(vod.date)
                            )}
                        </span>

                        ${
                            vod.adultVerified
                                ? `
                                    <span class="vod-tag gray">
                                        🔞 성인 인증
                                    </span>
                                  `
                                : ""
                        }

                    </div>


                    <h2 class="vod-title">
                        ${escapeHTML(vod.title)}
                    </h2>


                    <p class="vod-description">
                        ${
                            firstLine
                                ? escapeHTML(firstLine)
                                : "직접 정리한 내용이 없습니다."
                        }
                    </p>


                    <div class="vod-status">
                        ${createStatusHTML(vod)}
                    </div>


                    <div class="vod-actions">

                        <button
                            type="button"
                            class="detail-button"
                            data-detail-id="${escapeHTML(vod.id)}"
                        >
                            자세히 보기
                        </button>


                        ${
                            vod.url &&
                            vod.url !== "#"
                                ? `
                                    <a
                                        class="vod-button"
                                        href="${escapeHTML(vod.url)}"
                                        target="_blank"
                                        rel="noopener"
                                    >
                                        공식 VOD 보기 →
                                    </a>
                                  `
                                : `
                                    <button
                                        type="button"
                                        class="vod-button"
                                        disabled
                                        style="
                                            opacity:0.5;
                                            cursor:default;
                                        "
                                    >
                                        공식 VOD 준비 중
                                    </button>
                                  `
                        }

                    </div>

                </div>

            </div>
        `;


        vodList.appendChild(card);

    });


    document
        .querySelectorAll("[data-detail-id]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const id =
                        button.dataset.detailId;

                    const vod =
                        VOD_DATA.find(item =>
                            item.id === id
                        );


                    if (vod) {
                        openVODModal(vod);
                    }

                }
            );

        });

}


/* =========================================================
   VOD 상세 팝업
========================================================= */

function openVODModal(vod) {

    modalTitle.textContent =
        vod.title;


    modalBody.innerHTML = `

        <div class="detail-info">

            <h3>
                ${escapeHTML(vod.title)}
            </h3>


            <div class="detail-date">
                방송 날짜 ·
                ${escapeHTML(
                    formatDate(vod.date)
                )}
            </div>


            <div class="detail-status">
                ${createStatusHTML(vod)}
            </div>


            ${
                vod.organizedContent
                    ? `
                        <section class="detail-section">

                            <div class="detail-section-title">
                                📝 직접 정리한 내용
                            </div>


                            <div class="detail-text">
                                ${escapeHTML(
                                    vod.organizedContent
                                )}
                            </div>

                        </section>
                      `
                    : ""
            }


            ${
                vod.url &&
                vod.url !== "#"
                    ? `
                        <a
                            class="official-link"
                            href="${escapeHTML(vod.url)}"
                            target="_blank"
                            rel="noopener"
                        >
                            공식 VOD 보러가기 →
                        </a>
                      `
                    : ""
            }

        </div>

    `;


    modalBackdrop.classList.add("open");

    modalBackdrop.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.style.overflow =
        "hidden";
}


/* =========================================================
   팝업 닫기
========================================================= */

function closeVODModal() {

    modalBackdrop.classList.remove("open");

    modalBackdrop.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.style.overflow = "";
}


/* =========================================================
   이벤트
========================================================= */

vodSearch.addEventListener(
    "input",
    renderVODList
);


vodMonth.addEventListener(
    "change",
    renderVODList
);


modalClose.addEventListener(
    "click",
    closeVODModal
);


modalBackdrop.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modalBackdrop
        ) {
            closeVODModal();
        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {
            closeVODModal();
        }

    }
);


/* =========================================================
   초기화
========================================================= */

createMonthOptions();

renderVODList();

</script>

</body>
</html>
