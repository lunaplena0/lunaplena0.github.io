<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <title>VOD - 바다비 팬 아카이브</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;
            color: #334155;
            background: #f8fbff;
        }

        button,
        input,
        select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           상단 헤더 - 2번 파일과 동일
        ========================================================= */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid #e7eef5;
        }

        .header-inner {
            height: 68px;

            display: flex;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-weight: 800;
            color: #0f172a;
        }

        .brand-text {
            font-size: 17px;
        }

        .main-nav {
            margin-left: auto;

            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-nav a {
            padding: 8px 11px;

            border-radius: 9px;

            color: #64748b;

            font-size: 12px;
            font-weight: 700;

            transition: background 0.2s ease, color 0.2s ease;
        }

        .main-nav a:hover {
            background: #f0f9ff;
            color: #0284c7;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: min(1000px, calc(100% - 32px));

            margin: 0 auto;

            padding: 54px 0 80px;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading .eyebrow {
            margin-bottom: 7px;

            color: #0ea5e9;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 0.08em;
        }

        .page-heading h1 {
            margin: 0;

            color: #0f172a;

            font-size: 30px;
            line-height: 1.25;
            font-weight: 850;
        }

        .page-heading p {
            margin: 9px 0 0;

            color: #94a3b8;

            font-size: 13px;
        }


        /* =========================
           TOOLBAR
        ========================= */

        .vod-toolbar {
            display: flex;
            flex-direction: column;

            align-items: stretch;

            gap: 10px;

            margin-bottom: 22px;
            padding: 14px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            background: #ffffff;
        }

        .search-box {
            position: relative;

            width: 100%;
        }

        .search-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 20px;
            line-height: 1;

            pointer-events: none;
        }

        #vod-search {
            width: 100%;
            height: 42px;

            padding: 0 14px 0 42px;

            border: 1px solid #e2e8f0;
            border-radius: 11px;

            outline: none;

            color: #334155;
            background: #f8fafc;

            font-size: 13px;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        #vod-search:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        #vod-search::placeholder {
            color: #94a3b8;
        }

        .vod-filter-row {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .month-select,
        .tag-select {
            height: 42px;

            padding: 0 12px;

            border: 1px solid #e2e8f0;
            border-radius: 11px;

            outline: none;

            color: #475569;
            background: #f8fafc;

            font-size: 13px;

            cursor: pointer;
        }

        .month-select {
            width: 145px;
        }

        .tag-select {
            width: 145px;
        }

        .month-select:focus,
        .tag-select:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        .result-count {
            flex-shrink: 0;

            margin-left: auto;

            color: #94a3b8;

            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }


        /* =========================
           VOD LIST
        ========================= */

        .vod-list {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .vod-card {
            width: 100%;

            padding: 19px 20px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            background: #ffffff;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .vod-card:hover {
            transform: translateY(-1px);

            border-color: #bae6fd;

            box-shadow:
                0 8px 24px rgba(14, 165, 233, 0.08);
        }

        .vod-card-main {
            min-width: 0;
        }

        .vod-date {
            margin-bottom: 6px;

            color: #0ea5e9;

            font-size: 12px;
            font-weight: 800;
        }

        .vod-title {
            margin: 0;

            color: #1e293b;

            font-size: 16px;
            line-height: 1.45;
            font-weight: 800;

            word-break: keep-all;
        }


        /* =========================
           STATUS
        ========================= */

        .vod-status {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            margin-top: 12px;
        }

        .status-item {
            display: inline-flex;

            align-items: center;

            min-height: 27px;

            padding: 4px 9px;

            border: 1px solid #e2e8f0;
            border-radius: 8px;

            color: #94a3b8;
            background: #f8fafc;

            font-size: 11px;
            font-weight: 700;
        }

        /* 구독+전용 노란색 */

        .status-item.subscription {
            color: #a16207;

            border-color: #fde68a;

            background: #fef9c3;
        }

        /* 성인 인증 */

        .status-item.adult {
            color: #be123c;

            border-color: #fecdd3;

            background: #fff1f2;
        }


        /* =========================
           TAGS
        ========================= */

        .vod-tags {
            display: flex;
            flex-wrap: wrap;
            align-items: center;

            gap: 6px;

            margin-top: 8px;
        }

        .vod-tag {
            display: inline-flex;
            align-items: center;

            min-height: 25px;

            padding: 3px 9px;

            border: 1px solid #dbeafe;
            border-radius: 7px;

            color: #64748b;
            background: #f8fafc;

            font-size: 11px;
            font-weight: 700;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty-state {
            padding: 60px 20px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            text-align: center;

            color: #94a3b8;

            background: #ffffff;
        }

        .empty-state strong {
            display: block;

            margin-bottom: 6px;

            color: #64748b;

            font-size: 14px;
        }

        .empty-state span {
            font-size: 12px;
        }


        /* =========================================================
           FOOTER - 2번 파일과 동일
        ========================================================= */
        footer {
            padding: 14px 0 16px;
            border-top: 1px solid #e7eef5;
            background: #ffffff;
        }

        .footer-inner {
            width: min(1000px, calc(100% - 32px));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 11px;
        }

        .footer-title {
            color: #64748b;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 720px) {

            .header-inner {
                width: calc(100% - 20px);

                height: auto;
                min-height: 58px;

                padding: 8px 0;

                flex-direction: column;

                align-items: stretch;

                gap: 5px;
            }

            .brand {
                justify-content: center;
            }

            .main-nav {
                width: 100%;

                overflow-x: auto;

                justify-content: center;

                padding-bottom: 2px;

                scrollbar-width: none;
            }

            .main-nav::-webkit-scrollbar {
                display: none;
            }

            .main-nav a {
                flex-shrink: 0;

                padding: 7px 13px;

                font-size: 12px;
            }

            main {
                width: calc(100% - 20px);

                padding: 38px 0 60px;
            }

            .page-heading {
                margin-bottom: 22px;
            }

            .page-heading h1 {
                font-size: 26px;
            }

            .vod-toolbar {
                padding: 12px;
            }

            .vod-filter-row {
                width: 100%;
            }

            .month-select,
            .tag-select {
                flex: 1;

                width: auto;
            }

            .vod-card {
                padding: 17px;
            }

            .vod-bottom-row {
                align-items: flex-end;
            }

            .vod-direct-link {
                margin-left: auto;
            }

            .vod-title {
                font-size: 15px;
            }

            .vod-modal {
                padding: 22px 18px;

                border-radius: 17px;
            }

            .modal-title {
                font-size: 19px;
            }
        }

        .modal-tags {
            align-items: center;
        }

        .vod-card-main {
            position: relative;
        }

        .admin-recommend-badge {
            display: inline-flex;
            align-items: center;
            margin-top: 7px;
            padding: 4px 8px;
            border: 1px solid #fde68a;
            border-radius: 7px;
            color: #a16207;
            background: #fef9c3;
            font-size: 10px;
            font-weight: 800;
        }

        .vod-description {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.5;
            font-weight: 500;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            word-break: keep-all;
        }

        .admin-edit-button {
            position: absolute;
            top: 0;
            right: 0;
            margin-top: 0;
        }

        .admin-edit-button + * {
            margin-top: 0;
        }

        .admin-login-button {
            padding: 8px 11px;
            border: 1px solid #bae6fd;
            border-radius: 9px;
            color: #0284c7;
            background: #f0f9ff;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }
        .admin-login-button.authenticated { color:#047857; background:#ecfdf5; border-color:#a7f3d0; }
        .admin-edit-button { margin-top:12px; padding:8px 12px; border:1px solid #bae6fd; border-radius:9px; color:#0284c7; background:#f0f9ff; font-size:12px; font-weight:800; cursor:pointer; }
        .vod-bottom-row {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin-top:8px;
        }
        .vod-bottom-row .vod-tags {
            flex:1;
            min-width:0;
            margin-top:0;
        }
        .vod-direct-link {
            flex-shrink:0;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-height:34px;
            padding:0 12px;
            border:1px solid #0ea5e9;
            border-radius:9px;
            color:#ffffff;
            background:#0ea5e9;
            font-size:12px;
            font-weight:800;
            cursor:pointer;
            white-space:nowrap;
        }
        .vod-direct-link:hover { background:#0284c7; border-color:#0284c7; }
        .vod-admin-toolbar {
            display:flex;
            justify-content:flex-end;
            margin-top:10px;
        }
        .vod-add-button {
            min-height:40px;
            padding:0 14px;
            border:1px solid #0ea5e9;
            border-radius:10px;
            color:#fff;
            background:#0ea5e9;
            font-size:13px;
            font-weight:800;
            cursor:pointer;
        }
        .vod-add-button:hover { background:#0284c7; border-color:#0284c7; }
        .admin-delete-button {
            margin-top:12px;
            margin-left:6px;
            padding:8px 12px;
            border:1px solid #fecaca;
            border-radius:9px;
            color:#dc2626;
            background:#fff1f2;
            font-size:12px;
            font-weight:800;
            cursor:pointer;
        }
        .admin-delete-button:hover { background:#ffe4e6; border-color:#fda4af; }
        .admin-modal-backdrop { position:fixed; inset:0; z-index:3000; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(15,23,42,.48); backdrop-filter:blur(4px); }
        .admin-modal-backdrop.show { display:flex; }
        .admin-modal { position:relative; width:min(520px,100%); max-height:calc(100vh - 40px); overflow:auto; padding:30px; border:1px solid rgba(14,165,233,.12); border-radius:22px; background:#fff; box-shadow:0 28px 80px rgba(15,23,42,.24); }
        .admin-auth-modal { width:min(440px,100%); padding:30px; }
        .admin-auth-hero { display:flex; align-items:center; gap:14px; margin-bottom:18px; padding:14px; border:1px solid #e0f2fe; border-radius:15px; background:linear-gradient(135deg,#f0f9ff,#f8fafc); }
        .admin-auth-icon { display:flex; align-items:center; justify-content:center; flex:0 0 46px; width:46px; height:46px; border-radius:13px; background:#0ea5e9; color:#fff; font-size:22px; box-shadow:0 8px 18px rgba(14,165,233,.2); }
        .admin-auth-hero-title { color:#0f172a; font-size:14px; font-weight:850; }
        .admin-auth-hero-text { margin-top:3px; color:#64748b; font-size:11px; line-height:1.5; }
        .admin-auth-label { display:block; margin:0 0 7px; color:#475569; font-size:12px; font-weight:800; }
        .admin-auth-submit { width:100%; margin-top:2px; min-height:44px; }
        .admin-auth-status { text-align:center; }
        .admin-logout-modal { width:min(420px,100%); text-align:center; }
        .admin-logout-icon { display:flex; align-items:center; justify-content:center; width:52px; height:52px; margin:0 auto 14px; border-radius:15px; background:#f0f9ff; color:#0284c7; font-size:23px; }
        .admin-logout-actions { display:flex; justify-content:center; gap:8px; margin-top:20px; }
        .admin-toast { position:fixed; left:50%; bottom:26px; z-index:5000; transform:translate(-50%,16px); opacity:0; pointer-events:none; min-width:180px; max-width:calc(100vw - 32px); padding:12px 16px; border:1px solid rgba(14,165,233,.18); border-radius:12px; background:rgba(15,23,42,.94); color:#fff; box-shadow:0 12px 35px rgba(15,23,42,.22); font-size:13px; font-weight:800; text-align:center; transition:opacity .22s ease, transform .22s ease; }
        .admin-toast.show { opacity:1; transform:translate(-50%,0); }
        .admin-edit-modal { width:min(650px,100%); }
        .admin-modal-close { position:absolute; top:16px; right:16px; width:34px; height:34px; border:0; border-radius:9px; background:#f8fafc; color:#64748b; font-size:21px; cursor:pointer; }
        .admin-modal-title { margin-right:40px; color:#0f172a; font-size:20px; font-weight:850; }
        .admin-modal-subtitle { margin:6px 0 18px; color:#94a3b8; font-size:12px; line-height:1.6; }
        .admin-turnstile { min-height:65px; margin-bottom:8px; }
        .admin-password-row { display:flex; gap:7px; margin-bottom:10px; }
        .admin-input { width:100%; min-width:0; height:42px; padding:0 12px; border:1px solid #e2e8f0; border-radius:10px; outline:none; color:#334155; background:#f8fafc; font-size:13px; }
        .admin-textarea { height:auto; min-height:92px; padding:11px 12px; resize:vertical; line-height:1.65; }
        .admin-input:focus { border-color:#7dd3fc; background:#fff; }
        .admin-action-button,.admin-primary-button,.admin-secondary-button { min-height:42px; padding:0 14px; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer; }
        .admin-action-button,.admin-secondary-button { border:1px solid #e2e8f0; color:#64748b; background:#f8fafc; }
        .admin-primary-button { border:1px solid #0ea5e9; color:#fff; background:#0ea5e9; }
        .admin-status { min-height:20px; margin-top:10px; color:#ef4444; font-size:12px; line-height:1.5; }
        .admin-edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
        .admin-field { display:flex; flex-direction:column; gap:6px; }
        .admin-field > span { color:#475569; font-size:12px; font-weight:800; }
        .admin-field-full { grid-column:1 / -1; }
        .admin-check-row { display:flex; flex-direction:row; align-items:center; gap:9px; padding:11px 12px; border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; color:#475569; font-size:13px; font-weight:800; cursor:pointer; }
        .admin-check-row input { width:17px; height:17px; margin:0; accent-color:#0ea5e9; }
        .admin-edit-actions { display:flex; justify-content:space-between; gap:8px; margin-top:18px; }
        .admin-edit-actions-right { display:flex; justify-content:flex-end; gap:8px; margin-left:auto; }
        .admin-modal-delete-button { min-height:40px; padding:0 13px; border:1px solid #fecaca; border-radius:10px; color:#dc2626; background:#fff1f2; font-size:13px; font-weight:800; cursor:pointer; }
        .admin-modal-delete-button:hover { background:#ffe4e6; border-color:#fda4af; }
        .admin-archive-login { border:0; background:none; text-align:left; cursor:pointer; }
        .admin-archive-login:hover { opacity:.82; }
        @media(max-width:720px){ .admin-edit-grid{grid-template-columns:1fr}.admin-field-full{grid-column:auto}.admin-modal{padding:22px 18px;border-radius:17px}.main-nav{overflow-x:auto} }
        /* =========================================================
           관리자 로그인/로그아웃 팝업 - 2번 파일과 동일
        ========================================================= */
        .vod-admin-auth-backdrop,
        .vod-admin-logout-backdrop {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15,23,42,.48);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .vod-admin-auth-backdrop.show,
        .vod-admin-logout-backdrop.show { display:flex; }

        .vod-admin-auth-modal,
        .vod-admin-logout-backdrop .admin-logout-modal {
            position: relative;
            width: min(440px,100%);
            max-height: calc(100vh - 40px);
            overflow: auto;
            padding: 30px;
            border: 1px solid rgba(14,165,233,.12);
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 28px 80px rgba(15,23,42,.24);
        }
        .vod-admin-logout-backdrop .admin-logout-modal {
            width: min(420px,100%);
            text-align: center;
        }
        .vod-admin-auth-modal .admin-modal-close,
        .vod-admin-logout-backdrop .admin-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 9px;
            background: #f8fafc;
            color: #64748b;
            font-size: 21px;
            cursor: pointer;
        }
        .vod-admin-auth-modal .admin-modal-close:hover,
        .vod-admin-logout-backdrop .admin-modal-close:hover {
            background:#f1f5f9;
            color:#334155;
        }
        .admin-auth-hero {
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:18px;
            padding:14px;
            border:1px solid #e0f2fe;
            border-radius:15px;
            background:linear-gradient(135deg,#f0f9ff,#f8fafc);
        }
        .admin-auth-icon {
            display:flex;
            align-items:center;
            justify-content:center;
            flex:0 0 46px;
            width:46px;
            height:46px;
            border-radius:13px;
            background:#0ea5e9;
            color:#fff;
            font-size:22px;
            box-shadow:0 8px 18px rgba(14,165,233,.2);
        }
        .admin-auth-hero-title { color:#0f172a; font-size:14px; font-weight:850; }
        .vod-admin-auth-modal .admin-modal-title,
        .vod-admin-logout-backdrop .admin-modal-title {
            margin-right:40px;
            color:#0f172a;
            font-size:20px;
            font-weight:850;
        }
        .admin-modal-subtitle {
            margin:6px 0 18px;
            color:#94a3b8;
            font-size:12px;
            line-height:1.6;
        }
        .admin-auth-label {
            display:block;
            margin:0 0 7px;
            color:#475569;
            font-size:12px;
            font-weight:800;
        }
        .vod-admin-auth-modal .admin-password-row {
            display:flex;
            gap:7px;
            margin-bottom:10px;
        }
        .vod-admin-auth-modal .admin-input {
            width:100%;
            min-width:0;
            height:42px;
            padding:0 12px;
            border:1px solid #e2e8f0;
            border-radius:10px;
            outline:none;
            color:#334155;
            background:#f8fafc;
            font-size:13px;
        }
        .vod-admin-auth-modal .admin-input:focus {
            border-color:#7dd3fc;
            background:#fff;
        }
        .vod-admin-auth-modal .admin-turnstile {
            min-height:65px;
            margin-bottom:8px;
            margin-top:0;
        }
        .admin-auth-submit {
            width:100%;
            margin-top:2px;
            min-height:44px;
        }
        .admin-primary-button,
        .admin-secondary-button {
            min-height:42px;
            padding:0 14px;
            border-radius:10px;
            font-size:13px;
            font-weight:800;
            cursor:pointer;
        }
        .admin-secondary-button {
            border:1px solid #e2e8f0;
            color:#64748b;
            background:#f8fafc;
        }
        .admin-primary-button {

<script>

    /* =========================================================
       VOD DATA — Worker에서 fanvodlist.json 불러오기
    ========================================================= */

    const WORKER_URL =
        "https://badabi-api.dalkkumli054.workers.dev/";

    const FANVODLIST_URL =
        WORKER_URL + "?type=fanvodlist&t=";

    const TURNSTILE_SITE_KEY =
        "0x4AAAAAAEbQ0YWNiL_WiyKR";

    let VOD_DATA = [];


    async function loadVODData() {

        vodList.innerHTML = `
            <div class="empty-state">
                <strong>VOD 정보를 불러오는 중입니다.</strong>
                <span>잠시만 기다려주세요.</span>
            </div>
        `;

        try {

            const response =
                await fetch(
                    FANVODLIST_URL + Date.now(),
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error("VOD 데이터 요청 실패");
            }

            const data =
                await response.json();

            const vods =
                Array.isArray(data)
                    ? data
                    : Array.isArray(data?.vods)
                        ? data.vods
                        : Array.isArray(data?.content?.vods)
                            ? data.content.vods
                            : [];

            /*
             * fanvodlist.json 구조:
             * date / title / link / duration /
             * subPlus / adult / description / category
             * + todayRecommend
             *
             * description은 영상의 간단한 설명입니다.
             */
            VOD_DATA =
                vods.map((vod, index) => {

                    const tags =
                        String(vod.category || "")
                            .split(",")
                            .map(tag => tag.trim())
                            .filter(Boolean);

                    return {
                        id:
                            String(vod.link || "")
                                .trim() ||
                            `${String(vod.date || "vod")}-${index}`,

                        date:
                            String(vod.date || "").trim(),

                        title:
                            String(vod.title || "제목 없음").trim(),

                        url:
                            String(vod.link || vod.url || "").trim(),

                        duration:
                            String(vod.duration || "").trim(),

                        subscribed:
                            String(vod.subPlus || "").toUpperCase() === "Y",

                        adultVerified:
                            String(vod.adult || "").toUpperCase() === "Y",

                        tags,

                        description:
                            String(vod.description || "").trim(),

                        todayRecommend:
                            vod.todayRecommend === true ||
                            String(vod.todayRecommend || "").toUpperCase() === "Y" ||
                            String(vod.todayRecommend || "").toLowerCase() === "TRUE",

                        raw:
                            { ...vod }
                    };

                });

            createMonthOptions();
            createTagOptions();
            renderVODList();

        } catch (error) {

            console.error(
                "fanvodlist.json 불러오기 실패:",
                error
            );

            VOD_DATA = [];

            resultCount.textContent =
                "VOD 0개";

            vodList.innerHTML = `
                <div class="empty-state">
                    <strong>VOD 정보를 불러오지 못했습니다.</strong>
                    <span>잠시 후 다시 시도해주세요.</span>
                </div>
            `;

        }

    }


    /* =========================================================
       ELEMENT
    ========================================================= */

    const vodList =
        document.getElementById("vod-list");

    const vodSearch =
        document.getElementById("vod-search");

    const vodMonth =
        document.getElementById("vod-month");

    const vodTag =
        document.getElementById("vod-tag");

    const resultCount =
        document.getElementById("result-count");



    /* =========================================================
       ADMIN AUTH / EDITOR
    ========================================================= */

    const adminLoginButton = document.getElementById("admin-login-button");
    const adminAuthBackdrop = document.getElementById("admin-auth-backdrop");
    const adminAuthClose = document.getElementById("admin-auth-close");
    const adminLogoutBackdrop = document.getElementById("admin-logout-backdrop");
    const adminLogoutClose = document.getElementById("admin-logout-close");
    const adminLogoutCancel = document.getElementById("admin-logout-cancel");
    const adminLogoutConfirm = document.getElementById("admin-logout-confirm");
    const adminToast = document.getElementById("admin-toast");
    const adminPasswordInput = document.getElementById("vod-admin-password");
    const adminLoginSubmit = document.getElementById("admin-login-submit");
    const adminLoginStatus = document.getElementById("admin-login-status");
    const vodTurnstile = document.getElementById("vod-turnstile");
    const vodEditBackdrop = document.getElementById("vod-edit-backdrop");
    const vodEditClose = document.getElementById("vod-edit-close");
    const vodEditCancel = document.getElementById("vod-edit-cancel");
    const vodEditSave = document.getElementById("vod-edit-save");
    const vodEditDelete = document.getElementById("vod-edit-delete");
    const vodEditStatus = document.getElementById("vod-edit-status");
    const vodAdminToolbar = document.getElementById("vod-admin-toolbar");
    const vodAddButton = document.getElementById("vod-add-button");
    const editVodDate = document.getElementById("edit-vod-date");
    const editVodTitle = document.getElementById("edit-vod-title");
    const editVodTags = document.getElementById("edit-vod-tags");
    const editVodDescription = document.getElementById("edit-vod-description");
    const editVodTodayRecommend = document.getElementById("edit-vod-today-recommend");

    let isAdminAuthenticated = false;
    let adminSessionToken = localStorage.getItem("badabi_session") || "";
    let adminUserRole = "";
    let turnstileToken = "";
    let turnstileWidgetId = null;
    let editingVodId = "";
    let isAddingVod = false;

    function getRateLimitId() {
        let id = localStorage.getItem("badabi_rate_limit_id");
        if (id) return id;
        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        id = Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
        localStorage.setItem("badabi_rate_limit_id", id);
        return id;
    }

    function getAdminRoleName(role) {
        return role === "admin" ? "총괄관리자" : role === "sub_admin" ? "테스트관리자" : "관리자";
    }

    function resetTurnstile() {
        turnstileToken = "";
        if (window.turnstile && turnstileWidgetId !== null) {
            try { window.turnstile.reset(turnstileWidgetId); } catch (_) {}
        }
    }

    function renderTurnstile() {
        if (!window.turnstile || !vodTurnstile) return;
        try {
            if (turnstileWidgetId !== null) window.turnstile.remove(turnstileWidgetId);
            turnstileWidgetId = window.turnstile.render(vodTurnstile, {
                sitekey: TURNSTILE_SITE_KEY,
                callback: token => { turnstileToken = token || ""; },
                "expired-callback": resetTurnstile,
                "timeout-callback": resetTurnstile,
                theme: "auto"
            });
        } catch (error) {
            console.error("Turnstile 렌더링 실패:", error);
        }
    }

    function waitForTurnstile() {
        if (window.turnstile) { renderTurnstile(); return; }
        let count = 0;
        const timer = setInterval(() => {
            if (window.turnstile) { clearInterval(timer); renderTurnstile(); }
            else if (++count >= 50) clearInterval(timer);
        }, 100);
    }

    function openAdminAuthModal() {
        if (isAdminAuthenticated) {
            openAdminLogoutModal();
            return;
        }
        adminLoginStatus.textContent = "";
        adminPasswordInput.value = "";
        adminAuthBackdrop.classList.add("show");
        adminAuthBackdrop.setAttribute("aria-hidden", "false");
        waitForTurnstile();
        setTimeout(() => adminPasswordInput.focus(), 50);
    }

    function closeAdminAuthModal() {
        adminAuthBackdrop.classList.remove("show");
        adminAuthBackdrop.setAttribute("aria-hidden", "true");
        if (!isAdminAuthenticated) resetTurnstile();
    }

    function openAdminLogoutModal() {
        adminLogoutBackdrop.classList.add("show");
        adminLogoutBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeAdminLogoutModal() {
        adminLogoutBackdrop.classList.remove("show");
        adminLogoutBackdrop.setAttribute("aria-hidden", "true");
    }

    function showAdminToast(message) {
        adminToast.textContent = message;
        adminToast.classList.add("show");
        clearTimeout(showAdminToast.timer);
        showAdminToast.timer = setTimeout(() => adminToast.classList.remove("show"), 2200);
    }

    function updateAdminAuthUI() {
        adminLoginButton.classList.toggle("authenticated", isAdminAuthenticated);
        adminLoginButton.textContent = "VOD ARCHIVE";
        adminLoginButton.setAttribute("aria-label", isAdminAuthenticated ? "관리자 로그아웃" : "관리자 로그인");
        vodAdminToolbar.hidden = !(isAdminAuthenticated && adminUserRole === "admin");
        renderVODList();
    }

    async function verifyAdminPassword() {
        const password = adminPasswordInput.value.trim();
        if (!password) { adminLoginStatus.textContent = "패스워드를 입력해주세요."; return; }
        if (!turnstileToken) { adminLoginStatus.textContent = "보안 인증을 완료해주세요."; return; }
        adminLoginStatus.style.color = "#0284c7";
        adminLoginStatus.textContent = "확인 중...";
        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password, turnstileToken, rateLimitId: getRateLimitId(), action: "verify" })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success || !data.sessionToken) throw new Error(data.error || "인증 실패");
            adminSessionToken = data.sessionToken;
            adminUserRole = data.role || "";
            isAdminAuthenticated = true;
            localStorage.setItem("badabi_session", adminSessionToken);
            resetTurnstile();
            closeAdminAuthModal();
            updateAdminAuthUI();
        } catch (error) {
            adminLoginStatus.style.color = "#ef4444";
            adminLoginStatus.textContent = error.message || "로그인에 실패했습니다.";
            resetTurnstile();
            adminPasswordInput.value = "";
        }
    }

    async function restoreAdminAuthentication() {
        if (!adminSessionToken) { updateAdminAuthUI(); return; }
        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sessionToken: adminSessionToken, action: "verify" })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success || !data.role) throw new Error();
            adminUserRole = data.role;
            isAdminAuthenticated = true;
        } catch (_) {
            adminSessionToken = "";
            adminUserRole = "";
            isAdminAuthenticated = false;
            localStorage.removeItem("badabi_session");
        }
        updateAdminAuthUI();
    }

    function logoutAdmin() {
        isAdminAuthenticated = false;
        adminSessionToken = "";
        adminUserRole = "";
        localStorage.removeItem("badabi_session");
        resetTurnstile();
        closeAdminAuthModal();
        closeAdminLogoutModal();
        closeVODEditModal();
        updateAdminAuthUI();
        showAdminToast("로그아웃되었습니다.");
    }

    function openVODAddModal() {
        if (!isAdminAuthenticated || adminUserRole !== "admin") return;
        isAddingVod = true;
        editingVodId = "";
        editVodDate.value = new Date().toISOString().slice(0, 10);
        editVodTitle.value = "";
        editVodTags.value = "";
        editVodDescription.value = "";
        editVodTodayRecommend.checked = false;
        vodEditStatus.textContent = "";
        vodEditBackdrop.querySelector(".admin-modal-title").textContent = "VOD 추가";
        vodEditBackdrop.querySelector(".admin-modal-subtitle").textContent = "새 VOD 정보를 입력합니다.";
        vodEditDelete.hidden = true;
        editVodDate.readOnly = false;
        editVodTitle.readOnly = false;
        if (!document.getElementById("edit-vod-link")) {
            const label = document.createElement("label");
            label.className = "admin-field admin-field-full";
            label.innerHTML = '<span>VOD 링크</span><input id="edit-vod-link" class="admin-input" placeholder="https://...">';
            editVodTags.parentElement.insertBefore(label, editVodTags.parentElement.children[2]);
        }
        document.getElementById("edit-vod-link").value = "";
        vodEditBackdrop.classList.add("show");
        vodEditBackdrop.setAttribute("aria-hidden", "false");
    }

    function openVODEditModal(id) {
        if (!isAdminAuthenticated) { openAdminAuthModal(); return; }
        if (adminUserRole !== "admin") {
            alert("현재 Worker 권한 설정에서는 테스트관리자는 VOD를 수정할 수 없습니다.");
            return;
        }
        const vod = VOD_DATA.find(item => item.id === id);
        if (!vod) return;
        isAddingVod = false;
        editingVodId = id;
        editVodDate.value = vod.date || "";
        editVodTitle.value = vod.title || "";
        editVodTags.value = Array.isArray(vod.tags) ? vod.tags.join(", ") : "";
        editVodDescription.value = vod.description || "";
        editVodTodayRecommend.checked = !!vod.todayRecommend;
        if (document.getElementById("edit-vod-link")) document.getElementById("edit-vod-link").value = vod.url || "";
        vodEditBackdrop.querySelector(".admin-modal-title").textContent = "VOD 관리";
        vodEditBackdrop.querySelector(".admin-modal-subtitle").textContent = "영상 설명과 오늘의 VOD 추천 여부를 설정합니다.";
        editVodDate.readOnly = true;
        editVodTitle.readOnly = true;
        vodEditDelete.hidden = false;
        vodEditStatus.textContent = "";
        vodEditBackdrop.classList.add("show");
        vodEditBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeVODEditModal() {
        vodEditBackdrop.classList.remove("show");
        vodEditBackdrop.setAttribute("aria-hidden", "true");
        editingVodId = "";
        isAddingVod = false;
        vodEditDelete.hidden = true;
    }

    async function saveFanVodList() {
        if (!isAdminAuthenticated || !adminSessionToken) throw new Error("로그인 세션이 없습니다. 다시 로그인해주세요.");
        if (adminUserRole !== "admin") throw new Error("총괄관리자만 VOD 정보를 저장할 수 있습니다.");
        const vods = VOD_DATA.map(vod => {
            const { timeline, ...rawWithoutTimeline } = vod.raw || {};

            return {
                ...rawWithoutTimeline,
                date: vod.date,
                title: vod.title,
                link: vod.url,
                duration: vod.duration,
                subPlus: vod.subscribed ? "Y" : "N",
                adult: vod.adultVerified ? "Y" : "N",
                description: vod.description || "",
                category: Array.isArray(vod.tags) ? vod.tags.join(", ") : "",
                todayRecommend: !!vod.todayRecommend
            };
        });
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionToken: adminSessionToken, action: "save", fileType: "fanvodlist", content: { vods } })
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
            logoutAdmin();
            throw new Error("로그인 세션이 만료되었습니다. 다시 로그인해주세요.");
        }
        if (!response.ok) throw new Error(data.error || "VOD 저장에 실패했습니다.");
    }

    async function deleteVOD(id) {
        if (!isAdminAuthenticated || adminUserRole !== "admin") return;
        const index = VOD_DATA.findIndex(item => item.id === id);
        if (index < 0) return;
        const vod = VOD_DATA[index];
        if (!confirm(`「${vod.title}」 VOD를 삭제할까요?\n삭제 후 저장하면 되돌릴 수 없습니다.`)) return;
        const backup = VOD_DATA.slice();
        VOD_DATA.splice(index, 1);
        try {
            await saveFanVodList();
            createMonthOptions();
            createTagOptions();
            renderVODList();
        } catch (error) {
            VOD_DATA = backup;
            renderVODList();
            alert(error.message || "VOD 삭제에 실패했습니다.");
        }
    }


    async function saveVODEdit() {
        if (adminUserRole !== "admin") return;
        vodEditSave.disabled = true;
        vodEditStatus.style.color = "#0284c7";
        vodEditStatus.textContent = "저장 중...";
        try {
            if (isAddingVod) {
                const link = document.getElementById("edit-vod-link").value.trim();
                const date = editVodDate.value.trim();
                const title = editVodTitle.value.trim();
                if (!date || !title || !link) throw new Error("날짜, 제목, VOD 링크를 모두 입력해주세요.");
                const tags = editVodTags.value.split(",").map(tag => tag.trim()).filter(Boolean);
                VOD_DATA.push({
                    id: link || `${date}-${Date.now()}`,
                    date, title, url: link, duration: "",
                    subscribed: false, adultVerified: false, tags,
                    description: editVodDescription.value.trim(),
                    todayRecommend: editVodTodayRecommend.checked,
                    raw: { date, title, link, duration: "", subPlus: "N", adult: "N", description: editVodDescription.value.trim(), category: tags.join(", ") }
                });
            } else {
                const vod = VOD_DATA.find(item => item.id === editingVodId);
                if (!vod) return;
                vod.tags = editVodTags.value.split(",").map(tag => tag.trim()).filter(Boolean);
                vod.description = editVodDescription.value.trim();
                vod.todayRecommend = editVodTodayRecommend.checked;
            }
            await saveFanVodList();
            vodEditStatus.style.color = "#059669";
            vodEditStatus.textContent = "저장되었습니다.";
            createMonthOptions();
            createTagOptions();
            renderVODList();
            setTimeout(closeVODEditModal, 400);
        } catch (error) {
            vodEditStatus.style.color = "#ef4444";
            vodEditStatus.textContent = error.message || "저장에 실패했습니다.";
        } finally {
            vodEditSave.disabled = false;
        }
    }

    /* =========================================================
       UTILITY
    ========================================================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(dateString) {

        const date =
            new Date(dateString + "T00:00:00");

        if (Number.isNaN(date.getTime())) {
            return dateString;
        }

        const year =
            date.getFullYear();

        const month =
            String(date.getMonth() + 1)
                .padStart(2, "0");

        const day =
            String(date.getDate())
                .padStart(2, "0");

        return `${year}.${month}.${day}`;

    }


    function normalizeSearch(value) {

        return String(value ?? "")
            .toLowerCase()
            .replace(/\s+/g, "");

    }


    /* =========================================================
       MONTH OPTIONS
    ========================================================= */

    function createMonthOptions() {

        const currentValue = vodMonth.value;
        vodMonth.innerHTML = '<option value="">전체 기간</option>';

        const months = [
            ...new Set(
                VOD_DATA.map(
                    vod => vod.date.slice(0, 7)
                )
            )
        ]
        .sort()
        .reverse();


        months.forEach(month => {

            const [
                year,
                monthNumber
            ] = month.split("-");


            const option =
                document.createElement("option");


            option.value =
                month;


            option.textContent =
                `${year}년 ${Number(monthNumber)}월`;


            vodMonth.appendChild(option);

        });

        if ([...vodMonth.options].some(option => option.value === currentValue)) {
            vodMonth.value = currentValue;
        }

    }


    /* =========================================================
       TAG OPTIONS
    ========================================================= */

    function createTagOptions() {

        const currentValue = vodTag.value;
        vodTag.innerHTML = '<option value="">전체 태그</option>';

        const tags = [
            ...new Set(
                VOD_DATA.flatMap(
                    vod => Array.isArray(vod.tags)
                        ? vod.tags
                        : []
                )
            )
        ]
        .sort();


        tags.forEach(tag => {

            const option =
                document.createElement("option");


            option.value =
                tag;


            option.textContent =
                tag;


            vodTag.appendChild(option);

        });

        if ([...vodTag.options].some(option => option.value === currentValue)) {
            vodTag.value = currentValue;
        }

    }


    /* =========================================================
       STATUS
    ========================================================= */

    function createStatusHTML(vod) {

        let html = "";


        /* 구독+전용 */

        if (vod.subscribed) {

            html += `
                <span class="status-item subscription">
                    ✓ 구독+전용
                </span>
            `;

        } else {

            html += `
                <span class="status-item">
                    ○ 일반 VOD
                </span>
            `;

        }


        /* 성인 인증 */

        if (vod.adultVerified) {

            html += `
                <span class="status-item adult">
                    ✓ 성인 인증
                </span>
            `;

        } else {

            html += `
                <span class="status-item">
                    ○ 성인 인증 없음
                </span>
            `;

        }


        return html;

    }


    /* =========================================================
       TAG HTML
    ========================================================= */

    function createTagsHTML(tags) {

        if (
            !Array.isArray(tags) ||
            tags.length === 0
        ) {
            return "";
        }


        return tags.map(tag => {

            return `
                <span class="vod-tag">
                    #${escapeHTML(tag)}
                </span>
            `;

        }).join("");

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function renderVODList() {

        const searchValue =
            normalizeSearch(
                vodSearch.value
            );


        const selectedMonth =
            vodMonth.value;


        const selectedTag =
            vodTag.value;


        const filtered =
            VOD_DATA

                .filter(vod => {

                    /* 제목 */

                    const titleMatch =
                        !searchValue ||
                        normalizeSearch(vod.title)
                            .includes(searchValue);


                    /* 월 */

                    const monthMatch =
                        !selectedMonth ||
                        vod.date.startsWith(
                            selectedMonth
                        );


                    /* 태그 */

                    const tagMatch =
                        !selectedTag ||
                        (
                            Array.isArray(vod.tags) &&
                            vod.tags.includes(
                                selectedTag
                            )
                        );


                    return (
                        titleMatch &&
                        monthMatch &&
                        tagMatch
                    );

                })

                .sort((a, b) => {

                    return b.date.localeCompare(
                        a.date
                    );

                });


        resultCount.textContent =
            `VOD ${filtered.length}개`;


        if (filtered.length === 0) {

            vodList.innerHTML = `
                <div class="empty-state">

                    <strong>
                        검색 결과가 없습니다.
                    </strong>

                    <span>
                        다른 제목, 기간 또는 태그로 검색해보세요.
                    </span>

                </div>
            `;

            return;
        }


        vodList.innerHTML =
            filtered.map(vod => {

                return `
                    <article
                        class="vod-card"
                        data-id="${escapeHTML(vod.id)}"
                    >

                        <div class="vod-card-main">

                            <div class="vod-date">
                                ${escapeHTML(
                                    formatDate(vod.date)
                                )}
                            </div>


                            <h2 class="vod-title">
                                ${escapeHTML(vod.title)}
                            </h2>

                            ${vod.description ? `
                                <div class="vod-description">
                                    ${escapeHTML(vod.description)}
                                </div>
                            ` : ""}

                            ${isAdminAuthenticated && vod.todayRecommend ? `
                                <div class="admin-recommend-badge">오늘의 VOD 추천</div>
                            ` : ""}


                            <!-- 구독 + 성인 인증 -->

                            <div class="vod-status">
                                ${createStatusHTML(vod)}
                            </div>


                            <div class="vod-bottom-row">
                                <div class="vod-tags">
                                    ${createTagsHTML(vod.tags)}
                                </div>

                                ${vod.url && vod.url !== "#" ? `
                                    <a class="vod-direct-link" href="${escapeHTML(vod.url)}" target="_blank" rel="noopener noreferrer">해당 VOD로 이동</a>
                                ` : ""}
                            </div>

                            ${isAdminAuthenticated && adminUserRole === "admin" ? `
                                <button type="button" class="admin-edit-button" data-edit-id="${escapeHTML(vod.id)}">편집</button>
                            ` : ""}

                        </div>

                    </article>
                `;

            })
            .join("");


    }


    /* =========================================================
       EVENTS
    ========================================================= */

    vodList.addEventListener("click", event => {
        const editButton = event.target.closest(".admin-edit-button");
        if (editButton) {
            event.preventDefault();
            event.stopPropagation();
            openVODEditModal(editButton.dataset.editId);
            return;
        }
    });


    vodSearch.addEventListener(
        "input",
        renderVODList
    );


    vodMonth.addEventListener(
        "change",
        renderVODList
    );


    vodTag.addEventListener(
        "change",
        renderVODList
    );


    document.addEventListener(
        "keydown",
        event => {
            if (event.key !== "Escape") return;
            if (adminAuthBackdrop.classList.contains("show")) closeAdminAuthModal();
            if (adminLogoutBackdrop.classList.contains("show")) closeAdminLogoutModal();
            if (vodEditBackdrop.classList.contains("show")) closeVODEditModal();
        }
    );

    adminLoginButton.addEventListener("click", openAdminAuthModal);
    adminAuthClose.addEventListener("click", closeAdminAuthModal);
    adminAuthBackdrop.addEventListener("click", event => { if (event.target === adminAuthBackdrop) closeAdminAuthModal(); });
    adminLogoutClose.addEventListener("click", closeAdminLogoutModal);
    adminLogoutCancel.addEventListener("click", closeAdminLogoutModal);
    adminLogoutConfirm.addEventListener("click", logoutAdmin);
    adminLogoutBackdrop.addEventListener("click", event => { if (event.target === adminLogoutBackdrop) closeAdminLogoutModal(); });
    adminLoginSubmit.addEventListener("click", verifyAdminPassword);
    adminPasswordInput.addEventListener("keydown", event => { if (event.key === "Enter") verifyAdminPassword(); });
    vodEditClose.addEventListener("click", closeVODEditModal);
    vodEditCancel.addEventListener("click", closeVODEditModal);
    vodEditSave.addEventListener("click", saveVODEdit);
    vodEditDelete.addEventListener("click", async () => {
        if (!editingVodId || isAddingVod) return;
        const id = editingVodId;
        closeVODEditModal();
        await deleteVOD(id);
    });
    vodAddButton.addEventListener("click", openVODAddModal);
    vodEditBackdrop.addEventListener("click", event => { if (event.target === vodEditBackdrop) closeVODEditModal(); });


    /* =========================================================
       INITIALIZE
    ========================================================= */
    loadVODData();
    restoreAdminAuthentication();
</script>

</body>
