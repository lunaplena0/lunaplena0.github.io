<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOD - 바다비 팬 아카이브</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;
            color: #334155;
            background: #f8fbff;
        }

        button,
        input,
        select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================================================
           상단 헤더
        ========================================================= */

        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid #e7eef5;
        }

        .top-header-inner {
            width: min(1180px, calc(100% - 32px));
            height: 68px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: #0f172a;
        }

        .brand-text {
            font-size: 17px;
        }

        .top-nav {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-nav a {
            padding: 8px 11px;
            border-radius: 9px;
            color: #64748b;
            font-size: 12px;
            font-weight: 700;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .top-nav a:hover {
            background: #f0f9ff;
            color: #0284c7;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: min(1000px, calc(100% - 32px));

            margin: 0 auto;

            padding: 54px 0 80px;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading .eyebrow {
            margin-bottom: 7px;

            color: #0ea5e9;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 0.08em;
        }

        .page-heading h1 {
            margin: 0;

            color: #0f172a;

            font-size: 30px;
            line-height: 1.25;
            font-weight: 850;
        }

        .page-heading p {
            margin: 9px 0 0;

            color: #94a3b8;

            font-size: 13px;
        }


        /* =========================
           TOOLBAR
        ========================= */

        .vod-toolbar {
            display: flex;
            flex-direction: column;

            align-items: stretch;

            gap: 10px;

            margin-bottom: 22px;
            padding: 14px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            background: #ffffff;
        }

        .search-box {
            position: relative;

            width: 100%;
        }

        .search-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 20px;
            line-height: 1;

            pointer-events: none;
        }

        #vod-search {
            width: 100%;
            height: 42px;

            padding: 0 14px 0 42px;

            border: 1px solid #e2e8f0;
            border-radius: 11px;

            outline: none;

            color: #334155;
            background: #f8fafc;

            font-size: 13px;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        #vod-search:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        #vod-search::placeholder {
            color: #94a3b8;
        }

        .vod-filter-row {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .month-select,
        .tag-select {
            height: 42px;

            padding: 0 12px;

            border: 1px solid #e2e8f0;
            border-radius: 11px;

            outline: none;

            color: #475569;
            background: #f8fafc;

            font-size: 13px;

            cursor: pointer;
        }

        .month-select {
            width: 145px;
        }

        .tag-select {
            width: 145px;
        }

        .month-select:focus,
        .tag-select:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        .result-count {
            flex-shrink: 0;

            margin-left: auto;

            color: #94a3b8;

            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }


        /* =========================
           VOD LIST
        ========================= */

        .vod-list {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .vod-card {
            width: 100%;

            padding: 19px 20px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            background: #ffffff;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .vod-card:hover {
            transform: translateY(-1px);

            border-color: #bae6fd;

            box-shadow:
                0 8px 24px rgba(14, 165, 233, 0.08);
        }

        .vod-card-main {
            min-width: 0;
        }

        .vod-date {
            margin-bottom: 6px;

            color: #0ea5e9;

            font-size: 12px;
            font-weight: 800;
        }

        .vod-title {
            margin: 0;

            color: #1e293b;

            font-size: 16px;
            line-height: 1.45;
            font-weight: 800;

            word-break: keep-all;
        }


        /* =========================
           STATUS
        ========================= */

        .vod-status {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            margin-top: 12px;
        }

        .status-item {
            display: inline-flex;

            align-items: center;

            min-height: 27px;

            padding: 4px 9px;

            border: 1px solid #e2e8f0;
            border-radius: 8px;

            color: #94a3b8;
            background: #f8fafc;

            font-size: 11px;
            font-weight: 700;
        }

        /* 구독+전용 노란색 */

        .status-item.subscription {
            color: #a16207;

            border-color: #fde68a;

            background: #fef9c3;
        }

        /* 성인 인증 */

        .status-item.adult {
            color: #be123c;

            border-color: #fecdd3;

            background: #fff1f2;
        }


        /* =========================
           TAGS
        ========================= */

        .vod-tags {
            display: flex;
            flex-wrap: wrap;

            gap: 6px;

            margin-top: 8px;
        }

        .vod-tag {
            display: inline-flex;
            align-items: center;

            min-height: 25px;

            padding: 3px 9px;

            border: 1px solid #dbeafe;
            border-radius: 7px;

            color: #64748b;
            background: #f8fafc;

            font-size: 11px;
            font-weight: 700;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty-state {
            padding: 60px 20px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            text-align: center;

            color: #94a3b8;

            background: #ffffff;
        }

        .empty-state strong {
            display: block;

            margin-bottom: 6px;

            color: #64748b;

            font-size: 14px;
        }

        .empty-state span {
            font-size: 12px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(15, 23, 42, 0.48);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-backdrop.show {
            display: flex;
        }

        .vod-modal {
            position: relative;

            width: min(620px, 100%);
            max-height: min(720px, calc(100vh - 40px));

            overflow-y: auto;

            padding: 26px;

            border-radius: 20px;

            background: #ffffff;

            box-shadow:
                0 24px 70px rgba(15, 23, 42, 0.22);
        }

        .modal-close {
            position: absolute;

            top: 17px;
            right: 17px;

            width: 34px;
            height: 34px;

            border: 0;
            border-radius: 9px;

            color: #64748b;
            background: #f8fafc;

            font-size: 21px;
            line-height: 1;

            cursor: pointer;
        }

        .modal-close:hover {
            background: #f1f5f9;
        }

        .modal-date {
            margin-bottom: 7px;

            color: #0ea5e9;

            font-size: 12px;
            font-weight: 800;
        }

        .modal-title {
            margin: 0 45px 18px 0;

            color: #0f172a;

            font-size: 22px;
            line-height: 1.4;
            font-weight: 850;

            word-break: keep-all;
        }

        .modal-status {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            padding-bottom: 14px;

            border-bottom: 1px solid #e2e8f0;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;

            gap: 6px;

            padding-top: 10px;
            padding-bottom: 18px;

            border-bottom: 1px solid #e2e8f0;
        }

        .modal-section {
            padding-top: 20px;
        }

        .modal-section-title {
            margin-bottom: 9px;

            color: #334155;

            font-size: 13px;
            font-weight: 800;
        }

        .organized-content {
            margin: 0;

            padding: 15px;

            border-radius: 12px;

            color: #475569;
            background: #f8fafc;

            font-size: 13px;
            line-height: 1.75;

            white-space: pre-line;
            word-break: keep-all;
        }

        .official-link {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 40px;

            padding: 0 15px;

            border-radius: 10px;

            color: #ffffff;
            background: #0ea5e9;

            font-size: 13px;
            font-weight: 800;
        }

        .official-link:hover {
            background: #0284c7;
        }

        .official-link.disabled {
            color: #94a3b8;
            background: #f1f5f9;

            cursor: default;
        }


        /* =========================================================
           관리자 로그인 / 로그아웃 팝업
           2번 파일과 동일한 디자인
        ========================================================= */

        .admin-button { display: none !important; }

        .admin-modal {
            position: fixed; inset: 0; z-index: 3000;
            display: none; align-items: center; justify-content: center;
            padding: 18px;
            background: rgba(15,23,42,.42);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .admin-modal.active { display: flex; }

        .admin-panel {
            width: min(420px,100%); max-height: min(88vh,900px);
            overflow: hidden; border: 1px solid #e4edf5;
            border-radius: 22px; background: #fff;
            box-shadow: 0 20px 60px rgba(15,23,42,.18);
        }
        .admin-panel-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:18px 22px; border-bottom:1px solid #eef2f7;
        }
        .admin-panel-title { margin:0; color:#1e293b; font-size:16px; font-weight:800; }
        .admin-close {
            width:32px; height:32px; border:0; border-radius:9px;
            background:#f8fafc; color:#64748b; cursor:pointer; font-size:18px;
            transition:background .2s,color .2s;
        }
        .admin-close:hover { background:#f1f5f9; color:#334155; }
        .admin-login-body { padding:24px 22px; }
        .admin-login-body p { margin:0 0 16px; color:#64748b; font-size:12px; line-height:1.6; }
        .admin-input {
            width:100%; height:42px; padding:0 14px;
            border:1px solid #dbe5ef; border-radius:12px; outline:none;
            color:#1e293b; background:#fff; font-size:13px;
            transition:border-color .2s,box-shadow .2s;
        }
        .admin-input:focus { border-color:#7dd3fc; box-shadow:0 0 0 3px rgba(14,165,233,.08); }
        .admin-turnstile { min-height:65px; margin-top:14px; display:flex; justify-content:center; }
        .admin-login-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
        .admin-action-button {
            min-height:40px; padding:0 16px; border:1px solid #dbe5ef;
            border-radius:11px; background:#fff; color:#475569; font-size:12px;
            font-weight:800; cursor:pointer; transition:background .2s,border-color .2s;
        }
        .admin-action-button:hover { background:#f8fafc; border-color:#cbd5e1; }
        .admin-action-button.primary { border-color:#0284c7; background:#0284c7; color:#fff; }
        .admin-action-button.primary:hover { background:#026d9c; }
        .admin-action-button.primary.danger { border-color:#fecaca!important; color:#dc2626!important; background:#fecaca!important; }
        .admin-action-button.primary.danger:hover { background:#ff969e!important; }
        .admin-status { margin-top:12px; min-height:18px; color:#64748b; font-size:11px; text-align:center; font-weight:600; }

        .toast-message {
            position:fixed; bottom:30px; left:50%;
            transform:translateX(-50%) translateY(20px);
            background:rgba(15,23,42,.9); color:#fff; padding:12px 24px;
            border-radius:12px; font-size:13px; font-weight:700;
            box-shadow:0 10px 30px rgba(15,23,42,.25); z-index:4000;
            opacity:0; visibility:hidden;
            transition:opacity .3s ease,transform .3s ease,visibility .3s ease;
            backdrop-filter:blur(8px);
        }
        .toast-message.show { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 14px 0 16px;
            border-top: 1px solid #e7eef5;
            background: #ffffff;
        }

        .footer-inner {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 11px;
        }

        .footer-title {
            color: #64748b;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 720px) {

            .container {
                width: min(calc(100% - 22px), 680px);
            }

            .top-header-inner {
                height: 60px;
            }

            .brand-text {
                font-size: 15px;
            }

            .top-nav {
                gap: 1px;
            }

            .top-nav a {
                padding: 7px 5px;
                font-size: 10px;
            }

            main {
                width: calc(100% - 20px);

                padding: 38px 0 60px;
            }

            .page-heading {
                margin-bottom: 22px;
            }

            .page-heading h1 {
                font-size: 26px;
            }

            .vod-toolbar {
                padding: 12px;
            }

            .vod-filter-row {
                width: 100%;
            }

            .month-select,
            .tag-select {
                flex: 1;

                width: auto;
            }

            .vod-card {
                padding: 17px;
            }

            .vod-title {
                font-size: 15px;
            }

            .vod-modal {
                padding: 22px 18px;

                border-radius: 17px;
            }

            .modal-title {
                font-size: 19px;
            }
        }
    </style>
</head>


<body>

<header class="top-header">

    <div class="container top-header-inner">

        <a href="#" class="brand">
            <span class="brand-text">
                바다비 팬 아카이브
            </span>
        </a>

        <nav class="top-nav" aria-label="주요 링크">
            <a href="https://www.sooplive.com/station/bababi" target="_blank" rel="noopener">방송국</a>
            <a href="https://cafe.naver.com/soopbadabi" target="_blank" rel="noopener">팬카페</a>
            <a href="https://youtube.com/channel/UCUcnsZ-VzanQT6NSMJ_JlCQ?si=kMa8AhcVNcQ6FyYE" target="_blank" rel="noopener">유튜브</a>
            <a href="songlist.html">노래책</a>
            <a href="vod.html">VOD정보</a>
        </nav>

    </div>

</header>


<main>

    <section class="page-heading">

        <div class="eyebrow">
            VOD ARCHIVE
        </div>

        <h1>
            임시로 디자인만 잡혀있는 상태입니다 현재 아무런 기능이 없습니다.
        </h1>

        <p>
            방송 다시보기와 팬이 정리한 타임라인을 모아두는 공간입니다.
        </p>

    </section>


    <!-- =========================
         SEARCH
    ========================= -->

    <section class="vod-toolbar">

        <!-- 제목 검색 -->

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="search"
                id="vod-search"
                placeholder="VOD 제목 검색"
                autocomplete="off"
            >

        </div>


        <!-- 날짜 + 태그 검색 -->

        <div class="vod-filter-row">

            <select
                id="vod-month"
                class="month-select"
            >
                <option value="">
                    전체 기간
                </option>
            </select>


            <select
                id="vod-tag"
                class="tag-select"
            >
                <option value="">
                    전체 태그
                </option>
            </select>


            <span
                class="result-count"
                id="result-count"
            >
                VOD 0개
            </span>

        </div>

    </section>


    <!-- =========================
         VOD LIST
    ========================= -->

    <section
        id="vod-list"
        class="vod-list"
    ></section>

</main>


    <!-- 관리자 로그인 -->
    <div class="admin-modal" id="adminModal" aria-hidden="true">
        <div class="admin-panel" role="dialog" aria-modal="true" aria-labelledby="adminPanelTitle">
            <div class="admin-panel-header">
                <h2 class="admin-panel-title" id="adminPanelTitle">관리자 로그인</h2>
                <button type="button" class="admin-close" id="adminCloseButton" aria-label="닫기">×</button>
            </div>
            <div id="adminLoginView" class="admin-login-body">
                <p>로그인 상태는 브라우저에 보안 세션 토큰으로 유지됩니다.</p>
                <input type="password" id="adminPassword" class="admin-input" autocomplete="current-password" placeholder="관리자 비밀번호">
                <div id="adminTurnstile" class="admin-turnstile"></div>
                <div class="admin-login-actions">
                    <button type="button" class="admin-action-button primary" id="adminLoginButton" style="width:100%;">로그인</button>
                </div>
                <div class="admin-status" id="adminLoginStatus"></div>
            </div>
        </div>
    </div>

    <!-- 로그아웃 확인 -->
    <div class="admin-modal" id="logoutConfirmModal" aria-hidden="true">
        <div class="admin-panel" role="dialog" aria-modal="true" aria-labelledby="logoutConfirmTitle" style="width:min(380px,100%);">
            <div class="admin-panel-header">
                <h2 class="admin-panel-title" id="logoutConfirmTitle">로그아웃 확인</h2>
                <button type="button" class="admin-close" id="logoutConfirmCloseButton" aria-label="닫기">×</button>
            </div>
            <div class="admin-login-body" style="text-align:center; padding:28px 22px;">
                <p style="margin-bottom:0; color:#1e293b; font-weight:700; font-size:14px;">정말 로그아웃 하시겠습니까?</p>
                <div style="display:flex; justify-content:center; gap:8px; margin-top:22px;">
                    <button type="button" class="admin-action-button" id="logoutCancelButton" style="flex:1;">취소</button>
                    <button type="button" class="admin-action-button primary danger" id="logoutConfirmButton" style="flex:1;">로그아웃</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-message" id="toastMessage">성공적으로 로그아웃되었습니다.</div>

<footer>

    <div class="container footer-inner">

        <span class="footer-title" id="secretAdminTrigger">
            바다비 팬 아카이브
        </span>

        <span>
            팬 제작 아카이브 · 비공식 팬사이트
        </span>

    </div>

</footer>


<!-- =========================
     VOD DETAIL MODAL
========================= -->

<div
    class="modal-backdrop"
    id="vod-modal-backdrop"
    aria-hidden="true"
>

    <div
        class="vod-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
    >

        <button
            type="button"
            class="modal-close"
            id="modal-close"
            aria-label="닫기"
        >
            ×
        </button>


        <div
            class="modal-date"
            id="modal-date"
        ></div>


        <h2
            class="modal-title"
            id="modal-title"
        ></h2>


        <!-- 구독 + 성인 인증 -->

        <div
            class="modal-status"
            id="modal-status"
        ></div>


        <!-- 태그 -->

        <div
            class="modal-tags"
            id="modal-tags"
        ></div>


        <!-- 타임라인 -->

        <div class="modal-section">

            <div class="modal-section-title">
                타임라인
            </div>

            <p
                class="organized-content"
                id="modal-content"
            ></p>

        </div>


        <!-- 공식 VOD -->

        <div class="modal-section">

            <div class="modal-section-title">
                공식 VOD
            </div>

            <a
                id="modal-link"
                class="official-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                VOD 보러가기
            </a>

        </div>

    </div>

</div>


<script>
    /* =========================================================
       관리자 로그인 / 로그아웃
       2번 파일과 동일한 인증 방식
    ========================================================= */

    const ADMIN_WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
    const ADMIN_TURNSTILE_SITE_KEY = "0x4AAAAAAEbQ0YWNiL_WiyKR";

    let adminSessionToken = localStorage.getItem("badabi_session") || "";
    let adminUserRole = "";
    let adminTurnstileToken = "";
    let adminTurnstileWidgetId = null;
    let isAdminAuthenticated = false;

    function adminOpenModal() {
        if (isAdminAuthenticated) {
            const modal = document.getElementById("logoutConfirmModal");
            if (modal) {
                modal.classList.add("active");
                modal.setAttribute("aria-hidden", "false");
            }
            return;
        }

        const modal = document.getElementById("adminModal");
        if (!modal) return;

        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
        renderAdminTurnstile();
    }

    function adminCloseModal() {
        const modal = document.getElementById("adminModal");
        if (!modal) return;
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
    }

    function closeLogoutConfirmModal() {
        const modal = document.getElementById("logoutConfirmModal");
        if (!modal) return;
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
    }

    function showToast(message) {
        const toast = document.getElementById("toastMessage");
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function loadTurnstileScript() {
        if (window.turnstile) return Promise.resolve();
        if (window.__badabiTurnstilePromise) return window.__badabiTurnstilePromise;

        window.__badabiTurnstilePromise = new Promise((resolve, reject) => {
            const existing = document.querySelector('script[data-badabi-turnstile="1"]');

            if (existing) {
                existing.addEventListener("load", resolve, { once: true });
                existing.addEventListener("error", reject, { once: true });
                return;
            }

            const script = document.createElement("script");
            script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
            script.async = true;
            script.defer = true;
            script.dataset.badabiTurnstile = "1";
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });

        return window.__badabiTurnstilePromise;
    }

    function resetAdminTurnstile() {
        adminTurnstileToken = "";

        if (window.turnstile && adminTurnstileWidgetId !== null) {
            try { window.turnstile.reset(adminTurnstileWidgetId); } catch (_) {}
        }
    }

    async function renderAdminTurnstile() {
        const container = document.getElementById("adminTurnstile");
        if (!container) return;

        try {
            await loadTurnstileScript();
            if (!window.turnstile) return;

            if (adminTurnstileWidgetId !== null) {
                try { window.turnstile.remove(adminTurnstileWidgetId); } catch (_) {}
            }

            container.innerHTML = "";

            adminTurnstileWidgetId = window.turnstile.render(container, {
                sitekey: ADMIN_TURNSTILE_SITE_KEY,
                callback: token => adminTurnstileToken = token || "",
                "expired-callback": resetAdminTurnstile,
                "timeout-callback": resetAdminTurnstile,
                theme: "auto"
            });
        } catch (error) {
            console.error("Turnstile 렌더링 실패:", error);
        }
    }

    function rateLimitId() {
        let id = localStorage.getItem("badabi_rate_limit_id") || "";
        if (id) return id;

        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        id = Array.from(bytes, x => x.toString(16).padStart(2, "0")).join("");
        localStorage.setItem("badabi_rate_limit_id", id);
        return id;
    }

    async function adminLogin() {
        const input = document.getElementById("adminPassword");
        const status = document.getElementById("adminLoginStatus");
        const password = input?.value || "";

        if (!password) {
            status.textContent = "비밀번호를 입력해주세요.";
            status.style.color = "#ef4444";
            return;
        }

        if (!adminTurnstileToken) {
            status.textContent = "보안 인증을 완료해주세요.";
            status.style.color = "#ef4444";
            return;
        }

        status.textContent = "확인 중...";
        status.style.color = "#0284c7";

        try {
            const response = await fetch(ADMIN_WORKER_URL, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    password,
                    turnstileToken: adminTurnstileToken,
                    rateLimitId: rateLimitId(),
                    action: "verify"
                })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok || !data.success || !data.sessionToken) {
                throw new Error(data.error || "인증 실패");
            }

            adminSessionToken = data.sessionToken;
            adminUserRole = data.role || "";
            isAdminAuthenticated = true;

            localStorage.setItem("badabi_session", adminSessionToken);

            input.value = "";
            resetAdminTurnstile();
            adminCloseModal();

        } catch (error) {
            status.textContent = error.message || "로그인에 실패했습니다. 다시 시도해주세요.";
            status.style.color = "#ef4444";
            resetAdminTurnstile();

            if (input) {
                input.value = "";
                input.focus();
            }
        }
    }

    async function restoreAdminAuthentication() {
        const token = localStorage.getItem("badabi_session") || adminSessionToken || "";
        if (!token) return false;

        try {
            const response = await fetch(ADMIN_WORKER_URL, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    sessionToken: token,
                    action: "verify"
                })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok || !data.success || !data.role) throw new Error();

            adminSessionToken = token;
            adminUserRole = data.role || "";
            isAdminAuthenticated = true;
            return true;

        } catch (_) {
            adminSessionToken = "";
            adminUserRole = "";
            isAdminAuthenticated = false;
            localStorage.removeItem("badabi_session");
            return false;
        }
    }

    function logoutAdmin() {
        isAdminAuthenticated = false;
        adminSessionToken = "";
        adminUserRole = "";
        localStorage.removeItem("badabi_session");
        resetAdminTurnstile();
        closeLogoutConfirmModal();
        showToast("성공적으로 로그아웃되었습니다.");
    }

    document.getElementById("logoutConfirmModal")?.addEventListener("click", event => {
        if (event.target.id === "logoutConfirmModal") closeLogoutConfirmModal();
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {

    restoreAdminAuthentication();

    /* =========================================================

    const vodList =
        document.getElementById("vod-list");

    const vodSearch =
        document.getElementById("vod-search");

        document.getElementById("vod-month");

    const vodTag =
        document.getElementById("vod-tag");

    const resultCount =
        document.getElementById("result-count");


    const modalBackdrop =
        document.getElementById("vod-modal-backdrop");

    const modalClose =
        document.getElementById("modal-close");

    const modalDate =
        document.getElementById("modal-date");

    const modalTitle =
        document.getElementById("modal-title");

    const modalStatus =
        document.getElementById("modal-status");

    const modalTags =
        document.getElementById("modal-tags");

    const modalContent =
        document.getElementById("modal-content");

    const modalLink =
        document.getElementById("modal-link");


    /* =========================================================
       UTILITY
    ========================================================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(dateString) {

        const date =
            new Date(dateString + "T00:00:00");

        if (Number.isNaN(date.getTime())) {
            return dateString;
        }

        const year =
            date.getFullYear();

        const month =
            String(date.getMonth() + 1)
                .padStart(2, "0");

        const day =
            String(date.getDate())
                .padStart(2, "0");

        return `${year}.${month}.${day}`;

    }


    function normalizeSearch(value) {

        return String(value ?? "")
            .toLowerCase()
            .replace(/\s+/g, "");

    }


    /* =========================================================
       MONTH OPTIONS
    ========================================================= */

    function createMonthOptions() {

        const months = [
            ...new Set(
                VOD_DATA.map(
                    vod => vod.date.slice(0, 7)
                )
            )
        ]
        .sort()
        .reverse();


        months.forEach(month => {

            const [
                year,
                monthNumber
            ] = month.split("-");


            const option =
                document.createElement("option");


            option.value =
                month;


            option.textContent =
                `${year}년 ${Number(monthNumber)}월`;


            vodMonth.appendChild(option);

        });

    }


    /* =========================================================
       TAG OPTIONS
    ========================================================= */

    function createTagOptions() {

        const tags = [
            ...new Set(
                VOD_DATA.flatMap(
                    vod => Array.isArray(vod.tags)
                        ? vod.tags
                        : []
                )
            )
        ]
        .sort();


        tags.forEach(tag => {

            const option =
                document.createElement("option");


            option.value =
                tag;


            option.textContent =
                tag;


            vodTag.appendChild(option);

        });

    }


    /* =========================================================
       STATUS
    ========================================================= */

    function createStatusHTML(vod) {

        let html = "";


        /* 구독+전용 */

        if (vod.subscribed) {

            html += `
                <span class="status-item subscription">
                    ✓ 구독+전용
                </span>
            `;

        } else {

            html += `
                <span class="status-item">
                    ○ 일반 VOD
                </span>
            `;

        }


        /* 성인 인증 */

        if (vod.adultVerified) {

            html += `
                <span class="status-item adult">
                    ✓ 성인 인증
                </span>
            `;

        } else {

            html += `
                <span class="status-item">
                    ○ 성인 인증 없음
                </span>
            `;

        }


        return html;

    }


    /* =========================================================
       TAG HTML
    ========================================================= */

    function createTagsHTML(tags) {

        if (
            !Array.isArray(tags) ||
            tags.length === 0
        ) {
            return "";
        }


        return tags.map(tag => {

            return `
                <span class="vod-tag">
                    #${escapeHTML(tag)}
                </span>
            `;

        }).join("");

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function renderVODList() {

        const searchValue =
            normalizeSearch(
                vodSearch.value
            );


        const selectedMonth =
            vodMonth.value;


        const selectedTag =
            vodTag.value;


        const filtered =
            VOD_DATA

                .filter(vod => {

                    /* 제목 */

                    const titleMatch =
                        !searchValue ||
                        normalizeSearch(vod.title)
                            .includes(searchValue);


                    /* 월 */

                    const monthMatch =
                        !selectedMonth ||
                        vod.date.startsWith(
                            selectedMonth
                        );


                    /* 태그 */

                    const tagMatch =
                        !selectedTag ||
                        (
                            Array.isArray(vod.tags) &&
                            vod.tags.includes(
                                selectedTag
                            )
                        );


                    return (
                        titleMatch &&
                        monthMatch &&
                        tagMatch
                    );

                })

                .sort((a, b) => {

                    return b.date.localeCompare(
                        a.date
                    );

                });


        resultCount.textContent =
            `VOD ${filtered.length}개`;


        if (filtered.length === 0) {

            vodList.innerHTML = `
                <div class="empty-state">

                    <strong>
                        검색 결과가 없습니다.
                    </strong>

                    <span>
                        다른 제목, 기간 또는 태그로 검색해보세요.
                    </span>

                </div>
            `;

            return;
        }


        vodList.innerHTML =
            filtered.map(vod => {

                return `
                    <article
                        class="vod-card"
                        data-id="${escapeHTML(vod.id)}"
                        tabindex="0"
                        role="button"
                        aria-label="${escapeHTML(vod.title)} 상세보기"
                    >

                        <div class="vod-card-main">

                            <div class="vod-date">
                                ${escapeHTML(
                                    formatDate(vod.date)
                                )}
                            </div>


                            <h2 class="vod-title">
                                ${escapeHTML(vod.title)}
                            </h2>


                            <!-- 구독 + 성인 인증 -->

                            <div class="vod-status">
                                ${createStatusHTML(vod)}
                            </div>


                            <!-- 태그 -->

                            <div class="vod-tags">
                                ${createTagsHTML(vod.tags)}
                            </div>

                        </div>

                    </article>
                `;

            })
            .join("");


        document
            .querySelectorAll(".vod-card")
            .forEach(card => {

                card.addEventListener(
                    "click",
                    () => {
                        openVODModal(
                            card.dataset.id
                        );
                    }
                );


                card.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();

                            openVODModal(
                                card.dataset.id
                            );

                        }

                    }
                );

            });

    }


    /* =========================================================
       MODAL
    ========================================================= */

    function openVODModal(id) {

        const vod =
            VOD_DATA.find(
                item => item.id === id
            );


        if (!vod) {
            return;
        }


        modalDate.textContent =
            formatDate(vod.date);


        modalTitle.textContent =
            vod.title;


        modalStatus.innerHTML =
            createStatusHTML(vod);


        modalTags.innerHTML =
            createTagsHTML(vod.tags);


        modalContent.textContent =
            vod.timeline ||
            "정리된 타임라인이 없습니다.";


        /* 공식 VOD */

        if (
            vod.url &&
            vod.url !== "#"
        ) {

            modalLink.href =
                vod.url;

            modalLink.classList.remove(
                "disabled"
            );

            modalLink.textContent =
                "VOD 보러가기";

            modalLink.target =
                "_blank";

        } else {

            modalLink.href =
                "#";

            modalLink.classList.add(
                "disabled"
            );

            modalLink.textContent =
                "VOD 링크 준비 중";

            modalLink.removeAttribute(
                "target"
            );

        }


        modalBackdrop.classList.add(
            "show"
        );


        modalBackdrop.setAttribute(
            "aria-hidden",
            "false"
        );


        document.body.style.overflow =
            "hidden";

    }


    function closeVODModal() {

        modalBackdrop.classList.remove(
            "show"
        );


        modalBackdrop.setAttribute(
            "aria-hidden",
            "true"
        );


        document.body.style.overflow =
            "";

    }


    /* =========================================================
       EVENTS
    ========================================================= */

    vodSearch.addEventListener(
        "input",
        renderVODList
    );


    vodMonth.addEventListener(
        "change",
        renderVODList
    );


    vodTag.addEventListener(
        "change",
        renderVODList
    );


    modalClose.addEventListener(
        "click",
        closeVODModal
    );


    modalBackdrop.addEventListener(
        "click",
        event => {

            if (
                event.target === modalBackdrop
            ) {
                closeVODModal();
            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape" &&
                modalBackdrop.classList.contains(
                    "show"
                )
            ) {
                closeVODModal();
            }

        }
    );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    createMonthOptions();

    createTagOptions();

    renderVODList();

</script>
