<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <title>VOD - 바다비 팬 아카이브</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;
            color: #334155;
            background: #f8fbff;
        }

        button,
        input,
        select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        .site-header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;

            background: rgba(255, 255, 255, 0.92);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border-bottom: 1px solid #e2e8f0;
        }

        .header-inner {
            width: min(1100px, calc(100% - 32px));
            height: 64px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .brand {
            flex-shrink: 0;

            display: flex;
            align-items: center;

            gap: 7px;

            color: #0f172a;

            font-size: 16px;
            font-weight: 800;
        }

        .brand-wave {
            color: #0ea5e9;
        }

        .main-nav {
            display: flex;
            align-items: center;

            gap: 4px;
        }

        .main-nav a {
            padding: 8px 11px;

            border-radius: 9px;

            color: #64748b;

            font-size: 13px;
            font-weight: 700;

            transition:
                background 0.15s ease,
                color 0.15s ease;
        }

        .main-nav a:hover {
            color: #0ea5e9;
            background: #f0f9ff;
        }

        .main-nav a.active {
            color: #0284c7;
            background: #e0f2fe;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            width: min(1000px, calc(100% - 32px));

            margin: 0 auto;

            padding: 54px 0 80px;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading .eyebrow {
            margin-bottom: 7px;

            color: #0ea5e9;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 0.08em;
        }

        .page-heading h1 {
            margin: 0;

            color: #0f172a;

            font-size: 30px;
            line-height: 1.25;
            font-weight: 850;
        }

        .page-heading p {
            margin: 9px 0 0;

            color: #94a3b8;

            font-size: 13px;
        }


        /* =========================
           TOOLBAR
        ========================= */

        .vod-toolbar {
            display: flex;
            flex-direction: column;

            align-items: stretch;

            gap: 10px;

            margin-bottom: 22px;
            padding: 14px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            background: #ffffff;
        }

        .search-box {
            position: relative;

            width: 100%;
        }

        .search-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 20px;
            line-height: 1;

            pointer-events: none;
        }

        #vod-search {
            width: 100%;
            height: 42px;

            padding: 0 14px 0 42px;

            border: 1px solid #e2e8f0;
            border-radius: 11px;

            outline: none;

            color: #334155;
            background: #f8fafc;

            font-size: 13px;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        #vod-search:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        #vod-search::placeholder {
            color: #94a3b8;
        }

        .vod-filter-row {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .month-select,
        .tag-select {
            height: 42px;

            padding: 0 12px;

            border: 1px solid #e2e8f0;
            border-radius: 11px;

            outline: none;

            color: #475569;
            background: #f8fafc;

            font-size: 13px;

            cursor: pointer;
        }

        .month-select {
            width: 145px;
        }

        .tag-select {
            width: 145px;
        }

        .month-select:focus,
        .tag-select:focus {
            border-color: #7dd3fc;
            background: #ffffff;
        }

        .result-count {
            flex-shrink: 0;

            margin-left: auto;

            color: #94a3b8;

            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }


        /* =========================
           VOD LIST
        ========================= */

        .vod-list {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .vod-card {
            width: 100%;

            padding: 19px 20px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            background: #ffffff;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .vod-card:hover {
            transform: translateY(-1px);

            border-color: #bae6fd;

            box-shadow:
                0 8px 24px rgba(14, 165, 233, 0.08);
        }

        .vod-card-main {
            min-width: 0;
        }

        .vod-date {
            margin-bottom: 6px;

            color: #0ea5e9;

            font-size: 12px;
            font-weight: 800;
        }

        .vod-title {
            margin: 0;

            color: #1e293b;

            font-size: 16px;
            line-height: 1.45;
            font-weight: 800;

            word-break: keep-all;
        }


        /* =========================
           STATUS
        ========================= */

        .vod-status {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            margin-top: 12px;
        }

        .status-item {
            display: inline-flex;

            align-items: center;

            min-height: 27px;

            padding: 4px 9px;

            border: 1px solid #e2e8f0;
            border-radius: 8px;

            color: #94a3b8;
            background: #f8fafc;

            font-size: 11px;
            font-weight: 700;
        }

        /* 구독+전용 노란색 */

        .status-item.subscription {
            color: #a16207;

            border-color: #fde68a;

            background: #fef9c3;
        }

        /* 성인 인증 */

        .status-item.adult {
            color: #be123c;

            border-color: #fecdd3;

            background: #fff1f2;
        }


        /* =========================
           TAGS
        ========================= */

        .vod-tags {
            display: flex;
            flex-wrap: wrap;

            gap: 6px;

            margin-top: 8px;
        }

        .vod-tag {
            display: inline-flex;
            align-items: center;

            min-height: 25px;

            padding: 3px 9px;

            border: 1px solid #dbeafe;
            border-radius: 7px;

            color: #64748b;
            background: #f8fafc;

            font-size: 11px;
            font-weight: 700;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty-state {
            padding: 60px 20px;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            text-align: center;

            color: #94a3b8;

            background: #ffffff;
        }

        .empty-state strong {
            display: block;

            margin-bottom: 6px;

            color: #64748b;

            font-size: 14px;
        }

        .empty-state span {
            font-size: 12px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(15, 23, 42, 0.48);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-backdrop.show {
            display: flex;
        }

        .vod-modal {
            position: relative;

            width: min(620px, 100%);
            max-height: min(720px, calc(100vh - 40px));

            overflow-y: auto;

            padding: 26px;

            border-radius: 20px;

            background: #ffffff;

            box-shadow:
                0 24px 70px rgba(15, 23, 42, 0.22);
        }

        .modal-close {
            position: absolute;

            top: 17px;
            right: 17px;

            width: 34px;
            height: 34px;

            border: 0;
            border-radius: 9px;

            color: #64748b;
            background: #f8fafc;

            font-size: 21px;
            line-height: 1;

            cursor: pointer;
        }

        .modal-close:hover {
            background: #f1f5f9;
        }

        .modal-date {
            margin-bottom: 7px;

            color: #0ea5e9;

            font-size: 12px;
            font-weight: 800;
        }

        .modal-title {
            margin: 0 45px 18px 0;

            color: #0f172a;

            font-size: 22px;
            line-height: 1.4;
            font-weight: 850;

            word-break: keep-all;
        }

        .modal-status {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            padding-bottom: 14px;

            border-bottom: 1px solid #e2e8f0;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;

            gap: 6px;

            padding-top: 10px;
            padding-bottom: 18px;

            border-bottom: 1px solid #e2e8f0;
        }

        .modal-section {
            padding-top: 20px;
        }

        .modal-section-title {
            margin-bottom: 9px;

            color: #334155;

            font-size: 13px;
            font-weight: 800;
        }

        .organized-content {
            margin: 0;

            padding: 15px;

            border-radius: 12px;

            color: #475569;
            background: #f8fafc;

            font-size: 13px;
            line-height: 1.75;

            white-space: pre-line;
            word-break: keep-all;
        }

        .official-link {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 40px;

            padding: 0 15px;

            border-radius: 10px;

            color: #ffffff;
            background: #0ea5e9;

            font-size: 13px;
            font-weight: 800;
        }

        .official-link:hover {
            background: #0284c7;
        }

        .official-link.disabled {
            color: #94a3b8;
            background: #f1f5f9;

            cursor: default;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 28px 16px 38px;

            border-top: 1px solid #e2e8f0;

            text-align: center;

            background: #ffffff;
        }

        .footer-title {
            margin-bottom: 5px;

            color: #64748b;

            font-size: 12px;
            font-weight: 800;
        }

        .footer-text {
            color: #94a3b8;

            font-size: 11px;
            line-height: 1.7;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 720px) {

            .header-inner {
                width: calc(100% - 20px);

                height: auto;
                min-height: 58px;

                padding: 8px 0;

                flex-direction: column;

                align-items: stretch;

                gap: 5px;
            }

            .brand {
                justify-content: center;
            }

            .main-nav {
                width: 100%;

                overflow-x: auto;

                justify-content: center;

                padding-bottom: 2px;

                scrollbar-width: none;
            }

            .main-nav::-webkit-scrollbar {
                display: none;
            }

            .main-nav a {
                flex-shrink: 0;

                padding: 7px 13px;

                font-size: 12px;
            }

            main {
                width: calc(100% - 20px);

                padding: 38px 0 60px;
            }

            .page-heading {
                margin-bottom: 22px;
            }

            .page-heading h1 {
                font-size: 26px;
            }

            .vod-toolbar {
                padding: 12px;
            }

            .vod-filter-row {
                width: 100%;
            }

            .month-select,
            .tag-select {
                flex: 1;

                width: auto;
            }

            .vod-card {
                padding: 17px;
            }

            .vod-title {
                font-size: 15px;
            }

            .vod-modal {
                padding: 22px 18px;

                border-radius: 17px;
            }

            .modal-title {
                font-size: 19px;
            }
        }

        .modal-tags {
            align-items: center;
        }

        .vod-card-main {
            position: relative;
        }

        .vod-description {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.5;
            font-weight: 500;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            word-break: keep-all;
        }

        .admin-edit-button {
            position: absolute;
            top: 0;
            right: 0;
            margin-top: 0;
        }

        .admin-edit-button + * {
            margin-top: 0;
        }

        .admin-login-button {
            padding: 8px 11px;
            border: 1px solid #bae6fd;
            border-radius: 9px;
            color: #0284c7;
            background: #f0f9ff;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }
        .admin-login-button.authenticated { color:#047857; background:#ecfdf5; border-color:#a7f3d0; }
        .admin-edit-button { margin-top:12px; padding:8px 12px; border:1px solid #bae6fd; border-radius:9px; color:#0284c7; background:#f0f9ff; font-size:12px; font-weight:800; cursor:pointer; }
        .admin-modal-backdrop { position:fixed; inset:0; z-index:3000; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(15,23,42,.48); backdrop-filter:blur(4px); }
        .admin-modal-backdrop.show { display:flex; }
        .admin-modal { position:relative; width:min(520px,100%); max-height:calc(100vh - 40px); overflow:auto; padding:26px; border-radius:20px; background:#fff; box-shadow:0 24px 70px rgba(15,23,42,.22); }
        .admin-edit-modal { width:min(650px,100%); }
        .admin-modal-close { position:absolute; top:16px; right:16px; width:34px; height:34px; border:0; border-radius:9px; background:#f8fafc; color:#64748b; font-size:21px; cursor:pointer; }
        .admin-modal-title { margin-right:40px; color:#0f172a; font-size:20px; font-weight:850; }
        .admin-modal-subtitle { margin:6px 0 18px; color:#94a3b8; font-size:12px; line-height:1.6; }
        .admin-turnstile { min-height:65px; margin-bottom:8px; }
        .admin-password-row { display:flex; gap:7px; margin-bottom:10px; }
        .admin-input { width:100%; min-width:0; height:42px; padding:0 12px; border:1px solid #e2e8f0; border-radius:10px; outline:none; color:#334155; background:#f8fafc; font-size:13px; }
        .admin-textarea { height:auto; min-height:92px; padding:11px 12px; resize:vertical; line-height:1.65; }
        .admin-input:focus { border-color:#7dd3fc; background:#fff; }
        .admin-action-button,.admin-primary-button,.admin-secondary-button { min-height:42px; padding:0 14px; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer; }
        .admin-action-button,.admin-secondary-button { border:1px solid #e2e8f0; color:#64748b; background:#f8fafc; }
        .admin-primary-button { border:1px solid #0ea5e9; color:#fff; background:#0ea5e9; }
        .admin-status { min-height:20px; margin-top:10px; color:#ef4444; font-size:12px; line-height:1.5; }
        .admin-edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
        .admin-field { display:flex; flex-direction:column; gap:6px; }
        .admin-field > span { color:#475569; font-size:12px; font-weight:800; }
        .admin-field-full { grid-column:1 / -1; }
        .admin-check-row { display:flex; flex-direction:row; align-items:center; gap:9px; padding:11px 12px; border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; color:#475569; font-size:13px; font-weight:800; cursor:pointer; }
        .admin-check-row input { width:17px; height:17px; margin:0; accent-color:#0ea5e9; }
        .admin-edit-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
        @media(max-width:720px){ .admin-edit-grid{grid-template-columns:1fr}.admin-field-full{grid-column:auto}.admin-modal{padding:22px 18px;border-radius:17px}.main-nav{overflow-x:auto} }
    </style>
</head>


<body>

<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="brand">
            <span class="brand-wave">🌊</span>
            <span>바다비 팬 아카이브</span>
        </a>

        <nav class="main-nav">

            <a href="https://www.sooplive.com/station/bababi" target="_blank" rel="noopener">방송국</a>
            <a href="https://cafe.naver.com/soopbadabi" target="_blank" rel="noopener">팬카페</a>
            <a href="https://youtube.com/channel/UCUcnsZ-VzanQT6NSMJ_JlCQ?si=kMa8AhcVNcQ6FyYE" target="_blank" rel="noopener">유튜브</a>
            <a href="songlist.html">노래책</a>
            <a href="vod.html" class="active">VOD정보</a>
            <button type="button" class="admin-login-button" id="admin-login-button">관리자</button>

        </nav>

    </div>

</header>


<main>

    <section class="page-heading">

        <div class="eyebrow">
            VOD ARCHIVE
        </div>

        <h1>
            방송 다시보기와 팬이 정리한 VOD 정보를 모아두는 공간입니다.
        </h1>

        <p>
            방송 다시보기와 팬이 정리한 VOD 정보를 모아두는 공간입니다.
        </p>

    </section>


    <!-- =========================
         SEARCH
    ========================= -->

    <section class="vod-toolbar">

        <!-- 제목 검색 -->

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="search"
                id="vod-search"
                placeholder="VOD 제목 검색"
                autocomplete="off"
            >

        </div>


        <!-- 날짜 + 태그 검색 -->

        <div class="vod-filter-row">

            <select
                id="vod-month"
                class="month-select"
            >
                <option value="">
                    전체 기간
                </option>
            </select>


            <select
                id="vod-tag"
                class="tag-select"
            >
                <option value="">
                    전체 태그
                </option>
            </select>


            <span
                class="result-count"
                id="result-count"
            >
                VOD 0개
            </span>

        </div>

    </section>


    <!-- =========================
         VOD LIST
    ========================= -->

    <section
        id="vod-list"
        class="vod-list"
    ></section>

</main>


<footer>

    <div class="footer-title">
        바다비 팬 아카이브
    </div>

    <div class="footer-text">
        VOD를 정리하여 모아둔 페이지입니다.
    </div>

</footer>


<!-- =========================
     VOD DETAIL MODAL
========================= -->

<div
    class="modal-backdrop"
    id="vod-modal-backdrop"
    aria-hidden="true"
>

    <div
        class="vod-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
    >

        <button
            type="button"
            class="modal-close"
            id="modal-close"
            aria-label="닫기"
        >
            ×
        </button>


        <div
            class="modal-date"
            id="modal-date"
        ></div>


        <h2
            class="modal-title"
            id="modal-title"
        ></h2>


        <!-- 구독 + 성인 인증 -->

        <div
            class="modal-status"
            id="modal-status"
        ></div>


        <!-- 태그 -->

        <div
            class="modal-tags"
            id="modal-tags"
        ></div>


        <!-- 영상 설명 -->

        <div class="modal-section">

            <div class="modal-section-title">
                영상 설명
            </div>

            <p
                class="organized-content"
                id="modal-description"
            ></p>

        </div>


        <!-- 타임라인 -->

        <div class="modal-section">

            <div class="modal-section-title">
                타임라인
            </div>

            <p
                class="organized-content"
                id="modal-content"
            ></p>

        </div>


        <!-- 공식 VOD -->

        <div class="modal-section">

            <div class="modal-section-title">
                공식 VOD
            </div>

            <a
                id="modal-link"
                class="official-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                VOD 보러가기
            </a>

        </div>

    </div>

</div>


<!-- =========================
     ADMIN LOGIN
========================= -->
<div class="admin-modal-backdrop" id="admin-auth-backdrop" aria-hidden="true">
    <div class="admin-modal" role="dialog" aria-modal="true">
        <button type="button" class="admin-modal-close" id="admin-auth-close" aria-label="닫기">×</button>
        <div class="admin-modal-title">관리자 로그인</div>
        <div class="admin-modal-subtitle">노래책과 동일한 관리자 인증을 사용합니다.</div>
        <div id="vod-turnstile" class="admin-turnstile"></div>
        <div class="admin-password-row">
            <input type="password" id="vod-admin-password" class="admin-input" placeholder="관리자 패스워드" autocomplete="current-password">
            <button type="button" id="admin-password-toggle" class="admin-action-button">보기</button>
        </div>
        <button type="button" id="admin-login-submit" class="admin-primary-button">로그인</button>
        <div id="admin-login-status" class="admin-status"></div>
    </div>
</div>

<!-- =========================
     VOD ADMIN EDIT
========================= -->
<div class="admin-modal-backdrop" id="vod-edit-backdrop" aria-hidden="true">
    <div class="admin-modal admin-edit-modal" role="dialog" aria-modal="true">
        <button type="button" class="admin-modal-close" id="vod-edit-close" aria-label="닫기">×</button>
        <div class="admin-modal-title">VOD 관리</div>
        <div class="admin-modal-subtitle">영상 설명과 타임라인을 분리해서 저장하고, 오늘의 VOD 추천 여부를 설정합니다.</div>
        <div class="admin-edit-grid">
            <label class="admin-field"><span>날짜</span><input id="edit-vod-date" class="admin-input" readonly></label>
            <label class="admin-field"><span>제목</span><input id="edit-vod-title" class="admin-input" readonly></label>
            <label class="admin-field admin-field-full"><span>영상 설명</span><textarea id="edit-vod-description" class="admin-input admin-textarea" rows="3"></textarea></label>
            <label class="admin-field admin-field-full"><span>타임라인</span><textarea id="edit-vod-timeline" class="admin-input admin-textarea" rows="7" placeholder="예: 00:00 방송 시작 / 01:23 노래... "></textarea></label>
            <label class="admin-check-row admin-field-full"><input type="checkbox" id="edit-vod-today-recommend"><span>오늘의 VOD 추천</span></label>
        </div>
        <div class="admin-edit-actions">
            <button type="button" id="vod-edit-cancel" class="admin-secondary-button">취소</button>
            <button type="button" id="vod-edit-save" class="admin-primary-button">저장</button>
        </div>
        <div id="vod-edit-status" class="admin-status"></div>
    </div>
</div>

<script>

    /* =========================================================
       VOD DATA — Worker에서 fanvodlist.json 불러오기
    ========================================================= */

    const WORKER_URL =
        "https://badabi-api.dalkkumli054.workers.dev/";

    const FANVODLIST_URL =
        WORKER_URL + "?type=fanvodlist&t=";

    const TURNSTILE_SITE_KEY =
        "0x4AAAAAAEbQ0YWNiL_WiyKR";

    let VOD_DATA = [];


    async function loadVODData() {

        vodList.innerHTML = `
            <div class="empty-state">
                <strong>VOD 정보를 불러오는 중입니다.</strong>
                <span>잠시만 기다려주세요.</span>
            </div>
        `;

        try {

            const response =
                await fetch(
                    FANVODLIST_URL + Date.now(),
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error("VOD 데이터 요청 실패");
            }

            const data =
                await response.json();

            const vods =
                Array.isArray(data)
                    ? data
                    : Array.isArray(data?.vods)
                        ? data.vods
                        : Array.isArray(data?.content?.vods)
                            ? data.content.vods
                            : [];

            /*
             * fanvodlist.json 구조:
             * date / title / link / duration /
             * subPlus / adult / description / category
             * + timeline / todayRecommend
             *
             * description은 영상의 간단한 설명입니다.
             * timeline은 관리자 편집으로 별도 저장합니다.
             */
            VOD_DATA =
                vods.map((vod, index) => {

                    const tags =
                        String(vod.category || "")
                            .split(",")
                            .map(tag => tag.trim())
                            .filter(Boolean);

                    return {
                        id:
                            String(vod.link || "")
                                .trim() ||
                            `${String(vod.date || "vod")}-${index}`,

                        date:
                            String(vod.date || "").trim(),

                        title:
                            String(vod.title || "제목 없음").trim(),

                        url:
                            String(vod.link || vod.url || "").trim(),

                        duration:
                            String(vod.duration || "").trim(),

                        subscribed:
                            String(vod.subPlus || "").toUpperCase() === "Y",

                        adultVerified:
                            String(vod.adult || "").toUpperCase() === "Y",

                        tags,

                        description:
                            String(vod.description || "").trim(),

                        timeline:
                            String(vod.timeline || "").trim(),

                        todayRecommend:
                            vod.todayRecommend === true ||
                            String(vod.todayRecommend || "").toUpperCase() === "Y" ||
                            String(vod.todayRecommend || "").toLowerCase() === "TRUE",

                        raw:
                            { ...vod }
                    };

                });

            createMonthOptions();
            createTagOptions();
            renderVODList();

        } catch (error) {

            console.error(
                "fanvodlist.json 불러오기 실패:",
                error
            );

            VOD_DATA = [];

            resultCount.textContent =
                "VOD 0개";

            vodList.innerHTML = `
                <div class="empty-state">
                    <strong>VOD 정보를 불러오지 못했습니다.</strong>
                    <span>잠시 후 다시 시도해주세요.</span>
                </div>
            `;

        }

    }


    /* =========================================================
       ELEMENT
    ========================================================= */

    const vodList =
        document.getElementById("vod-list");

    const vodSearch =
        document.getElementById("vod-search");

    const vodMonth =
        document.getElementById("vod-month");

    const vodTag =
        document.getElementById("vod-tag");

    const resultCount =
        document.getElementById("result-count");


    const modalBackdrop =
        document.getElementById("vod-modal-backdrop");

    const modalClose =
        document.getElementById("modal-close");

    const modalDate =
        document.getElementById("modal-date");

    const modalTitle =
        document.getElementById("modal-title");

    const modalStatus =
        document.getElementById("modal-status");

    const modalTags =
        document.getElementById("modal-tags");

    const modalDescription =
        document.getElementById("modal-description");

    const modalContent =
        document.getElementById("modal-content");

    const modalLink =
        document.getElementById("modal-link");


    /* =========================================================
       ADMIN AUTH / EDITOR
    ========================================================= */

    const adminLoginButton = document.getElementById("admin-login-button");
    const adminAuthBackdrop = document.getElementById("admin-auth-backdrop");
    const adminAuthClose = document.getElementById("admin-auth-close");
    const adminPasswordInput = document.getElementById("vod-admin-password");
    const adminPasswordToggle = document.getElementById("admin-password-toggle");
    const adminLoginSubmit = document.getElementById("admin-login-submit");
    const adminLoginStatus = document.getElementById("admin-login-status");
    const vodTurnstile = document.getElementById("vod-turnstile");
    const vodEditBackdrop = document.getElementById("vod-edit-backdrop");
    const vodEditClose = document.getElementById("vod-edit-close");
    const vodEditCancel = document.getElementById("vod-edit-cancel");
    const vodEditSave = document.getElementById("vod-edit-save");
    const vodEditStatus = document.getElementById("vod-edit-status");
    const editVodDate = document.getElementById("edit-vod-date");
    const editVodTitle = document.getElementById("edit-vod-title");
    const editVodDescription = document.getElementById("edit-vod-description");
    const editVodTimeline = document.getElementById("edit-vod-timeline");
    const editVodTodayRecommend = document.getElementById("edit-vod-today-recommend");

    let isAdminAuthenticated = false;
    let adminSessionToken = localStorage.getItem("badabi_session") || "";
    let adminUserRole = "";
    let turnstileToken = "";
    let turnstileWidgetId = null;
    let editingVodId = "";

    function getRateLimitId() {
        let id = localStorage.getItem("badabi_rate_limit_id");
        if (id) return id;
        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);
        id = Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
        localStorage.setItem("badabi_rate_limit_id", id);
        return id;
    }

    function getAdminRoleName(role) {
        return role === "admin" ? "총괄관리자" : role === "sub_admin" ? "테스트관리자" : "관리자";
    }

    function resetTurnstile() {
        turnstileToken = "";
        if (window.turnstile && turnstileWidgetId !== null) {
            try { window.turnstile.reset(turnstileWidgetId); } catch (_) {}
        }
    }

    function renderTurnstile() {
        if (!window.turnstile || !vodTurnstile) return;
        try {
            if (turnstileWidgetId !== null) window.turnstile.remove(turnstileWidgetId);
            turnstileWidgetId = window.turnstile.render(vodTurnstile, {
                sitekey: TURNSTILE_SITE_KEY,
                callback: token => { turnstileToken = token || ""; },
                "expired-callback": resetTurnstile,
                "timeout-callback": resetTurnstile,
                theme: "auto"
            });
        } catch (error) {
            console.error("Turnstile 렌더링 실패:", error);
        }
    }

    function waitForTurnstile() {
        if (window.turnstile) { renderTurnstile(); return; }
        let count = 0;
        const timer = setInterval(() => {
            if (window.turnstile) { clearInterval(timer); renderTurnstile(); }
            else if (++count >= 50) clearInterval(timer);
        }, 100);
    }

    function openAdminAuthModal() {
        if (isAdminAuthenticated) {
            logoutAdmin();
            return;
        }
        adminLoginStatus.textContent = "";
        adminPasswordInput.value = "";
        adminAuthBackdrop.classList.add("show");
        adminAuthBackdrop.setAttribute("aria-hidden", "false");
        waitForTurnstile();
        setTimeout(() => adminPasswordInput.focus(), 50);
    }

    function closeAdminAuthModal() {
        adminAuthBackdrop.classList.remove("show");
        adminAuthBackdrop.setAttribute("aria-hidden", "true");
        if (!isAdminAuthenticated) resetTurnstile();
    }

    function updateAdminAuthUI() {
        adminLoginButton.classList.toggle("authenticated", isAdminAuthenticated);
        adminLoginButton.textContent = isAdminAuthenticated
            ? `${getAdminRoleName(adminUserRole)} · 로그아웃`
            : "관리자";
        renderVODList();
    }

    async function verifyAdminPassword() {
        const password = adminPasswordInput.value.trim();
        if (!password) { adminLoginStatus.textContent = "패스워드를 입력해주세요."; return; }
        if (!turnstileToken) { adminLoginStatus.textContent = "보안 인증을 완료해주세요."; return; }
        adminLoginStatus.style.color = "#0284c7";
        adminLoginStatus.textContent = "확인 중...";
        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password, turnstileToken, rateLimitId: getRateLimitId(), action: "verify" })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success || !data.sessionToken) throw new Error(data.error || "인증 실패");
            adminSessionToken = data.sessionToken;
            adminUserRole = data.role || "";
            isAdminAuthenticated = true;
            localStorage.setItem("badabi_session", adminSessionToken);
            resetTurnstile();
            closeAdminAuthModal();
            updateAdminAuthUI();
        } catch (error) {
            adminLoginStatus.style.color = "#ef4444";
            adminLoginStatus.textContent = error.message || "로그인에 실패했습니다.";
            resetTurnstile();
            adminPasswordInput.value = "";
        }
    }

    async function restoreAdminAuthentication() {
        if (!adminSessionToken) { updateAdminAuthUI(); return; }
        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sessionToken: adminSessionToken, action: "verify" })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success || !data.role) throw new Error();
            adminUserRole = data.role;
            isAdminAuthenticated = true;
        } catch (_) {
            adminSessionToken = "";
            adminUserRole = "";
            isAdminAuthenticated = false;
            localStorage.removeItem("badabi_session");
        }
        updateAdminAuthUI();
    }

    function logoutAdmin() {
        isAdminAuthenticated = false;
        adminSessionToken = "";
        adminUserRole = "";
        localStorage.removeItem("badabi_session");
        resetTurnstile();
        closeAdminAuthModal();
        closeVODEditModal();
        updateAdminAuthUI();
    }

    function openVODEditModal(id) {
        if (!isAdminAuthenticated) { openAdminAuthModal(); return; }
        if (adminUserRole !== "admin") {
            alert("현재 Worker 권한 설정에서는 테스트관리자는 VOD를 수정할 수 없습니다.");
            return;
        }
        const vod = VOD_DATA.find(item => item.id === id);
        if (!vod) return;
        editingVodId = id;
        editVodDate.value = vod.date || "";
        editVodTitle.value = vod.title || "";
        editVodDescription.value = vod.description || "";
        editVodTimeline.value = vod.timeline || "";
        editVodTodayRecommend.checked = !!vod.todayRecommend;
        vodEditStatus.textContent = "";
        vodEditBackdrop.classList.add("show");
        vodEditBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeVODEditModal() {
        vodEditBackdrop.classList.remove("show");
        vodEditBackdrop.setAttribute("aria-hidden", "true");
        editingVodId = "";
    }

    async function saveFanVodList() {
        if (!isAdminAuthenticated || !adminSessionToken) throw new Error("로그인 세션이 없습니다. 다시 로그인해주세요.");
        if (adminUserRole !== "admin") throw new Error("총괄관리자만 VOD 정보를 저장할 수 있습니다.");
        const vods = VOD_DATA.map(vod => ({
            ...(vod.raw || {}),
            date: vod.date,
            title: vod.title,
            link: vod.url,
            duration: vod.duration,
            subPlus: vod.subscribed ? "Y" : "N",
            adult: vod.adultVerified ? "Y" : "N",
            description: vod.description || "",
            category: Array.isArray(vod.tags) ? vod.tags.join(", ") : "",
            timeline: vod.timeline || "",
            todayRecommend: !!vod.todayRecommend
        }));
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionToken: adminSessionToken, action: "save", fileType: "fanvodlist", content: { vods } })
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
            logoutAdmin();
            throw new Error("로그인 세션이 만료되었습니다. 다시 로그인해주세요.");
        }
        if (!response.ok) throw new Error(data.error || "VOD 저장에 실패했습니다.");
    }

    async function saveVODEdit() {
        if (adminUserRole !== "admin") return;
        const vod = VOD_DATA.find(item => item.id === editingVodId);
        if (!vod) return;
        vod.description = editVodDescription.value.trim();
        vod.timeline = editVodTimeline.value.trim();
        vod.todayRecommend = editVodTodayRecommend.checked;
        vodEditSave.disabled = true;
        vodEditStatus.style.color = "#0284c7";
        vodEditStatus.textContent = "저장 중...";
        try {
            await saveFanVodList();
            vodEditStatus.style.color = "#059669";
            vodEditStatus.textContent = "저장되었습니다.";
            renderVODList();
            setTimeout(closeVODEditModal, 400);
        } catch (error) {
            vodEditStatus.style.color = "#ef4444";
            vodEditStatus.textContent = error.message || "저장에 실패했습니다.";
        } finally {
            vodEditSave.disabled = false;
        }
    }

    /* =========================================================
       UTILITY
    ========================================================= */

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(dateString) {

        const date =
            new Date(dateString + "T00:00:00");

        if (Number.isNaN(date.getTime())) {
            return dateString;
        }

        const year =
            date.getFullYear();

        const month =
            String(date.getMonth() + 1)
                .padStart(2, "0");

        const day =
            String(date.getDate())
                .padStart(2, "0");

        return `${year}.${month}.${day}`;

    }


    function normalizeSearch(value) {

        return String(value ?? "")
            .toLowerCase()
            .replace(/\s+/g, "");

    }


    /* =========================================================
       MONTH OPTIONS
    ========================================================= */

    function createMonthOptions() {

        const months = [
            ...new Set(
                VOD_DATA.map(
                    vod => vod.date.slice(0, 7)
                )
            )
        ]
        .sort()
        .reverse();


        months.forEach(month => {

            const [
                year,
                monthNumber
            ] = month.split("-");


            const option =
                document.createElement("option");


            option.value =
                month;


            option.textContent =
                `${year}년 ${Number(monthNumber)}월`;


            vodMonth.appendChild(option);

        });

    }


    /* =========================================================
       TAG OPTIONS
    ========================================================= */

    function createTagOptions() {

        const tags = [
            ...new Set(
                VOD_DATA.flatMap(
                    vod => Array.isArray(vod.tags)
                        ? vod.tags
                        : []
                )
            )
        ]
        .sort();


        tags.forEach(tag => {

            const option =
                document.createElement("option");


            option.value =
                tag;


            option.textContent =
                tag;


            vodTag.appendChild(option);

        });

    }


    /* =========================================================
       STATUS
    ========================================================= */

    function createStatusHTML(vod) {

        let html = "";


        /* 구독+전용 */

        if (vod.subscribed) {

            html += `
                <span class="status-item subscription">
                    ✓ 구독+전용
                </span>
            `;

        } else {

            html += `
                <span class="status-item">
                    ○ 일반 VOD
                </span>
            `;

        }


        /* 성인 인증 */

        if (vod.adultVerified) {

            html += `
                <span class="status-item adult">
                    ✓ 성인 인증
                </span>
            `;

        } else {

            html += `
                <span class="status-item">
                    ○ 성인 인증 없음
                </span>
            `;

        }


        return html;

    }


    /* =========================================================
       TAG HTML
    ========================================================= */

    function createTagsHTML(tags) {

        if (
            !Array.isArray(tags) ||
            tags.length === 0
        ) {
            return "";
        }


        return tags.map(tag => {

            return `
                <span class="vod-tag">
                    #${escapeHTML(tag)}
                </span>
            `;

        }).join("");

    }


    /* =========================================================
       RENDER
    ========================================================= */

    function renderVODList() {

        const searchValue =
            normalizeSearch(
                vodSearch.value
            );


        const selectedMonth =
            vodMonth.value;


        const selectedTag =
            vodTag.value;


        const filtered =
            VOD_DATA

                .filter(vod => {

                    /* 제목 */

                    const titleMatch =
                        !searchValue ||
                        normalizeSearch(vod.title)
                            .includes(searchValue);


                    /* 월 */

                    const monthMatch =
                        !selectedMonth ||
                        vod.date.startsWith(
                            selectedMonth
                        );


                    /* 태그 */

                    const tagMatch =
                        !selectedTag ||
                        (
                            Array.isArray(vod.tags) &&
                            vod.tags.includes(
                                selectedTag
                            )
                        );


                    return (
                        titleMatch &&
                        monthMatch &&
                        tagMatch
                    );

                })

                .sort((a, b) => {

                    return b.date.localeCompare(
                        a.date
                    );

                });


        resultCount.textContent =
            `VOD ${filtered.length}개`;


        if (filtered.length === 0) {

            vodList.innerHTML = `
                <div class="empty-state">

                    <strong>
                        검색 결과가 없습니다.
                    </strong>

                    <span>
                        다른 제목, 기간 또는 태그로 검색해보세요.
                    </span>

                </div>
            `;

            return;
        }


        vodList.innerHTML =
            filtered.map(vod => {

                return `
                    <article
                        class="vod-card"
                        data-id="${escapeHTML(vod.id)}"
                        tabindex="0"
                        role="button"
                        aria-label="${escapeHTML(vod.title)} 상세보기"
                    >

                        <div class="vod-card-main">

                            <div class="vod-date">
                                ${escapeHTML(
                                    formatDate(vod.date)
                                )}
                            </div>


                            <h2 class="vod-title">
                                ${escapeHTML(vod.title)}
                            </h2>

                            ${vod.description ? `
                                <div class="vod-description">
                                    ${escapeHTML(vod.description)}
                                </div>
                            ` : ""}


                            <!-- 구독 + 성인 인증 -->

                            <div class="vod-status">
                                ${createStatusHTML(vod)}
                            </div>


                            <!-- 태그 -->

                            <div class="vod-tags">
                                ${createTagsHTML(vod.tags)}
                            </div>

                            ${isAdminAuthenticated && adminUserRole === "admin" ? `
                                <button type="button" class="admin-edit-button" data-edit-id="${escapeHTML(vod.id)}">편집</button>
                            ` : ""}

                        </div>

                    </article>
                `;

            })
            .join("");


        document
            .querySelectorAll(".vod-card")
            .forEach(card => {

                card.addEventListener(
                    "click",
                    event => {
                        if (event.target.closest(".admin-edit-button")) return;
                        openVODModal(card.dataset.id);
                    }
                );


                card.addEventListener(
                    "keydown",
                    event => {

                        if (event.target.closest(".admin-edit-button")) return;

                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();

                            openVODModal(
                                card.dataset.id
                            );

                        }

                    }
                );

            });

    }


    /* =========================================================
       MODAL
    ========================================================= */

    function openVODModal(id) {

        const vod =
            VOD_DATA.find(
                item => item.id === id
            );


        if (!vod) {
            return;
        }


        modalDate.textContent =
            formatDate(vod.date);


        modalTitle.textContent =
            vod.title;


        modalStatus.innerHTML =
            createStatusHTML(vod);


        modalTags.innerHTML =
            createTagsHTML(vod.tags);


        modalDescription.textContent =
            vod.description ||
            "등록된 영상 설명이 없습니다.";


        modalContent.textContent =
            vod.timeline ||
            "등록된 타임라인이 없습니다.";


        /* 공식 VOD */

        if (
            vod.url &&
            vod.url !== "#"
        ) {

            modalLink.href =
                vod.url;

            modalLink.classList.remove(
                "disabled"
            );

            modalLink.textContent =
                "VOD 보러가기";

            modalLink.target =
                "_blank";

        } else {

            modalLink.href =
                "#";

            modalLink.classList.add(
                "disabled"
            );

            modalLink.textContent =
                "VOD 링크 준비 중";

            modalLink.removeAttribute(
                "target"
            );

        }


        modalBackdrop.classList.add(
            "show"
        );


        modalBackdrop.setAttribute(
            "aria-hidden",
            "false"
        );


        document.body.style.overflow =
            "hidden";

    }


    function closeVODModal() {

        modalBackdrop.classList.remove(
            "show"
        );


        modalBackdrop.setAttribute(
            "aria-hidden",
            "true"
        );


        document.body.style.overflow =
            "";

    }


    /* =========================================================
       EVENTS
    ========================================================= */

    vodList.addEventListener("click", event => {
        const editButton = event.target.closest(".admin-edit-button");
        if (!editButton) return;
        event.preventDefault();
        event.stopPropagation();
        openVODEditModal(editButton.dataset.editId);
    });


    vodSearch.addEventListener(
        "input",
        renderVODList
    );


    vodMonth.addEventListener(
        "change",
        renderVODList
    );


    vodTag.addEventListener(
        "change",
        renderVODList
    );


    modalClose.addEventListener(
        "click",
        closeVODModal
    );


    modalBackdrop.addEventListener(
        "click",
        event => {

            if (
                event.target === modalBackdrop
            ) {
                closeVODModal();
            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {
            if (event.key !== "Escape") return;
            if (modalBackdrop.classList.contains("show")) closeVODModal();
            if (adminAuthBackdrop.classList.contains("show")) closeAdminAuthModal();
            if (vodEditBackdrop.classList.contains("show")) closeVODEditModal();
        }
    );

    adminLoginButton.addEventListener("click", openAdminAuthModal);
    adminAuthClose.addEventListener("click", closeAdminAuthModal);
    adminAuthBackdrop.addEventListener("click", event => { if (event.target === adminAuthBackdrop) closeAdminAuthModal(); });
    adminPasswordToggle.addEventListener("click", () => {
        const visible = adminPasswordInput.type === "password";
        adminPasswordInput.type = visible ? "text" : "password";
        adminPasswordToggle.textContent = visible ? "숨기기" : "보기";
    });
    adminLoginSubmit.addEventListener("click", verifyAdminPassword);
    adminPasswordInput.addEventListener("keydown", event => { if (event.key === "Enter") verifyAdminPassword(); });
    vodEditClose.addEventListener("click", closeVODEditModal);
    vodEditCancel.addEventListener("click", closeVODEditModal);
    vodEditSave.addEventListener("click", saveVODEdit);
    vodEditBackdrop.addEventListener("click", event => { if (event.target === vodEditBackdrop) closeVODEditModal(); });


    /* =========================================================
       INITIALIZE
    ========================================================= */
    loadVODData();
    restoreAdminAuthentication();
</script>

</body>
</html>
