<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노래 위젯 관리 페이지</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; max-width: 950px; margin: 30px auto; padding: 20px; background-color: #f4f7f9; color: #2b2d42; }
        h2 { color: #03045e; border-bottom: 2px solid rgba(0, 119, 190, 0.2); padding-bottom: 10px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 119, 190, 0.1); margin-bottom: 20px; border: 1px solid rgba(0, 119, 190, 0.15); }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #0077b6; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 12px; border: 1px solid rgba(0, 119, 190, 0.25); border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; font-size: 14px; background: #fafbfc; }
        button { background-color: #0077b6; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.2s ease; }
        button:hover { background-color: #03045e; transform: translateY(-1px); }
        #admin-app-container { margin-top: 20px; }
    </style>
</head>
<body>

    <h2>노래 위젯 관리 페이지</h2>

    <div id="login-section" class="card">
        <h3>🔐 인증</h3>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 15px;">관리페이지를 이용하려면 비밀번호를 입력해주세요.</p>
        <input type="password" id="admin-password" placeholder="비밀번호 입력">
        <button onclick="verifyAndLoad()" style="width: 100%;">로그인 하기</button>
        <div id="login-status" style="margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div id="admin-app-container"></div>

    <script src="widgetadmin.js"></script>
    <!-- 기타 필요한 JS 파일들 -->
</body>
</html>
