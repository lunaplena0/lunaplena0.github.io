<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 프로필</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 20px; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        /* 왼쪽 바다비 GIF 영역 */
        .profile-main-gif {
            position: relative;
            width: 650px; 
            height: 650px;
            background-image: url('바다비.gif'); 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                                linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                        linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-composite: intersect;

            filter: drop-shadow(0 0 35px rgba(0, 119, 190, 0.5));
            z-index: 3;
            flex-shrink: 0;
            margin-right: -120px;
        }

        /* 오른쪽 프로필 카드 영역 (글씨 가독성을 위한 배경 패널 및 외곽 그림자/글로우 효과 추가) */
        .profile-info-card {
            position: relative;
            z-index: 1;
            /* 은은한 흰색 반투명 배경을 주어 이미지 위에서도 글씨가 선명하게 보이도록 수정 */
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 119, 190, 0.12);
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            color: #2b2d42; 
            box-sizing: border-box;
            
            /* 왼쪽(이미지 쪽)으로 갈수록 배경이 부드럽게 사라지도록 마스크 페이드 적용 */
            mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 20%, rgba(0,0,0,1) 50%, rgba(0,0,0,1) 100%);
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 20%, rgba(0,0,0,1) 50%, rgba(0,0,0,1) 100%);
            padding: 35px;
        }

        /* 상단 헤더 (우측 정렬) */
        .profile-header-top {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100%;
            text-align: right;
        }

        .profile-name {
            font-size: clamp(36px, 4.5vw, 48px);
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #03045e;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8); /* 글자 가독성 강화 */
        }

        /* 캐치프레이즈 영역 */
        .profile-catchphrase {
            display: inline-block;
            font-size: clamp(14px, 1.4vw, 16px);
            line-height: 1.5;
            color: #0077b6;
            background: transparent; 
            padding: 0;
            border: none;
            font-weight: 600;
            text-align: right;
            text-shadow: 0 1px 8px rgba(255, 255, 255, 0.8);
        }

        /* 정보 영역 스타일 (우측 정렬) */
        .profile-info-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: transparent; 
            padding: 0;
            border: none;
            box-sizing: border-box;
            text-align: right;
        }

        .info-item {
            font-size: clamp(14px, 1.3vw, 17px);
            line-height: 1.6;
            display: flex;
            justify-content: flex-end;
            align-items: baseline;
            gap: 10px;
            color: #334155;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.8);
        }

        .info-label {
            font-weight: 800;
            color: #0077b6;
        }

        /* 하단 소개말 영역 (우측 정렬) */
        .profile-bio-box {
            width: 100%;
            text-align: right;
            font-size: clamp(13px, 1.2vw, 15px);
            line-height: 1.7;
            color: #1e293b;
            background: transparent; 
            padding: 0;
            border: none;
            box-sizing: border-box;
            word-break: keep-all;
            font-weight: 500;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.8);
        }

        .profile-bio-box p { margin: 0; }
        .profile-bio-box p:first-child {
            font-weight: 800;
            margin-bottom: 6px;
            color: #03045e;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .ocean-profile-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                padding: 16px;
                gap: 20px;
            }
            .profile-main-gif {
                width: 320px;
                height: 320px;
                margin-right: 0;
            }
            .profile-info-card {
                max-width: 100%;
                padding: 20px;
                mask-image: none;
                -webkit-mask-image: none;
            }
            .profile-header-top, .profile-info-grid, .profile-bio-box {
                text-align: center;
                align-items: center;
            }
            .info-item {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <!-- 왼쪽 큰 이미지(GIF) 영역 -->
        <div class="profile-main-gif"></div>

        <!-- 오른쪽 프로필 카드 (이미지와 겹치는 부분의 가독성을 높이기 위해 은은한 반투명 배경 및 텍스트 섀도우 추가) -->
        <div class="profile-info-card">
            <div class="profile-header-top">
                <div class="profile-name">바다비。</div>
                <div class="profile-catchphrase">
                    오시마크: 🌊🌧️ <br>팬덤 명: 꼬용이
                </div>
            </div>

            <div class="profile-info-grid">
                <div class="info-item"><span class="info-label">나이</span> 20살</div>
                <div class="info-item"><span class="info-label">생일</span> 1월 9일</div>
                <div class="info-item"><span class="info-label">성별</span> 여자</div>
                <div class="info-item"><span class="info-label">인간키</span> 152cm</div>
                <div class="info-item"><span class="info-label">종족</span> 미니블루드래곤(갯민숭달팽이) 💙</div>
                <div class="info-item"><span class="info-label">데뷔일</span> 2026년 4월 20일</div>
                <div class="info-item"><span class="info-label">방송시간</span> 평일 오후 4시 / 주말 오후 2시</div>
                <div class="info-item"><span class="info-label">주 컨텐츠</span> 소통 & 노래 & 춤 & 기타연주 노래 & ASMR</div>
            </div>

            <div class="profile-bio-box">
                <p>바다의 작은 용 , 잘못 만지면 아파요! ↜(⃔っ•̤ ༝ •̤c)⃕</p>
                <p>"바다의 작은 용? 아니, 바다의 독가시!<br>만져서 찔리면 약도 없는 치명적인 매력, 바다비입니다!"</p>
            </div>
        </div>
    </div>

</body>
</html>
