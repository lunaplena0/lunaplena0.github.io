<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 프로필</title>
    <style>
        /* 전체 페이지 기본 설정: 세로 정렬 및 배경 색상 지정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 상단 네비게이션 바 스타일: 고정 및 블러 효과 적용 */
        .marine-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(3, 4, 94, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 12px 24px;
        }

        /* 네비게이션바 내부 컨테이너 정렬 */
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 네비게이션 로고 스타일 */
        .nav-logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #caf0f8;
            text-decoration: none;
        }

        /* 네비게이션 링크 리스트 스타일 */
        .nav-links {
            display: flex;
            gap: 16px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* 네비게이션 개별 링크 스타일 및 호버 효과 */
        .nav-links a {
            color: #90e0ef;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
            padding: 6px 6px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 메인 콘텐츠 영역: 프로필 카드와 이미지를 감싸는 컨테이너 */
        .ocean-profile-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            flex: 1;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 20px; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        /* 왼쪽 바다비 GIF 영역 (페이드 인 애니메이션 적용) */
        .profile-main-gif {
            position: relative;
            width: 650px; 
            height: 650px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                                linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                        linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-composite: intersect;

            filter: drop-shadow(0 0 35px rgba(0, 119, 190, 0.5));
            z-index: 3;
            flex-shrink: 0;
            margin-right: -120px;

            /* 초기 상태 숨김 및 애니메이션 준비 */
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* 이미지가 로드된 후 부드럽게 나타나도록 하는 클래스 */
        .profile-main-gif.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* 오른쪽 프로필 카드 영역 (페이드 인 애니메이션 적용) */
        .profile-info-card {
            position: relative;
            z-index: 1;
            background: transparent; 
            border: none; 
            box-shadow: none; 
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            color: #2b2d42; 
            box-sizing: border-box;
            padding: 20px;

            /* 초기 상태 숨김 및 애니메이션 준비 */
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* 카드가 로드된 후 부드럽게 나타나도록 하는 클래스 */
        .profile-info-card.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* 프로필 헤더(이름 및 캐치프레이즈) 정렬 영역 */
        .profile-header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
        }

        /* 프로필 이름 스타일 */
        .profile-name {
            font-size: clamp(36px, 4.5vw, 48px);
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #03045e;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        /* 프로필 캐치프레이즈 스타일 */
        .profile-catchphrase {
            display: inline-block;
            font-size: clamp(14px, 1.4vw, 16px);
            line-height: 1.5;
            color: #0077b6;
            background: transparent; 
            padding: 0;
            border: none;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        /* 상세 정보 그리드 영역 컨테이너 */
        .profile-info-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: transparent; 
            padding: 0 0 0 40px;
            border: none;
            box-sizing: border-box;
        }

        /* 개별 상세 정보 아이템 스타일 */
        .info-item {
            font-size: clamp(14px, 1.3vw, 17px);
            line-height: 1.6;
            display: grid;
            grid-template-columns: 75px 1fr;
            align-items: baseline;
            gap: 5px;
            color: #334155;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
            text-align: left;
        }

        /* 상세 정보 라벨 스타일 */
        .info-label {
            font-weight: 800;
            color: #0077b6;
            text-align: left;
        }

        /* 하단 자기소개 박스 스타일 */
        .profile-bio-box {
            width: 100%;
            text-align: center;
            font-size: clamp(13px, 1.2vw, 15px);
            line-height: 1.7;
            color: #1e293b;
            background: transparent; 
            padding: 0;
            border: none;
            box-sizing: border-box;
            word-break: keep-all;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .profile-bio-box p { margin: 0; }
        .profile-bio-box p:first-child {
            font-weight: 800;
            margin-bottom: 6px;
            color: #03045e;
        }

        /* 모바일 화면 대응 미디어 쿼리 (768px 이하) */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .ocean-profile-container {
                flex-direction: column;
                height: auto;
                min-height: auto;
                padding: 16px;
                gap: 20px;
            }
            .profile-main-gif {
                width: 250px;
                height: 250px;
                margin-right: 0;
            }
            .profile-info-card {
                max-width: 100%;
                padding: 10px;
            }
            .profile-header-top, .profile-bio-box {
                text-align: center;
                align-items: center;
            }
            .profile-info-grid {
                padding: 0 0 0 0;
            }
            .info-item {
                text-align: left;
                grid-template-columns: 50px 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="marine-nav">
        <div class="nav-container">
            <a href="#" class="nav-logo">BABABI FAN ARCHIVE</a>
            <ul class="nav-links">
                <li><a href="profile.html">프로필</a></li>
                <li><a href="link.html">주소모음</a></li>
            </ul>
        </div>
    </nav>

    <!-- 메인 프로필 레이아웃 컨테이너 -->
    <div class="ocean-profile-container">
        <!-- 왼쪽 큰 이미지(GIF) 영역 -->
        <div class="profile-main-gif" id="profile-gif"></div>

        <!-- 오른쪽 프로필 카드 -->
        <div class="profile-info-card" id="profile-card">
            <!-- 이름 및 캐치프레이즈 출력 영역 -->
            <div class="profile-header-top">
                <div class="profile-name" id="view-name">로딩 중...</div>
                <div class="profile-catchphrase" id="view-catchphrase"></div>
            </div>

            <!-- 상세 정보 동적 생성 그리드 영역 -->
            <div class="profile-info-grid" id="view-info-grid"></div>

            <!-- 하단 자기소개글 동적 생성 영역 -->
            <div class="profile-bio-box" id="view-bio-box"></div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const response = await fetch('https://badabi-api.dalkkumli054.workers.dev/?type=profile&t=' + new Date().getTime());
                if (!response.ok) throw new Error("프로필 데이터를 불러오지 못했습니다.");
                const data = await response.json();

                // 1. 이름 및 캐치프레이즈 데이터 바인딩
                document.getElementById("view-name").textContent = data.name || "바다비。";
                document.getElementById("view-catchphrase").innerHTML = (data.catchphrase || "").replace(/\n/g, '<br>');

                // 2. 왼쪽 프로필 GIF 이미지 경로 동적 적용
                const gifEl = document.getElementById("profile-gif");
                if (data.image) {
                    gifEl.style.backgroundImage = `url('${data.image}')`;
                }

                // 3. 동적 상세 프로필 그리드 구성
                const gridEl = document.getElementById("view-info-grid");
                let fields = [];

                if (Array.isArray(data.details)) {
                    data.details.forEach(item => {
                        if (item.key && item.value) {
                            fields.push({ label: item.key, val: item.value });
                        }
                    });
                }

                if (data.time) fields.push({ label: "방송시간", val: data.time });
                if (data.content) fields.push({ label: "컨텐츠", val: data.content });

                gridEl.innerHTML = fields
                    .map(item => `<div class="info-item"><span class="info-label">${item.label}</span> ${item.val}</div>`)
                    .join('');

                // 4. 하단 소개말 구성
                const bioEl = document.getElementById("view-bio-box");
                bioEl.innerHTML = `
                    <p>${data.bio1 || ''}</p>
                    <p>${(data.bio2 || '').replace(/\n/g, '<br>')}</p>
                `;

                // 5. 모든 데이터 바인딩이 끝난 직후 페이드 인 애니메이션 클래스 추가
                gifEl.classList.add('loaded');
                document.getElementById("profile-card").classList.add('loaded');

            } catch (error) {
                console.error(error);
                document.getElementById("view-name").textContent = "데이터 로드 실패";
                // 에러 발생 시에도 화면이 나타나도록 처리
                document.getElementById("profile-gif").classList.add('loaded');
                document.getElementById("profile-card").classList.add('loaded');
            }
        }

        loadProfile();
    </script>

</body>
</html>
