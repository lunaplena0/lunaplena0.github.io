<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 프로필</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 20px; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        /* 왼쪽 바다비 GIF 영역 (좌우 및 상하 부드러운 마스크 페이드 적용) */
        .profile-main-gif {
            position: relative;
            width: 650px; 
            height: 650px;
            background-image: url('바다비.gif'); /* 기본값, JS로 변경 가능 */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                                linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%),
                        linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 15%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            mask-composite: intersect;

            filter: drop-shadow(0 0 35px rgba(0, 119, 190, 0.5));
            z-index: 3;
            flex-shrink: 0;
            margin-right: -120px;
        }

        /* 오른쪽 프로필 카드 영역 */
        .profile-info-card {
            position: relative;
            z-index: 1;
            background: transparent; 
            border: none; 
            box-shadow: none; 
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            color: #2b2d42; 
            box-sizing: border-box;
            padding: 20px;
        }

        .profile-header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
        }

        .profile-name {
            font-size: clamp(36px, 4.5vw, 48px);
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #03045e;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .profile-catchphrase {
            display: inline-block;
            font-size: clamp(14px, 1.4vw, 16px);
            line-height: 1.5;
            color: #0077b6;
            background: transparent; 
            padding: 0;
            border: none;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .profile-info-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: transparent; 
            padding: 0;
            border: none;
            box-sizing: border-box;
            align-items: center;
            text-align: center;
        }

        .info-item {
            font-size: clamp(14px, 1.3vw, 17px);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 10px;
            color: #334155;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .info-label {
            font-weight: 800;
            color: #0077b6;
        }

        .profile-bio-box {
            width: 100%;
            text-align: center;
            font-size: clamp(13px, 1.2vw, 15px);
            line-height: 1.7;
            color: #1e293b;
            background: transparent; 
            padding: 0;
            border: none;
            box-sizing: border-box;
            word-break: keep-all;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .profile-bio-box p { margin: 0; }
        .profile-bio-box p:first-child {
            font-weight: 800;
            margin-bottom: 6px;
            color: #03045e;
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .ocean-profile-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                padding: 16px;
                gap: 20px;
            }
            .profile-main-gif {
                width: 320px;
                height: 320px;
                margin-right: 0;
            }
            .profile-info-card {
                max-width: 100%;
                padding: 10px;
            }
            .profile-header-top, .profile-info-grid, .profile-bio-box {
                text-align: center;
                align-items: center;
            }
            .info-item {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <!-- 왼쪽 큰 이미지(GIF) 영역 -->
        <div class="profile-main-gif" id="profile-gif"></div>

        <!-- 오른쪽 프로필 카드 (동적 바인딩 영역) -->
        <div class="profile-info-card">
            <div class="profile-header-top">
                <div class="profile-name" id="view-name">로딩 중...</div>
                <div class="profile-catchphrase" id="view-catchphrase"></div>
            </div>

            <div class="profile-info-grid" id="view-info-grid">
                <!-- JS로 자동 생성됨 -->
            </div>

            <div class="profile-bio-box" id="view-bio-box">
                <!-- JS로 자동 생성됨 -->
            </div>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const response = await fetch('profile.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("프로필 데이터를 불러오지 못했습니다.");
                const data = await response.json();

                // 1. 이름 및 캐치프레이즈 적용 (줄바꿈 허용)
                document.getElementById("view-name").textContent = data.name || "바다비。";
                document.getElementById("view-catchphrase").innerHTML = (data.catchphrase || "").replace(/\n/g, '<br>');

                // 2. 정보 그리드 구성
                const gridEl = document.getElementById("view-info-grid");
                const fields = [
                    { label: "나이", val: data.age },
                    { label: "생일", val: data.birthday },
                    { label: "성별", val: data.gender },
                    { label: "인간키", val: data.height },
                    { label: "종족", val: data.species },
                    { label: "데뷔일", val: data.debut },
                    { label: "방송시간", val: data.time },
                    { label: "주 컨텐츠", val: data.content }
                ];

                gridEl.innerHTML = fields
                    .filter(item => item.val) // 값이 있는 항목만 출력
                    .map(item => `<div class="info-item"><span class="info-label">${item.label}</span> ${item.val}</div>`)
                    .join('');

                // 3. 하단 소개말 구성
                const bioEl = document.getElementById("view-bio-box");
                bioEl.innerHTML = `
                    <p>${data.bio1 || ''}</p>
                    <p>${(data.bio2 || '').replace(/\n/g, '<br>')}</p>
                `;

                // 4. 움짤 이미지 설정 (만약 profile.json에 gif 주소 필드가 있다면 연동, 없으면 기본 파일 유지)
                if (data.gifUrl) {
                    document.getElementById("profile-gif").style.backgroundImage = `url('${data.gifUrl}')`;
                }

            } catch (error) {
                console.error(error);
                document.getElementById("view-name").textContent = "데이터 로드 실패";
            }
        }

        loadProfile();
    </script>

</body>
</html>
