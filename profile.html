<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 프로필</title>
    <style>
        body {
    margin: 0;
    width: 100vw;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f4f7f9;
    overflow-x: hidden;
}

.ocean-profile-container {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center; 
    gap: 40px; 
    padding: 20px; /* 양옆 여백을 줄이거나 0으로 설정 가능 */
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: transparent; 
}

        /* 왼쪽 바다비 GIF 영역 (정사각형 박스에 맞춘 4방향 균일 선형 페이드) */
        .profile-gif-area {
            position: relative;
            width: 350px; 
            height: 350px;
            background-image: url('바다비.gif'); 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 20%, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%),
                                linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 20%, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 20%, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%),
                        linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 20%, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%);
            mask-composite: intersect;

            filter: drop-shadow(0 0 25px rgba(0, 119, 190, 0.6));
            
            z-index: 1;
            opacity: 0.95;
            flex-shrink: 0;
        }

        /* 오른쪽 프로필 카드 박스 (화면 비율에 맞춰 가득 차도록 확장) */
       .profile-info-card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.85); 
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 119, 190, 0.15);
    border-radius: 12px; 
    padding: 40px;
    box-shadow: 0 20px 45px rgba(0, 119, 190, 0.15);
    max-width: 900px; /* 기존 600px에서 더 넓게 확장 가능 */
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 24px;
    color: #2b2d42; 
    box-sizing: border-box;
}

        /* 상단 프로필 헤더 (움짤 + 이름/캐치프레이즈 가로 배치) */
        .profile-header-top {
            display: flex;
            align-items: center;
            gap: 24px;
            width: 100%;
        }

        /* 카드 내부로 옮겨온 GIF 영역 */
        .profile-header-top .profile-gif-area {
            width: 130px;
            height: 130px;
            filter: drop-shadow(0 0 15px rgba(0, 119, 190, 0.5));
        }

        .profile-titles {
            flex: 1;
            text-align: left;
        }

        .profile-name {
            font-size: clamp(32px, 4vw, 42px);
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #03045e;
        }

        /* 캐치프레이즈 영역 */
        .profile-catchphrase {
            display: inline-block;
            font-size: clamp(13px, 1.3vw, 15px);
            line-height: 1.4;
            color: #0077b6;
            background: rgba(0, 119, 190, 0.08);
            padding: 7px 14px;
            border-radius: 4px; 
            border-left: 4px solid #0077b6; 
            font-weight: 600;
        }

        /* 정보 영역 스타일 */
        .profile-info-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.6);
            padding: 16px 24px;
            border-radius: 8px; 
            border: 1px solid rgba(0, 119, 190, 0.1);
            box-sizing: border-box;
        }

        .info-item {
            font-size: clamp(14px, 1.4vw, 16px);
            line-height: 1.5;
            display: flex;
            align-items: baseline;
            gap: 16px;
            color: #334155;
        }

        .info-label {
            font-weight: 800;
            color: #0077b6;
            min-width: 100px;
            flex-shrink: 0;
        }

        /* 하단 소개말 영역 */
        .profile-bio-box {
            width: 100%;
            text-align: center;
            font-size: clamp(14px, 1.4vw, 16.5px);
            line-height: 1.6;
            color: #1e293b;
            background: rgba(255, 255, 255, 0.6);
            padding: 16px 20px;
            border-radius: 8px; 
            border: 1px solid rgba(0, 119, 190, 0.1);
            box-sizing: border-box;
            word-break: keep-all;
            font-weight: 500;
        }

        .profile-bio-box p { margin: 0; }
        .profile-bio-box p:first-child {
            font-weight: 800;
            margin-bottom: 6px;
            color: #03045e;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .ocean-profile-container {
                height: auto;
                min-height: 100vh;
                padding: 16px;
            }
            .profile-info-card {
                height: auto;
                max-height: none;
                padding: 24px;
                gap: 16px;
            }
            .profile-header-top {
                flex-direction: row;
                align-items: center;
                text-align: left;
            }
            .profile-titles {
                text-align: left;
            }
            .profile-info-grid {
                gap: 12px;
                flex-grow: 0;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <!-- 오른쪽 프로필 카드 영역 (GIF를 상단 왼쪽으로 이동 통합) -->
        <div class="profile-info-card">
            <div class="profile-header-top">
                <!-- 기존 GIF 영역을 카드 상단 왼쪽에 배치 (효과 및 페이드 유지) -->
                <div class="profile-gif-area"></div>
                <div class="profile-titles">
                    <div class="profile-name">바다비。</div>
                    <div class="profile-catchphrase">
                        오시마크: 🌊🌧️ &nbsp;|&nbsp; 팬덤명: 꼬용이
                    </div>
                </div>
            </div>

            <div class="profile-info-grid">
                <div class="info-item"><span class="info-label">나이</span> 20살</div>
                <div class="info-item"><span class="info-label">생일</span> 1월 9일</div>
                <div class="info-item"><span class="info-label">성별</span> 여자</div>
                <div class="info-item"><span class="info-label">인간키</span> 152cm</div>
                <div class="info-item"><span class="info-label">종족</span> 미니블루드래곤(갯민숭달팽이) 💙</div>
                <div class="info-item"><span class="info-label">데뷔일</span> 2026년 4월 20일</div>
                <div class="info-item"><span class="info-label">방송시간</span> 평일 오후 4시 / 주말 오후 2시</div>
                <div class="info-item"><span class="info-label">주 컨텐츠</span> 소통 & 노래 & 춤 & 기타연주 노래 & ASMR</div>
            </div>

            <div class="profile-bio-box">
                <p>바다의 작은 용 , 잘못 만지면 아파요! ↜(⃔っ•̤ ༝ •̤c)⃕</p>
                <p>"바다의 작은 용? 아니, 바다의 독가시!<br>만져서 찔리면 약도 없는 치명적인 매력, 바다비입니다!"</p>
            </div>
        </div>
    </div>

</body>
</html>
