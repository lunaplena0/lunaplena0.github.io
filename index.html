<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바다비 팬 아카이브</title>
<meta name="description" content="바다비 팬 아카이브">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f7fbff;
    color: #334155;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

img {
    max-width: 100%;
}

.site {
    width: 100%;
    min-height: 100vh;
}

.container {
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto;
}


/* =========================================================
   상단 헤더
========================================================= */

.top-header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-bottom: 1px solid #e7eef5;
}

.top-header-inner {
    height: 68px;

    display: flex;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    font-weight: 800;
    color: #0f172a;
}

.brand-icon {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: #e0f2fe;
    color: #0284c7;

    font-size: 17px;
}

.brand-text {
    font-size: 17px;
}

.top-nav {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 6px;
}

.top-nav a {
    padding: 8px 11px;

    border-radius: 9px;

    color: #64748b;

    font-size: 12px;
    font-weight: 700;

    transition: background 0.2s ease, color 0.2s ease;
}

.top-nav a:hover {
    background: #f0f9ff;
    color: #0284c7;
}


/* =========================================================
   메인
========================================================= */

main {
    padding: 34px 0 70px;
}


/* =========================================================
   프로필
========================================================= */

.profile-card {
    position: relative;
    overflow: hidden;

    padding: 32px;

    border: 1px solid #e4edf5;
    border-radius: 24px;

    background: #ffffff;

    box-shadow:
        0 8px 30px rgba(30, 64, 175, 0.05);
}

.profile-card::before {
    content: "";

    position: absolute;
    top: -100px;
    right: -80px;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: #e0f2fe;
    opacity: 0.55;
}

.profile-content {
    position: relative;
    z-index: 1;

    display: flex;
    align-items: center;
    gap: 25px;
}

.profile-image {
    width: 112px;
    height: 112px;

    flex: 0 0 112px;

    object-fit: cover;

    border-radius: 28px;

    background: #e0f2fe;
    border: 4px solid #ffffff;

    box-shadow:
        0 5px 18px rgba(14, 165, 233, 0.18);
}

.profile-info {
    min-width: 0;
}

.profile-name {
    margin: 0;

    color: #0f172a;

    font-size: 28px;
    line-height: 1.2;
    font-weight: 800;
}

.profile-message {
    margin: 10px 0 0;

    color: #64748b;

    font-size: 14px;
    line-height: 1.7;
}

.profile-sub {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;

    margin-top: 13px;
}

.profile-tag {
    padding: 5px 9px;

    border-radius: 8px;

    background: #f0f9ff;
    color: #0284c7;

    font-size: 11px;
    font-weight: 700;
}


/* =========================================================
   바로가기
========================================================= */

.quick-links {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;

    margin-top: 18px;
}

.quick-link {
    min-height: 76px;

    display: flex;
    align-items: center;
    gap: 13px;

    padding: 15px 17px;

    border: 1px solid #e4edf5;
    border-radius: 17px;

    background: #ffffff;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.quick-link:hover {
    transform: translateY(-2px);

    border-color: #bae6fd;

    box-shadow:
        0 8px 22px rgba(14, 165, 233, 0.08);
}

.quick-icon {
    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: #f0f9ff;
    color: #0284c7;

    font-size: 18px;
}

.quick-text {
    min-width: 0;
}

.quick-title {
    display: block;

    color: #1e293b;

    font-size: 13px;
    font-weight: 800;
}

.quick-description {
    display: block;

    margin-top: 3px;

    color: #94a3b8;

    font-size: 11px;
}


/* =========================================================
   섹션
========================================================= */

.section {
    margin-top: 22px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 12px;
}

.section-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #0ea5e9;
}

.section-title {
    margin: 0;

    color: #1e293b;

    font-size: 17px;
    font-weight: 800;
}

.section-more {
    color: #94a3b8;

    font-size: 12px;
    font-weight: 600;
}


/* =========================================================
   월간 일정 + 타임라인
========================================================= */

.content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;

    align-items: stretch;
}


/* =========================================================
   공통 카드
========================================================= */

.card {
    border: 1px solid #e4edf5;
    border-radius: 20px;

    background: #ffffff;

    box-shadow:
        0 6px 24px rgba(30, 64, 175, 0.04);
}


/* =========================================================
   월간 일정
========================================================= */

.schedule-card {
    min-height: 400px;
    height: auto;

    padding: 20px;

    overflow: hidden;
}

.month-header {
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 12px;
}

.month-title {
    color: #1e293b;

    font-size: 17px;
    font-weight: 800;
}

.month-control {
    display: flex;
    gap: 5px;
}

.month-button {
    width: 30px;
    height: 30px;

    border: 1px solid #e2e8f0;
    border-radius: 9px;

    background: #ffffff;
    color: #64748b;

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease;
}

.month-button:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
}


/* 달력 전체 크기 고정 */

.calendar {
    width: 100%;
    height: auto;

    border-collapse: collapse;
    border-spacing: 0;

    table-layout: fixed;
}

.calendar thead {
    height: 30px;
}

.calendar tbody tr {
    height: 64px;
}

.calendar th {
    width: 14.2857%;
    height: 30px;

    padding: 0;

    color: #94a3b8;

    font-size: 11px;
    font-weight: 700;

    text-align: center;
}

.calendar td {
    width: 14.2857%;
    height: 64px;

    padding: 5px;

    vertical-align: top;

    border-top: 1px solid #f1f5f9;

    color: #64748b;

    font-size: 11px;
}

.calendar-day {
    display: inline-flex;

    width: 23px;
    height: 23px;

    align-items: center;
    justify-content: center;

    border-radius: 7px;
}

.calendar td.today .calendar-day {
    background: #0ea5e9;
    color: #ffffff;

    font-weight: 800;
}

.calendar-event {
    display: block;

    margin-top: 3px;
    padding: 2px 4px;

    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    border-radius: 5px;

    background: #f0f9ff;
    color: #0284c7;

    font-size: 9px;
    font-weight: 700;
}


.calendar-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.38);
}

.calendar-modal-backdrop.open {
    display: flex;
}

.calendar-modal {
    width: min(440px, 100%);
    max-height: min(620px, 90vh);
    overflow: hidden;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
}

.calendar-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid #f1f5f9;
}

.calendar-modal-title {
    margin: 0;
    color: #0f172a;
    font-size: 16px;
    font-weight: 800;
}

.calendar-modal-close {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 9px;
    background: #f8fafc;
    color: #64748b;
    font-size: 18px;
    cursor: pointer;
}

.calendar-modal-list {
    max-height: calc(min(620px, 90vh) - 70px);
    overflow-y: auto;
    padding: 12px;
}

.calendar-modal-item {
    padding: 13px;
    border: 1px solid #e2e8f0;
    border-radius: 13px;
    background: #f8fafc;
}

.calendar-modal-item + .calendar-modal-item {
    margin-top: 9px;
}

.calendar-modal-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 7px;
}

.calendar-modal-badge {
    padding: 3px 7px;
    border-radius: 6px;
    background: #e0f2fe;
    color: #0284c7;
    font-size: 9px;
    font-weight: 800;
}

.calendar-modal-event-title {
    margin: 0;
    color: #0f172a;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.5;
    word-break: keep-all;
}

.calendar-modal-category {
    margin: 6px 0 0;
    color: #64748b;
    font-size: 10px;
    line-height: 1.4;
}

.calendar-modal-link {
    display: inline-flex;
    margin-top: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    background: #0ea5e9;
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
    text-decoration: none;
}

@media (max-width: 430px) {
    .calendar-modal-backdrop {
        padding: 12px;
    }

    .calendar-modal {
        border-radius: 15px;
    }
}




/* =========================================================
   방송 타임라인
========================================================= */

.timeline-card {
    height: 400px;

    padding: 20px;

    overflow: hidden;
}

.timeline-wrap {
    position: relative;
    height: 325px;
    overflow: hidden;
}

.timeline-line {
    position: absolute;
    left: 19px;
    top: 7px;
    bottom: 7px;
    width: 1px;
    background: #dbeafe;
    z-index: 0;
    pointer-events: none;
}

.timeline {
    position: relative;
    height: 325px;
    margin-left: 0;
    padding-left: 40px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 transparent;
}

.timeline::-webkit-scrollbar {
    width: 6px;
}

.timeline::-webkit-scrollbar-track {
    background: transparent;
}

.timeline::-webkit-scrollbar-thumb {
    background: #cbd5e1;

    border-radius: 10px;
}

.timeline::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
}

.timeline-item {
    position: relative;

    padding-bottom: 19px;
}

.timeline-item:last-child {
    padding-bottom: 0;
}

.timeline-point {
    position: absolute;

    left: -25px;
    top: 4px;

    /* 세로줄 중심과 정확히 맞춤 */
    z-index: 1;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #0ea5e9;

    box-shadow:
        0 0 0 4px #e0f2fe;
}

.timeline-date {
    color: #94a3b8;

    font-size: 10px;
    font-weight: 700;
}

.timeline-title {
    margin-top: 4px;

    color: #334155;

    font-size: 13px;
    font-weight: 800;
}

.timeline-description {
    margin-top: 3px;

    color: #94a3b8;

    font-size: 11px;
    line-height: 1.5;
}


/* =========================================================
   추천 영역
   순서: VOD → 노래
========================================================= */

.recommend-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 22px;

    align-items: stretch;
}

.recommend-grid > .section {
    display: flex;
    flex-direction: column;
}

.recommend-grid > .section > .vod-recommend-card,
.recommend-grid > .section > .song-recommend-card {
    flex: 1;

    display: flex;
    flex-direction: column;
    justify-content: center;
}


/* =========================================================
   오늘의 VOD
========================================================= */

.vod-recommend-card {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #e4edf5;
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 6px 24px rgba(30, 64, 175, 0.04);
}

.vod-list {
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
}

.vod-item {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 55px;
    padding: 8px 4px;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.2s ease, padding 0.2s ease;
}

.vod-item:last-child { border-bottom: 0; }

.vod-item:hover {
    padding-left: 8px;
    padding-right: 8px;
    background: #f8fcff;
    border-radius: 10px;
}

.vod-number {
    width: 25px;
    flex: 0 0 25px;
    color: #bae6fd;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
}

.vod-info { min-width: 0; flex: 1; }

.vod-title {
    display: block;
    overflow: hidden;
    color: #1e293b;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.vod-date {
    display: block;
    margin-top: 3px;
    overflow: hidden;
    color: #94a3b8;
    font-size: 10px;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.vod-arrow { flex: 0 0 auto; color: #94a3b8; font-size: 11px; }


/* =========================================================
   오늘의 노래
========================================================= */

.song-recommend-card {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;

    border: 1px solid #e4edf5;
    border-radius: 20px;

    background: #ffffff;

    box-shadow:
        0 6px 24px rgba(30, 64, 175, 0.04);
}

.song-recommend-list {
    display: flex;
    flex-direction: column;
}

.song-recommend-item {
    display: flex;
    align-items: center;

    gap: 12px;

    min-height: 55px;

    padding: 8px 4px;

    border-bottom: 1px solid #f1f5f9;

    transition:
        background 0.2s ease,
        padding 0.2s ease;
}

.song-recommend-item:last-child {
    border-bottom: 0;
}

.song-recommend-item:hover {
    padding-left: 8px;
    padding-right: 8px;

    background: #f8fcff;

    border-radius: 10px;
}


/* 긴 제목/가수명은 카드 안에서 좌우로 이동하여 전체 표시 */
.marquee-viewport{display:block;min-width:0;overflow:hidden;white-space:nowrap}
.marquee-track{display:inline-block;white-space:nowrap;transform:translateX(0)}
.marquee-viewport.is-overflow .marquee-track{animation:recommendMarquee 7s ease-in-out infinite alternate;will-change:transform;padding-right:40px}
@keyframes recommendMarquee{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(calc(-1 * var(--marquee-distance, 0px)))}}

.song-number {
    width: 25px;

    flex: 0 0 25px;

    color: #bae6fd;

    font-size: 15px;
    font-weight: 800;

    text-align: center;
}

.song-info {
    min-width: 0;

    flex: 1;
}

.song-title {
    display: block;

    overflow: hidden;

    color: #1e293b;

    font-size: 13px;
    font-weight: 800;

    white-space: nowrap;
    text-overflow: ellipsis;
}

.song-artist {
    display: block;

    margin-top: 3px;

    overflow: hidden;

    color: #94a3b8;

    font-size: 10px;

    white-space: nowrap;
    text-overflow: ellipsis;
}

.song-arrow {
    flex: 0 0 auto;

    color: #94a3b8;

    font-size: 11px;
}


/* =========================================================
   관리자
========================================================= */
.admin-button { margin-left: 8px; padding: 7px 10px; border: 1px solid #bae6fd; border-radius: 9px; background: #f0f9ff; color: #0284c7; font-size: 11px; font-weight: 800; cursor: pointer; }
.admin-button.authenticated { background: #0284c7; color: #fff; border-color: #0284c7; }
.admin-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(15,23,42,.42); backdrop-filter: blur(6px); }
.admin-modal.active { display: flex; }
.admin-panel { width: min(920px,100%); max-height: min(88vh,900px); overflow: hidden; border: 1px solid #e4edf5; border-radius: 22px; background: #fff; box-shadow: 0 20px 60px rgba(15,23,42,.18); }
.admin-panel-header { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid #eef2f7; }
.admin-panel-title { margin:0; color:#1e293b; font-size:16px; font-weight:800; }
.admin-close { width:32px; height:32px; border:0; border-radius:9px; background:#f8fafc; color:#64748b; cursor:pointer; }
.admin-login-body { padding:24px; }
.admin-login-body p { margin:0 0 14px; color:#64748b; font-size:12px; line-height:1.6; }
.admin-input { width:100%; height:42px; padding:0 12px; border:1px solid #dbe5ef; border-radius:10px; outline:none; color:#1e293b; background:#fff; font-size:13px; }
.admin-input:focus { border-color:#7dd3fc; box-shadow:0 0 0 3px rgba(14,165,233,.08); }
.admin-turnstile { min-height:65px; margin-top:12px; }
.admin-login-actions,.admin-editor-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
.admin-action-button { min-height:38px; padding:0 13px; border:1px solid #dbe5ef; border-radius:9px; background:#fff; color:#475569; font-size:12px; font-weight:800; cursor:pointer; }
.admin-action-button.primary { border-color:#0284c7; background:#0284c7; color:#fff; }
.admin-action-button.danger { border-color:#fecaca; color:#dc2626; }
.admin-editor-body { max-height:calc(min(88vh,900px) - 70px); overflow-y:auto; padding:18px; }
.admin-section { padding:16px; border:1px solid #e7eef5; border-radius:16px; background:#fbfdff; }
.admin-section + .admin-section { margin-top:12px; }
.admin-section h3 { margin:0 0 10px; color:#1e293b; font-size:13px; }
.admin-row { display:grid; grid-template-columns:25px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:center; margin-top:7px; }
.admin-row.timeline-row { grid-template-columns:25px 125px minmax(0,1fr) minmax(0,1fr); }
.admin-row:first-of-type { margin-top:0; }
.admin-row-number { color:#0ea5e9; font-size:11px; font-weight:800; text-align:center; }
.admin-status { margin-top:10px; min-height:18px; color:#64748b; font-size:11px; }
@media (max-width:800px) {
 .admin-button { margin-left:3px; padding:6px 7px; font-size:9px; }
 .admin-panel { border-radius:18px; }
 .admin-row,.admin-row.timeline-row { grid-template-columns:22px 1fr; }
 .admin-row .admin-input { grid-column:2; }
}

/* 관리자/팝업 보정 */
.section-header-actions{display:flex;align-items:center;gap:7px}
.profile-name{display:flex;align-items:baseline;gap:7px;min-width:0}
.profile-day-count{color:#94a3b8;font-size:10px;font-weight:700;white-space:nowrap}
.inline-editor{overflow:auto}
.inline-editor-grid{max-height:calc(88vh - 130px);overflow:auto;padding-bottom:70px}
.inline-editor-actions{position:static!important;margin:0!important}
.inline-editor .admin-status{position:static!important;width:auto!important;text-align:left!important;margin:0!important}
.inline-editor{flex-direction:column}
.inline-editor-grid{flex:0 1 auto}
.inline-editor-actions{width:min(680px,100%)!important;padding:12px 0 0;background:#fff}
.inline-editor[id="timelineEditor"]{padding-bottom:18px}
.inline-editor[id="timelineEditor"] .timeline-editor-head,
.inline-editor[id="timelineEditor"] #inlineTimelineRows{flex-shrink:0}
.inline-editor[id="timelineEditor"] #inlineTimelineRows{max-height:calc(88vh - 180px)}
.inline-editor[id="timelineEditor"] .inline-editor-actions{bottom:auto!important}
.timeline-edit-row{grid-template-columns:28px minmax(140px,180px) minmax(180px,1fr) 28px 28px}
.timeline-editor-head span{display:none}

/* =========================================================
   모든 관리자 수정 팝업 공통 디자인
========================================================= */
.editor-modal-backdrop{
    position:fixed; inset:0; z-index:1200;
    display:none; align-items:center; justify-content:center;
    padding:18px;
    background:rgba(15,23,42,.42);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
}
.editor-modal-backdrop.active{display:flex}
.editor-modal{
    width:min(720px,100%);
    max-height:min(88vh,900px);
    display:flex; flex-direction:column;
    overflow:hidden;
    border:1px solid #e4edf5;
    border-radius:22px;
    background:#fff;
    box-shadow:0 20px 60px rgba(15,23,42,.18);
}
.editor-modal-header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    padding:16px 20px;
    border-bottom:1px solid #eef2f7;
}
.editor-modal-title{margin:0;color:#1e293b;font-size:16px;font-weight:800}
.editor-modal-close{
    width:32px;height:32px;flex:0 0 32px;
    border:0;border-radius:9px;background:#f8fafc;color:#64748b;
    cursor:pointer;font-size:18px;line-height:1;
}
.editor-modal-close:hover{background:#f1f5f9;color:#334155}
.editor-modal-footer{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:50px;padding:7px 16px;
    border-top:1px solid #eef2f7;background:#fff;
}
.editor-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-left:auto}
.editor-modal .admin-status{margin:0;min-height:18px;font-size:11px;color:#64748b}
.editor-modal .admin-input{height:40px}
#profileEditor input[type="file"]{
    height:40px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    padding:6px 10px;
    line-height:26px;
}
#profileEditor input[type="file"]::file-selector-button{
    margin-right:8px;
    vertical-align:middle;
}


/* 프로필 / 타임라인도 같은 모달 프레임 사용 */
#profileEditor,#timelineEditor{
    flex-direction:column;
}
#profileEditor .inline-editor-grid,
#timelineEditor #inlineTimelineRows,
#timelineEditor .timeline-editor-head{
    width:min(680px,100%);
}
#profileEditor .inline-editor-grid{
    margin:auto;
    padding:20px;
    border:1px solid #e7eef5;
    border-radius:16px;
    background:#fbfdff;
}
#profileEditor .inline-editor-actions,
#timelineEditor .inline-editor-actions{
    position:static!important;
    width:min(680px,100%)!important;
    padding:12px 0 0!important;
    margin:0 auto!important;
    border:0!important;
    background:transparent!important;
}
#profileEditor .admin-status,
#timelineEditor .admin-status{
    position:static!important;
    width:min(680px,100%)!important;
    margin:0 auto!important;
    text-align:left!important;
}
#timelineEditor .timeline-editor-head{margin:0 auto 10px}
#timelineEditor #inlineTimelineRows{
    max-height:calc(88vh - 180px);
    overflow:auto;
    padding:14px;
    border:1px solid #e7eef5;
    border-radius:16px;
    background:#fbfdff;
}

/* 월간 일정 편집: 실제 메인 달력과 같은 달력에서 날짜를 선택 */
.calendar-editor-content{
    flex:1 1 auto; min-height:0; overflow:auto;
    padding:18px 20px 20px;
}
.calendar-editor-monthbar{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-bottom:12px;color:#1e293b;
}
.calendar-editor-monthbar strong{min-width:120px;text-align:center;font-size:15px}
.calendar-editor-grid{margin:0}
.calendar-editor-grid th{height:30px}
.calendar-editor-grid td{
    height:58px;padding:5px;vertical-align:top;cursor:pointer;
    transition:background .15s ease,box-shadow .15s ease;
}
.calendar-editor-grid td.calendar-editor-empty{cursor:default}
.calendar-editor-grid td.calendar-editor-day:hover{background:#f8fcff}
.calendar-editor-grid td.selected{
    background:#eff9ff;
    box-shadow:inset 0 0 0 2px #7dd3fc;
}
.calendar-editor-marker{
    display:block;margin-top:3px;padding:2px 4px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    border-radius:5px;background:#f0f9ff;color:#0284c7;
    font-size:9px;font-weight:700;
}
.calendar-editor-count{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:16px;height:16px;margin-left:3px;padding:0 4px;
    border-radius:8px;background:#dbeafe;color:#0369a1;
    font-size:8px;font-weight:800;
}
.calendar-editor-selected{
    margin-top:16px;padding:15px;
    border:1px solid #e2e8f0;border-radius:16px;background:#fbfdff;
}
.calendar-editor-selected-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:12px;
}
.calendar-editor-label{
    display:block;margin-bottom:3px;color:#94a3b8;font-size:10px;font-weight:700;
}
.calendar-editor-selected-head strong{color:#1e293b;font-size:14px}
.calendar-editor-event-row{
    display:grid;
    grid-template-columns:95px 95px minmax(110px,1fr) minmax(120px,1.2fr) 30px;
    gap:7px;align-items:center;
    padding:10px;
    border:1px solid #e2e8f0;border-radius:12px;background:#fff;
}
.calendar-editor-event-row + .calendar-editor-event-row{margin-top:8px}
.calendar-editor-remove{
    width:30px;height:32px;border:1px solid #fecaca;border-radius:8px;
    background:#fff;color:#dc2626;font-weight:900;cursor:pointer;
}
.calendar-editor-remove:hover{background:#fff1f2}
.calendar-editor-no-data{
    padding:14px;text-align:center;color:#94a3b8;font-size:11px;
    border:1px dashed #cbd5e1;border-radius:10px;background:#fff;
}
@media(max-width:700px){
    .editor-modal-backdrop{padding:10px}
    .editor-modal{max-height:94vh;border-radius:18px}
    .editor-modal-header{padding:14px 16px}
    .editor-modal-footer{min-height:46px;padding:7px 12px}
    .calendar-editor-content{padding:14px}
    .calendar-editor-grid td{height:52px;padding:3px}
    .calendar-editor-event-row{grid-template-columns:1fr 1fr}
    .calendar-editor-remove{grid-column:2;justify-self:end}
    .calendar-editor-selected-head{align-items:flex-start;flex-direction:column}
    .calendar-editor-selected-head .admin-action-button{width:100%}
}
@media(max-width:430px){
    .editor-modal-footer{align-items:stretch;flex-direction:column}
    .editor-modal-actions{width:100%;margin-left:0}
    .editor-modal-actions .admin-action-button{flex:1}
}

/* =========================================================
   Footer
========================================================= */

footer {
    padding: 28px 0 35px;

    border-top: 1px solid #e7eef5;

    background: #ffffff;
}

.footer-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;

    color: #94a3b8;

    font-size: 11px;
}

.footer-title {
    color: #64748b;

    font-weight: 800;
}

========================================================= */

            680px
        );
    }

    .top-header-inner {
        height: 60px;
    }

    .brand-text {
        font-size: 15px;
    }

        gap: 1px;
    }

    /* 프로필 */

    }

    }

        flex-basis: 82px;

        border-radius: 21px;
    }

    .profile-name {
        font-size: 22px;
    }

    .profile-message {
        margin-top: 7px;
        font-size: 12px;
    }

    .profile-sub {
        margin-top: 9px;
    }


    /* 바로가기 */

    .quick-links {
        grid-template-columns: repeat(2, 1fr);

        gap: 9px;

        margin-top: 12px;
    }

    .quick-link {
        min-height: 65px;

        padding: 11px;

        border-radius: 14px;
    }

    .quick-icon {
        width: 34px;
        height: 34px;

        flex-basis: 34px;

        border-radius: 10px;

        font-size: 15px;
    }

    .quick-title {
        font-size: 12px;
    }

    .quick-description {
        font-size: 10px;
    }


    /* 섹션 */

    .section {
        margin-top: 17px;
    }

    .section-title {
        font-size: 15px;
    }


    /* 일정 + 타임라인 */

    .content-grid {
        grid-template-columns: 1fr;
        gap: 17px;
    }

    .schedule-card {
        min-height: 390px;
        height: auto;
    }

    .timeline-card {
        height: 390px;
    }

    .schedule-card,

        padding: 16px;
    }

    .calendar {
        height: auto;
    }

    .calendar tbody tr {
        height: 58px;
    }

    .calendar td {
        height: 58px;
    }

   .timeline {
        height: 315px;
    }


    /* 추천 */

    .recommend-grid {
        grid-template-columns: 1fr;
        gap: 17px;
    }



    /* Footer */

    .footer-inner {
        flex-direction: column;

        gap: 7px;

        text-align: center;
    }
}

   작은 모바일

function calendarEditorMonthRender(){
    const body=document.getElementById("calendarEditBody");
    const title=document.getElementById("calendarEditMonthTitle");
    if(!body||!title)return;

    const year=calendarEditCurrentDate.getFullYear();
    const month=calendarEditCurrentDate.getMonth();
    const firstDay=new Date(year,month,1);
    const lastDate=new Date(year,month+1,0).getDate();
    const firstWeekday=firstDay.getDay();

    let html="";
    let day=1;
    for(let week=0;week<6;week++){
        html+="<tr>";
        for(let weekday=0;weekday<7;weekday++){
            const cellIndex=week*7+weekday;
            if(cellIndex<firstWeekday||day>lastDate){
                html+='<td class="calendar-editor-empty"></td>';
                continue;
            }
            const date=new Date(year,month,day);
            const key=calendarDateKey(date);
            const entries=calendarEditorGetNotes(key);
            const first=entries[0]?.note;
            const titleText=first?.title||first?.type||"일정";
            const marker=entries.length
                ? `<span class="calendar-editor-marker">${calendarEscapeHtml(titleText)}</span>`
                : "";
            const count=entries.length>1
                ? `<span class="calendar-editor-count">+${entries.length}</span>`:"";
            const selected=calendarEditSelectedKey===key?" selected":"";
            const today=calendarSameDay(date,new Date())?" today":"";
            html+=`<td class="calendar-editor-day${selected}" data-calendar-edit-date="${key}" role="button" tabindex="0">
                <span class="calendar-day">${day}</span>${count}${marker}
            </td>`;
            day++;
        }
        html+="</tr>";
        if(day>lastDate)break;
    }
    body.innerHTML=html;

    const minKey=calendarMonthKey(CALENDAR_MIN_DATE);
    const maxKey=calendarMonthKey(CALENDAR_MAX_DATE);
    const curKey=calendarEditorMonthKey(calendarEditCurrentDate);
    const prev=document.getElementById("calendarEditPrevMonth");
    const next=document.getElementById("calendarEditNextMonth");
    if(prev)prev.disabled=curKey<=minKey;
    if(next)next.disabled=curKey>=maxKey;
}

function calendarEditorRowHtml(note={},sourceIndex=-1){
    return `<div class="calendar-editor-event-row" data-calendar-source-index="${sourceIndex}">
        <input class="admin-input calendar-edit-time" value="${calendarEscapeHtml(note.time||"")}" placeholder="시간" type="time">
        <input class="admin-input calendar-edit-type" value="${calendarEscapeHtml(note.type||"")}" placeholder="타입">
        <input class="admin-input calendar-edit-title" value="${calendarEscapeHtml(note.title||"")}" placeholder="일정 제목">
        <input class="admin-input calendar-edit-category" value="${calendarEscapeHtml(note.category||"")}" placeholder="카테고리">
        <button type="button" class="calendar-editor-remove" title="이 일정 삭제">−</button>
        <input class="admin-input calendar-edit-url" value="${calendarEscapeHtml(note.url||"")}" placeholder="일정 주소 (선택)" type="url">
    </div>`;
}

function calendarEditorSelectedRender(){
    const rows=document.getElementById("calendarEditRows");
    const title=document.getElementById("calendarEditSelectedDate");
    const add=document.getElementById("calendarEditAdd");
    if(!rows||!title)return;

    if(!calendarEditSelectedKey){
        title.textContent="날짜를 선택해주세요";
        rows.innerHTML='<div class="calendar-editor-no-data">달력에서 수정할 날짜를 선택해주세요.</div>';
        if(add)add.disabled=true;
        return;
    }

    const date=new Date(`${calendarEditSelectedKey}T00:00:00`);
    title.textContent=`${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일`;
    if(add)add.disabled=false;

    const entries=calendarEditorGetNotes(calendarEditSelectedKey);
    rows.innerHTML=entries.length
        ? entries.map(x=>calendarEditorRowHtml(x.note,x.index)).join("")
        : '<div class="calendar-editor-no-data">등록된 일정이 없습니다. '+`<strong>+ 일정 추가</strong>`+' 버튼으로 추가할 수 있습니다.</div>';
}

function calendarEditorSelectDate(dateKey){
    calendarEditSelectedKey=dateKey;
    calendarEditorMonthRender();
    calendarEditorSelectedRender();
}

function calendarEditorAddRow(){
    if(!calendarEditSelectedKey)return;
    const rows=document.getElementById("calendarEditRows");
    if(!rows)return;
    const empty=rows.querySelector(".calendar-editor-no-data");
    if(empty)rows.innerHTML="";
    rows.insertAdjacentHTML("beforeend",calendarEditorRowHtml({date:calendarEditSelectedKey,time:"",type:"",title:"",category:"",url:""},-1));
    rows.lastElementChild?.querySelector(".calendar-edit-title")?.focus();
}

function calendarEditorCollect(){
    const next=calendarNotes.map(x=>({...x}));
    const rows=Array.from(document.querySelectorAll("#calendarEditRows .calendar-editor-event-row"));
    rows.forEach(row=>{
        const idx=Number(row.dataset.calendarSourceIndex);
        const value={
            date:calendarEditSelectedKey,
            time:row.querySelector(".calendar-edit-time")?.value.trim()||"",
            type:row.querySelector(".calendar-edit-type")?.value.trim()||"",
            title:row.querySelector(".calendar-edit-title")?.value.trim()||"",
            category:row.querySelector(".calendar-edit-category")?.value.trim()||"",
            url:row.querySelector(".calendar-edit-url")?.value.trim()||""
        };
        if(idx>=0) next[idx]=value;
        else next.push(value);
    });

    // 선택한 날짜의 기존 일정 중 현재 화면에서 삭제된 항목 제거
    const keptIndexes=new Set(rows.map(r=>Number(r.dataset.calendarSourceIndex)).filter(Number.isInteger));
    for(let i=next.length-1;i>=0;i--){
        if(String(next[i]?.date||"")===calendarEditSelectedKey && !keptIndexes.has(i))next.splice(i,1);
    }
    return next.filter(x=>x.date||x.title||x.type||x.category||x.time||x.url);
}

function openCalendarEditor(){
    if(!isAdminAuthenticated)return;
    calendarEditCurrentDate=new Date(calendarCurrentDate);
    calendarEditCurrentDate=new Date(calendarEditCurrentDate.getFullYear(),calendarEditCurrentDate.getMonth(),1);
    calendarEditSelectedKey="";
    calendarEditorMonthRender();
    calendarEditorSelectedRender();
    const modal=document.getElementById("calendarEditModal");
    modal.classList.add("active");
    modal.setAttribute("aria-hidden","false");
    document.getElementById("calendarEditStatus").textContent="";
    document.getElementById("calendarEditStatus").style.color="#64748b";
}

function closeCalendarEditor(){
    const modal=document.getElementById("calendarEditModal");
    modal.classList.remove("active");
    modal.setAttribute("aria-hidden","true");
}

async function saveCalendarEditor(){
    const status=document.getElementById("calendarEditStatus");
    const button=document.getElementById("calendarEditSave");
    button.disabled=true;
    try{
        status.textContent="저장 중...";
        status.style.color="#0284c7";
        const next=calendarEditorCollect();
        await saveCalendarData(next);
        status.textContent="저장되었습니다.";
        status.style.color="#059669";
        setTimeout(closeCalendarEditor,350);
    }catch(e){
        status.textContent=e.message||"저장 실패";
        status.style.color="#ef4444";
    }finally{
        button.disabled=false;
    }
}

/*
 * ============================================================
 * 월간 일정 — fancalenar.json 연결
 * ============================================================
 */

const CALENDAR_DATA_URL = "https://badabi-api.dalkkumli054.workers.dev/?type=fancalenar&t=";
const CALENDAR_MIN_DATE = new Date(2026, 3, 20);
const CALENDAR_TODAY = new Date();
const CALENDAR_MAX_DATE = new Date(
    CALENDAR_TODAY.getFullYear(),
    CALENDAR_TODAY.getMonth(),
    1
);

let calendarNotes = [];
let calendarCurrentDate = new Date(
    Math.max(
        CALENDAR_TODAY.getTime(),
        CALENDAR_MIN_DATE.getTime()
    )
);
calendarCurrentDate = new Date(
    calendarCurrentDate.getFullYear(),
    calendarCurrentDate.getMonth(),
    1
);

const calendarBody = document.getElementById("calendar-body");
const calendarMonthTitle = document.getElementById("calendar-month-title");
const calendarSectionMonth = document.getElementById("calendar-section-month");
const monthButtons = document.querySelectorAll(".month-button");

function calendarDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function calendarMonthKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}

function calendarSameDay(a, b) {
    return calendarDateKey(a) === calendarDateKey(b);
}

function calendarSameMonth(a, b) {
    return calendarMonthKey(a) === calendarMonthKey(b);
}

function calendarEscapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

function calendarBuildNoteMap() {
    const map = new Map();

    calendarNotes.forEach(note => {
        if (!note || !note.date) return;

        const key = String(note.date).trim();
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(note);
    });

    return map;
}

function calendarRender() {
    if (!calendarBody) return;

    const year = calendarCurrentDate.getFullYear();
    const month = calendarCurrentDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDate = new Date(year, month + 1, 0).getDate();
    const firstWeekday = firstDay.getDay();
    const noteMap = calendarBuildNoteMap();

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    calendarMonthTitle.textContent = `${year}년 ${month + 1}월`;
    calendarSectionMonth.textContent = `${year}년 ${month + 1}월`;

    let html = "";
    let day = 1;

    for (let week = 0; week < 6; week++) {
        html += "<tr>";

        for (let weekday = 0; weekday < 7; weekday++) {
            const cellIndex = week * 7 + weekday;

            if (cellIndex < firstWeekday || day > lastDate) {
                html += "<td></td>";
                continue;
            }

            const cellDate = new Date(year, month, day);
            const key = calendarDateKey(cellDate);
            const notes = noteMap.get(key) || [];
            const isToday = calendarSameDay(cellDate, today);
            const isBeforeStart = cellDate < CALENDAR_MIN_DATE;
            const isFuture = cellDate > today;
            const hasNotes = notes.length > 0;

            let eventHtml = "";

            if (!isBeforeStart) {
                if (hasNotes) {
                    // 여러 일정이 있는 경우 날짜 옆에 전체 일정 개수를 표시합니다.
                    const firstNote = notes[0];
                    const title = firstNote.title || firstNote.type || "일정";
                    const countHtml = notes.length > 1
                        ? `<span class="calendar-count">+${notes.length}</span>`
                        : "";

                    eventHtml = `
                        <span class="calendar-event" title="${calendarEscapeHtml(title)}">
                            ${calendarEscapeHtml(title)}
                        </span>
                    `;

                    html += `
                        <td class="${isToday ? "today" : ""} has-calendar-notes" data-calendar-date="${key}" role="button" tabindex="0">
                            <span class="calendar-day-wrap">
                                <span class="calendar-day">${day}</span>
                                ${countHtml}
                            </span>
                            ${eventHtml}
                        </td>
                    `;
                } else if (isToday) {
                    eventHtml = `
                        <span class="calendar-event">🌊 미정</span>
                    `;
                } else if (!isFuture) {
                    eventHtml = `
                        <span class="calendar-event">🌊 휴방</span>
                    `;
                }

                if (!hasNotes) {
                    html += `
                        <td class="${isToday ? "today" : ""}">
                            <span class="calendar-day">${day}</span>
                            ${eventHtml}
                        </td>
                    `;
                }
            } else {
                html += `
                    <td class="${isToday ? "today" : ""}">
                        <span class="calendar-day">${day}</span>
                    </td>
                `;
            }

            day++;
        }

        html += "</tr>";

        if (day > lastDate) break;
    }

    calendarBody.innerHTML = html;

    const isAtMin = calendarSameMonth(calendarCurrentDate, CALENDAR_MIN_DATE);
    const isAtMax = calendarSameMonth(calendarCurrentDate, CALENDAR_MAX_DATE);

    if (monthButtons[0]) {
        monthButtons[0].disabled = isAtMin;
        monthButtons[0].setAttribute("aria-disabled", String(isAtMin));
    }

    if (monthButtons[1]) {
        monthButtons[1].disabled = isAtMax;
        monthButtons[1].setAttribute("aria-disabled", String(isAtMax));
    }
}

function calendarOpenModal(dateKey) {
    const modalBackdrop = document.getElementById("calendar-modal-backdrop");
    const modalTitle = document.getElementById("calendar-modal-title");
    const modalList = document.getElementById("calendar-modal-list");
    if (!modalBackdrop || !modalTitle || !modalList) return;

    const notes = calendarBuildNoteMap().get(dateKey) || [];
    if (!notes.length) return;

    const date = new Date(`${dateKey}T00:00:00`);
    modalTitle.textContent = `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 일정`;

    modalList.innerHTML = notes.map(note => {
        const time = note.time && note.time !== "-" ? note.time : "시간 미정";
        const type = note.type || "일정";
        const title = note.title || type;
        const category = note.category && note.category !== "-" ? note.category : "";
        const url = typeof note.url === "string" ? note.url.trim() : "";
        const hasLink = /^https?:\/\//i.test(url);

        return `
            <div class="calendar-modal-item">
                <div class="calendar-modal-meta">
                    <span class="calendar-modal-badge">${calendarEscapeHtml(time)}</span>
                    <span class="calendar-modal-badge">${calendarEscapeHtml(type)}</span>
                </div>
                <p class="calendar-modal-event-title">${calendarEscapeHtml(title)}</p>
                ${category ? `<p class="calendar-modal-category">${calendarEscapeHtml(category)}</p>` : ""}
                ${hasLink ? `<a class="calendar-modal-link" href="${calendarEscapeHtml(url)}" target="_blank" rel="noopener noreferrer">일정 링크 이동 →</a>` : ""}
            </div>
        `;
    }).join("");

    modalBackdrop.classList.add("open");
    modalBackdrop.setAttribute("aria-hidden", "false");
}

function calendarCloseModal() {
    const modalBackdrop = document.getElementById("calendar-modal-backdrop");
    if (!modalBackdrop) return;

    modalBackdrop.classList.remove("open");
    modalBackdrop.setAttribute("aria-hidden", "true");
}

async function loadCalendarData() {
    try {
        const timestamp = Date.now();
        const response = await fetch(CALENDAR_DATA_URL + timestamp);
        if (!response.ok) {
            throw new Error(`달력 데이터 요청 실패: ${response.status}`);
        }

        const data = await response.json();
        calendarNotes = Array.isArray(data.notes) ? data.notes : [];
        calendarRender();
    } catch (error) {
        console.error("Cloudflare Worker에서 fancalenar 데이터 불러오기 실패:", error);
        calendarNotes = [];
        calendarRender();
    }
}

calendarBody.addEventListener("click", event => {
    const cell = event.target.closest("td.has-calendar-notes");
    if (!cell || !calendarBody.contains(cell)) return;
    calendarOpenModal(cell.dataset.calendarDate);
});

calendarBody.addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;

    const cell = event.target.closest("td.has-calendar-notes");
    if (!cell || !calendarBody.contains(cell)) return;

    event.preventDefault();
    calendarOpenModal(cell.dataset.calendarDate);
});

const calendarModalBackdrop = document.getElementById("calendar-modal-backdrop");
const calendarModalClose = document.getElementById("calendar-modal-close");

if (calendarModalClose) {
    calendarModalClose.addEventListener("click", calendarCloseModal);
}

if (calendarModalBackdrop) {
    calendarModalBackdrop.addEventListener("click", event => {
        if (event.target === calendarModalBackdrop) calendarCloseModal();
    });
}

document.addEventListener("keydown", event => {
    if (event.key === "Escape") calendarCloseModal();
});

monthButtons.forEach((button, index) => {
    button.addEventListener("click", () => {
        const nextMonth = new Date(
            calendarCurrentDate.getFullYear(),
            calendarCurrentDate.getMonth() + (index === 0 ? -1 : 1),
            1
        );

        if (nextMonth < new Date(
            CALENDAR_MIN_DATE.getFullYear(),
            CALENDAR_MIN_DATE.getMonth(),
            1
        )) return;

        if (nextMonth > CALENDAR_MAX_DATE) return;

        calendarCurrentDate = nextMonth;
        calendarRender();
    });
});

calendarRender();
loadCalendarData();


</script>
