<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바다비 팬 아카이브</title>
<meta name="description" content="바다비 팬 아카이브">
<link rel="icon" type="image/png" href="logo.png">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f7fbff;
    color: #334155;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

img {
    max-width: 100%;
}

.site {
    width: 100%;
    min-height: 100vh;
}

.container {
    width: min(1180px, calc(100% - 32px));
    margin: 0 auto;
}


/* =========================================================
   상단 헤더
========================================================= */

.top-header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-bottom: 1px solid #e7eef5;
}

.top-header-inner {
    height: 68px;

    display: flex;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;

    font-weight: 800;
    color: #0f172a;
}

.brand-icon {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background: #e0f2fe;
    color: #0284c7;

    font-size: 17px;
}

.brand-text {
    font-size: 17px;
}

.top-nav {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 6px;
}

.top-nav a {
    padding: 8px 11px;

    border-radius: 9px;

    color: #64748b;

    font-size: 12px;
    font-weight: 700;

    transition: background 0.2s ease, color 0.2s ease;
}

.top-nav a:hover {
    background: #f0f9ff;
    color: #0284c7;
}


/* =========================================================
   메인
========================================================= */

main {
    padding: 34px 0 70px;
}


/* =========================================================
   프로필
========================================================= */

.profile-card {
    position: relative;
    overflow: hidden;

    padding: 32px;

    border: 1px solid #e4edf5;
    border-radius: 24px;

    background: #ffffff;

    box-shadow:
        0 8px 30px rgba(30, 64, 175, 0.05);
}

.profile-card::before {
    content: "";

    position: absolute;
    top: -100px;
    right: -80px;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: #e0f2fe;
    opacity: 0.55;
}

.profile-content {
    position: relative;
    z-index: 1;

    display: flex;
    align-items: center;
    gap: 25px;
}

.profile-image {
    width: 112px;
    height: 112px;

    flex: 0 0 112px;

    object-fit: cover;

    border-radius: 28px;

    background: #e0f2fe;
    border: 4px solid #ffffff;

    box-shadow:
        0 5px 18px rgba(14, 165, 233, 0.18);
}

.profile-info {
    min-width: 0;
}

.profile-name {
    margin: 0;

    color: #0f172a;

    font-size: 28px;
    line-height: 1.2;
    font-weight: 800;
}

.profile-message {
    margin: 10px 0 0;

    color: #64748b;

    font-size: 14px;
    line-height: 1.7;
}

.profile-sub {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;

    margin-top: 13px;
}

.profile-tag {
    padding: 5px 9px;

    border-radius: 8px;

    background: #f0f9ff;
    color: #0284c7;

    font-size: 11px;
    font-weight: 700;
}


/* =========================================================
   바로가기
========================================================= */

.quick-links {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;

    margin-top: 18px;
}

.quick-link {
    min-height: 76px;

    display: flex;
    align-items: center;
    gap: 13px;

    padding: 15px 17px;

    border: 1px solid #e4edf5;
    border-radius: 17px;

    background: #ffffff;

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.quick-link:hover {
    transform: translateY(-2px);

    border-color: #bae6fd;

    box-shadow:
        0 8px 22px rgba(14, 165, 233, 0.08);
}

.quick-icon {
    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background: #f0f9ff;
    color: #0284c7;

    font-size: 18px;
}

.quick-text {
    min-width: 0;
}

.quick-title {
    display: block;

    color: #1e293b;

    font-size: 13px;
    font-weight: 800;
}

.quick-description {
    display: block;

    margin-top: 3px;

    color: #94a3b8;

    font-size: 11px;
}


/* =========================================================
   섹션
========================================================= */

.section {
    margin-top: 22px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 12px;
}

.section-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
}

.section-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #0ea5e9;
}

.section-title {
    margin: 0;

    color: #1e293b;

    font-size: 17px;
    font-weight: 800;
}

.section-more {
    color: #94a3b8;

    font-size: 12px;
    font-weight: 600;
}


/* =========================================================
   월간 일정 + 타임라인
========================================================= */

.content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;

    align-items: stretch;
}


/* =========================================================
   공통 카드
========================================================= */

.card {
    border: 1px solid #e4edf5;
    border-radius: 20px;

    background: #ffffff;

    box-shadow:
        0 6px 24px rgba(30, 64, 175, 0.04);
}


/* =========================================================
   월간 일정 (최대 6주 높이 고정)
========================================================= */

.schedule-card {
    height: 485px; /* 6주 기준으로 고정된 높이 설정 */
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow: hidden;
}

.month-header {
    height: 38px;
    flex: 0 0 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.month-title {
    color: #1e293b;
    font-size: 17px;
    font-weight: 800;
}

.month-control {
    display: flex;
    gap: 5px;
}

.month-button {
    width: 30px;
    height: 30px;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    background: #ffffff;
    color: #64748b;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
}

.month-button:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
}

.calendar-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.calendar {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    border-spacing: 0;
    table-layout: fixed;
}

.calendar thead {
    height: 28px;
}

.calendar tbody {
    height: calc(100% - 28px);
}

.calendar tbody tr {
    height: calc(100% / 6); /* 6주 고정 균등 분할 */
}

.calendar th {
    width: 14.2857%;
    padding: 0;
    color: #94a3b8;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
}

.calendar td {
    width: 14.2857%;
    padding: 4px;
    vertical-align: top;
    border-top: 1px solid #f1f5f9;
    color: #64748b;
    font-size: 11px;
    overflow: hidden;
}

.calendar-day-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.calendar-day {
    display: inline-flex;
    width: 22px;
    height: 22px;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
}

.calendar-count {
    font-size: 9px;
    font-weight: 800;
    color: #0284c7;
    background: #e0f2fe;
    padding: 1px 4px;
    border-radius: 4px;
}

.calendar td.today .calendar-day {
    background: #0ea5e9;
    color: #ffffff;
    font-weight: 800;
}

.calendar-event {
    display: block;
    margin-top: 2px;
    padding: 2px 4px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    border-radius: 5px;
    background: #f0f9ff;
    color: #0284c7;
    font-size: 9px;
    font-weight: 700;
}


.calendar-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.38);
}

.calendar-modal-backdrop.open {
    display: flex;
}

.calendar-modal {
    width: min(440px, 100%);
    max-height: min(620px, 90vh);
    overflow: hidden;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
}

.calendar-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid #f1f5f9;
}

.calendar-modal-title {
    margin: 0;
    color: #0f172a;
    font-size: 16px;
    font-weight: 800;
}

.calendar-modal-close {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 9px;
    background: #f8fafc;
    color: #64748b;
    font-size: 18px;
    cursor: pointer;
}

.calendar-modal-list {
    max-height: calc(min(620px, 90vh) - 70px);
    overflow-y: auto;
    padding: 12px;
}

.calendar-modal-item {
    padding: 13px;
    border: 1px solid #e2e8f0;
    border-radius: 13px;
    background: #f8fafc;
}

.calendar-modal-item + .calendar-modal-item {
    margin-top: 9px;
}

.calendar-modal-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 7px;
}

.calendar-modal-badge {
    padding: 3px 7px;
    border-radius: 6px;
    background: #e0f2fe;
    color: #0284c7;
    font-size: 9px;
    font-weight: 800;
}

.calendar-modal-event-title {
    margin: 0;
    color: #0f172a;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.5;
    word-break: keep-all;
}

.calendar-modal-category {
    margin: 6px 0 0;
    color: #64748b;
    font-size: 10px;
    line-height: 1.4;
}

.calendar-modal-link {
    display: inline-flex;
    margin-top: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    background: #0ea5e9;
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
    text-decoration: none;
}


/* =========================================================
   방송 타임라인 (달력 높이에 연동 고정)
========================================================= */

.timeline-card {
    height: 485px; /* 달력 카드와 동일한 높이로 고정 */
    padding: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.timeline-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
}

.timeline-line {
    position: absolute;
    left: 19px;
    top: 7px;
    bottom: 7px;
    width: 1px;
    background: #dbeafe;
    z-index: 0;
    pointer-events: none;
}

.timeline {
    position: relative;
    height: 100%;
    margin-left: 0;
    padding-left: 40px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 transparent;
}

.timeline::-webkit-scrollbar {
    width: 6px;
}

.timeline::-webkit-scrollbar-track {
    background: transparent;
}

.timeline::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
}

.timeline::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
}

.timeline-item {
    position: relative;
    padding-bottom: 19px;
}

.timeline-item:last-child {
    padding-bottom: 0;
}

.timeline-point {
    position: absolute;
    left: -25px;
    top: 4px;
    z-index: 1;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #0ea5e9;
    box-shadow: 0 0 0 4px #e0f2fe;
}

.timeline-date {
    color: #94a3b8;
    font-size: 10px;
    font-weight: 700;
}

.timeline-title {
    margin-top: 4px;
    color: #334155;
    font-size: 13px;
    font-weight: 800;
}

.timeline-description {
    margin-top: 3px;
    color: #94a3b8;
    font-size: 11px;
    line-height: 1.5;
}


/* =========================================================
   추천 영역
========================================================= */

.recommend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    align-items: stretch;
}

.recommend-grid > .section {
    display: flex;
    flex-direction: column;
    min-width: 0; /* 모바일 그리드 수평 넘침 방지 */
}

.recommend-grid > .section > .vod-recommend-card,
.recommend-grid > .section > .song-recommend-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0; /* 내부 넘침 방지 */
}


/* =========================================================
   오늘의 VOD
========================================================= */

.vod-recommend-card {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #e4edf5;
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 6px 24px rgba(30, 64, 175, 0.04);
}

.vod-list {
    display: flex;
    flex-direction: column;
    padding: 8px 16px; /* 패딩을 줄여 크기 축소 */
    min-width: 0;
}

.vod-item {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px; /* 높이를 줄여 크기 축소 */
    padding: 6px 4px;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.2s ease, padding 0.2s ease;
    min-width: 0;
}

.vod-item:last-child { border-bottom: 0; }

.vod-item:hover {
    padding-left: 8px;
    padding-right: 8px;
    background: #f8fcff;
    border-radius: 10px;
}

.vod-number {
    width: 25px;
    flex: 0 0 25px;
    color: #bae6fd;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
}

.vod-info { min-width: 0; flex: 1; }

.vod-title {
    display: block;
    overflow: hidden;
    color: #1e293b;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.vod-date {
    display: block;
    margin-top: 2px;
    overflow: hidden;
    color: #94a3b8;
    font-size: 10px;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.vod-arrow { flex: 0 0 auto; color: #94a3b8; font-size: 11px; }


/* =========================================================
   오늘의 노래
========================================================= */

.song-recommend-card {
    padding: 8px 16px; /* 패딩을 줄여 크기 축소 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    border: 1px solid #e4edf5;
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 6px 24px rgba(30, 64, 175, 0.04);
    overflow: hidden; /* 모바일 화면 밖으로 튀어나가지 않도록 설정 */
    min-width: 0;
}

.song-recommend-list {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.song-recommend-item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px; /* 높이를 줄여 크기 축소 */
    padding: 6px 4px;
    border-bottom: 1px solid #f1f5f9;
    transition: background 0.2s ease, padding 0.2s ease;
    min-width: 0; /* 좌우 레이아웃이 화면을 넘기지 않게 고정 */
}

.song-recommend-item:last-child {
    border-bottom: 0;
}

.song-recommend-item:hover {
    padding-left: 8px;
    padding-right: 8px;
    background: #f8fcff;
    border-radius: 10px;
}

.marquee-viewport{display:block;min-width:0;overflow:hidden;white-space:nowrap}
.marquee-track{display:inline-block;white-space:nowrap;transform:translateX(0)}
.marquee-viewport.is-overflow .marquee-track{animation:recommendMarquee 7s linear infinite;will-change:transform;padding-right:40px}
@keyframes recommendMarquee{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(calc(-1 * var(--marquee-distance, 0px)))}}

.song-number {
    width: 25px;
    flex: 0 0 25px;
    color: #bae6fd;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
}

.song-info {
    min-width: 0;
    flex: 1;
}

.song-title {
    display: block;
    overflow: hidden;
    color: #1e293b;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.song-artist {
    display: block;
    margin-top: 2px;
    overflow: hidden;
    color: #94a3b8;
    font-size: 10px;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.song-arrow {
    flex: 0 0 auto;
    color: #94a3b8;
    font-size: 11px;
}


/* =========================================================
   관리자 (로그인 팝업 디자인 대폭 개선)
========================================================= */
.admin-button { display: none !important; }
.admin-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(15,23,42,.42); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.admin-modal.active { display: flex; }
.admin-panel { width: min(420px,100%); max-height: min(88vh,900px); overflow: hidden; border: 1px solid #e4edf5; border-radius: 22px; background: #fff; box-shadow: 0 20px 60px rgba(15,23,42,.18); }
.admin-panel-header { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid #eef2f7; }
.admin-panel-title { margin:0; color:#1e293b; font-size:16px; font-weight:800; }
.admin-close { width:32px; height:32px; border:0; border-radius:9px; background:#f8fafc; color:#64748b; cursor:pointer; font-size: 18px; transition: background 0.2s, color 0.2s; }
.admin-close:hover { background: #f1f5f9; color: #334155; }
.admin-login-body { padding:24px 22px; }
.admin-login-body p { margin:0 0 16px; color:#64748b; font-size:12px; line-height:1.6; }
.admin-input { width:100%; height:42px; padding:0 14px; border:1px solid #dbe5ef; border-radius:12px; outline:none; color:#1e293b; background:#fff; font-size:13px; transition: border-color 0.2s, box-shadow 0.2s; }
.admin-input:focus { border-color:#7dd3fc; box-shadow:0 0 0 3px rgba(14,165,233,.08); }
.admin-turnstile { min-height:65px; margin-top:14px; display: flex; justify-content: center; }
.admin-login-actions,.admin-editor-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.admin-action-button { min-height:40px; padding:0 16px; border:1px solid #dbe5ef; border-radius:11px; background:#fff; color:#475569; font-size:12px; font-weight:800; cursor:pointer; transition: background 0.2s, border-color 0.2s; }
.admin-action-button:hover { background: #f8fafc; border-color: #cbd5e1; }
.admin-action-button.primary { border-color:#0284c7; background:#0284c7; color:#fff; }
.admin-action-button.primary:hover { background: #026d9c; }
.admin-action-button.primary.danger { border-color:#fecaca !important; color:#dc2626 !important; background:#fecaca !important;}
.admin-action-button.primary.danger:hover { background:#ff969e !important; }
.admin-status { margin-top:12px; min-height:18px; color:#64748b; font-size:11px; text-align: center; font-weight: 600; }

/* 토스트 메시지 스타일 추가 */
.toast-message {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.9);
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    z-index: 2000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
    backdrop-filter: blur(8px);
}
.toast-message.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

/* 관리자/팝업 보정 */
.section-header-actions{display:flex;align-items:center;gap:7px}
.profile-name{display:flex;align-items:baseline;gap:7px;min-width:0}

/* 디데이 태그 스타일 지정 (프로필 태그 .profile-tag와 동일하게 매칭) */
.profile-tag.profile-day-count {
    padding: 5px 9px;
    border-radius: 8px;
    background: #f0f9ff;
    color: #0284c7;
    font-size: 11px;
    font-weight: 700;
    display: inline-block;
}

/* =========================================================
   모든 관리자 수정 팝업 공통 디자인
========================================================= */
.editor-modal-backdrop{
    position:fixed; inset:0; z-index:1200;
    display:none; align-items:center; justify-content:center;
    padding:18px;
    background:rgba(15,23,42,.42);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
}
.editor-modal-backdrop.active{display:flex}
.editor-modal{
    width:min(720px,100%);
    max-height:min(88vh,900px);
    display:flex; flex-direction:column;
    overflow:hidden;
    border:1px solid #e4edf5;
    border-radius:22px;
    background:#fff;
    box-shadow:0 20px 60px rgba(15,23,42,.18);
}
.editor-modal-header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    padding:16px 20px;
    border-bottom:1px solid #eef2f7;
}
.editor-modal-title{margin:0;color:#1e293b;font-size:16px;font-weight:800}
.editor-modal-close{
    width:32px;height:32px;flex:0 0 32px;
    border:0;border-radius:9px;background:#f8fafc;color:#64748b;
    cursor:pointer;font-size:18px;line-height:1;
}
.editor-modal-close:hover{background:#f1f5f9;color:#334155}
.editor-modal-footer{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:50px;padding:7px 16px;
    border-top:1px solid #eef2f7;background:#fff;
}
.editor-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-left:auto}
.editor-modal .admin-status{margin:0;min-height:18px;font-size:11px;color:#64748b}

/* =========================================================
   월간 일정 편집 화면 스타일 수정 (세로 누적 구조 및 가로 무리한 배치 해제)
========================================================= */
.calendar-editor-content{
    flex:1 1 auto; min-height:0; overflow:auto;
    padding:18px 20px 20px;
}
.calendar-editor-monthbar{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-bottom:12px;color:#1e293b;
}
.calendar-editor-monthbar strong{min-width:120px;text-align:center;font-size:15px}
.calendar-editor-grid{margin:0}
.calendar-editor-grid th{height:30px}
.calendar-editor-grid td{
    height:52px;padding:4px;vertical-align:top;cursor:pointer;
    transition:background .15s ease,box-shadow .15s ease;
}
.calendar-editor-grid td.calendar-editor-empty{cursor:default}
.calendar-editor-grid td.calendar-editor-day:hover{background:#f8fcff}
.calendar-editor-grid td.selected{
    background:#eff9ff;
    box-shadow:inset 0 0 0 2px #7dd3fc;
}
.calendar-editor-marker{
    display:block;margin-top:2px;padding:2px 4px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    border-radius:5px;background:#f0f9ff;color:#0284c7;
    font-size:9px;font-weight:700;
}
.calendar-editor-count{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:16px;height:16px;margin-left:3px;padding:0 4px;
    border-radius:8px;background:#dbeafe;color:#0369a1;
    font-size:8px;font-weight:800;
}
.calendar-editor-selected{
    margin-top:16px;padding:15px;
    border:1px solid #e2e8f0;border-radius:16px;background:#fbfdff;
}
.calendar-editor-selected-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:12px;
}
.calendar-editor-label{
    display:block;margin-bottom:3px;color:#94a3b8;font-size:10px;font-weight:700;
}
.calendar-editor-selected-head strong{color:#1e293b;font-size:14px}

.calendar-editor-event-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:12px;
    border:1px solid #e2e8f0;
    border-radius:12px;
    background:#fff;
    margin-top:8px;
}
.calendar-editor-row-top{
    display:grid;
    grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1fr) 30px;
    gap:8px;
    align-items:center;
}
.calendar-editor-remove{
    width:30px;height:40px;border:1px solid #fecaca;border-radius:8px;
    background:#fff;color:#dc2626;font-weight:900;cursor:pointer;
}
.calendar-editor-remove:hover{background:#fff1f2}
.calendar-editor-no-data{
    padding:14px;text-align:center;color:#94a3b8;font-size:11px;
    border:1px dashed #cbd5e1;border-radius:10px;background:#fff;
}


/* =========================================================
   Footer (요청에 따라 패딩을 줄여 높이 축소)
========================================================= */

footer {
    padding: 14px 0 16px;
    border-top: 1px solid #e7eef5;
    background: #ffffff;
}

.footer-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #94a3b8;
    font-size: 11px;
}

.footer-title {
    color: #64748b;
    font-weight: 800;
    cursor: pointer;
    user-select: none;
}

function calendarEditorMonthKey(date){
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`;

function calendarEditorGetNotes(dateKey){
    return calendarEditDraftNotes
        .map((note,index)=>({note,index}))

}

/* 현재 선택 날짜의 입력값을 임시 편집 데이터에 반영 */
function calendarEditorCommitSelectedDate(){
    if(!calendarEditSelectedKey)return;

    const rows=Array.from(document.querySelectorAll("#calendarEditRows .calendar-editor-event-row"));
    const nextRows=[];

    rows.forEach(row=>{
        let rawTitle=row.querySelector(".calendar-edit-title")?.value.trim()||"";

        // 일정 제목 앞의 아이콘은 입력한 값을 그대로 사용한다.
        // 🌊 방송 / 🌧️ 휴방 등 원하는 아이콘을 직접 입력할 수 있다.
        // 아이콘을 입력하지 않은 경우에는 기본값으로 🌊를 붙인다.
        if(rawTitle && !/^(🌊|🌧️)\s*/.test(rawTitle)){
            rawTitle="🌊 "+rawTitle;
        }

        const value={
            date:calendarEditSelectedKey,
            time:row.querySelector(".calendar-edit-time")?.value.trim()||"",
            type:row.querySelector(".calendar-edit-type")?.value.trim()||"",
            title:rawTitle,
            category:row.querySelector(".calendar-edit-category")?.value.trim()||"",
            url:row.querySelector(".calendar-edit-url")?.value.trim()||""
        };

        // 모든 입력칸이 비어 있는 새 행은 저장하지 않음
        if(value.title||value.type||value.category||value.time||value.url){
            nextRows.push(value);
        }
    });

    // 기존 선택 날짜 데이터를 통째로 교체하여
    // 추가/수정/삭제가 모두 정확하게 임시 데이터에 반영되도록 함
    calendarEditDraftNotes=calendarEditDraftNotes.filter(note=>
        String(note?.date||"").trim()!==calendarEditSelectedKey
    );
    calendarEditDraftNotes.push(...nextRows);
}

function calendarEditorMonthRender(){
    const body=document.getElementById("calendarEditBody");
    const title=document.getElementById("calendarEditMonthTitle");
    if(!body||!title)return;

    const year=calendarEditCurrentDate.getFullYear();
    const month=calendarEditCurrentDate.getMonth();
    const firstDay=new Date(year,month,1);
    const lastDate=new Date(year,month+1,0).getDate();
    const firstWeekday=firstDay.getDay();

    title.textContent=`${year}년 ${month+1}월`;

    let html="";
    let day=1;
    for(let week=0;week<6;week++){
        html+="<tr>";
        for(let weekday=0;weekday<7;weekday++){
            const cellIndex=week*7+weekday;
            if(cellIndex<firstWeekday||day>lastDate){
                html+='<td class="calendar-editor-empty"></td>';
                continue;
            }
            const date=new Date(year,month,day);
            const key=calendarDateKey(date);
            const entries=calendarEditorGetNotes(key);
            const first=entries[0]?.note;
            const titleText=first?.title||first?.type||"일정";
            const marker=entries.length
                ? `<span class="calendar-editor-marker">${calendarEscapeHtml(titleText)}</span>`
                : "";
            const count=entries.length>1
                ? `<span class="calendar-editor-count">+${entries.length}</span>`:"";
            const selected=calendarEditSelectedKey===key?" selected":"";
            html+=`<td class="calendar-editor-day${selected}" data-calendar-edit-date="${key}" role="button" tabindex="0">
                <span class="calendar-day">${day}</span>${count}${marker}
            </td>`;
            day++;
        }
        html+="</tr>";
        if(day>lastDate)break;
    }
    body.innerHTML=html;
}

async function saveCalendarEditor(){

function fanVodSeedHash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function renderFanVodRecommendations(){const list=document.getElementById("vodRecommendList");if(!list)return;list.innerHTML=fanVodRecommendationData.slice(0,3).map((v,i)=>{const title=adminEsc(v.title||"제목 없음"),date=adminEsc(v.date||"");const url=/^https?:\/\//i.test(v.url)?v.url:"#";return `<a href="${adminEsc(url)}" class="vod-item" target="_blank" rel="noopener"><span class="vod-number">${String(i+1).padStart(2,"0")}</span><span class="vod-info"><span class="marquee-viewport vod-title"><span class="marquee-track">${title}</span></span><span class="marquee-viewport vod-date"><span class="marquee-track">${date}</span></span></span><span class="vod-arrow">→</span></a>`;}).join("");setupRecommendationMarquees(list);}

const FANSONG_STATS_URL = ADMIN_WORKER_URL + "?type=fansongstats&t=";
let fanSongRecommendationData = [];
let fanSongRecommendationSource = [];

function fanSongKstDateKey(date=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(date);}
function fanSongSeedHash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

// 시간(HH:MM:SS 또는 MM:SS)을 초(Seconds)로 변환하는 함수
function timeToSeconds(timeStr) {
    if (!timeStr) return 0;
    const parts = timeStr.split(":").map(Number);
    if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
    } else if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
    }
    return 0;
}

function setupRecommendationMarquees(root=document){root.querySelectorAll?.(".marquee-viewport")?.forEach(view=>{const track=view.querySelector(".marquee-track");if(!track)return;view.classList.remove("is-overflow");view.style.removeProperty("--marquee-distance");requestAnimationFrame(()=>{const distance=Math.max(0,track.scrollWidth-view.clientWidth);if(distance>1){view.style.setProperty("--marquee-distance",distance+"px");view.classList.add("is-overflow");}});});}

function renderFanSongRecommendations(){
    const list=document.querySelector(".song-recommend-list");
    if(!list)return;
    list.innerHTML=fanSongRecommendationData.slice(0,3).map((song,index)=>{
        const title=adminEsc(song.title||"제목 없음");
        const artist=adminEsc(song.artist||"아티스트 미상");
        const url=/^https?:\/\//i.test(song.url)?song.url:"#";
        return `<a href="${adminEsc(url)}" class="song-recommend-item" target="_blank" rel="noopener"><span class="song-number">${String(index+1).padStart(2,"0")}</span><span class="song-info"><span class="marquee-viewport song-title"><span class="marquee-track">${title}</span></span><span class="marquee-viewport song-artist"><span class="marquee-track">${artist}</span></span></span><span class="song-arrow">→</span></a>`;
    }).join("");
    setupRecommendationMarquees(list);
}

function applyDailyFanSongRecommendations(){
    const day=fanSongKstDateKey();
    fanSongRecommendationData=fanSongRecommendationSource.slice().sort((a,b)=>fanSongSeedHash(day+"|"+String(a.title)+"|"+String(a.artist))-fanSongSeedHash(day+"|"+String(b.title)+"|"+String(b.artist))).slice(0,3);
    renderFanSongRecommendations();
}

async function loadFanSongRecommendations(){
    try{
        const response=await fetch(FANSONG_STATS_URL+Date.now(),{cache:"no-store"});
        if(!response.ok)throw new Error();
        const data=await response.json();
        
        const registered = Array.isArray(data.registeredSongs)?data.registeredSongs:[];
        const unregistered = Array.isArray(data.unregisteredSongs)?data.unregisteredSongs:[];
        const allSongs = [...registered, ...unregistered];
        
        const vodSources = Array.isArray(data.vodSources) ? data.vodSources : (data.vods || []);

        fanSongRecommendationSource = [];

        allSongs.forEach(song => {
            if(!song || !song.title) return;
            const title = String(song.title || "").trim();
            const artist = String(song.artist || "").trim();
            const dateTimes = Array.isArray(song.dateTimes) ? song.dateTimes : [];

            if (dateTimes.length > 0) {
                dateTimes.forEach(dt => {
                    const targetDate = String(dt.date || "").trim();
                    const targetTime = String(dt.time || "").trim();
                    
                    const matchedVod = vodSources.find(v => String(v.date || "").trim() === targetDate);
                    const baseUrl = matchedVod ? (matchedVod.link || matchedVod.url || "") : "";
                    
                    if (baseUrl) {
                        const seconds = timeToSeconds(targetTime);
                        const finalUrl = `${baseUrl}?change_second=${seconds}`;
                        
                        fanSongRecommendationSource.push({
                            title: title,
                            artist: artist,
                            url: finalUrl
                        });
                    }
                });
            }
        });

        // 같은 노래가 여러 날짜에 기록되어 있어도 추천 후보에는 한 번만 넣는다.
        // 제목 + 가수를 기준으로 같은 곡을 하나로 묶고, 처음 발견된 링크 하나만 사용한다.
        const uniqueSongs = new Map();
        fanSongRecommendationSource.forEach(song => {
            const normalizeSongKey = value => String(value || "")
                .toLowerCase()
                .replace(/[\\s\\p{P}\\p{S}]+/gu, "");

            const key = `${normalizeSongKey(song.title)}|${normalizeSongKey(song.artist)}`;
            if (!uniqueSongs.has(key)) {
                uniqueSongs.set(key, song);
            }
        });
        fanSongRecommendationSource = Array.from(uniqueSongs.values());

        applyDailyFanSongRecommendations();
    }catch(error){
        console.error("노래 추천 목록 불러오기 실패:", error);
        fanSongRecommendationSource=[];
        fanSongRecommendationData=[];
        renderFanSongRecommendations();
    }
}

const CALENDAR_DATA_URL = "https://badabi-api.dalkkumli054.workers.dev/?type=fancalenar&t=";
const CALENDAR_MIN_DATE = new Date(2026, 3, 20);
const CALENDAR_TODAY = new Date();
const CALENDAR_MAX_DATE = new Date(CALENDAR_TODAY.getFullYear(), CALENDAR_TODAY.getMonth(), 1);

let calendarNotes = [];
let calendarCurrentDate = new Date(Math.max(CALENDAR_TODAY.getTime(), CALENDAR_MIN_DATE.getTime()));
calendarCurrentDate = new Date(calendarCurrentDate.getFullYear(), calendarCurrentDate.getMonth(), 1);

const calendarBody = document.getElementById("calendar-body");
const calendarMonthTitle = document.getElementById("calendar-month-title");
const calendarSectionMonth = document.getElementById("calendar-section-month");
const monthButtons = document.querySelectorAll("#schedule .month-button");

function calendarDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function calendarMonthKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
}

function calendarSameDay(a, b) {
    return calendarDateKey(a) === calendarDateKey(b);
}

function calendarSameMonth(a, b) {
    return calendarMonthKey(a) === calendarMonthKey(b);
}

function calendarEscapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = String(value ?? "");
    return div.innerHTML;
}

function calendarBuildNoteMap() {
    const map = new Map();
    calendarNotes.forEach(note => {
        if (!note || !note.date) return;
        const key = String(note.date).trim();
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(note);
    });
    return map;
}

function calendarRender() {
    if (!calendarBody) return;

    const year = calendarCurrentDate.getFullYear();
    const month = calendarCurrentDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDate = new Date(year, month + 1, 0).getDate();
    const firstWeekday = firstDay.getDay();
    const noteMap = calendarBuildNoteMap();

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    calendarMonthTitle.textContent = `${year}년 ${month + 1}월`;
    calendarSectionMonth.textContent = `${year}년 ${month + 1}월`;

    let html = "";
    let day = 1;

    for (let week = 0; week < 6; week++) {
        html += "<tr>";

        for (let weekday = 0; weekday < 7; weekday++) {
            const cellIndex = week * 7 + weekday;

            if (cellIndex < firstWeekday || day > lastDate) {
                html += "<td></td>";
                continue;
            }

            const cellDate = new Date(year, month, day);
            const key = calendarDateKey(cellDate);
            const notes = noteMap.get(key) || [];
            const isToday = calendarSameDay(cellDate, today);
            const isBeforeStart = cellDate < CALENDAR_MIN_DATE;
            const isFuture = cellDate > today;
            const hasNotes = notes.length > 0;

            let eventHtml = "";

            if (!isBeforeStart) {
                if (hasNotes) {
                    const firstNote = notes[0];
                    const title = firstNote.title || firstNote.type || "일정";
                    const countHtml = notes.length > 1
                        ? `<span class="calendar-count">+${notes.length}</span>`
                        : "";

                    eventHtml = `
                        <span class="calendar-event" title="${calendarEscapeHtml(title)}">
                            ${calendarEscapeHtml(title)}
                        </span>
                    `;

                    html += `
                        <td class="${isToday ? "today" : ""} has-calendar-notes" data-calendar-date="${key}" role="button" tabindex="0">
                            <span class="calendar-day-wrap">
                                <span class="calendar-day">${day}</span>
                                ${countHtml}
                            </span>
                            ${eventHtml}
                        </td>
                    `;
                } else if (isToday) {
                    eventHtml = `<span class="calendar-event">🌊 미정</span>`;
                } else if (!isFuture) {
                    eventHtml = `<span class="calendar-event">🌧️ 휴방</span>`;
                }

                if (!hasNotes) {
                    html += `
                        <td class="${isToday ? "today" : ""}">
                            <span class="calendar-day">${day}</span>
                            ${eventHtml}
                        </td>
                    `;
                }
            } else {
                html += `
                    <td class="${isToday ? "today" : ""}">
                        <span class="calendar-day">${day}</span>
                    </td>
                `;
            }

            day++;
        }

        html += "</tr>";
        if (day > lastDate) break;
    }

    calendarBody.innerHTML = html;
}

function calendarOpenModal(dateKey) {
    const modalBackdrop = document.getElementById("calendar-modal-backdrop");
    const modalTitle = document.getElementById("calendar-modal-title");
    const modalList = document.getElementById("calendar-modal-list");
    if (!modalBackdrop || !modalTitle || !modalList) return;

    const notes = calendarBuildNoteMap().get(dateKey) || [];
    if (!notes.length) return;

    const date = new Date(`${dateKey}T00:00:00`);
    modalTitle.textContent = `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 일정`;

    modalList.innerHTML = notes.map(note => {
        const time = note.time && note.time !== "-" ? note.time : "시간 미정";
        const type = note.type || "일정";
        const title = note.title || type;
        const category = note.category && note.category !== "-" ? note.category : "";
        const url = typeof note.url === "string" ? note.url.trim() : "";
        const hasLink = /^https?:\/\//i.test(url);

        return `
            <div class="calendar-modal-item">
                <div class="calendar-modal-meta">
                    <span class="calendar-modal-badge">${calendarEscapeHtml(time)}</span>
                    <span class="calendar-modal-badge">${calendarEscapeHtml(type)}</span>
                </div>
                <p class="calendar-modal-event-title">${calendarEscapeHtml(title)}</p>
                ${category ? `<p class="calendar-modal-category">${calendarEscapeHtml(category)}</p>` : ""}
                ${hasLink ? `<a class="calendar-modal-link" href="${calendarEscapeHtml(url)}" target="_blank" rel="noopener noreferrer">일정 링크 이동 →</a>` : ""}
            </div>
        `;
    }).join("");

    modalBackdrop.classList.add("open");
    modalBackdrop.setAttribute("aria-hidden", "false");
}

function calendarCloseModal() {
    const modalBackdrop = document.getElementById("calendar-modal-backdrop");
    if (!modalBackdrop) return;
    modalBackdrop.classList.remove("open");
    modalBackdrop.setAttribute("aria-hidden", "true");
}

async function loadCalendarData() {
    try {
        const response = await fetch(CALENDAR_DATA_URL + Date.now());
        if (!response.ok) throw new Error();
        const data = await response.json();
        calendarNotes = Array.isArray(data.notes) ? data.notes : [];
        calendarRender();
    } catch (error) {
        calendarNotes = [];
        calendarRender();
    }
}

calendarBody.addEventListener("click", event => {
    const cell = event.target.closest("td.has-calendar-notes");
    if (!cell || !calendarBody.contains(cell)) return;
    calendarOpenModal(cell.dataset.calendarDate);
});

const calendarModalBackdrop = document.getElementById("calendar-modal-backdrop");
const calendarModalClose = document.getElementById("calendar-modal-close");

if (calendarModalClose) {
    calendarModalClose.addEventListener("click", calendarCloseModal);
}

monthButtons.forEach((button, index) => {
    button.addEventListener("click", () => {
        const nextMonth = new Date(
            calendarCurrentDate.getFullYear(),
            calendarCurrentDate.getMonth() + (index === 0 ? -1 : 1),
            1
        );
        if (nextMonth < new Date(CALENDAR_MIN_DATE.getFullYear(), CALENDAR_MIN_DATE.getMonth(), 1)) return;
        if (nextMonth > CALENDAR_MAX_DATE) return;

        calendarCurrentDate = nextMonth;
        calendarRender();
    });
});

calendarRender();
loadCalendarData();
</script>
