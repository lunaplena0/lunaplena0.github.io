<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 메인페이지</title>
    <!-- 탭 아이콘(Favicon) 동적 변경을 위한 기본 link 태그 추가 -->
    <link rel="icon" id="dynamic-favicon" href="">
    <!-- Noto Sans KR 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* 전체 페이지 기본 설정: 모바일 하단 잘림 방지를 위해 min-height와 dvh 활용 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            min-height: 100dvh; /* 모바일 주소창 영역을 고려한 동적 뷰포트 높이 */
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden; /* 가로 스크롤만 방지 */
            font-family: 'Noto Sans KR', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2b2d42;
        }

        /* 상단 네비게이션 바 스타일: 고정 및 블러 효과 적용 */
        .marine-nav {
            position: sticky;
            top: 0;
            z-index: 40;
            width: 100%;
            background: rgba(3, 4, 94, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            padding: 12px 24px;
        }

        /* 네비게이션바 내부 컨테이너 정렬 (수직 중앙 정렬 확실하게 고정) */
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 네비게이션 로고 스타일 */
        .nav-logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #caf0f8;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* 네비게이션 링크 리스트 스타일 */
        .nav-links {
            display: flex;
            gap: 8px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        /* 네비게이션 개별 링크 스타일 및 호버 효과 */
        .nav-links a {
            color: #90e0ef;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease, background 0.2s ease;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* 메인 콘텐츠 영역 (화면 전체를 채우되 콘텐츠가 넘칠 경우 스크롤 허용) */
        .main-content-container {
            flex: 1;
            width: 100vw;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* 하단 짤림 방지를 위해 내부 스크롤 허용 */
        }

        /* 로딩 상태 표시 */
        .loading-text {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
            font-size: 15px;
        }

        /* 모바일 화면 대응 최적화 */
        @media (max-width: 768px) {
            .marine-nav {
                padding: 10px 16px; /* 모바일에서 상하좌우 패딩 축소 */
            }
            .nav-logo {
                font-size: 12px;
                letter-spacing: 1px;
            }
            .nav-links {
                gap: 4px; /* 버튼 사이 간격 좁힘 */
            }
            .nav-links a {
                font-size: 11px;
                padding: 4px 6px; /* 모바일에서 버튼 패딩 최적화로 치우침 방지 */
            }
        }
    </style>
</head>
<body>

    <!-- 상단 네비게이션 바 -->
    <nav class="marine-nav" id="marine-nav-bar">
        <div class="nav-container">
            <a href="#" class="nav-logo" id="default-home-link"> </a>
            <ul class="nav-links" id="nav-links-container">
                <!-- 동적 메뉴가 여기에 생성됩니다 -->
            </ul>
        </div>
    </nav>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content-container" id="main-content-area">
        <div class="loading-text">데이터를 불러오는 중입니다...</div>
    </div>

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";

        // 페이지가 로드될 때 서버에서 메인페이지 설정 데이터를 불러와 적용
        async function loadMainPageSettings() {
            const navBar = document.getElementById('marine-nav-bar');
            const logoEl = document.getElementById('default-home-link');
            const navLinksContainer = document.getElementById('nav-links-container');
            const faviconEl = document.getElementById('dynamic-favicon'); // 파비콘 엘리먼트 가져오기

            try {
                const timestamp = new Date().getTime();
                const response = await fetch(WORKER_URL + "?type=fanmainpages&t=" + timestamp);
                
                if (!response.ok) {
                    throw new Error("서버에서 데이터를 불러오지 못했습니다.");
                }

                const data = await response.json();

                if (data) {
if (data.image) {
    const cacheBuster = data.image.includes('?') ? '&t=' : '?t=';
    faviconEl.href = data.image + cacheBuster + timestamp;
    
    // 이미지 확장자에 맞춰 타입 설정 (브라우저 호환성 향상)
    if (data.image.endsWith('.png')) {
        faviconEl.type = "image/png";
    } else if (data.image.endsWith('.ico')) {
        faviconEl.type = "image/x-icon";
    } else if (data.image.endsWith('.svg')) {
        faviconEl.type = "image/svg+xml";
    }
}

                    // 1. 네비게이션 배경 색상 적용
                    if (data.navBgColor) {
                        navBar.style.background = data.navBgColor;
                    }

                    // 2. 로고 텍스트 및 링크 적용
                    if (data.logoText) {
                        logoEl.textContent = data.logoText;
                    }
                    logoEl.onclick = (e) => {
                        e.preventDefault();
                        if (data.mainContent) {
                            renderMainContent(data.mainContent);
                        }
                    };

                    // 3. 네비게이션 메뉴 목록 동적 생성 및 싱글 페이지(SPA) 스타일 연동
                    if (navLinksContainer && Array.isArray(data.menuItems)) {
                        navLinksContainer.innerHTML = "";
                        
                        data.menuItems.forEach(item => {
                            if (!item.name) return;
                            const li = document.createElement('li');
                            const a = document.createElement('a');
                            a.textContent = item.name;
                            a.href = item.url || "#";

                            // 메뉴 클릭 시 페이지 전체 이동 대신 내부 콘텐츠 변경
                            a.onclick = (e) => {
                                e.preventDefault();
                                if (item.url) {
                                    renderMainContent(item.url);
                                }
                            };

                            li.appendChild(a);
                            navLinksContainer.appendChild(li);
                        });
                    }

                    // 4. 초기 메인페이지 본문 콘텐츠 영역 렌더링
                    if (data.mainContent) {
                        renderMainContent(data.mainContent);
                    }
                }

            } catch (err) {
                console.error("메인페이지 설정 로드 실패:", err);
                const mainContainer = document.querySelector('.main-content-container');
                if (mainContainer) {
                    mainContainer.innerHTML = `<div class="loading-text" style="color: #ef4444;">설정을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>`;
                }
            }
        }

        // 메인 콘텐츠 영역에 주소(.html, http) 혹은 일반 HTML을 채워 넣는 공통 함수
        function renderMainContent(contentValue) {
            const mainContainer = document.querySelector('.main-content-container');
            if (!mainContainer) return;

            const trimmed = contentValue.trim();
            if (trimmed.endsWith('.html') || trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
                mainContainer.innerHTML = `
                    <iframe src="${trimmed}" style="width: 100%; height: 100%; border: none; background: white; margin: 0; display: block; flex: 1; min-height: 80vh;"></iframe>
                `;
            } else {
                mainContainer.innerHTML = trimmed;
            }
        }

        // 페이지가 열릴 때 실행
        document.addEventListener("DOMContentLoaded", loadMainPageSettings);
    </script>
</body>
</html>
