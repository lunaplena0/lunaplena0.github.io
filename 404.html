<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - 바다비</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        .profile-info-card {
            position: relative;
            z-index: 2;
            background: transparent; 
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-sizing: border-box;
            align-items: center;
            text-align: center;
        }

        /* 💡 애니메이션 키프레임 정의: 아래에서 위로 살짝 올라오며 나타남 */
        @keyframes fadeUpIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: #0077b6;
            margin: 0;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .error-message {
            font-size: 20px;
            font-weight: 600;
            color: #64748b;
            margin: 0 0 10px 0;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .profile-button-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0; 
            box-sizing: border-box;
            align-items: flex-start;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .profile-btn {
            background: transparent;
            border: none;
            border-radius: 0;
            border-bottom: 1px solid rgba(0, 119, 190, 0.15); 
            padding: 18px 0 18px 28px; 
            font-size: 26px;
            font-weight: 700;
            color: #0077b6;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: left;
            box-shadow: none;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            position: relative;
            box-sizing: border-box;
        }

        /* 왼쪽에 있는 세로 바 */
        .profile-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 30px;
            background-color: #0077b6;
            border-radius: 3px;
            transition: background-color 0.2s ease-in-out, height 0.2s ease-in-out;
        }

        /* 마우스 호버 시 효과 */
        .profile-btn:hover {
            color: #03045e;
            transform: translateX(8px);
            border-bottom-color: rgba(3, 4, 94, 0.3);
        }

        .profile-btn:hover::before {
            background-color: #03045e;
            height: 36px;
        }

        @media (max-width: 768px) { 
            body { 
                overflow: auto; 
                height: auto; 
            } 
            .ocean-profile-container { 
                height: auto; 
                min-height: auto; 
                padding: 16px; 
            } 
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <div class="profile-info-card">
            <h1 class="error-code">404</h1>
            <p class="error-message">요청하신 페이지를 찾을 수 없습니다.</p>
            
            <!-- 링크 영역 -->
            <div class="profile-button-grid" id="button-grid">
                <a href="index.html" class="profile-btn">메인으로 돌아가기</a>
            </div>
        </div>
    </div>

</body>
</html>
