<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - 바다비</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean-profile-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
            background: transparent; 
        }

        .profile-info-card {
            position: relative;
            z-index: 2;
            background: transparent; 
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-sizing: border-box;
            align-items: center;
            text-align: center;
        }

        /* 💡 애니메이션 키프레임 정의 */
        @keyframes fadeUpIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            width: 84px;
            height: 84px;
            margin-bottom: -6px;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .error-title {
            font-size: 32px;
            font-weight: 800;
            color: #0077b6;
            margin: 0;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .error-message {
            font-size: 18px;
            font-weight: 600;
            color: #64748b;
            margin: 0 0 10px 0;
            line-height: 1.5;
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .profile-button-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0; 
            box-sizing: border-box;
            align-items: center; /* 가운데 정렬 */
            opacity: 0;
            animation: fadeUpIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .profile-btn {
            background: transparent;
            border: none;
            border-radius: 0;
            border-bottom: 1px solid rgba(0, 119, 190, 0.15); 
            padding: 18px 0; 
            font-size: 26px;
            font-weight: 700;
            color: #0077b6;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center; /* 텍스트 가운데 정렬 */
            box-shadow: none;
            text-decoration: none;
            display: inline-block;
            width: 100%;
            position: relative;
            box-sizing: border-box;
        }

        /* 마우스 호버 시 효과 */
        .profile-btn:hover {
            color: #03045e;
            transform: translateY(-2px); /* 살짝 위로 떠오르는 효과 */
            border-bottom-color: rgba(3, 4, 94, 0.3);
        }

        @media (max-width: 768px) { 
            body { 
                overflow: auto; 
                height: auto; 
            } 
            .ocean-profile-container { 
                height: auto; 
                min-height: auto; 
                padding: 16px; 
            } 
        }
    </style>
</head>
<body>

    <div class="ocean-profile-container">
        <div class="profile-info-card">
            <!-- 바다의 물결/파도를 표현한 SVG 아이콘 -->
            <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="#0077b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.5 2 5 2 2.6 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
                <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.5 2 5 2 2.6 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
                <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.5 2 5 2 2.6 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
            </svg>

            <h1 class="error-title">바다비 팬 아카이브</h1>
            <p class="error-message">
                요청하신 페이지를 찾을 수 없습니다.<br>
                주소를 다시 한번 확인해주세요.
            </p>
            
            <!-- 링크 영역 -->
            <div class="profile-button-grid" id="button-grid">
                <a href="index.html" class="profile-btn">메인으로 돌아가기</a>
                <button type="button" class="profile-btn" onclick="history.back();">이전 페이지로 돌아가기</button>
            </div>
        </div>
    </div>

</body>
</html>
