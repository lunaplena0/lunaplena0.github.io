<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 노래통계</title>
    <link rel="icon" type="image/png" href="badabi_logo.png">
    <!-- Cloudflare Turnstile: Site Key는 공개 가능하지만 Secret Key는 Worker에만 보관합니다. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: #f8fafc;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
        }

        .main-container {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            padding: 12px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            max-height: 100dvh;
            overflow: hidden;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .title-summary-box {
            border-left: 5px solid #0ea5e9;
            padding-left: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .page-title {
            font-size: 21px;
            font-weight: 800;
            color: #0f172a;
            margin: 0;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title-svg {
            width: 24px;
            height: 24px;
            stroke: #0ea5e9;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        .stats-summary {
            font-size: 13.5px;
            color: #64748b;
            font-weight: 600;
            margin: 0;
        }

        .header-btn-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .header-action-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0369a1;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-action-btn:hover {
            background-color: #f8fafc;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .header-action-btn:active {
            transform: scale(0.97);
        }

        /* 로그인 / 노래 수정 */
        .song-admin-toolbar { display: none; align-items: center; gap: 7px; margin-top: 7px; }
        body.authenticated-mode .song-admin-toolbar { display: flex; }
        .song-admin-btn { border: 1px solid #cbd5e1; background: #fff; color: #0369a1; border-radius: 8px; padding: 6px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
        .song-admin-btn:hover { border-color: #0ea5e9; background: #f0f9ff; }
        .song-unregistered-section { grid-column:1/-1; border:1px solid #e2e8f0; border-radius:11px; background:#f8fafc; padding:10px; margin-bottom:2px; }
        .song-unregistered-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
        .song-unregistered-title { font-size:12px; font-weight:800; color:#0369a1; margin:0; }
        .song-unregistered-help { font-size:10.5px; color:#94a3b8; margin:0; }
        .song-unregistered-list { display:flex; flex-direction:column; gap:5px; max-height:180px; overflow-y:auto; }
        .song-unregistered-item { width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 9px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; cursor:pointer; text-align:left; font-family:inherit; }
        .song-unregistered-item:hover { border-color:#7dd3fc; background:#f0f9ff; }
        .song-unregistered-main { min-width:0; flex:1; }
        .song-unregistered-song { display:block; font-size:12px; font-weight:700; color:#334155; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .song-unregistered-meta { display:block; margin-top:2px; font-size:10.5px; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .song-unregistered-count { flex-shrink:0; padding:3px 6px; border-radius:7px; background:#e0f2fe; color:#0369a1; font-size:10px; font-weight:700; }
        .song-autocomplete-wrap { position:relative; }
        .song-autocomplete-list { display:none; position:absolute; z-index:1005; left:0; right:0; top:calc(100% + 4px); max-height:190px; overflow-y:auto; padding:4px; background:#fff; border:1px solid #dbe3ec; border-radius:10px; box-shadow:0 8px 22px rgba(15,23,42,.10); }
        .song-autocomplete-list.active { display:block; }
        .song-autocomplete-item { width:100%; display:block; border:0; background:transparent; text-align:left; padding:8px 9px; border-radius:7px; color:#334155; font:inherit; font-size:12px; cursor:pointer; }
        .song-autocomplete-item:hover { background:#f0f9ff; color:#0369a1; }
        .song-autocomplete-empty { padding:9px; color:#94a3b8; font-size:11px; }
        #noticeModalContent { white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; }
        .song-add-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .song-add-form .edit-form-field.full { grid-column: 1 / -1; }
        #noticeModalContent {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .notice-format-toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .notice-format-btn {
            min-width: 38px;
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--border-color, #d1d5db);
            border-radius: 8px;
            background: var(--card-bg, #fff);
            color: inherit;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
        }
        .notice-format-btn:hover {
            filter: brightness(0.96);
        }
        .notice-edit-content {
            white-space: pre-wrap;
            overflow-y: auto;
            outline: none;
        }
        .notice-edit-content:empty::before {
            content: "공지 내용을 입력해주세요.";
            opacity: 0.45;
            pointer-events: none;
        }

        .notice-edit-textarea {
            width: 100%;
            min-height: 220px;
            box-sizing: border-box;
            resize: vertical;
            border: 1px solid #d6dee8;
            border-radius: 12px;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 13.5px;
            line-height: 1.7;
            color: #334155;
            background: #fff;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
        }
        .notice-edit-textarea:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.12); }

        .song-auth-panel {
            padding: 2px 1px 0;
        }

        .song-auth-hero {
            text-align: center;
            padding: 8px 0 18px;
        }

        .song-auth-hero-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f9ff;
            color: #0369a1;
            border: 1px solid #dbeafe;
        }

        .song-auth-hero-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .song-auth-hero-title {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.3px;
        }

        .song-auth-hero-desc {
            margin: 6px 0 0;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
        }

        .song-auth-field {
            margin-top: 3px;
        }

        .song-auth-field-label {
            display: block;
            margin-bottom: 7px;
            font-size: 11.5px;
            font-weight: 700;
            color: #64748b;
        }

        .song-auth-input-shell {
            position: relative;
        }

        .song-auth-input {
            width: 100%;
            height: 42px;
            box-sizing: border-box;
            padding: 0 42px 0 13px;
            border: 1px solid #d6dee8;
            border-radius: 10px;
            background: #fff;
            color: #1e293b;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        .song-auth-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,.12);
        }

        .song-auth-eye {
            position: absolute;
            right: 7px;
            top: 6px;
            width: 30px;
            height: 30px;
            border: 0;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 7px;
        }

        .song-auth-eye:hover {
            color: #0369a1;
            background: #f0f9ff;
        }

        .song-turnstile-wrap {
            display: flex;
            justify-content: center;
            min-height: 65px;
            margin-top: 12px;
            overflow: hidden;
        }

        #songTurnstileWidget {
            min-height: 65px;
        }

        .song-auth-action {
            width: 100%;
            height: 41px;
            margin-top: 13px;
            border: 0;
            border-radius: 10px;
            background: #0369a1;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background .18s ease, transform .12s ease;
        }

        .song-auth-action:hover {
            background: #075985;
        }

        .song-auth-action:active {
            transform: translateY(1px);
        }

        .song-auth-cancel {
            width: 100%;
            height: 38px;
            margin-top: 7px;
            border: 0;
            background: transparent;
            color: #94a3b8;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .song-auth-cancel:hover {
            color: #64748b;
        }

        .song-logout-card {
            text-align: center;
            padding: 5px 0 1px;
        }

        .song-logout-icon {
            width: 46px;
            height: 46px;
            margin: 2px auto 11px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .song-logout-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .song-logout-title {
            margin: 0;
            font-size: 15px;
            font-weight: 800;
            color: #334155;
        }

        .song-logout-desc {
            margin: 6px 0 16px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
        }

        .song-logout-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .song-logout-actions button {
            height: 39px;
            border-radius: 9px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .song-logout-cancel {
            border: 1px solid #d6dee8;
            background: #fff;
            color: #64748b;
        }

        .song-logout-confirm {
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #475569;
        }

        .song-logout-confirm:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .song-auth-intro { display:flex; align-items:center; gap:12px; padding:12px 13px; margin-bottom:14px; border:1px solid #dbeafe; border-radius:12px; background:linear-gradient(135deg,#f0f9ff,#fff); }
        .song-auth-intro-icon { width:38px; height:38px; flex-shrink:0; border-radius:10px; display:flex; align-items:center; justify-content:center; background:#e0f2fe; color:#0369a1; }
        .song-auth-intro-icon svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .song-auth-intro-text strong { display:block; font-size:14px; color:#03045e; margin-bottom:3px; }
        .song-auth-intro-text span { display:block; font-size:11.5px; color:#64748b; }
        .song-auth-password-wrap { position:relative; }
        .song-auth-password-wrap .modal-input { width:100%; box-sizing:border-box; padding-right:42px; }
        .song-auth-password-toggle { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:30px; height:30px; border:0; background:transparent; color:#64748b; cursor:pointer; border-radius:7px; }
        .song-auth-password-toggle:hover { background:#f1f5f9; color:#0369a1; }
        @media (max-width:520px) { .song-add-form { grid-template-columns:1fr; } .song-add-form .edit-form-field.full { grid-column:auto; } }
        .song-title-login-trigger {
            width: 24px;
            height: 24px;
            padding: 0;
            margin: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .song-title-login-trigger:hover {
            background: #e0f2fe;
        }

        .song-title-login-trigger.authenticated .page-title-svg {
            stroke: #0369a1;
        }

        .auth-icon-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #0369a1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .auth-icon-btn:hover {
            border-color: #0ea5e9;
            background: #f8fafc;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .auth-icon-btn.authenticated {
            color: #03045e;
            border-color: #0ea5e9;
            background: #e0f2fe;
        }

        .auth-icon-svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .song-edit-btn {
            margin-left: 4px;
            display: none;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0369a1;
            border-radius: 8px;
            padding: 4px 7px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .song-edit-btn:hover {
            border-color: #0ea5e9;
            background: #e0f2fe;
        }

        body.authenticated-mode .song-edit-btn {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .song-card.auth-editing {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
        }

        .edit-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .edit-form-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .edit-form-field.full {
            grid-column: 1 / -1;
        }

        .edit-form-label {
            font-size: 12px;
            font-weight: 700;
            color: #0369a1;
        }

        .edit-form-input,
        .edit-form-textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            padding: 9px 10px;
            font-size: 13px;
            font-family: inherit;
            color: #1e293b;
            outline: none;
            background: #ffffff;
        }

        .edit-form-input:focus,
        .edit-form-textarea:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.12);
        }

        .edit-form-textarea {
            min-height: 74px;
            resize: vertical;
            line-height: 1.45;
        }

        .auth-status {
            font-size: 12px;
            color: #64748b;
            margin: -5px 0 0;
        }

        .modal-btn-danger {
            background: #ffadc0;
            border: 1px solid #efc3cc;
            color: #b85c6b;
        }

        /* 저장 / 삭제 / 취소 버튼 호버 */
        .modal-actions .modal-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .modal-actions .modal-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.10);
        }

        .modal-actions .modal-btn-close:hover {
            background-color: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
        }

        .modal-actions .modal-btn-refresh:hover {
            background-color: #f0f9ff;
            border-color: #7dd3fc;
            color: #0369a1;
        }

        .modal-actions .modal-btn-danger:hover {
            background-color: #f3a6ae;
            border-color: #e8909a;
            color: #6b1726;
            box-shadow: 0 3px 10px rgba(244, 114, 114, 0.18);
        }

        .modal-actions .modal-btn:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
        }

        .modal-btn-danger:hover {
            background: #f4d2da;
            border-color: #e7b5c0;
            color: #a94f60;
        }

        @media (max-width: 520px) {
            .edit-form-grid {
                grid-template-columns: 1fr;
            }
            .edit-form-field.full {
                grid-column: auto;
            }
        }

        .btn-icon-svg {
            width: 15px;
            height: 15px;
            stroke: #0369a1;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.2s;
        }

        .search-container {
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }

        .search-icon-wrapper {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }

        .search-icon-svg {
            width: 18px;
            height: 18px;
            stroke: #64748b;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.2s;
        }

        .search-icon-wrapper:hover .search-icon-svg {
            stroke: #0ea5e9;
        }

        .search-box {
            width: 100%;
            padding: 12px 42px 12px 16px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .filter-tags-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }

        .filter-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0369a1;
            height: 34px;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .filter-btn:hover {
            background-color: #f8fafc;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .filter-btn.active {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }

        /* 주요 4개 장르 외의 장르가 있을 때만 표시 */
        .filter-btn.other-genre-btn {
            display: none;
        }
        .filter-btn.other-genre-btn.visible {
            display: inline-flex;
        }

        .sub-filter-btn {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0369a1;
            width: 35px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .sub-filter-btn:hover {
            background-color: #f8fafc;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .sub-filter-btn.active-filter {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }

        .sub-filter-btn.active-filter svg {
            stroke: white;
        }

        .filter-icon-svg {
            width: 18px;
            height: 18px;
            stroke: #0369a1;
            stroke-width: 2.2;
            stroke-linecap: round;
            fill: none;
            transition: stroke 0.2s;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }

    <script>
        const WORKER_URL = "https://badabi-api.dalkkumli054.workers.dev/";
        // 관리자 비밀번호는 localStorage/sessionStorage에 저장하지 않는다. 서버에서 권한을 검증해야 한다.
        // Cloudflare Turnstile Site Key
        // 아래 값은 Cloudflare Dashboard에서 발급받은 Site Key로 교체하세요.
        // Secret Key(TURNSTILE_SECRET_KEY)는 절대 이 HTML에 넣지 않습니다.
        const TURNSTILE_SITE_KEY = "YOUR_TURNSTILE_SITE_KEY";
        let songTurnstileToken = "";
        let songTurnstileWidgetId = null;

        const SONG_LIST_URL = WORKER_URL + "?type=songlist&t=";
        const STATS_API_URL = WORKER_URL + "?type=fansongstats&t=";

        let allSongs = [];
        let filteredSongs = [];
        let sortedSongs = [];
        let vodMap = {};
        let currentFilter = '전체';
        let currentVersionFilter = '전체';
        let currentCountFilter = '전체';
        let currentRecentFilter = '전체';
        let toastTimer = null;

        // 관리자 비밀번호는 브라우저에 저장하지 않는다.
        // Worker가 발급한 서명된 세션 토큰만 7일간 유지한다.
        let isSongAuthenticated = false;
        let songSessionToken = localStorage.getItem("badabi_session") || "";
        let editingSongIndex = -1;
        let songSaveQueue = Promise.resolve();
        let isSongLocallyMutating = false;
        let currentNoticeText = "";
        let noticeEditOriginalText = "";
        let fansongStatsData = { vodSources: [], registeredSongs: [], unregisteredSongs: [] };
        let selectedUnregisteredKey = "";
        const songAddModal = document.getElementById("songAddModal");
        const noticeEditModal = document.getElementById("noticeEditModal");

        const songAuthModal = document.getElementById("songAuthModal");
        const songAuthModalContent = document.getElementById("songAuthModalContent");
        const songEditModal = document.getElementById("songEditModal");
        const songAuthBtn = document.getElementById("songTitleLoginTrigger");

        function timeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(":").map(Number);
            if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
            else if (parts.length === 2) return parts[0] * 60 + parts[1];
            return 0;
        }

        function parseDateString(dateStr) {
            if (!dateStr) return null;
            let cleanStr = dateStr.replace(/\(.*?\)/g, "").trim().replace(/\./g, '-');
            const parts = cleanStr.split('-');
            if (parts.length === 3) return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
            else if (parts.length === 2) return new Date(new Date().getFullYear(), parseInt(parts[0], 10) - 1, parseInt(parts[1], 10));
            const d = new Date(cleanStr);
            return isNaN(d.getTime()) ? null : d;
        }

        function toggleSongCard(cardElement) { cardElement.classList.toggle("expanded"); }

        function showToastMessage(customText) {
            const toast = document.getElementById("toastMessage");
            toast.textContent = customText;
            toast.classList.add("show");
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove("show"); }, 2000);
        }

        function copySongInfo(title, artist, event) {
            if (event) event.stopPropagation();
            const textToCopy = artist ? `${title} - ${artist}` : title;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToastMessage(`'${textToCopy}' 노래와 가수가 복사되었습니다.`);
            });
        }

        async function openSongAuthModal() {
            await restoreSongAuthentication();
            if (isSongAuthenticated) {
                songAuthModalContent.innerHTML = `
                    <div class="song-logout-card">
                        <div class="song-logout-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M9 18V5l12-2v13"></path>
                                <circle cx="6" cy="18" r="3"></circle>
                                <circle cx="18" cy="16" r="3"></circle>
                            </svg>
                        </div>
                        <h4 class="song-logout-title">관리자 모드</h4>
                        <p class="song-logout-desc">현재 노래책 관리 권한으로 로그인되어 있습니다.<br>로그아웃하면 수정 기능이 다시 숨겨집니다.</p>
                        <div class="song-logout-actions">
                            <button class="song-logout-confirm" onclick="logoutSongAuth()">로그아웃</button>
                            <button class="song-logout-cancel" onclick="closeSongAuthModal()">닫기</button>
                        </div>
                    </div>
                `;
            } else {
                songAuthModalContent.innerHTML = `
                    <div class="song-auth-panel">
                        <div class="song-auth-hero">
                            <div class="song-auth-hero-icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M9 18V5l12-2v13"></path>
                                    <circle cx="6" cy="18" r="3"></circle>
                                    <circle cx="18" cy="16" r="3"></circle>
                                </svg>
                            </div>
                            <h4 class="song-auth-hero-title">노래책 관리자 로그인</h4>
                            <p class="song-auth-hero-desc">노래와 공지를 관리하려면 인증이 필요합니다.</p>
                        </div>
                        <div class="song-auth-field">
                            <label class="song-auth-field-label" for="songPasswordInput">패스워드</label>
                            <div class="song-auth-input-shell">
                                <input type="password" class="song-auth-input" id="songPasswordInput"
                                       placeholder="관리자 패스워드를 입력하세요" autocomplete="current-password">
                                <button type="button" class="song-auth-eye" onclick="toggleSongPasswordVisibility()" aria-label="패스워드 표시">◉</button>
                            </div>
                        </div>
                        <div class="song-turnstile-wrap">
                            <div id="songTurnstileWidget"></div>
                        </div>
                        <button class="song-auth-action" onclick="verifySongPassword()">로그인</button>
                        <button class="song-auth-cancel" onclick="closeSongAuthModal()">취소</button>
                    </div>
                `;
                setTimeout(() => {
                    const input = document.getElementById("songPasswordInput");
                    if (input) {
                        input.focus();
                        input.addEventListener("keydown", (event) => {
                            if (event.key === "Enter") {
                                event.preventDefault();
                                verifySongPassword();
                            }
                        });
                    }
                    waitForSongTurnstile();
                }, 50);
            }
            songAuthModal.classList.add("active");
        }

        function onSongTurnstileSuccess(token) {
            songTurnstileToken = typeof token === "string" ? token : "";
        }

        function resetSongTurnstile() {
            songTurnstileToken = "";
            if (window.turnstile && songTurnstileWidgetId !== null) {
                try {
                    window.turnstile.reset(songTurnstileWidgetId);
                } catch (error) {
                    console.warn("Turnstile 초기화 실패");
                }
            }
        }

        function renderSongTurnstile() {
            if (typeof window.turnstile === "undefined") return;
            const container = document.getElementById("songTurnstileWidget");
            if (!container || !TURNSTILE_SITE_KEY || TURNSTILE_SITE_KEY === "YOUR_TURNSTILE_SITE_KEY") return;

            songTurnstileToken = "";

            try {
                if (songTurnstileWidgetId !== null) {
                    window.turnstile.remove(songTurnstileWidgetId);
                    songTurnstileWidgetId = null;
                }

                songTurnstileWidgetId = window.turnstile.render(container, {
                    sitekey: TURNSTILE_SITE_KEY,
                    callback: onSongTurnstileSuccess,
                    "expired-callback": resetSongTurnstile,
                    "timeout-callback": resetSongTurnstile,
                    theme: "auto"
                });
            } catch (error) {
                console.error("Turnstile 렌더링 실패:", error);
            }
        }

        function waitForSongTurnstile() {
            if (typeof window.turnstile !== "undefined") {
                renderSongTurnstile();
                return;
            }
            let attempts = 0;
            const timer = setInterval(() => {
                attempts += 1;
                if (typeof window.turnstile !== "undefined") {
                    clearInterval(timer);
                    renderSongTurnstile();
                } else if (attempts >= 50) {
                    clearInterval(timer);
                }
            }, 100);
        }

        function closeSongAuthModal() {
            songAuthModal.classList.remove("active");
            if (!isSongAuthenticated) resetSongTurnstile();
        }

        function toggleSongPasswordVisibility() {
            const input=document.getElementById("songPasswordInput");
            if(input) input.type=input.type==="password" ? "text" : "password";
        }

        async function verifySongPassword() {
            const input = document.getElementById("songPasswordInput");
            const password = input ? input.value : "";

            if (!password) {
                showToastMessage("패스워드를 입력해주세요.");
                return;
            }

            if (!songTurnstileToken) {
                showToastMessage("보안 인증을 완료해주세요.");
                return;
            }

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        password,
                        turnstileToken: songTurnstileToken,
                        action: "verify"
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success || !data.sessionToken) {
                    throw new Error(data.error || "인증 실패");
                }

                // 비밀번호는 저장하지 않고 Worker가 발급한 서명된 세션 토큰만 유지합니다.
                songSessionToken = data.sessionToken;
                localStorage.setItem("badabi_session", songSessionToken);
                localStorage.removeItem("badabi_song_auth_password");

                isSongAuthenticated = true;
                songTurnstileToken = "";
                updateSongAuthUI();
                closeSongAuthModal();
                showToastMessage("성공적으로 로그인되었습니다!");
            } catch (error) {
                console.error("관리자 로그인 실패:", error);
                showToastMessage(error.message || "로그인에 실패했습니다. 다시 시도해주세요.");
                resetSongTurnstile();
                if (input) {
                    input.value = "";
                    input.focus();
                }
            }
        }

        function logoutSongAuth() {
            isSongAuthenticated = false;
            songSessionToken = "";
            localStorage.removeItem("badabi_session");
            localStorage.removeItem("badabi_song_auth_password");
            resetSongTurnstile();
            updateSongAuthUI();
            closeSongAuthModal();
            showToastMessage("로그아웃되었습니다.");
        }

        async function restoreSongAuthentication() {
            const token = localStorage.getItem("badabi_session") || songSessionToken || "";

            if (!token) {
                isSongAuthenticated = false;
                songSessionToken = "";
                updateSongAuthUI();
                return false;
            }

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sessionToken: token,
                        action: "verify"
                    })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok || !data.success || !data.role) {
                    throw new Error("saved session rejected");
                }

                songSessionToken = token;
                isSongAuthenticated = true;
                localStorage.removeItem("badabi_song_auth_password");
                updateSongAuthUI();
                return true;
            } catch (error) {
                console.warn("저장된 관리자 세션이 만료되었거나 유효하지 않습니다.");
                songSessionToken = "";
                isSongAuthenticated = false;
                localStorage.removeItem("badabi_session");
                localStorage.removeItem("badabi_song_auth_password");
                updateSongAuthUI();
                return false;
            }
        }

        function updateSongAuthUI() {
            document.body.classList.toggle("authenticated-mode", isSongAuthenticated);

            if (songAuthBtn) {
                songAuthBtn.classList.toggle("authenticated", isSongAuthenticated);
                songAuthBtn.title = isSongAuthenticated
                    ? "노래책 관리자 모드 - 클릭하여 관리"
                    : "노래책 로그인 / 인증";
            }

            // 현재 검색/정렬 상태에서도 관리자 버튼과 수정 버튼을 즉시 다시 렌더링
            if (typeof updateFilteredAndSorted === "function") {
                try { updateFilteredAndSorted(); } catch (e) {}
            }
            if (typeof renderAllSongs === "function") {
                try { renderAllSongs(); } catch (e) {}
            }
        }

        function openSongEditModal(index) {
            if (!isSongAuthenticated) { openSongAuthModal(); return; }
            editingSongIndex = allSongs.indexOf(sortedSongs[index]);
            const song = sortedSongs[index];
            if (!song || editingSongIndex < 0) return;
            document.getElementById("editSongTitle").value = song.title || "";
            document.getElementById("editSongArtist").value = song.artist || "";
            document.getElementById("editSongGenre").value = song.genre || "";
            document.getElementById("editSongLimit").value = song.limit || "";

        function sanitizeNoticeHtml(value) {
            const raw = String(value ?? "");
            if (!raw) return "";

            // 공지에 필요한 서식 태그만 허용하고 나머지는 제거한다.
            const doc = new DOMParser().parseFromString(`<div>${raw}</div>`, "text/html");
            const root = doc.body.firstElementChild;
            if (!root) return "";

            const allowed = new Set(["B", "I", "U", "S", "BR", "P", "DIV", "SPAN"]);
            root.querySelectorAll("*").forEach(node => {
                if (!allowed.has(node.tagName)) {
                    node.replaceWith(...Array.from(node.childNodes));
                    return;
                }
                Array.from(node.attributes).forEach(attr => {
                    if(attr.name.toLowerCase() !== "style"){
                        node.removeAttribute(attr.name);
                    }
                });

                if(node.hasAttribute("style")){
                    const allowedStyles = [];
                    const styleText = node.getAttribute("style") || "";
                    styleText.split(";").forEach(rule => {
                        const parts = rule.split(":");
                        if(parts.length < 2) return;
                        const prop = parts[0].trim().toLowerCase();
                        const value = parts.slice(1).join(":").trim();
                        if(prop === "font-weight" && (value === "bold" || value === "700")){
                            allowedStyles.push("font-weight: bold");
                        }
                        if(prop === "text-decoration" && /^(underline|line-through)(\s+underline|\s+line-through)*$/.test(value)){
                            allowedStyles.push(`${prop}: ${value}`);
                        }
                        if(prop === "font-style" && value === "italic"){
                            allowedStyles.push(`${prop}: italic`);
                        }
                    });
                    if(allowedStyles.length) node.setAttribute("style", allowedStyles.join("; "));
                    else node.removeAttribute("style");
                }
            });
            return root.innerHTML;
        }

        function rememberNoticeSelection(){

        function getNoticeStyleInfo(node) {
            if (!node || node.nodeType !== Node.ELEMENT_NODE) return "";
            const tag = node.tagName.toLowerCase();
            const style = (node.getAttribute("style") || "").toLowerCase().replace(/\s+/g, "");
            if (tag === "s" || tag === "strike" || style.includes("text-decoration:line-through")) return "strikeThrough";
            if (tag === "u" || style.includes("text-decoration:underline")) return "underline";
            if (tag === "i" || style.includes("font-style:italic")) return "italic";
            if (tag === "b" || tag === "strong" || /font-weight:(?:bold|700)/.test(style)) return "bold";
            return "";
        }

        function findNoticeFormatAncestor(node, command, editor) {
            let cur = node && node.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
            while (cur && cur !== editor) {
                if (getNoticeStyleInfo(cur) === command) return cur;
                cur = cur.parentElement;
            }
            return null;
        }

        function unwrapNoticeNode(node) {
            if (!node || !node.parentNode) return [];
            const parent = node.parentNode;
            const moved = Array.from(node.childNodes);
            moved.forEach(child => parent.insertBefore(child, node));
            parent.removeChild(node);
            return moved;
        }

            } catch (error) {

            if (range.collapsed || !editor.contains(range.commonAncestorContainer)) return;

            // 브라우저의 selection 기반 토글을 사용한다.
            // 같은 서식을 다시 누르면 해당 서식만 해제되고, 다른 서식은 유지된다.
            try {

            } catch (error) {
                console.error("공지 서식 적용 실패:", error);

            }

            const updatedSelection = window.getSelection();
            if (updatedSelection && updatedSelection.rangeCount) {

                }
            }
        }

        function serializeNoticeForStorage(editor){
            function escText(value){
                return String(value ?? "")
                    .replace(/&/g,"&amp;")
                    .replace(/</g,"&lt;")
                    .replace(/>/g,"&gt;")
                    .replace(/"/g,"&quot;");
            }

            function walk(node){
                if(node.nodeType===Node.TEXT_NODE) return escText(node.nodeValue);
                if(node.nodeType!==Node.ELEMENT_NODE) return "";

                const tag=node.tagName.toLowerCase();

                if(tag==="br") return "\n";

                let inner="";
                Array.from(node.childNodes).forEach(child=>{
                    inner+=walk(child);
                });

                if(tag==="div" || tag==="p"){
                    return inner + "\n";
                }

                // 허용된 서식만 저장
                if(tag==="b" || tag==="strong"){
                    return '<span style="font-weight: bold;">'+inner+"</span>";
                }
                if(tag==="i"){
                    return '<span style="font-style: italic;">'+inner+"</span>";
                }
                if(tag==="u"){
                    return '<span style="text-decoration: underline;">'+inner+"</span>";
                }
                if(tag==="s" || tag==="strike"){
                    return '<span style="text-decoration: line-through;">'+inner+"</span>";
                }

                if(tag==="span"){
                    const raw=node.getAttribute("style") || "";
                    const styles=[];
                    raw.split(";").forEach(part=>{
                        const bits=part.split(":");
                        if(bits.length<2)return;
                        const prop=bits[0].trim().toLowerCase();
                        const val=bits.slice(1).join(":").trim().toLowerCase();

                        if(prop==="font-weight" && (val==="bold" || val==="700")){
                            styles.push("font-weight: bold");
                        }else if(prop==="font-style" && val==="italic"){
                            styles.push("font-style: italic");
                        }else if(prop==="text-decoration" && val.includes("line-through")){
                            styles.push("text-decoration: line-through");
                        }else if(prop==="text-decoration" && val.includes("underline")){
                            styles.push("text-decoration: underline");
                        }
                    });

                    if(styles.length && inner){
                        return '<span style="'+styles.join("; ")+';">'+inner+"</span>";
                    }
                    return inner;
                }

                return inner;
            }

            return walk(editor)
                .replace(/\r\n/g,"\n")
                .replace(/\n{3,}/g,"\n\n")
                .replace(/^\n+|\n+$/g,"");
        }

        function setupSongTitleMarquees(container, scrollRoot = null) {
            if (window.innerWidth > 768 || !container) return;

            requestAnimationFrame(() => {
                const marquees = [];
                container.querySelectorAll('.song-text-viewport').forEach(viewport => {
                    const text = viewport.querySelector('.song-text-marquee');
                    if (!text) return;

                    const overflow = Math.ceil(text.scrollWidth - viewport.clientWidth);
                    if (overflow > 0) {
                        viewport.classList.add('marquee-active');
                        viewport.classList.remove('marquee-visible');
                        text.style.setProperty('--song-title-shift', `${-overflow}px`);
                        marquees.push(viewport);
                    } else {
                        viewport.classList.remove('marquee-active', 'marquee-visible');
                        text.style.removeProperty('--song-title-shift');
                    }
                });

                if ('IntersectionObserver' in window) {
                    const observer = new IntersectionObserver(entries => {
                        entries.forEach(entry => {
                            entry.target.classList.toggle('marquee-visible', entry.isIntersecting);
                        });
                    }, { root: scrollRoot, threshold: 0.01 });
                    marquees.forEach(viewport => observer.observe(viewport));
                } else {
                    marquees.forEach(viewport => viewport.classList.add('marquee-visible'));
                }
            });
        }

        function animateNumber(elementId, endValue, duration = 800) {
            const element = document.getElementById(elementId);
            if (!element) return;
            const startTime = performance.now();
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                element.textContent = Math.floor(progress * endValue).toLocaleString();
                if (progress < 1) requestAnimationFrame(update);
                else element.textContent = endValue.toLocaleString();
            }
            requestAnimationFrame(update);
        }

        function updateOtherGenreButtonVisibility() {

        function updateFilteredAndSorted() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
            const now = new Date();

            filteredSongs = allSongs.filter(song => {
                const title = song.title || '';
                const artist = song.artist || '';
                const genre = song.genre || '';
                const limit = song.limit || '';
                const etc = song.etc || '';

                const matchesKeyword = title.toLowerCase().includes(keyword) || artist.toLowerCase().includes(keyword) || genre.toLowerCase().includes(keyword) || limit.toLowerCase().includes(keyword) || etc.toLowerCase().includes(keyword);
                if (!matchesKeyword) return false;

                const g = genre.toLowerCase();
                const l = limit.toLowerCase();
                let matchesGenre = true;
                if (currentFilter === '기타연주') matchesGenre = l.includes('기타');
                else if (currentFilter === 'k팝') matchesGenre = g.includes('k') || g.includes('가요');
                else if (currentFilter === 'j팝') matchesGenre = g.includes('j') || g.includes('일본');
                else if (currentFilter === '팝') matchesGenre = (g.includes('팝') || g.includes('pop')) && !g.includes('k') && !g.includes('j');
                 else if (currentFilter.startsWith('장르:')) {
                     const selectedGenre = currentFilter.slice(3).trim().toLowerCase();
                     matchesGenre = g === selectedGenre;
                 }
                 else if (currentFilter === '그 외') {
                     const isKpop = g.includes('k') || g.includes('가요');
                     const isJpop = g.includes('j') || g.includes('일본');
                     const isPop = (g.includes('팝') || g.includes('pop')) && !isKpop && !isJpop;
                     matchesGenre = l.includes('기타') ? false : (g !== '' && !isKpop && !isJpop && !isPop);
                 }

                if (!matchesGenre) return false;
                const isGuitarVersion = l.includes('기타');
                if (currentVersionFilter === '일반버전' && isGuitarVersion) return false;
                if (currentVersionFilter === '기타버전' && !isGuitarVersion) return false;

                const dateTimes = song.dateTimes || [];
                let targetPlayCount = 0;
                if (currentRecentFilter !== '전체') {
                    const daysLimit = parseInt(currentRecentFilter, 10);
                    dateTimes.forEach(dt => {
                        const songDate = parseDateString(dt.date);
                        if (songDate) {
                            const nowDateOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                            const songDateOnly = new Date(songDate.getFullYear(), songDate.getMonth(), songDate.getDate());
                            const diffDays = (nowDateOnly - songDateOnly) / (1000 * 3600 * 24);
                            if (diffDays >= 0 && diffDays <= daysLimit) targetPlayCount++;
                        }
                    });
                } else {
                    targetPlayCount = dateTimes.length;
                }

                const playCountToCheck = currentRecentFilter !== '전체' ? targetPlayCount : dateTimes.length;
                if (currentCountFilter === '0' && playCountToCheck !== 0) return false;
                if (currentCountFilter === '1' && playCountToCheck !== 1) return false;
                if (currentCountFilter === '2' && playCountToCheck !== 2) return false;
                if (currentCountFilter === '3' && playCountToCheck < 3) return false;

                if (currentRecentFilter !== '전체' && currentCountFilter === '전체') {
                    const daysLimit = parseInt(currentRecentFilter, 10);
                    let hasRecentPlay = false;
                    dateTimes.forEach(dt => {
                        const songDate = parseDateString(dt.date);
                        if (songDate) {
                            const diffDays = (now.getTime() - songDate.getTime()) / (1000 * 3600 * 24);
                            if (diffDays >= 0 && diffDays <= daysLimit) hasRecentPlay = true;
                        }
                    });
                    if (!hasRecentPlay) return false;
                }

                return true;
            });

            sortedSongs = [...filteredSongs].sort((a, b) => {
                const artistA = (a.artist || '아티스트 미상').trim();
                const artistB = (b.artist || '아티스트 미상').trim();
                const artistCompare = artistA.localeCompare(artistB, 'ko', { sensitivity: 'base' });
                if (artistCompare !== 0) return artistCompare;

                const titleA = (a.title || '').trim();
                const titleB = (b.title || '').trim();
                const titleCompare = titleA.localeCompare(titleB, 'ko', { sensitivity: 'base' });
                if (titleCompare !== 0) return titleCompare;

                // 같은 가수/같은 제목이면 일반 버전을 먼저, 기타전용 버전을 다음으로
                const isGuitarA = String(a.limit || '').toLowerCase().includes('기타');
                const isGuitarB = String(b.limit || '').toLowerCase().includes('기타');
                if (isGuitarA !== isGuitarB) return isGuitarA ? 1 : -1;

                return 0;
            });
        }

                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="10" y1="14" x2="21" y2="3"></line>
                                </svg>
                            </a>
                        `;
                    });
                    timestampsHTML += '</div>';
                } else {
                    timestampsHTML = '<div class="timestamp-container" style="padding: 10px 16px; font-size: 13px; color: #64748b;">부른 기록이 없습니다.</div>';
                }

                const safeTitle = (song.title || '').replace(/'/g, "\\'");
                const safeArtist = (song.artist || '').replace(/'/g, "\\'");

                card.innerHTML = `
                    <div class="song-summary-row">
                        <div class="song-info-left">
                            <div class="song-title-wrapper">
                                <div class="song-title-line">
                                    ${limitBadge}
                                    <div class="song-text-viewport">
                                        <div class="song-text-marquee">
                                            <h3 class="song-title"><span class="song-title-copy" onclick="copySongInfo('${safeTitle}', '${safeArtist}', event)">${song.title || '제목없음'}</span></h3>
                                        </div>
                                    </div>
                                </div>
                                <span class="song-artist">${song.artist || ''}</span>
                            </div>
                        </div>
                        <div class="song-badges">
                            ${etcBadge}
                            ${genreBadge}
                            ${countBadge}
                            ${isSongAuthenticated ? `<button class="song-edit-btn" onclick="event.stopPropagation(); openSongEditModal(${sortedIndex})" title="노래 수정">✎ 수정</button>` : ""}
                        </div>
                    </div>
                    ${timestampsHTML}
                `;
                fragment.appendChild(card);
            });

            container.appendChild(fragment);

            // 모바일에서 실제로 영역을 넘는 긴 제목만 자동 슬라이드.
            setupSongTitleMarquees(container, container.closest('.song-list-scroll-wrapper') || null);
        }

        function onSearchInput() { updateFilteredAndSorted(); renderAllSongs(); }
        function triggerSearch() { updateFilteredAndSorted(); renderAllSongs(); }

        restoreSongAuthentication().finally(() => {
            loadData();
        });
    </script>
    <footer style="text-align: center; padding: 5px 10px; color: #b3cde0; font-size: 11px; border-top: 1px solid rgba(0, 229, 255, 0.12); margin-top: 5px; width: 100%; box-sizing: border-box;">
        <p style="margin: 0; opacity: 0.8; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;">
            <strong style="display: block; margin-bottom: 5px; color: #03045e; font-size: 12px;">바다비 팬 제작 노래통계</strong>
            <span style="display: inline-block;">수정 · 요청은 팬카페에 올려주세요</span>
        </p>
    </footer>

<div class="modal-overlay" id="vodModal"><div class="filter-modal-box" style="width:92%;max-width:620px;max-height:88vh"><div class="modal-header"><h3 class="modal-title">VOD 관리</h3><button class="modal-close-btn" onclick="closeVodModal()">✕</button></div><div class="edit-form-grid"><div class="edit-form-field"><label class="edit-form-label">VOD 날짜</label><input id="statsVodDate" class="edit-form-input" type="date"></div><div class="edit-form-field"><label class="edit-form-label">방송 회차</label><select id="statsVodRound" class="edit-form-input"><option value="0">일반</option><option value="1">(1)</option><option value="2">(2)</option><option value="3">(3)</option><option value="4">(4)</option><option value="5">(5)</option></select></div><div class="edit-form-field full"><label class="edit-form-label">VOD 주소</label><input id="statsVodUrl" class="edit-form-input" type="url" placeholder="https://..."></div></div><div class="modal-actions"><button class="modal-btn modal-btn-close" onclick="saveStatsVod()">저장</button><button class="modal-btn modal-btn-refresh" onclick="resetVodForm()">초기화</button></div><div id="statsVodList" class="stats-vod-list"></div></div></div>
<script>
let editingVodKey='';
function openVodModal(){if(!isSongAuthenticated){openSongAuthModal();return;}resetVodForm();renderStatsVodList();document.getElementById('vodModal').classList.add('active')}
function closeVodModal(){document.getElementById('vodModal')?.classList.remove('active')}
function resetVodForm(){editingVodKey='';document.getElementById('statsVodDate').value=new Date().toISOString().slice(0,10);document.getElementById('statsVodRound').value='0';document.getElementById('statsVodUrl').value=''}
function vodRoundKey(date,round){return round>0?`${date} (${round})`:date}
function editStatsVod(key){const v=(fansongStatsData.vodSources||[]).find(x=>String(x.date||'')===key);if(!v)return;editingVodKey=key;const m=String(v.date||'').match(/^(\d{4}-\d{2}-\d{2})(?: \((\d+)\))?$/);document.getElementById('statsVodDate').value=m?m[1]:String(v.date||'');document.getElementById('statsVodRound').value=m&&m[2]?m[2]:'0';document.getElementById('statsVodUrl').value=v.url||''}
function deleteStatsVod(key){if(!isSongAuthenticated)return;if(!confirm(`'${key}' VOD를 삭제하시겠습니까?`))return;fansongStatsData.vodSources=(fansongStatsData.vodSources||[]).filter(v=>String(v.date||'')!==key);delete vodMap[key];enqueueSongServerSave();renderStatsVodList();showToastMessage('VOD를 삭제했습니다.')}
function renderStatsVodList(){const c=document.getElementById('statsVodList');if(!c)return;c.innerHTML=(fansongStatsData.vodSources||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(v=>{const key=String(v.date||'');return `<div class="stats-vod-row"><div class="stats-vod-info"><strong>${key}</strong><div>${v.url||''}</div></div><div class="stats-vod-actions"><button class="modal-btn" onclick="editStatsVod('${key.replace(/'/g,"\\'")}')">수정</button><button class="modal-btn modal-btn-danger" onclick="deleteStatsVod('${key.replace(/'/g,"\\'")}')">삭제</button>${v.url?`<a class="modal-btn" href="${v.url}" target="_blank" rel="noopener">열기</a>`:''}</div></div>`}).join('')||'<div class="no-result">등록된 VOD가 없습니다.</div>'}
function saveStatsVod(){if(!isSongAuthenticated)return;const date=document.getElementById('statsVodDate').value,round=Number(document.getElementById('statsVodRound').value||0),url=document.getElementById('statsVodUrl').value.trim();if(!date||!url){showToastMessage('VOD 날짜와 주소를 입력해주세요.');return;}const key=vodRoundKey(date,round);if(editingVodKey&&editingVodKey!==key){fansongStatsData.vodSources=(fansongStatsData.vodSources||[]).filter(v=>String(v.date||'')!==editingVodKey);delete vodMap[editingVodKey]}const existing=(fansongStatsData.vodSources||[]).find(v=>String(v.date||'')===key);if(existing)existing.url=url;else fansongStatsData.vodSources.push({date:key,url});vodMap[key]=url;enqueueSongServerSave();renderStatsVodList();editingVodKey='';showToastMessage('VOD 정보를 저장했습니다.')}
</script>
</body>
</html>
