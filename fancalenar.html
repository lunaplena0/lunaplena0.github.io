<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 월간 캘린더</title>
    <style>
        /* 전체 페이지 기본 설정 (프로필 페이지 디자인 계승) */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2b2d42;
        }

        /* 메인 콘텐츠 영역 */
        .ocean-calendar-container {
            position: relative;
            width: 100%;
            max-width: 1300px;
            flex: 1;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            background: transparent;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .ocean-calendar-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* 페이지 타이틀 */
        .calendar-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .calendar-title {
            font-size: clamp(32px, 4vw, 42px);
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -1px;
            color: #03045e;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1), 0 0 20px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .calendar-subtitle {
            font-size: clamp(14px, 1.3vw, 16px);
            color: #0077b6;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 255, 255, 1);
        }

        /* 월 선택 컨트롤러 */
        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 800;
            color: #03045e;
        }

        .nav-btn {
            background: #ffffff;
            border: 1px solid rgba(0, 119, 190, 0.25);
            color: #0077b6;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 119, 190, 0.05);
        }

        .nav-btn:hover {
            background: #0077b6;
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* 캘린더 그리드 스타일 */
        .calendar-grid-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.15);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 119, 190, 0.08);
            overflow: hidden;
            box-sizing: border-box;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #0077b6;
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            padding: 12px 0;
            font-size: 15px;
        }

        .weekdays-header div:first-child { color: #ffadad; } /* 일요일 */
        .weekdays-header div:last-child { color: #9bf6ff; }  /* 토요일 */

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(120px, auto);
        }

        .calendar-cell {
            border-right: 1px solid rgba(0, 119, 190, 0.1);
            border-bottom: 1px solid rgba(0, 119, 190, 0.1);
            padding: 8px;
            box-sizing: border-box;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 120px;
        }

        .calendar-cell.other-month {
            background: #fafbfc;
            opacity: 0.5;
        }

        .cell-date-num {
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 2px;
        }

        .calendar-cell:nth-child(7n) .cell-date-num { color: #0284c7; } /* 토요일 날짜 색상 */
        .calendar-cell:nth-child(7n+1) .cell-date-num { color: #dc2626; } /* 일요일 날짜 색상 */

        /* 일정 칩 스타일 */
        .schedule-chip {
            display: block;
            background: #e0f2fe;
            border-left: 3px solid #0077b6;
            padding: 4px 6px;
            border-radius: 4px;
            text-decoration: none;
            color: #03045e;
            font-size: 11px;
            transition: all 0.2s ease;
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .schedule-chip:hover {
            background: #0077b6;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .schedule-chip .chip-time {
            font-weight: 700;
            margin-right: 4px;
            color: #0284c7;
        }

        .schedule-chip:hover .chip-time {
            color: #e0f2fe;
        }

        .no-schedule {
            text-align: center;
            color: #64748b;
            padding: 60px;
            font-size: 16px;
            font-weight: 600;
        }

        /* 모바일 반응형 디자인 */
        @media (max-width: 768px) {
            .ocean-calendar-container {
                padding: 15px 10px;
            }
            .days-grid {
                grid-auto-rows: minmax(80px, auto);
            }
            .calendar-cell {
                padding: 4px;
                min-height: 80px;
            }
            .schedule-chip {
                font-size: 10px;
                padding: 2px 4px;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-calendar-container" id="calendar-container">
        <div class="calendar-header">
            <div class="calendar-title">바다비 월간 캘린더</div>
            <div class="calendar-subtitle">🌊 한눈에 보는 방송 및 컨텐츠 일정표</div>
        </div>

        <!-- 월 이동 컨트롤러 -->
        <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전 달</button>
            <span id="current-month-label">YYYY년 MM월</span>
            <button class="nav-btn" onclick="changeMonth(1)">다음 달 ▶</button>
        </div>

        <!-- 캘린더 본체 -->
        <div class="calendar-grid-box">
            <div class="weekdays-header">
                <div>일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div>토</div>
            </div>
            <div class="days-grid" id="days-grid">
                <!-- 동적으로 날짜 셀이 생성됩니다 -->
            </div>
        </div>
    </div>

    <script>
        let allEvents = [];
        let currentDate = new Date(); // 현재 보여지는 달력 기준 날짜

        async function loadCalendarData() {
            const containerEl = document.getElementById("calendar-container");
            const gridEl = document.getElementById("days-grid");

            try {
                // 프로필 페이지와 동일한 Worker API 호출 (?type=fancalenar)
                const response = await fetch('https://badabi-api.dalkkumli054.workers.dev/?type=fancalenar&t=' + new Date().getTime());
                if (!response.ok) throw new Error("일정 데이터를 불러오지 못했습니다.");
                
                const data = await response.json();
                
                // 데이터 파싱 대응
                if (Array.isArray(data)) {
                    allEvents = data;
                } else if (data && Array.isArray(data.notes)) {
                    allEvents = data.notes;
                } else if (data && Array.isArray(data.events)) {
                    allEvents = data.events;
                } else {
                    allEvents = [];
                }

                renderCalendar();
                containerEl.classList.add('loaded');

            } catch (error) {
                console.error(error);
                gridEl.innerHTML = `<div class="no-schedule" style="grid-column: span 7; color: #ef4444;">일정을 불러오는 중 오류가 발생했습니다.</div>`;
                containerEl.classList.add('loaded');
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth(); // 0~11

            // 상단 타이틀 업데이트
            document.getElementById("current-month-label.textContent = `${year}년 ${month + 1}월`";
            // 간단하게 문자열 조합으로 표현
            document.getElementById("current-month-label").textContent = `${year}년 ${String(month + 1).padStart(2, '0')}월`;

            const gridEl = document.getElementById("days-grid");
            gridEl.innerHTML = "";

            // 해당 월의 첫 번째 요일 (0: 일요일 ~ 6: 토요일)
            const firstDayIndex = new Date(year, month, 1).getDay();
            // 해당 월의 마지막 날짜 (28, 29, 30, 31)
            const lastDay = new Date(year, month + 1, 0).getDate();
            // 이전 달의 마지막 날짜
            const prevLastDay = new Date(year, month, 0).getDate();

            let cellsHtml = "";

            // 1. 이전 달 빈 칸 채우기
            for (let i = firstDayIndex; i > 0; i--) {
                const prevDateNum = prevLastDay - i + 1;
                cellsHtml += `<div class="calendar-cell other-month"><div class="cell-date-num">${prevDateNum}</div></div>`;
            }

            // 2. 이번 달 날짜 채우기
            for (let day = 1; day <= lastDay; day++) {
                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateString = `${year}-${formattedMonth}-${formattedDay}`;

                // 해당 날짜에 맞는 일정 필터링
                const daySchedules = allEvents.filter(event => event.date === dateString);

                let schedulesHtml = "";
                daySchedules.forEach(schedule => {
                    const timeText = schedule.time ? schedule.time : "";
                    const itemUrl = schedule.url ? schedule.url : "#";
                    const targetAttr = schedule.url ? `target="_blank"` : "";

                    schedulesHtml += `
                        <a href="${itemUrl}" ${targetAttr} class="schedule-chip" title="${schedule.title || ''}">
                            ${timeText ? `<span class="chip-time">${timeText}</span>` : ''}${schedule.title || '일정'}
                        </a>
                    `;
                });

                cellsHtml += `
                    <div class="calendar-cell">
                        <div class="cell-date-num">${day}</div>
                        ${schedulesHtml}
                    </div>
                `;
            }

            // 3. 다음 달 빈 칸으로 남은 그리드 채우기 (총 35셀 또는 42셀 맞추기)
            const totalCellsSoFar = firstDayIndex + lastDay;
            const nextDaysCount = totalCellsSoFar <= 35 ? (35 - totalCellsSoFar) : (42 - totalCellsSoFar);
            
            for (let i = 1; i <= nextDaysCount; i++) {
                cellsHtml += `<div class="calendar-cell other-month"><div class="cell-date-num">${i}</div></div>`;
            }

            gridEl.innerHTML = cellsHtml;
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        // 페이지 로드 시 실행
        loadCalendarData();
    </script>

</body>
</html>
