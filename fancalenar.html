<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바다비 월간 캘린더</title>
    <style>
        /* 전체 페이지 기본 설정 */
        body {
            margin: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f7f9;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2b2d42;
        }

        /* 메인 콘텐츠 영역 */
        .ocean-calendar-container {
            position: relative;
            width: 100%;
            max-width: 1050px; 
            flex: 1;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 30px 15px;
            box-sizing: border-box;
            background: transparent;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .ocean-calendar-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* 월 선택 컨트롤러 및 드롭다운 영역 */
        .calendar-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
        }

        .month-picker-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 119, 190, 0.25);
            color: #03045e;
            padding: 5px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 119, 190, 0.05);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .month-picker-btn:hover {
            background: #0077b6;
            color: #ffffff;
            border-color: #0077b6;
            transform: translateY(-1px);
        }

        /* 드롭다운 셀렉트 박스 컨테이너 */
        .month-dropdown-box {
            position: absolute;
            top: 40px;
            background: #ffffff;
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 10px;
            padding: 6px 8px;
            box-shadow: 0 8px 20px rgba(0, 119, 190, 0.12);
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 4px;
            z-index: 10;
            white-space: nowrap;
        }

        .month-dropdown-box.active {
            display: flex;
        }

        .month-dropdown-box select {
            padding: 4px 6px;
            border: 1px solid rgba(0, 119, 190, 0.3);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #03045e;
            background: #f8fafc;
            outline: none;
            cursor: pointer;
        }

        .month-dropdown-box button {
            background-color: #0077b6;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
        }

        .month-dropdown-box button:hover {
            background-color: #03045e;
        }

        /* 캘린더 그리드 스타일 (6주 고정) */
        .calendar-grid-box {
            width: 100%;
            max-width: 1050px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 119, 190, 0.15);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 119, 190, 0.08);
            overflow: hidden;
            box-sizing: border-box;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #0077b6;
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            padding: 8px 0;
            font-size: 13px;
        }

        .weekdays-header div:first-child { color: #ffadad; } /* 일요일 */
        .weekdays-header div:last-child { color: #9bf6ff; }  /* 토요일 */

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 105px); 
        }

        /* 캘린더 칸 높이 고정 및 클릭 가능 */
        .calendar-cell {
            border-right: 1px solid rgba(0, 119, 190, 0.1);
            border-bottom: 1px solid rgba(0, 119, 190, 0.1);
            padding: 5px;
            box-sizing: border-box;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            height: 105px !important; 
            min-height: 105px !important;
            max-height: 105px !important;
            overflow: hidden;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .calendar-cell:hover {
            background-color: #f0f7ff;
        }

        .calendar-cell.other-month {
            background: #fafbfc;
            opacity: 0.5;
        }

        .cell-date-num {
            font-size: 11.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .calendar-cell:nth-child(7n) .cell-date-num { color: #0284c7; } /* 토요일 */
        .calendar-cell:nth-child(7n+1) .cell-date-num { color: #dc2626; } /* 일요일 */

        /* 셀 내부 일정 목록 영역 */
        .cell-schedules {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
        }

        .cell-schedules::-webkit-scrollbar {
            width: 3px;
        }
        .cell-schedules::-webkit-scrollbar-thumb {
            background: rgba(0, 119, 190, 0.2);
            border-radius: 3px;
        }

        /* 일정 칩 스타일 */
        .schedule-chip {
            display: block;
            background: #e0f2fe;
            border-left: 3px solid #0077b6;
            padding: 2px 4px;
            border-radius: 3px;
            color: #03045e;
            font-size: 10px;
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .schedule-chip .chip-time {
            font-weight: 700;
            margin-right: 3px;
            color: #0284c7;
        }

        /* 팝업 모달 백드롭 */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-backdrop.active {
            display: flex;
        }

        /* 팝업 모달 박스 */
        .modal-box {
            background: #ffffff;
            border: 1px solid rgba(0, 119, 190, 0.2);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            animation: modalPop 0.25s ease forwards;
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            font-size: 18px;
            font-weight: 800;
            color: #03045e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e0f2fe;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            font-size: 20px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            background: #f1f5f9;
            color: #03045e;
        }

        .modal-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .modal-content::-webkit-scrollbar {
            width: 4px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(0, 119, 190, 0.2);
            border-radius: 4px;
        }

        /* 상세 항목 카드 (세로 구조 정렬 및 2줄 공간 확보) */
        .detail-item {
            background: #f8fafc;
            border: 1px solid rgba(0, 119, 190, 0.1);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .detail-item.clickable {
            cursor: pointer;
        }

        .detail-item.clickable:hover {
            border-color: rgba(0, 119, 190, 0.4);
            background: #f0f7ff;
            transform: translateY(-1px);
        }

        /* 제목 영역: 정확히 2줄 높이를 확보하여 일정한 공간 유지 */
        .detail-item-title {
            font-size: 15px;
            font-weight: 700;
            color: #03045e;
            line-height: 1.4;
            height: calc(15px * 1.4 * 2); /* 2줄의 높이 고정 확보 */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 시간 및 분류 라인 */
        .detail-item-time-type {
            font-size: 13px;
            color: #475569;
            font-weight: 600;
        }

        /* 카테고리 라인 */
        .detail-item-category {
            font-size: 13px;
            color: #0284c7;
            font-weight: 600;
        }

        .no-select-msg {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            padding: 25px 0;
            font-weight: 600;
        }

        /* 모바일 반응형 디자인 */
        @media (max-width: 768px) {
            .ocean-calendar-container {
                padding: 10px 10px 20px 10px;
            }
            .days-grid {
                grid-template-rows: repeat(6, 90px);
            }
            .calendar-cell {
                height: 90px !important; 
                min-height: 90px !important;
                max-height: 90px !important;
                padding: 3px;
            }
            .schedule-chip {
                font-size: 9px;
                padding: 1px 2px;
            }
        }
    </style>
</head>
<body>

    <div class="ocean-calendar-container" id="calendar-container">
        <!-- 월 선택 컨트롤러 및 드롭다운 박스 -->
        <div class="calendar-nav">
            <button class="month-picker-btn" id="current-month-label" onclick="toggleMonthDropdown()">YYYY년 MM월 📅</button>
            
            <div class="month-dropdown-box" id="month-dropdown">
                <select id="select-year"></select>
                <select id="select-month">
                    <option value="1">1월</option>
                    <option value="2">2월</option>
                    <option value="3">3월</option>
                    <option value="4">4월</option>
                    <option value="5">5월</option>
                    <option value="6">6월</option>
                    <option value="7">7월</option>
                    <option value="8">8월</option>
                    <option value="9">9월</option>
                    <option value="10">10월</option>
                    <option value="11">11월</option>
                    <option value="12">12월</option>
                </select>
                <button onclick="applySelectedMonth()">이동</button>
            </div>
        </div>

        <!-- 캘린더 본체 -->
        <div class="calendar-grid-box">
            <div class="weekdays-header">
                <div>일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div>토</div>
            </div>
            <div class="days-grid" id="days-grid"></div>
        </div>
    </div>

    <!-- 화면 정중앙 상세 일정 모달 팝업 -->
    <div class="modal-backdrop" id="detail-modal" onclick="closeModalOnBackdrop(event)">
        <div class="modal-box">
            <div class="modal-header">
                <span id="modal-header-title">상세 일정</span>
                <button class="modal-close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-content" id="modal-content-box">
                <!-- 동적 상세 내용 표시 -->
            </div>
        </div>
    </div>

    <script>
        let allEvents = [];
        let currentDate = new Date();

        function updateDropdownOptions() {
            const selectYearEl = document.getElementById("select-year");
            const selectMonthEl = document.getElementById("select-month");

            const availableYM = new Set();
            const availableYears = new Set();

            allEvents.forEach(event => {
                const d = event.date;
                if (d && typeof d === 'string' && d.trim() !== '' && d.trim() !== '-') {
                    const parts = d.split('-');
                    if (parts.length >= 2) {
                        const y = parts[0];
                        const m = String(parseInt(parts[1], 10));
                        availableYM.add(`${y}-${m}`);
                        availableYears.add(parseInt(y, 10));
                    }
                }
            });

            let yearOptionsHtml = "";
            const sortedYears = Array.from(availableYears).sort((a, b) => a - b);
            if (sortedYears.length === 0) {
                sortedYears.push(new Date().getFullYear());
            }
            sortedYears.forEach(y => {
                yearOptionsHtml += `<option value="${y}">${y}년</option>`;
            });
            selectYearEl.innerHTML = yearOptionsHtml;

            const currentSelectedYear = selectYearEl.value || currentDate.getFullYear();
            let monthOptionsHtml = "";
            for (let m = 1; m <= 12; m++) {
                if (availableYM.has(`${currentSelectedYear}-${m}`)) {
                    monthOptionsHtml += `<option value="${m}">${m}월</option>`;
                }
            }

            if (monthOptionsHtml === "") {
                monthOptionsHtml = `<option value="">일정 없음</option>`;
            }
            selectMonthEl.innerHTML = monthOptionsHtml;

            selectYearEl.onchange = function() {
                const chosenYear = selectYearEl.value;
                let subHtml = "";
                for (let m = 1; m <= 12; m++) {
                    if (availableYM.has(`${chosenYear}-${m}`)) {
                        subHtml += `<option value="${m}">${m}월</option>`;
                    }
                }
                if (subHtml === "") subHtml = `<option value="">일정 없음</option>`;
                selectMonthEl.innerHTML = subHtml;
            };
        }

        async function loadCalendarData() {
            const containerEl = document.getElementById("calendar-container");
            const gridEl = document.getElementById("days-grid");

            try {
                const response = await fetch('https://badabi-api.dalkkumli054.workers.dev/?type=fancalenar&t=' + new Date().getTime());
                if (!response.ok) throw new Error("일정 데이터를 불러오지 못했습니다.");
                
                const data = await response.json();
                
                let rawEvents = [];
                if (Array.isArray(data)) {
                    rawEvents = data;
                } else if (data && Array.isArray(data.notes)) {
                    rawEvents = data.notes;
                } else if (data && Array.isArray(data.events)) {
                    rawEvents = data.events;
                }

                allEvents = rawEvents.filter(event => {
                    const d = event.date;
                    return d && typeof d === 'string' && d.trim() !== '' && d.trim() !== '-';
                });

                updateDropdownOptions();
                renderCalendar();
                containerEl.classList.add('loaded');

            } catch (error) {
                console.error(error);
                gridEl.innerHTML = `<div class="no-schedule" style="grid-column: span 7; color: #ef4444;">일정을 불러오는 중 오류가 발생했습니다.</div>`;
                containerEl.classList.add('loaded');
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById("current-month-label").textContent = `${year}년 ${String(month + 1).padStart(2, '0')}월 📅`;

            const gridEl = document.getElementById("days-grid");
            gridEl.innerHTML = "";

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            let cellsHtml = "";

            // 1. 이전 달 빈 칸 채우기
            for (let i = firstDayIndex; i > 0; i--) {
                const prevDateNum = prevLastDay - i + 1;
                cellsHtml += `<div class="calendar-cell other-month"><div class="cell-date-num">${prevDateNum}</div><div class="cell-schedules"></div></div>`;
            }

            // 2. 이번 달 날짜 채우기
            for (let day = 1; day <= lastDay; day++) {
                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateString = `${year}-${formattedMonth}-${formattedDay}`;

                const daySchedules = allEvents.filter(event => event.date === dateString);

                let schedulesHtml = "";
                daySchedules.forEach(schedule => {
                    const timeText = schedule.time ? schedule.time : "";
                    schedulesHtml += `
                        <span class="schedule-chip" title="${schedule.title || ''}">
                            ${timeText ? `<span class="chip-time">${timeText}</span>` : ''}${schedule.title || '일정'}
                        </span>
                    `;
                });

                cellsHtml += `
                    <div class="calendar-cell" onclick="openDateModal('${dateString}')">
                        <div class="cell-date-num">${day}</div>
                        <div class="cell-schedules">
                            ${schedulesHtml}
                        </div>
                    </div>
                `;
            }

            // 3. 다음 달 빈 칸 채우기 (6주 고정)
            const totalCellsSoFar = firstDayIndex + lastDay;
            const nextDaysCount = totalCellsSoFar <= 35 ? (35 - totalCellsSoFar) : (42 - totalCellsSoFar);
            
            for (let i = 1; i <= nextDaysCount; i++) {
                cellsHtml += `<div class="calendar-cell other-month"><div class="cell-date-num">${i}</div><div class="cell-schedules"></div></div>`;
            }

            gridEl.innerHTML = cellsHtml;
        }

        // 날짜 클릭 시 정중앙 모달 팝업 열기
        function openDateModal(dateString) {
            const modalEl = document.getElementById("detail-modal");
            const headerTitleEl = document.getElementById("modal-header-title");
            const contentBoxEl = document.getElementById("modal-content-box");

            headerTitleEl.textContent = `${dateString} 상세 일정`;

            const daySchedules = allEvents.filter(event => event.date === dateString);

            if (daySchedules.length === 0) {
                contentBoxEl.innerHTML = `<div class="no-select-msg">이 날 등록된 상세 일정이 없습니다.</div>`;
                modalEl.classList.add("active");
                return;
            }

            let html = "";
            daySchedules.forEach(item => {
                const title = item.title || '제목 없음';
                const time = item.time || '시간 미정';
                const type = item.type || '분류 없음';
                const category = item.category || '카테고리 없음';
                const rawUrl = item.url ? item.url.trim() : "";
                const hasValidUrl = rawUrl !== "" && rawUrl !== "-";

                const clickableClass = hasValidUrl ? "detail-item clickable" : "detail-item";
                const clickAction = hasValidUrl ? `onclick="window.open('${rawUrl}', '_blank')"` : "";

                html += `
                    <div class="${clickableClass}" ${clickAction}>
                        <div class="detail-item-title">${title}</div>
                        <div class="detail-item-time-type">🕒 시간: ${time} &nbsp;|&nbsp; 📌 분류: ${type}</div>
                        <div class="detail-item-category">🏷️ 카테고리: ${category}</div>
                    </div>
                `;
            });

            contentBoxEl.innerHTML = html;
            modalEl.classList.add("active");
        }

        // 모달 닫기 함수
        function closeModal() {
            document.getElementById("detail-modal").classList.remove("active");
        }

        // 백드롭(바깥 영역) 클릭 시 닫기
        function closeModalOnBackdrop(e) {
            if (e.target.id === "detail-modal") {
                closeModal();
            }
        }

        function toggleMonthDropdown() {
            const dropdown = document.getElementById("month-dropdown");
            if (!dropdown.classList.contains('active')) {
                updateDropdownOptions();
                const selectYearEl = document.getElementById("select-year");
                const selectMonthEl = document.getElementById("select-month");
                
                selectYearEl.value = currentDate.getFullYear();
                selectYearEl.dispatchEvent(new Event('change'));
                selectMonthEl.value = currentDate.getMonth() + 1;
            }
            dropdown.classList.toggle('active');
        }

        function applySelectedMonth() {
            const selectedYear = parseInt(document.getElementById("select-year").value, 10);
            const selectedMonth = parseInt(document.getElementById("select-month").value, 10);

            if (isNaN(selectedYear) || isNaN(selectedMonth)) {
                alert("이동할 수 있는 유효한 일정이 없습니다.");
                return;
            }

            currentDate.setFullYear(selectedYear);
            currentDate.setMonth(selectedMonth - 1);
            
            renderCalendar();
            document.getElementById("month-dropdown").classList.remove('active');
        }

        window.addEventListener('click', function(e) {
            const navContainer = document.querySelector('.calendar-nav');
            const dropdown = document.getElementById("month-dropdown");
            if (!navContainer.contains(e.target) && dropdown.classList.contains('active')) {
                dropdown.classList.remove('active');
            }
        });

        loadCalendarData();
    </script>

</body>
</html>
